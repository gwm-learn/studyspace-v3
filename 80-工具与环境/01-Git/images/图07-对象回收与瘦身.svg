<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="520" viewBox="0 0 1220 520" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1220" height="520" fill="#ffffff"/>
<line x1="36" y1="112" x2="1184" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 07 · 对象的三种归宿与回收路径</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">对象先以松散形态写入，gc 后进 pack；一旦没有引用可达，就变成悬空对象。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">悬空不会立刻消失——reflog 还指着它，要等过期 + prune 才真正回收。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">可达对象</text>
<line x1="142" y1="142" x2="172" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="180" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">悬空对象</text>
<line x1="248" y1="142" x2="278" y2="142" stroke="#475569" stroke-width="3"/>
<text x="286" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">已回收</text>
<rect x="36" y="190" width="212" height="96" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="36" y="190" width="4.5" height="96" fill="#0f9d58" rx="2"/>
<text x="49" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">写入：松散对象</text>
<text x="49" y="226" font-size="9.6" fill="#334155" xml:space="preserve">.git/objects/ab/cdef…</text>
<text x="49" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">一对象一文件</text>
<rect x="270" y="190" width="212" height="96" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="270" y="190" width="4.5" height="96" fill="#0f9d58" rx="2"/>
<text x="283" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">gc：打包 + delta</text>
<text x="283" y="226" font-size="9.6" fill="#334155" xml:space="preserve">pack-*.pack + .idx</text>
<text x="283" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">相似对象存差异</text>
<rect x="504" y="190" width="212" height="96" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="504" y="190" width="4.5" height="96" fill="#d97706" rx="2"/>
<text x="517" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">失去引用</text>
<text x="517" y="226" font-size="9.6" fill="#334155" xml:space="preserve">分支被删 / 历史改写</text>
<text x="517" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">reflog 仍指着它</text>
<rect x="738" y="190" width="212" height="96" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="738" y="190" width="4.5" height="96" fill="#d97706" rx="2"/>
<text x="751" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">悬空对象</text>
<text x="751" y="226" font-size="9.6" fill="#334155" xml:space="preserve">dangling</text>
<text x="751" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">等待过期</text>
<rect x="972" y="190" width="212" height="96" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="972" y="190" width="4.5" height="96" fill="#475569" rx="2"/>
<text x="985" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">prune：真正删除</text>
<text x="985" y="226" font-size="9.6" fill="#334155" xml:space="preserve">reflog 过期 + gc</text>
<text x="985" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">不可恢复</text>
<line x1="248" y1="238" x2="270" y2="238" stroke="#475569" stroke-width="1.8"/>
<polygon points="270,238 261,233.5 261,242.5" fill="#475569"/>
<line x1="482" y1="238" x2="504" y2="238" stroke="#475569" stroke-width="1.8"/>
<polygon points="504,238 495,233.5 495,242.5" fill="#475569"/>
<line x1="716" y1="238" x2="738" y2="238" stroke="#475569" stroke-width="1.8"/>
<polygon points="738,238 729,233.5 729,242.5" fill="#475569"/>
<line x1="950" y1="238" x2="972" y2="238" stroke="#475569" stroke-width="1.8"/>
<polygon points="972,238 963,233.5 963,242.5" fill="#475569"/>
<rect x="36" y="320" width="1148" height="128" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="350" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">仓库瘦身的三步（缺一步就白做）</text>
<text x="52" y="374" font-size="10.2" fill="#334155" xml:space="preserve">① 找：git rev-list --objects --all | cat-file --batch-check，按大小排序，定位大 blob。</text>
<text x="52" y="392" font-size="10.2" fill="#334155" xml:space="preserve">② 判：git log --all -- &lt;path&gt; 确认它是否还在历史里；只在某次提交出现过也算。</text>
<text x="52" y="410" font-size="10.2" fill="#334155" xml:space="preserve">③ 改写：git filter-repo（推荐）重写历史 → 全员重新 clone → 远端 force push → 平台侧 GC。</text>
<text x="52" y="428" font-size="10.2" fill="#334155" xml:space="preserve">只做 ① 不做 ③，仓库不会变小；只做 ③ 不做「全员重 clone」，旧历史会被 pull 回来。</text>
<text x="36" y="466" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py 生成</text>
<text x="36" y="484" font-size="12.3" fill="#64748b" xml:space="preserve">本篇：80-工具与环境/01-Git/00-Git对象模型与引用.md</text>
</svg>
