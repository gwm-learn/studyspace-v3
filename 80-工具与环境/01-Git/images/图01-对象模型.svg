<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="580" viewBox="0 0 1220 580" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1220" height="580" fill="#ffffff"/>
<line x1="36" y1="112" x2="1184" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · 从工作区到引用：对象写入路径</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">add 写 blob 并更新索引，commit 写 tree 与 commit，最后移动分支引用。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：从左到右看两次写入，注意引用只指向 commit，不直接指向文件。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">工作区</text>
<line x1="131" y1="142" x2="161" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="169" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">索引</text>
<line x1="215" y1="142" x2="245" y2="142" stroke="#0891b2" stroke-width="3"/>
<text x="253" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">对象库</text>
<line x1="310" y1="142" x2="340" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="348" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">引用</text>
<rect x="36" y="195" width="230" height="120" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="36" y="195" width="4.5" height="120" fill="#d97706" rx="2"/>
<text x="49" y="214" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">工作区</text>
<text x="49" y="231" font-size="9.6" fill="#334155" xml:space="preserve">可直接编辑的文件</text>
<text x="49" y="246.4" font-size="9.6" fill="#334155" xml:space="preserve">git status：unstaged</text>
<text x="49" y="261.8" font-size="9.6" fill="#334155" xml:space="preserve">不属于对象库</text>
<rect x="330" y="195" width="230" height="120" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="330" y="195" width="4.5" height="120" fill="#4f46e5" rx="2"/>
<text x="343" y="214" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">索引 index</text>
<text x="343" y="231" font-size="9.6" fill="#334155" xml:space="preserve">path → OID</text>
<text x="343" y="246.4" font-size="9.6" fill="#334155" xml:space="preserve">下一次提交的快照</text>
<text x="343" y="261.8" font-size="9.6" fill="#334155" xml:space="preserve">冲突时出现 stage 1/2/3</text>
<rect x="624" y="195" width="250" height="120" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="624" y="195" width="4.5" height="120" fill="#0891b2" rx="2"/>
<text x="637" y="214" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">对象库 .git/objects</text>
<text x="637" y="231" font-size="9.6" fill="#334155" xml:space="preserve">blob：文件内容</text>
<text x="637" y="246.4" font-size="9.6" fill="#334155" xml:space="preserve">tree：一层目录</text>
<text x="637" y="261.8" font-size="9.6" fill="#334155" xml:space="preserve">commit：快照入口</text>
<rect x="938" y="195" width="230" height="120" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="938" y="195" width="4.5" height="120" fill="#0f9d58" rx="2"/>
<text x="951" y="214" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">引用 refs/heads/main</text>
<text x="951" y="231" font-size="9.6" fill="#334155" xml:space="preserve">保存一个 commit OID</text>
<text x="951" y="246.4" font-size="9.6" fill="#334155" xml:space="preserve">提交时自动前移</text>
<text x="951" y="261.8" font-size="9.6" fill="#334155" xml:space="preserve">HEAD 通常指向它</text>
<line x1="266" y1="255" x2="330" y2="255" stroke="#475569" stroke-width="2.2"/>
<polygon points="330,255 321,250.5 321,259.5" fill="#475569"/>
<text x="280" y="246" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">git add</text>
<line x1="560" y1="255" x2="624" y2="255" stroke="#475569" stroke-width="2.2"/>
<polygon points="624,255 615,250.5 615,259.5" fill="#475569"/>
<text x="562" y="246" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">git commit</text>
<line x1="874" y1="255" x2="938" y2="255" stroke="#475569" stroke-width="2.2"/>
<polygon points="938,255 929,250.5 929,259.5" fill="#475569"/>
<text x="872" y="246" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">update-ref</text>
<rect x="36" y="370" width="1132" height="128" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="400" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图</text>
<text x="52" y="424" font-size="10.2" fill="#334155" xml:space="preserve">git add：读工作区内容 → 算 blob 哈希 → 写对象 → 更新索引条目（含 stat 信息）。</text>
<text x="52" y="442" font-size="10.2" fill="#334155" xml:space="preserve">git commit：按索引递归生成 tree → 生成 commit → 用 update-ref 移动当前分支；HEAD 文件本身不变。</text>
<text x="52" y="460" font-size="10.2" fill="#334155" xml:space="preserve">git status：比较 HEAD tree、索引、工作区三者，分别得到已暂存、未暂存、未跟踪。</text>
<text x="52" y="478" font-size="10.2" fill="#334155" xml:space="preserve">checkout / restore 是反方向：读 commit 的 tree，写回索引和工作区。</text>
<text x="36" y="526" font-size="12.3" fill="#64748b" xml:space="preserve">对象按内容寻址：相同内容只存一份，改名不会产生新 blob。</text>
<text x="36" y="544" font-size="12.3" fill="#64748b" xml:space="preserve">图源：本仓库生成脚本；索引路径与对象 OID 的对应关系可参考 git ls-files -s。</text>
</svg>
