<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1180" height="720" fill="#ffffff"/>
<line x1="36" y1="112" x2="1144" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · 变基：把提交逐个复制到新基底</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">rebase 不移动原来的提交，而是按顺序重放，生成一批 hash 不同的新提交。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：上半部分是变基前，下半部分是变基后；带撇号的 D&#x27;、E&#x27; 是新对象。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">main</text>
<line x1="124.4" y1="142" x2="154.4" y2="142" stroke="#94a3b8" stroke-width="3"/>
<text x="162.4" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">feature（旧）</text>
<line x1="265.6" y1="142" x2="295.6" y2="142" stroke="#0891b2" stroke-width="3"/>
<text x="303.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">feature（新）</text>
<text x="36" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① 变基前：feature 从 B 分叉</text>
<rect x="36" y="195" width="110" height="56" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="36" y="195" width="4.5" height="56" fill="#4f46e5" rx="2"/>
<text x="49" y="214" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">A</text>
<rect x="180" y="195" width="110" height="56" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="180" y="195" width="4.5" height="56" fill="#4f46e5" rx="2"/>
<text x="193" y="214" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">B</text>
<rect x="360" y="195" width="110" height="56" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="360" y="195" width="4.5" height="56" fill="#4f46e5" rx="2"/>
<text x="373" y="214" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">C</text>
<rect x="180" y="300" width="110" height="56" fill="#f8fafc" rx="8" stroke="#94a3b8" stroke-width="1.1"/>
<rect x="180" y="300" width="4.5" height="56" fill="#94a3b8" rx="2"/>
<text x="193" y="319" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">D</text>
<rect x="360" y="300" width="110" height="56" fill="#f8fafc" rx="8" stroke="#94a3b8" stroke-width="1.1"/>
<rect x="360" y="300" width="4.5" height="56" fill="#94a3b8" rx="2"/>
<text x="373" y="319" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">E</text>
<line x1="146" y1="223" x2="180" y2="223" stroke="#475569" stroke-width="2"/>
<polygon points="180,223 171,218.5 171,227.5" fill="#475569"/>
<line x1="290" y1="223" x2="360" y2="223" stroke="#475569" stroke-width="2"/>
<polygon points="360,223 351,218.5 351,227.5" fill="#475569"/>
<line x1="235" y1="251" x2="235" y2="300" stroke="#475569" stroke-width="2"/>
<polygon points="235,300 239.5,291 230.5,291" fill="#475569"/>
<line x1="290" y1="328" x2="360" y2="328" stroke="#475569" stroke-width="2"/>
<polygon points="360,328 351,323.5 351,332.5" fill="#475569"/>
<text x="36" y="280" font-size="9.6" fill="#4f46e5" xml:space="preserve" font-weight="700">main</text>
<text x="36" y="380" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="700">feature</text>
<text x="36" y="435" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② 变基后：D、E 被重放到 C 之上</text>
<rect x="36" y="455" width="110" height="56" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="36" y="455" width="4.5" height="56" fill="#4f46e5" rx="2"/>
<text x="49" y="474" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">A</text>
<rect x="180" y="455" width="110" height="56" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="180" y="455" width="4.5" height="56" fill="#4f46e5" rx="2"/>
<text x="193" y="474" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">B</text>
<rect x="360" y="455" width="110" height="56" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="360" y="455" width="4.5" height="56" fill="#4f46e5" rx="2"/>
<text x="373" y="474" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">C</text>
<rect x="360" y="560" width="110" height="56" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="360" y="560" width="4.5" height="56" fill="#0891b2" rx="2"/>
<text x="373" y="579" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">D&#x27;</text>
<rect x="520" y="560" width="110" height="56" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="520" y="560" width="4.5" height="56" fill="#0891b2" rx="2"/>
<text x="533" y="579" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">E&#x27;</text>
<line x1="146" y1="483" x2="180" y2="483" stroke="#475569" stroke-width="2"/>
<polygon points="180,483 171,478.5 171,487.5" fill="#475569"/>
<line x1="290" y1="483" x2="360" y2="483" stroke="#475569" stroke-width="2"/>
<polygon points="360,483 351,478.5 351,487.5" fill="#475569"/>
<line x1="415" y1="511" x2="415" y2="560" stroke="#475569" stroke-width="2"/>
<polygon points="415,560 419.5,551 410.5,551" fill="#475569"/>
<line x1="470" y1="588" x2="520" y2="588" stroke="#475569" stroke-width="2"/>
<polygon points="520,588 511,583.5 511,592.5" fill="#475569"/>
<text x="36" y="540" font-size="9.6" fill="#4f46e5" xml:space="preserve" font-weight="700">main</text>
<text x="36" y="640" font-size="9.6" fill="#0891b2" xml:space="preserve" font-weight="700">feature</text>
<rect x="660" y="455" width="470" height="128" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="676" y="485" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">变基做了什么</text>
<text x="676" y="509" font-size="10.2" fill="#334155" xml:space="preserve">1. 找 feature 与 main 的共同祖先 B。</text>
<text x="676" y="527" font-size="10.2" fill="#334155" xml:space="preserve">2. 取出 B..feature 的 D、E 两个提交。</text>
<text x="676" y="545" font-size="10.2" fill="#334155" xml:space="preserve">3. 以 C 为新基底，逐个重放并生成 D&#x27;、E&#x27;。</text>
<text x="676" y="563" font-size="10.2" fill="#334155" xml:space="preserve">4. 把 feature 引用移到 E&#x27;；D、E 仍留在对象库。</text>
<text x="36" y="666" font-size="12.3" fill="#64748b" xml:space="preserve">命令：git switch feature &amp;&amp; git rebase main；冲突时解决后 git rebase --continue。</text>
<text x="36" y="684" font-size="12.3" fill="#64748b" xml:space="preserve">图源：本仓库生成脚本；hash 改变是重放的必然结果，不是“修改原提交”。</text>
</svg>
