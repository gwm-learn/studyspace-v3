<text x="569" y="254" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">tags/</text>
<text x="569" y="271" font-size="9.6" fill="#334155" xml:space="preserve">v1.0（约定只读）</text>
<text x="84" y="355" font-size="10.8" fill="#64748b" xml:space="preserve">revision: r100 → r101 → r102 …（一次提交一个全局号）</text>
<rect x="60" y="430" width="250" height="90" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="60" y="430" width="4.5" height="90" fill="#0891b2" rx="2"/>
<text x="73" y="449" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">工作副本 A</text>
<text x="73" y="466" font-size="9.6" fill="#334155" xml:space="preserve">trunk @ r101</text>
<text x="73" y="481.4" font-size="9.6" fill="#334155" xml:space="preserve">本地修改/冲突</text>
<rect x="360" y="430" width="250" height="90" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
