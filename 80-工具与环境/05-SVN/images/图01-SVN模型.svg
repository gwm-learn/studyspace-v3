<rect x="320" y="235" width="4.5" height="76" fill="#4f46e5" rx="2"/>
<text x="333" y="254" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">branches/</text>
<text x="333" y="271" font-size="9.6" fill="#334155" xml:space="preserve">feature-x</text>
<text x="333" y="286.4" font-size="9.6" fill="#334155" xml:space="preserve">release-1.0</text>
<rect x="556" y="235" width="200" height="76" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
