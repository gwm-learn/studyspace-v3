<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · SVN 中央仓库、分支目录与工作副本</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">仓库唯一、revision 全局递增；trunk/branches/tags 只是目录约定</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
