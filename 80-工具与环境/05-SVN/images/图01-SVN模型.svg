<text x="673" y="481.4" font-size="9.6" fill="#334155" xml:space="preserve">只读检出</text>
<line x1="185" y1="430" x2="185" y2="380" stroke="#d97706" stroke-width="2.2"/>
<polygon points="185,380 180.5,389 189.5,389" fill="#d97706"/>
<text x="193" y="399" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">commit / update</text>
<line x1="485" y1="430" x2="485" y2="380" stroke="#d97706" stroke-width="2.2"/>
<polygon points="485,380 480.5,389 489.5,389" fill="#d97706"/>
<text x="493" y="399" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">merge / switch</text>
<line x1="785" y1="430" x2="785" y2="380" stroke="#94a3b8" stroke-width="1.8"/>
<polygon points="785,380 780.5,389 789.5,389" fill="#94a3b8"/>
<text x="793" y="399" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">checkout</text>
<rect x="60" y="560" width="400" height="110" fill="#ecfeff" rx="10" stroke="#0891b2" stroke-width="1"/>
<text x="76" y="590" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图</text>
<text x="76" y="614" font-size="10.2" fill="#334155" xml:space="preserve">commit 是原子的：多路径一起成功或一起失败。</text>
<text x="76" y="632" font-size="10.2" fill="#334155" xml:space="preserve">工作副本每个路径有自己的 base revision。</text>
<text x="76" y="650" font-size="10.2" fill="#334155" xml:space="preserve">分支/标签由 svn copy 创建，不是指针。</text>
<rect x="500" y="560" width="440" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="516" y="590" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">边界</text>
<text x="516" y="614" font-size="10.2" fill="#334155" xml:space="preserve">SVN 不支持改写历史，纠错靠反向合并。</text>
<text x="516" y="632" font-size="10.2" fill="#334155" xml:space="preserve">svn:mergeinfo 记录合并来源，不要手改。</text>
<text x="516" y="650" font-size="10.2" fill="#334155" xml:space="preserve">externals 必须固定 revision，保证可复现。</text>
<text x="36" y="706" font-size="12.3" fill="#64748b" xml:space="preserve">图源：本仓库 .图表模板/svg-figure-template.py 生成</text>
<text x="36" y="724" font-size="12.3" fill="#64748b" xml:space="preserve">VSCode / SVN · studyspace-v3</text>
</svg>
