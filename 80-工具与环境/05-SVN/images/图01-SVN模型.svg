<text x="373" y="481.4" font-size="9.6" fill="#334155" xml:space="preserve">混合版本</text>
<rect x="660" y="430" width="250" height="90" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="660" y="430" width="4.5" height="90" fill="#0891b2" rx="2"/>
