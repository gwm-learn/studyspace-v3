<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1280" height="600" fill="#ffffff"/>
<line x1="36" y1="112" x2="1244" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · 收帧时的 tag 判定：五种输入，五种结果</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">同一个判定流程，输入只有两个：带不带 tag、VID 在不在允许列表。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">最右一支是跨厂商陷阱——VID 等于 PVID 时，有的设备去 tag 转发，有的保留 tag。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#0891b2" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">带 tag</text>
<line x1="135.4" y1="142" x2="165.4" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="173.4" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">无 tag</text>
<line x1="234.8" y1="142" x2="264.8" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="272.8" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">丢弃</text>
<rect x="421" y="176" width="430" height="58" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="421" y="176" width="4.5" height="58" fill="#475569" rx="2"/>
<text x="434" y="195" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">一个帧从端口进来</text>
<text x="434" y="212" font-size="9.6" fill="#334155" xml:space="preserve">先判有没有 802.1Q 标签，再判这个 VID 是否被放行</text>
<rect x="36" y="286" width="225.6" height="72.8" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="36" y="286" width="4.5" height="72.8" fill="#0891b2" rx="2"/>
<text x="49" y="305" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">带 tag，且放行</text>
<text x="49" y="322" font-size="9.6" fill="#334155" xml:space="preserve">按帧内 VID 归属 VLAN</text>
<text x="49" y="337.4" font-size="9.6" fill="#334155" xml:space="preserve">出口再按端口类型决定 tag</text>
<line x1="492.67" y1="234" x2="148.8" y2="286" stroke="#0891b2" stroke-width="1.8"/>
<polygon points="148.8,286 158.37,289.1 157.03,280.2" fill="#0891b2"/>
<text x="46" y="378.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 正常转发</text>
<rect x="279.6" y="286" width="225.6" height="72.8" fill="#fff5f5" rx="8" stroke="#dc2626" stroke-width="1.1"/>
<rect x="279.6" y="286" width="4.5" height="72.8" fill="#dc2626" rx="2"/>
<text x="292.6" y="305" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">带 tag，未放行</text>
<text x="292.6" y="322" font-size="9.6" fill="#334155" xml:space="preserve">该 VLAN 不在允许列表</text>
<text x="292.6" y="337.4" font-size="9.6" fill="#334155" xml:space="preserve">或 VID 等于保留值</text>
<line x1="564.33" y1="234" x2="392.4" y2="286" stroke="#dc2626" stroke-width="1.8"/>
<polygon points="392.4,286 402.32,287.7 399.71,279.09" fill="#dc2626"/>
<text x="289.6" y="378.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 静默丢弃，无日志</text>
<rect x="523.2" y="286" width="225.6" height="72.8" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="523.2" y="286" width="4.5" height="72.8" fill="#d97706" rx="2"/>
<text x="536.2" y="305" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">无 tag（Access 口）</text>
<text x="536.2" y="322" font-size="9.6" fill="#334155" xml:space="preserve">打上 PVID</text>
<text x="536.2" y="337.4" font-size="9.6" fill="#334155" xml:space="preserve">终端链路的唯一身份</text>
<line x1="636" y1="234" x2="636" y2="286" stroke="#d97706" stroke-width="1.8"/>
<polygon points="636,286 640.5,277 631.5,277" fill="#d97706"/>
<text x="533.2" y="378.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 进入 PVID 对应的 VLAN</text>
<rect x="766.8" y="286" width="225.6" height="72.8" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="766.8" y="286" width="4.5" height="72.8" fill="#d97706" rx="2"/>
<text x="779.8" y="305" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">无 tag（Trunk/Hybrid）</text>
<text x="779.8" y="322" font-size="9.6" fill="#334155" xml:space="preserve">打上 PVID（native VLAN）</text>
<text x="779.8" y="337.4" font-size="9.6" fill="#334155" xml:space="preserve">也可配成丢弃</text>
<line x1="707.67" y1="234" x2="879.6" y2="286" stroke="#d97706" stroke-width="1.8"/>
<polygon points="879.6,286 872.29,279.09 869.68,287.7" fill="#d97706"/>
<text x="776.8" y="378.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 进入 PVID，注意泄漏</text>
<rect x="1010.4" y="286" width="225.6" height="72.8" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="1010.4" y="286" width="4.5" height="72.8" fill="#0891b2" rx="2"/>
<text x="1023.4" y="305" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">带 tag，VID = PVID</text>
<text x="1023.4" y="322" font-size="9.6" fill="#334155" xml:space="preserve">边界情况：算 tagged</text>
<text x="1023.4" y="337.4" font-size="9.6" fill="#334155" xml:space="preserve">还是当 native 处理</text>
<line x1="779.33" y1="234" x2="1123.2" y2="286" stroke="#0891b2" stroke-width="1.8"/>
<polygon points="1123.2,286 1114.97,280.2 1113.63,289.1" fill="#0891b2"/>
<text x="1020.4" y="378.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 厂商行为不一致</text>
<rect x="36" y="412.8" width="1200" height="110" fill="#eef2ff" rx="10" stroke="#4f46e5" stroke-width="1"/>
<text x="52" y="442.8" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">为什么这一步决定了后面所有判断</text>
<text x="52" y="466.8" font-size="10.2" fill="#334155" xml:space="preserve">① VID 定不下来，就查不了 VLAN 成员表；② 成员表查不出来，就不知道该从哪些口出去；③ 出口类型没判，tag 就会加错或去错。</text>
<text x="52" y="484.8" font-size="10.2" fill="#334155" xml:space="preserve">所以排障顺序应当倒过来用：先在出口看「帧带不带 tag、VID 是多少」，反推它在入口被判成了什么，比通读配置快。</text>
<text x="52" y="502.8" font-size="10.2" fill="#334155" xml:space="preserve">边界：QinQ 场景下有两个 tag（0x88a8 外层、0x8100 内层），这里判的是外层；内层由外层 VLAN 的业务决定，别再套一遍本流程。</text>
<text x="36" y="546" font-size="12.3" fill="#64748b" xml:space="preserve">读图顺序：从左到右五支对应五种输入，颜色只区分「带 tag / 无 tag / 丢弃」，不表示优先级。</text>
<text x="36" y="564" font-size="12.3" fill="#64748b" xml:space="preserve">图源：本篇 §4.5。</text>
</svg>
