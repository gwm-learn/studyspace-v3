<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1280" height="600" fill="#ffffff"/>
<line x1="36" y1="112" x2="1244" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · 一个帧的三条去向：直转、上送、丢弃</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">判据只看帧头与查表结果，不看业务语义：命中就直转，异常才打扰 CPU。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">上送走内联口且有速率限制，泛滥的未知单播会先打满它，而不是业务端口。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">直转（ASIC 路径）</text>
<line x1="197" y1="142" x2="227" y2="142" stroke="#0891b2" stroke-width="3"/>
<text x="235" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">泛洪</text>
<line x1="281" y1="142" x2="311" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="319" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">上送 CPU</text>
<line x1="391.4" y1="142" x2="421.4" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="429.4" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">丢弃/改向</text>
<rect x="401" y="176" width="470" height="58" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="401" y="176" width="4.5" height="58" fill="#475569" rx="2"/>
<text x="414" y="195" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">一个以太帧到达端口</text>
<text x="414" y="212" font-size="9.6" fill="#334155" xml:space="preserve">逻辑顺序 VLAN → MAC → ACL；芯片内并行查表</text>
<rect x="36" y="286" width="225.6" height="72.8" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="36" y="286" width="4.5" height="72.8" fill="#4f46e5" rx="2"/>
<text x="49" y="305" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">命中 + 单播</text>
<text x="49" y="322" font-size="9.6" fill="#334155" xml:space="preserve">目的 MAC 在表里</text>
<text x="49" y="337.4" font-size="9.6" fill="#334155" xml:space="preserve">出端口已确定</text>
<line x1="479.33" y1="234" x2="148.8" y2="286" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="148.8,286 158.39,289.05 156.99,280.16" fill="#4f46e5"/>
<text x="46" y="378.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ ASIC 直转，CPU 完全不知道</text>
<rect x="279.6" y="286" width="225.6" height="72.8" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="279.6" y="286" width="4.5" height="72.8" fill="#0891b2" rx="2"/>
<text x="292.6" y="305" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">未命中</text>
<text x="292.6" y="322" font-size="9.6" fill="#334155" xml:space="preserve">VLAN 内泛洪</text>
<text x="292.6" y="337.4" font-size="9.6" fill="#334155" xml:space="preserve">同时学习源 MAC</text>
<line x1="557.67" y1="234" x2="392.4" y2="286" stroke="#0891b2" stroke-width="1.8"/>
<polygon points="392.4,286 402.34,287.59 399.63,279.01" fill="#0891b2"/>
<text x="289.6" y="378.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 泛洪，不进 CPU</text>
<rect x="523.2" y="286" width="225.6" height="72.8" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="523.2" y="286" width="4.5" height="72.8" fill="#d97706" rx="2"/>
<text x="536.2" y="305" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">发给本机 / 协议</text>
<text x="536.2" y="322" font-size="9.6" fill="#334155" xml:space="preserve">STP、LACP、LLDP、IGMP</text>
<text x="536.2" y="337.4" font-size="9.6" fill="#334155" xml:space="preserve">ARP、DHCP、SNMP</text>
<line x1="636" y1="234" x2="636" y2="286" stroke="#d97706" stroke-width="1.8"/>
<polygon points="636,286 640.5,277 631.5,277" fill="#d97706"/>
<text x="533.2" y="378.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 上送 CPU，走内联口</text>
<rect x="766.8" y="286" width="225.6" height="72.8" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="766.8" y="286" width="4.5" height="72.8" fill="#d97706" rx="2"/>
<text x="779.8" y="305" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">TTL=1 / 需特殊处理</text>
<text x="779.8" y="322" font-size="9.6" fill="#334155" xml:space="preserve">路由式设备才有的分支</text>
<text x="779.8" y="337.4" font-size="9.6" fill="#334155" xml:space="preserve">TTL 耗尽、IP 选项</text>
<line x1="714.33" y1="234" x2="879.6" y2="286" stroke="#d97706" stroke-width="1.8"/>
<polygon points="879.6,286 872.37,279.01 869.66,287.59" fill="#d97706"/>
<text x="776.8" y="378.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 上送 CPU，回 ICMP 超时</text>
<rect x="1010.4" y="286" width="225.6" height="72.8" fill="#fff5f5" rx="8" stroke="#dc2626" stroke-width="1.1"/>
<rect x="1010.4" y="286" width="4.5" height="72.8" fill="#dc2626" rx="2"/>
<text x="1023.4" y="305" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">ACL / 抑制命中</text>
<text x="1023.4" y="322" font-size="9.6" fill="#334155" xml:space="preserve">deny、重定向、风暴抑制</text>
<text x="1023.4" y="337.4" font-size="9.6" fill="#334155" xml:space="preserve">或镜像到 CPU 口</text>
<line x1="792.67" y1="234" x2="1123.2" y2="286" stroke="#dc2626" stroke-width="1.8"/>
<polygon points="1123.2,286 1115.01,280.16 1113.61,289.05" fill="#dc2626"/>
<text x="1020.4" y="378.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 丢弃、改向或复制一份</text>
<rect x="36" y="412.8" width="1200" height="110" fill="#eef2ff" rx="10" stroke="#4f46e5" stroke-width="1"/>
<text x="52" y="442.8" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">为什么「哪些帧会打扰 CPU」可以事先算出来</text>
<text x="52" y="466.8" font-size="10.2" fill="#334155" xml:space="preserve">上送量 ≈ 协议报文数（常数级） + 未知单播与广播（随表项溢出线性增长） + 镜像流量（可配置）。</text>
<text x="52" y="484.8" font-size="10.2" fill="#334155" xml:space="preserve">前两项由拓扑和表项容量决定，第三项由人决定；排障时先分清属于哪一项，再看内联口速率。</text>
<text x="52" y="502.8" font-size="10.2" fill="#334155" xml:space="preserve">边界：镜像是否占用内联口取决于实现——独立分析口不抢带宽，复制进内联口的会抢。</text>
<text x="36" y="546" font-size="12.3" fill="#64748b" xml:space="preserve">读图顺序：先看根节点（进入端口），再看五条分支各自的判据；颜色只区分「谁在干活」，不表示优先级。</text>
<text x="36" y="564" font-size="12.3" fill="#64748b" xml:space="preserve">图源：本篇 §4.2。</text>
</svg>
