<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1280" height="620" fill="#ffffff"/>
<line x1="36" y1="112" x2="1244" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · 吞吐不达标：先按帧长分流，再怀疑设备</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">同一个「不达标」结论，按「哪些帧长受影响」分成五支，每支的怀疑对象完全不同。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">分错支的代价是：把设备问题当仪表问题，或反过来，白改一轮配置。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">方法/口径</text>
<line x1="148.6" y1="142" x2="178.6" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="186.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">pps 相关</text>
<line x1="259" y1="142" x2="289" y2="142" stroke="#0891b2" stroke-width="3"/>
<text x="297" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">帧长/缓存相关</text>
<line x1="393.6" y1="142" x2="423.6" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="431.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">分布相关</text>
<line x1="499.6" y1="142" x2="529.6" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="537.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">时间相关</text>
<rect x="401" y="176" width="470" height="58" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="401" y="176" width="4.5" height="58" fill="#475569" rx="2"/>
<text x="414" y="195" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">吞吐不达标</text>
<text x="414" y="212" font-size="9.6" fill="#334155" xml:space="preserve">先固定口径：方向（单/双向）、流数、帧长、是否开镜像</text>
<rect x="36" y="286" width="225.6" height="72.8" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="36" y="286" width="4.5" height="72.8" fill="#4f46e5" rx="2"/>
<text x="49" y="305" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">所有帧长都低</text>
<text x="49" y="322" font-size="9.6" fill="#334155" xml:space="preserve">端口/双工/流控不一致</text>
<text x="49" y="337.4" font-size="9.6" fill="#334155" xml:space="preserve">或仪表端口配对错</text>
<line x1="479.33" y1="234" x2="148.8" y2="286" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="148.8,286 158.39,289.05 156.99,280.16" fill="#4f46e5"/>
<text x="46" y="378.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 先排除测试方法</text>
<rect x="279.6" y="286" width="225.6" height="72.8" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="279.6" y="286" width="4.5" height="72.8" fill="#d97706" rx="2"/>
<text x="292.6" y="305" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">只有小包低</text>
<text x="292.6" y="322" font-size="9.6" fill="#334155" xml:space="preserve">pps 瓶颈：上送、ACL 未下硬件</text>
<text x="292.6" y="337.4" font-size="9.6" fill="#334155" xml:space="preserve">或走了软转发路径</text>
<line x1="557.67" y1="234" x2="392.4" y2="286" stroke="#d97706" stroke-width="1.8"/>
<polygon points="392.4,286 402.34,287.59 399.63,279.01" fill="#d97706"/>
<text x="289.6" y="378.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 看 CPU 与表项命中</text>
<rect x="523.2" y="286" width="225.6" height="72.8" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="523.2" y="286" width="4.5" height="72.8" fill="#0891b2" rx="2"/>
<text x="536.2" y="305" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">只有大包低</text>
<text x="536.2" y="322" font-size="9.6" fill="#334155" xml:space="preserve">MTU/jumbo 口径不一致</text>
<text x="536.2" y="337.4" font-size="9.6" fill="#334155" xml:space="preserve">或缓存不足</text>
<line x1="636" y1="234" x2="636" y2="286" stroke="#0891b2" stroke-width="1.8"/>
<polygon points="636,286 640.5,277 631.5,277" fill="#0891b2"/>
<text x="533.2" y="378.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 统一 MTU，查队列丢包</text>
<rect x="766.8" y="286" width="225.6" height="72.8" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="766.8" y="286" width="4.5" height="72.8" fill="#0f9d58" rx="2"/>
<text x="779.8" y="305" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">单流过、多流不均</text>
<text x="779.8" y="322" font-size="9.6" fill="#334155" xml:space="preserve">哈希不均、聚合成员未 Selected</text>
<text x="779.8" y="337.4" font-size="9.6" fill="#334155" xml:space="preserve">上行带宽不匹配</text>
<line x1="714.33" y1="234" x2="879.6" y2="286" stroke="#0f9d58" stroke-width="1.8"/>
<polygon points="879.6,286 872.37,279.01 869.66,287.59" fill="#0f9d58"/>
<text x="776.8" y="378.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 换哈希组合复测</text>
<rect x="1010.4" y="286" width="225.6" height="72.8" fill="#fff5f5" rx="8" stroke="#dc2626" stroke-width="1.1"/>
<rect x="1010.4" y="286" width="4.5" height="72.8" fill="#dc2626" rx="2"/>
<text x="1023.4" y="305" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">越跑越低</text>
<text x="1023.4" y="322" font-size="9.6" fill="#334155" xml:space="preserve">温升降频、表项泄漏</text>
<text x="1023.4" y="337.4" font-size="9.6" fill="#334155" xml:space="preserve">内存碎片</text>
<line x1="792.67" y1="234" x2="1123.2" y2="286" stroke="#dc2626" stroke-width="1.8"/>
<polygon points="1123.2,286 1115.01,280.16 1113.61,289.05" fill="#dc2626"/>
<text x="1020.4" y="378.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 看温度与计数斜率</text>
<rect x="36" y="412.8" width="1200" height="128" fill="#eef2ff" rx="10" stroke="#4f46e5" stroke-width="1"/>
<text x="52" y="442.8" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">顺序：方法 → 配置 → 硬件</text>
<text x="52" y="466.8" font-size="10.2" fill="#334155" xml:space="preserve">① 先确认口径与仪表（帧长集合、单向还是双向、流数、时间戳口径）——这一层错，后面全是无效数据。</text>
<text x="52" y="484.8" font-size="10.2" fill="#334155" xml:space="preserve">② 再查配置（MTU、镜像、ACL 是否下硬件、流控）——配置改动会改变转发路径，先回到干净基线复测。</text>
<text x="52" y="502.8" font-size="10.2" fill="#334155" xml:space="preserve">③ 最后怀疑硬件与芯片（缓存、队列、降频）——到这一步才值得拆机、换模块、进温箱。</text>
<text x="52" y="520.8" font-size="10.2" fill="#334155" xml:space="preserve">边界：五支可以叠加（例如小包低 + 越跑越低 = 温升降频叠加 pps 瓶颈），分流只决定先查哪一支。</text>
<text x="36" y="566" font-size="12.3" fill="#64748b" xml:space="preserve">读图顺序：先看根节点的口径，再看五支各自的判据（受影响的帧长/时间分布）。</text>
<text x="36" y="584" font-size="12.3" fill="#64748b" xml:space="preserve">图源：本篇 §4.2。</text>
</svg>
