<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">发现 → 加入 → 配置 → 运行；任一阶段失败会重试，超过阈值回发现或离线。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">运行中与 AC 失联也会回到发现——这就是「AP 突然掉线又自己回来」的原因。</text>
