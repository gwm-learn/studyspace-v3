<text x="66" y="454" font-size="10.2" fill="#334155" xml:space="preserve">「加入」和「配置」之间失败，多半是版本或证书问题；「运行」掉回发现，多半是心跳超时。</text>
<text x="66" y="472" font-size="10.2" fill="#334155" xml:space="preserve">重试上限的意义是防止无限刷日志：到上限应留下明确原因，而不是静默离线。</text>
