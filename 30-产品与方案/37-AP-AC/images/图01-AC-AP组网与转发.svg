<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="960" height="580" fill="#ffffff"/>
<line x1="36" y1="112" x2="924" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · AC-AP 组网与转发：管理一条路，数据两条路</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">AP 通过管理 VLAN 找到 AC；业务流量按 SSID 选集中转发（隧道到 AC）或本地转发（直接出上行）。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">访客 / IoT 走独立 VLAN，即使到了 AC 也不进内网。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">管理</text>
<line x1="120" y1="142" x2="150" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">集中转发</text>
<line x1="226" y1="142" x2="256" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="264" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">本地转发</text>
<rect x="380" y="190" width="280" height="84" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="380" y="190" width="4.5" height="84" fill="#d97706" rx="2"/>
<text x="393" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">AC（管理 VLAN）</text>
<text x="393" y="226" font-size="9.6" fill="#334155" xml:space="preserve">CAPWAP 控制</text>
<text x="393" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">策略 / 漫游 / 认证</text>
<rect x="380" y="320" width="280" height="70" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="380" y="320" width="4.5" height="70" fill="#475569" rx="2"/>
<text x="393" y="339" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">交换机（Trunk）</text>
<text x="393" y="356" font-size="9.6" fill="#334155" xml:space="preserve">管理 VLAN + 业务 VLAN</text>
<rect x="120" y="450" width="220" height="84" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="120" y="450" width="4.5" height="84" fill="#4f46e5" rx="2"/>
<text x="133" y="469" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">AP 1</text>
<text x="133" y="486" font-size="9.6" fill="#334155" xml:space="preserve">集中转发 SSID</text>
<text x="133" y="501.4" font-size="9.6" fill="#334155" xml:space="preserve">本地转发 SSID</text>
<rect x="700" y="450" width="220" height="84" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="700" y="450" width="4.5" height="84" fill="#0f9d58" rx="2"/>
<text x="713" y="469" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">AP 2</text>
<text x="713" y="486" font-size="9.6" fill="#334155" xml:space="preserve">同 SSID</text>
<text x="713" y="501.4" font-size="9.6" fill="#334155" xml:space="preserve">漫游目标</text>
<line x1="520" y1="274" x2="520" y2="320" stroke="#d97706" stroke-width="1.8"/>
<polygon points="520,320 524.5,311 515.5,311" fill="#d97706"/>
<text x="530" y="304" font-size="9.4" fill="#64748b" xml:space="preserve" font-weight="600">管理</text>
<line x1="480" y1="390" x2="260" y2="450" stroke="#475569" stroke-width="1.6"/>
<polygon points="260,450 269.87,451.97 267.5,443.29" fill="#475569"/>
<line x1="560" y1="390" x2="780" y2="450" stroke="#475569" stroke-width="1.6"/>
<polygon points="780,450 772.5,443.29 770.13,451.97" fill="#475569"/>
<line x1="160" y1="450" x2="160" y2="232" stroke="#4f46e5" stroke-width="1.6" stroke-dasharray="3 3"/>
<line x1="160" y1="232" x2="380" y2="232" stroke="#4f46e5" stroke-width="1.6" stroke-dasharray="3 3"/>
<polygon points="380,232 371,227.5 371,236.5" fill="#4f46e5"/>
<text x="172" y="430" font-size="9.4" fill="#4f46e5" xml:space="preserve" font-weight="600">隧道（集中转发）</text>
