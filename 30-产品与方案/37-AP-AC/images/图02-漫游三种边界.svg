<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1240" height="620" fill="#ffffff"/>
<line x1="36" y1="112" x2="1204" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · 漫游的三种边界：地址在哪儿丢的</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">同样是「换 AP」，地址是否保持取决于两件事：新 AP 的业务 VLAN 是否同子网、有没有 AC 间隧道/锚点。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">左边的分支代价最小，右侧两条要网络侧额外补能力；都没有，就只是一次重新连网。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#0891b2" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">直接桥接</text>
<line x1="142" y1="142" x2="172" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="180" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">隧道回原网关</text>
<line x1="270" y1="142" x2="300" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="308" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">需重新分配地址</text>
<rect x="480" y="184" width="240" height="58" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="480" y="184" width="4.5" height="58" fill="#475569" rx="2"/>
<text x="493" y="203" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">终端从 AP1 走到 AP2</text>
<text x="493" y="220" font-size="9.6" fill="#334155" xml:space="preserve">先问：地址要不要保？</text>
<rect x="36" y="304" width="364" height="88.2" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="36" y="304" width="4.5" height="88.2" fill="#0891b2" rx="2"/>
<text x="49" y="323" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">① 同子网（二层）</text>
<text x="49" y="340" font-size="9.6" fill="#334155" xml:space="preserve">AP1/AP2 同一业务 VLAN</text>
<text x="49" y="355.4" font-size="9.6" fill="#334155" xml:space="preserve">帧直接桥接到同一网关</text>
<text x="49" y="370.8" font-size="9.6" fill="#334155" xml:space="preserve">终端 IP 不变</text>
<line x1="540" y1="242" x2="218" y2="304" stroke="#0891b2" stroke-width="1.8"/>
<polygon points="218,304 227.69,306.72 225.99,297.88" fill="#0891b2"/>
<text x="46" y="412.2" font-size="9.4" fill="#64748b" xml:space="preserve">→ 网络侧只需同 ESS（k/v/r 可选）</text>
<rect x="418" y="304" width="364" height="88.2" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="418" y="304" width="4.5" height="88.2" fill="#4f46e5" rx="2"/>
<text x="431" y="323" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">② 跨子网、同 AC</text>
<text x="431" y="340" font-size="9.6" fill="#334155" xml:space="preserve">业务 VLAN 不同</text>
<text x="431" y="355.4" font-size="9.6" fill="#334155" xml:space="preserve">需 AC 侧锚点/隧道把流量</text>
<text x="431" y="370.8" font-size="9.6" fill="#334155" xml:space="preserve">送回原子网网关</text>
<line x1="600" y1="242" x2="600" y2="304" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="600,304 604.5,295 595.5,295" fill="#4f46e5"/>
<text x="428" y="412.2" font-size="9.4" fill="#64748b" xml:space="preserve">→ 要配隧道或三层移动性</text>
<rect x="800" y="304" width="364" height="88.2" fill="#fff5f5" rx="8" stroke="#dc2626" stroke-width="1.1"/>
<rect x="800" y="304" width="4.5" height="88.2" fill="#dc2626" rx="2"/>
<text x="813" y="323" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">③ 跨 AC</text>
<text x="813" y="340" font-size="9.6" fill="#334155" xml:space="preserve">新 AP 归另一台 AC</text>
<text x="813" y="355.4" font-size="9.6" fill="#334155" xml:space="preserve">无隧道 → 重新 DHCP</text>
<text x="813" y="370.8" font-size="9.6" fill="#334155" xml:space="preserve">有隧道 → 仍回原网关</text>
<line x1="660" y1="242" x2="982" y2="304" stroke="#dc2626" stroke-width="1.8"/>
<polygon points="982,304 974.01,297.88 972.31,306.72" fill="#dc2626"/>
<text x="810" y="412.2" font-size="9.4" fill="#64748b" xml:space="preserve">→ 要漫游域 + AC 间隧道 + 密钥同步</text>
<rect x="36" y="446.2" width="1128" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="476.2" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">判断顺序</text>
<text x="52" y="500.2" font-size="10.2" fill="#334155" xml:space="preserve">① 看新 AP 的业务 VLAN 与原 AP 是否同子网；② 看有没有 AC 间隧道/锚点；③ 两者都没有，就不是「漫游」，是「重连」。</text>
<text x="52" y="518.2" font-size="10.2" fill="#334155" xml:space="preserve">先按这个顺序判，再决定要不要调 k/v/r —— 子网不连续时，调 11r 只会让「断得更快」而不是「断得更少」。</text>
<text x="36" y="566" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py 生成</text>
<text x="36" y="584" font-size="12.3" fill="#64748b" xml:space="preserve">本篇：30-产品与方案/37-AP-AC/02-AC-AP组网与漫游.md</text>
</svg>
