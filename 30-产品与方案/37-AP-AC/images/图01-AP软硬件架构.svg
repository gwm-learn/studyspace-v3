<text x="673" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">管理路径（Fit）</text>
<text x="673" y="226" font-size="9.6" fill="#334155" xml:space="preserve">CAPWAP 控制通道</text>
<text x="673" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">配置 / 镜像 / 统计</text>
<rect x="660" y="330" width="260" height="120" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
