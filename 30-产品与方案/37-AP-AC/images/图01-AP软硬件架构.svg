<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · AP 软硬件架构：一条硬件链，两条软件路径</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">硬件自下而上：PoE/以太 → SoC → 射频链（FEM → 天线）。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">软件分两条：管理走 CAPWAP（Fit），数据按转发模式走隧道或本地。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#475569" stroke-width="3"/>
