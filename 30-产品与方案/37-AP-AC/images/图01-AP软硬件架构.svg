<text x="673" y="366" font-size="9.6" fill="#334155" xml:space="preserve">集中转发：隧道到 AC</text>
<text x="673" y="381.4" font-size="9.6" fill="#334155" xml:space="preserve">本地转发：直接出上行</text>
<rect x="40" y="440" width="920" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="470" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="494" font-size="10.2" fill="#334155" xml:space="preserve">Fit 模式下管理必须能到 AC；管理 VLAN 不通，AP 会一直停在发现阶段。</text>
<text x="56" y="512" font-size="10.2" fill="#334155" xml:space="preserve">本地转发省掉隧道开销，但策略与漫游要在 AP 侧做；集中转发便于统一管控，代价是 AC 成为带宽瓶颈。</text>
