<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">管理</text>
<line x1="204" y1="142" x2="234" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="242" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">数据</text>
<rect x="40" y="190" width="560" height="52" fill="#f8fafc" rx="6" stroke="#475569" stroke-width="1.1"/>
<text x="52" y="219.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">天线 / FEM（功放、滤波）</text>
