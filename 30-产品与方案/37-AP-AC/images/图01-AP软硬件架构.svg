<text x="52" y="279.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">射频芯片 + mac80211</text>
<text x="590" y="279.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">基带</text>
<rect x="40" y="310" width="560" height="52" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.1"/>
<text x="52" y="339.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">SoC：桥接 / NAT / 转发</text>
<text x="590" y="339.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">数据面</text>
<rect x="40" y="370" width="560" height="52" fill="#f8fafc" rx="6" stroke="#475569" stroke-width="1.1"/>
<text x="52" y="399.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">PoE + 以太上行</text>
<text x="590" y="399.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">供电与回程</text>
<rect x="660" y="190" width="260" height="120" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
