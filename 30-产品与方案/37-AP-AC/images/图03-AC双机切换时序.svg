<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="840" viewBox="0 0 1300 840" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1300" height="840" fill="#ffffff"/>
<line x1="36" y1="112" x2="1264" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 03 · AC 双机切换：AP 在切换窗口里经历什么</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">稳态在生命线上半段：AP 与主 AC 维持 Echo 与业务，主备之间同步 AP 表、客户端表与密钥。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">下半段是三种结局：状态同步完整则 Echo 续上；只同步部分则重新 Join；完全没同步则回发现。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">正常</text>
