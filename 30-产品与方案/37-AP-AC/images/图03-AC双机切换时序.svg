<polygon points="475,260 466,255.5 466,264.5" fill="#0f9d58"/>
<text x="181" y="253" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">已关联（业务经 AP 转发）</text>
<line x1="475" y1="300" x2="775" y2="300" stroke="#0f9d58" stroke-width="1.8"/>
<polygon points="775,300 766,295.5 766,304.5" fill="#0f9d58"/>
<text x="481" y="293" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">Echo / 业务（稳态）</text>
<line x1="775" y1="340" x2="1075" y2="340" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="3 3"/>
<polygon points="1075,340 1066,335.5 1066,344.5" fill="#4f46e5"/>
<text x="781" y="333" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">同步 AP 表 / 客户端表 / 密钥</text>
<line x1="775" y1="380" x2="809" y2="380" stroke="#dc2626" stroke-width="1.8"/>
<line x1="809" y1="380" x2="809" y2="394" stroke="#dc2626" stroke-width="1.8"/>
<line x1="809" y1="394" x2="781" y2="394" stroke="#dc2626" stroke-width="1.8"/>
<polygon points="777,394 786,398.5 786,389.5" fill="#dc2626"/>
<text x="781" y="373" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">AC-A 故障：电源 / 进程 / 链路</text>
