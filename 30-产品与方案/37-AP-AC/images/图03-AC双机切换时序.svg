<text x="481" y="493" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">会话不在 → Discovery / DTLS / Join</text>
<line x1="1075" y1="540" x2="475" y2="540" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="3 3"/>
<polygon points="475,540 484,544.5 484,535.5" fill="#4f46e5"/>
<text x="481" y="533" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">配置重下发（Config Status）</text>
<line x1="175" y1="580" x2="475" y2="580" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3 3"/>
<polygon points="475,580 466,575.5 466,584.5" fill="#dc2626"/>
<text x="181" y="573" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">终端重认证 / 长连接断开</text>
<line x1="475" y1="620" x2="1075" y2="620" stroke="#0f9d58" stroke-width="1.8"/>
<polygon points="1075,620 1066,615.5 1066,624.5" fill="#0f9d58"/>
<text x="481" y="613" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">业务恢复（按同步深度决定代价）</text>
<rect x="36" y="666" width="1150" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="696" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">切换时长不是 VRRP 的秒数</text>
<text x="52" y="720" font-size="10.2" fill="#334155" xml:space="preserve">切换窗口 = 故障检测 + 升主 + AP 重加入（+ 终端重认证）。同步到哪一层，决定 AP 是续上、重 Join 还是回发现。</text>
<text x="52" y="738" font-size="10.2" fill="#334155" xml:space="preserve">验收指标要看「重认证终端比例」和「业务中断时长」，不要只看「备机能不能接管」。</text>
