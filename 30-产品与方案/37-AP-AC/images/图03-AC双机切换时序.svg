<text x="362" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">AP</text>
<rect x="650" y="190" width="250" height="42" fill="#f1f5f9" rx="8" stroke="#0f9d58" stroke-width="1"/>
<text x="662" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">主 AC（AC-A）</text>
<rect x="950" y="190" width="250" height="42" fill="#f1f5f9" rx="8" stroke="#d97706" stroke-width="1"/>
<text x="962" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">备 AC（AC-B）</text>
