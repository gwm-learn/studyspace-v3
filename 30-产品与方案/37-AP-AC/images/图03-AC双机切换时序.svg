<text x="1081" y="413" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">VRRP 升主，虚拟 IP 漂移</text>
<line x1="475" y1="460" x2="1075" y2="460" stroke="#0891b2" stroke-width="1.8"/>
<polygon points="1075,460 1066,455.5 1066,464.5" fill="#0891b2"/>
