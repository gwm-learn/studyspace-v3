<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">同步/可选</text>
<line x1="232.6" y1="142" x2="262.6" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="270.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">故障</text>
<line x1="316.6" y1="142" x2="346.6" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="354.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">重建</text>
