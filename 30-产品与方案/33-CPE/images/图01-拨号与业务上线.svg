<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="540" viewBox="0 0 1020 540" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1020" height="540" fill="#ffffff"/>
<line x1="36" y1="112" x2="984" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · 拨号与业务上线：五个阶段，协议各不相同</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">链路、认证、地址、转发、业务：每一步用的协议不同，卡在同一步说明问题在同一层。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">定位时先看阶段，再查该阶段的协议与配置，不要一上来就翻全部日志。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#475569" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">链路</text>
<line x1="120" y1="142" x2="150" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">认证/地址</text>
<line x1="232.6" y1="142" x2="262.6" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="270.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">可用</text>
<line x1="70" y1="270" x2="970" y2="270" stroke="#cbd5e1" stroke-width="1.8"/>
<polygon points="160,265 155,270 160,275 165,270" fill="#475569"/>
<text x="160" y="252" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="600" text-anchor="middle">链路</text>
<text x="160" y="238" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">物理同步 / PPPoE 发现</text>
<polygon points="340,265 335,270 340,275 345,270" fill="#4f46e5"/>
<text x="340" y="294" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="600" text-anchor="middle">认证</text>
<text x="340" y="308" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">PAP / CHAP</text>
<polygon points="520,265 515,270 520,275 525,270" fill="#4f46e5"/>
<text x="520" y="252" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="600" text-anchor="middle">地址</text>
<text x="520" y="238" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">IPCP / DHCP</text>
<polygon points="700,265 695,270 700,275 705,270" fill="#d97706"/>
<text x="700" y="294" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="600" text-anchor="middle">转发</text>
<text x="700" y="308" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">路由 / NAT</text>
<polygon points="880,265 875,270 880,275 885,270" fill="#0f9d58"/>
<text x="880" y="252" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="600" text-anchor="middle">业务可用</text>
<text x="880" y="238" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">DNS / 端口 / 代理</text>
<rect x="70" y="360" width="900" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="86" y="390" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="86" y="414" font-size="10.2" fill="#334155" xml:space="preserve">「拨号成功」只代表到了地址阶段，业务可用还要看 DNS、端口映射、代理链路。</text>
<text x="86" y="432" font-size="10.2" fill="#334155" xml:space="preserve">PPPoE 的 MTU 1492 会影响后续业务：拨号本身成功，但大包在业务阶段才出问题。</text>
