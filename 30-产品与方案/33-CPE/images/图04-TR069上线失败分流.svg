<text x="52" y="484" font-size="10.2" fill="#334155" xml:space="preserve">前两支是「连不上」：左边查网络与地址，右边查身份；两支都不涉及参数模型，先别改配置。</text>
<text x="52" y="502" font-size="10.2" fill="#334155" xml:space="preserve">后两支是「连上了但没干成」：会话断看中间设备与超时，任务失败才轮到参数路径与数据模型版本。</text>
<text x="52" y="520" font-size="10.2" fill="#334155" xml:space="preserve">顺序的价值在于排除：① 没到 ACS 时，②③④ 全部无从谈起；先证明「到了」，再往下判。</text>
