<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1100" height="620" fill="#ffffff"/>
<line x1="36" y1="112" x2="1064" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · 定制分层与入网流程：改动越靠上越便宜</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">左边是四层定制：上层改配置，下层改镜像与 SDK；越往下影响面越大。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">右边是入网阶段：越往后发现问题，返工成本越高。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">定制层</text>
<line x1="131" y1="142" x2="161" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="169" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">入网阶段</text>
<text x="40" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① 定制分四层</text>
<rect x="40" y="196" width="520" height="52" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.1"/>
<text x="52" y="225.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">运营商配置层：预置参数 / 皮肤 / SSID 策略</text>
<text x="550" y="225.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">改配置</text>
<rect x="40" y="256" width="520" height="52" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.1"/>
<text x="52" y="285.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">业务层：插件、脚本、页面</text>
<text x="550" y="285.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">改代码</text>
<rect x="40" y="316" width="520" height="52" fill="#f8fafc" rx="6" stroke="#475569" stroke-width="1.1"/>
<text x="52" y="345.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">系统层：镜像、内核、默认值</text>
<text x="550" y="345.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">改镜像</text>
<rect x="40" y="376" width="520" height="52" fill="#f8fafc" rx="6" stroke="#475569" stroke-width="1.1"/>
<text x="52" y="405.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">芯片 / SDK 层：驱动、BSP</text>
<text x="550" y="405.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">改 SDK</text>
<text x="640" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② 入网阶段</text>
<rect x="640" y="196" width="420" height="40" fill="#f2fcf5" rx="6" stroke="#0f9d58" stroke-width="1.1"/>
<text x="652" y="219.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">需求冻结</text>
<text x="1050" y="219.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">可改</text>
<rect x="640" y="242" width="420" height="40" fill="#f2fcf5" rx="6" stroke="#0f9d58" stroke-width="1.1"/>
<text x="652" y="265.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">样机验证</text>
<text x="1050" y="265.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">可改</text>
<rect x="640" y="288" width="420" height="40" fill="#fff9ee" rx="6" stroke="#d97706" stroke-width="1.1"/>
<text x="652" y="311.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">集采测试</text>
<text x="1050" y="311.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">慎改</text>
<rect x="640" y="334" width="420" height="40" fill="#fff9ee" rx="6" stroke="#d97706" stroke-width="1.1"/>
<text x="652" y="357.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">试点</text>
<text x="1050" y="357.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">尽量不改</text>
<rect x="640" y="380" width="420" height="40" fill="#fff5f5" rx="6" stroke="#dc2626" stroke-width="1.1"/>
<text x="652" y="403.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">量产</text>
<text x="1050" y="403.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">冻结</text>
<rect x="40" y="454" width="1020" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="484" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="508" font-size="10.2" fill="#334155" xml:space="preserve">越靠上的定制层越适合做差异（配置、页面），越靠下越应该保持主线一致——否则每次升级都要重新合补丁。</text>
<text x="56" y="526" font-size="10.2" fill="#334155" xml:space="preserve">入网阶段门的意义在于「早发现」：样机阶段发现参数错，改一行配置；量产后发现，就是批量升级。</text>
<text x="36" y="566" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py 生成</text>
<text x="36" y="584" font-size="12.3" fill="#64748b" xml:space="preserve">本篇：30-产品与方案/33-CPE/03-运营商定制与入网.md</text>
</svg>
