<svg xmlns="http://www.w3.org/2000/svg" width="820" height="960" viewBox="0 0 820 960" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="820" height="960" fill="#ffffff"/>
<line x1="36" y1="112" x2="784" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 03 · CWMP 会话时序：一条 HTTP 连接里的双向对话</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">CPE 发 POST 带上 Inform，ACS 的 200 响应里带回自己的 RPC；双方交替，直到一方发空 body。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">Download 的 200 只是「接受任务」，真正结果在重启后由 7 TRANSFER COMPLETE 带回。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">Inform / 会话</text>
<line x1="179.4" y1="142" x2="209.4" y2="142" stroke="#475569" stroke-width="3"/>
<text x="217.4" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">空 body 交话头</text>
<line x1="325" y1="142" x2="355" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="363" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">下载与回报</text>
<rect x="120" y="190" width="270" height="42" fill="#f1f5f9" rx="8" stroke="#4f46e5" stroke-width="1"/>
<text x="132" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">CPE（CWMP 客户端）</text>
<rect x="500" y="190" width="270" height="42" fill="#f1f5f9" rx="8" stroke="#0f9d58" stroke-width="1"/>
<text x="512" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">ACS（服务端）</text>
<line x1="255" y1="232" x2="255" y2="734" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="635" y1="232" x2="635" y2="734" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="255" y1="260" x2="635" y2="260" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="635,260 626,255.5 626,264.5" fill="#4f46e5"/>
<text x="261" y="253" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">POST Inform：1 BOOT + 关键参数</text>
<line x1="635" y1="298" x2="255" y2="298" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="255,298 264,302.5 264,293.5" fill="#4f46e5"/>
<text x="261" y="291" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">200 InformResponse</text>
<line x1="255" y1="336" x2="635" y2="336" stroke="#475569" stroke-width="1.8"/>
<polygon points="635,336 626,331.5 626,340.5" fill="#475569"/>
<text x="261" y="329" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">POST 空 body：我这边没有请求了</text>
<line x1="635" y1="374" x2="255" y2="374" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="255,374 264,378.5 264,369.5" fill="#4f46e5"/>
<text x="261" y="367" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">200 GetParameterValues：读状态</text>
<line x1="255" y1="412" x2="635" y2="412" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="635,412 626,407.5 626,416.5" fill="#4f46e5"/>
<text x="261" y="405" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">POST 参数值</text>
<line x1="635" y1="450" x2="255" y2="450" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="255,450 264,454.5 264,445.5" fill="#4f46e5"/>
<text x="261" y="443" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">200 SetParameterValues（带 ParameterKey）</text>
<line x1="255" y1="488" x2="635" y2="488" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="635,488 626,483.5 626,492.5" fill="#4f46e5"/>
<text x="261" y="481" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">POST 200 或 Fault 9007（只读）</text>
<line x1="635" y1="526" x2="255" y2="526" stroke="#d97706" stroke-width="1.8"/>
<polygon points="255,526 264,530.5 264,521.5" fill="#d97706"/>
<text x="261" y="519" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">200 Download：URL / 校验 / FileType</text>
<line x1="255" y1="564" x2="635" y2="564" stroke="#d97706" stroke-width="1.8"/>
<polygon points="635,564 626,559.5 626,568.5" fill="#d97706"/>
<text x="261" y="557" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">POST 200：接受任务，尚未下载</text>
<line x1="635" y1="602" x2="255" y2="602" stroke="#475569" stroke-width="1.8"/>
<polygon points="255,602 264,606.5 264,597.5" fill="#475569"/>
<text x="261" y="595" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">200 空 body：会话结束</text>
<line x1="255" y1="640" x2="289" y2="640" stroke="#d97706" stroke-width="1.8"/>
<line x1="289" y1="640" x2="289" y2="654" stroke="#d97706" stroke-width="1.8"/>
<line x1="289" y1="654" x2="261" y2="654" stroke="#d97706" stroke-width="1.8"/>
<polygon points="257,654 266,658.5 266,649.5" fill="#d97706"/>
<text x="261" y="633" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">下载 → 校验 → 写备用分区 → 重启</text>
<line x1="255" y1="678" x2="635" y2="678" stroke="#0f9d58" stroke-width="1.8"/>
<polygon points="635,678 626,673.5 626,682.5" fill="#0f9d58"/>
<text x="261" y="671" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">POST Inform：7 TRANSFER COMPLETE + 新版本</text>
<line x1="635" y1="716" x2="255" y2="716" stroke="#0f9d58" stroke-width="1.8"/>
<polygon points="255,716 264,720.5 264,711.5" fill="#0f9d58"/>
<text x="261" y="709" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">200：确认结果，按版本决定是否重试</text>
<rect x="36" y="760" width="748" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="790" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="52" y="814" font-size="10.2" fill="#334155" xml:space="preserve">会话只有一条连接：左边发的 POST 与右边回的 200 交替，谁发空 body 表示「我没有更多请求」，双方都空才结束。</text>
<text x="52" y="832" font-size="10.2" fill="#334155" xml:space="preserve">Download 返回 200 时文件还没下；校验失败、分区不足、断电都会在 TransferComplete 里变成 Fault，不能只看 200。</text>
<text x="52" y="850" font-size="10.2" fill="#334155" xml:space="preserve">重启是会话之外的动作：新镜像起来后靠 1 BOOT + 版本号确认，所以「升级成功」要看第三次上报，而不是第二条报文。</text>
<text x="36" y="906" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py 生成</text>
<text x="36" y="924" font-size="12.3" fill="#64748b" xml:space="preserve">本篇：30-产品与方案/33-CPE/02-TR-069与ACS运维.md</text>
</svg>
