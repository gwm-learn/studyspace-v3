<rect x="36" y="584" width="974" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="614" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="52" y="638" font-size="10.2" fill="#334155" xml:space="preserve">分水岭在中间一列：只有 Internet 那一行改源地址；IPTV 改地址组播就散了，VoIP 改地址 SDP 就对不上，管理流量干脆不进转发路径。</text>
<text x="52" y="656" font-size="10.2" fill="#334155" xml:space="preserve">右边一列的 VLAN 不是画着好看：三类业务共用一根光纤时，靠 VLAN 在上游区分，CPE 配错 VLAN 表现为「别的业务都好，就这一类不通」。</text>
<text x="52" y="674" font-size="10.2" fill="#334155" xml:space="preserve">底下一行是旁路：它和上面三行共用 WAN，但不共用转发路径，所以业务打满 CPU 时管理会变慢，通常仍能连上。</text>
