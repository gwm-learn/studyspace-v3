<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · CPE 内部业务分流：分水岭是「改不改地址」</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">同样从 CPE 穿过，四类业务的处理方式完全不同：上网改地址、IPTV 不改地址、VoIP 在本机终结、管理走旁路。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">判断某业务该走哪种路径，只看一条——它能不能接受源地址被改写。</text>
