<text x="49" y="495" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">CWMP 客户端</text>
<text x="49" y="512" font-size="9.6" fill="#334155" xml:space="preserve">设备上电 / 周期主动上报</text>
<text x="49" y="527.4" font-size="9.6" fill="#334155" xml:space="preserve">本机进程，独立于转发面</text>
