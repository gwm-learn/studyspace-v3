<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · 多协议接入与网络隔离：南向适配，北向消费</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">左边是南向：Zigbee / BLE / Z-Wave / Thread 各自接入，由中间件抽象成统一模型。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">右边是北向：场景与云管只面对模型；IoT 设备放独立 VLAN，规则受控出入。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#0891b2" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">南向</text>
