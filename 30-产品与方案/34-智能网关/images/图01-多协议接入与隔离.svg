<polygon points="580,374 571,369.5 571,378.5" fill="#0f9d58"/>
<line x1="840" y1="374" x2="880" y2="374" stroke="#d97706" stroke-width="1.4" stroke-dasharray="3 3"/>
<polygon points="880,374 871,369.5 871,378.5" fill="#d97706"/>
<rect x="40" y="430" width="1080" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="460" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="484" font-size="10.2" fill="#334155" xml:space="preserve">隔离不是「连不上」：IoT 设备通常需要访问云端，所以放行的是「出站 + 特定端口」，不是全通。</text>
<text x="56" y="502" font-size="10.2" fill="#334155" xml:space="preserve">协议越多，越要靠模型收敛；否则每接一种设备就要改北向业务。</text>
