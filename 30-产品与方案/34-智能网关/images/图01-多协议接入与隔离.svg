<text x="69.36" y="321.6" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">Z-Wave</text>
<rect x="40" y="350" width="58.72" height="36" fill="#ecfeff" rx="6" stroke="#0891b2" stroke-width="1.2"/>
<text x="69.36" y="371.6" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">Thread</text>
<rect x="220" y="200" width="300" height="186" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="220" y="200" width="4.5" height="186" fill="#4f46e5" rx="2"/>
<text x="233" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">中间件：统一设备模型</text>
<text x="233" y="236" font-size="9.6" fill="#334155" xml:space="preserve">属性 / 事件 / 动作</text>
<text x="233" y="251.4" font-size="9.6" fill="#334155" xml:space="preserve">协议差异在这里被抹平</text>
<text x="233" y="266.8" font-size="9.6" fill="#334155" xml:space="preserve">北向只看模型，不看协议</text>
<rect x="580" y="200" width="260" height="186" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="580" y="200" width="4.5" height="186" fill="#0f9d58" rx="2"/>
<text x="593" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">北向消费者</text>
<text x="593" y="236" font-size="9.6" fill="#334155" xml:space="preserve">场景 / 自动化</text>
<text x="593" y="251.4" font-size="9.6" fill="#334155" xml:space="preserve">云管 / App</text>
<text x="593" y="266.8" font-size="9.6" fill="#334155" xml:space="preserve">本地 Web</text>
<rect x="880" y="200" width="240" height="186" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="880" y="200" width="4.5" height="186" fill="#d97706" rx="2"/>
<text x="893" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">IoT VLAN 隔离</text>
<text x="893" y="236" font-size="9.6" fill="#334155" xml:space="preserve">独立网段 / 独立 SSID</text>
<text x="893" y="251.4" font-size="9.6" fill="#334155" xml:space="preserve">只放行必要出站</text>
<text x="893" y="266.8" font-size="9.6" fill="#334155" xml:space="preserve">默认不能访问主网</text>
