<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">模型</text>
<line x1="204" y1="142" x2="234" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="242" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">北向</text>
<line x1="288" y1="142" x2="318" y2="142" stroke="#d97706" stroke-width="3"/>
