<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 03 · 子设备与配网：离线不等于被移除</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">配网 → 认证 → 上线才可控；离线只是暂时失联，配置与场景仍然保留。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">移除是显式动作，要清理绑定关系，避免「幽灵设备」占着规则。</text>
