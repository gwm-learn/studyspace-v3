<text x="76" y="504" font-size="10.2" fill="#334155" xml:space="preserve">把「离线」当「移除」是常见误判：设备重启、信号弱都会离线，规则不该被清掉。</text>
<text x="76" y="522" font-size="10.2" fill="#334155" xml:space="preserve">配网失败多发生在密钥交换阶段：协议版本、配网窗口、设备已被其他网关绑定。</text>
