<polygon points="1271.75,300 1263.3,294.54 1262.31,303.48" fill="#4f46e5"/>
<text x="1113.5" y="392.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 调功率、开辅助漫游</text>
<rect x="40" y="440" width="1400" height="128" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="470" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="494" font-size="10.2" fill="#334155" xml:space="preserve">先判范围：全屋是共因（主网关/主干/OLT），单房间是分支（纤/分光器/供电）。</text>
<text x="56" y="512" font-size="10.2" fill="#334155" xml:space="preserve">再判层：光、电、空口三层，别用 Wi-Fi 的现象去解释光层故障。</text>
<text x="56" y="530" font-size="10.2" fill="#334155" xml:space="preserve">每步用对照实验：换纤、换口、换终端，比读规格书收敛得快。</text>
<text x="56" y="548" font-size="10.2" fill="#334155" xml:space="preserve">答错的代价：范围判错让上门次数翻倍；层判错会把施工问题当成设备坏。</text>
