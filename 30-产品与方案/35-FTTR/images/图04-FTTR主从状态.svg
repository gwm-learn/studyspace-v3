<text x="326.7" y="274" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">光口扫描</text>
<rect x="500" y="240" width="89.08" height="44" fill="#f2fcf5" rx="6" stroke="#0f9d58" stroke-width="1.2"/>
