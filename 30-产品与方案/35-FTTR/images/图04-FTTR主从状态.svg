<text x="76" y="484" font-size="10.2" fill="#334155" xml:space="preserve">从网关的注册依赖主网关：主网关没上线或光下行口没使能，从网关一直停在「注册中」。</text>
<text x="76" y="502" font-size="10.2" fill="#334155" xml:space="preserve">统一组网阶段才下发 SSID/VLAN/漫游参数；这时从网关才真正能和主网关「同一个网」。</text>
