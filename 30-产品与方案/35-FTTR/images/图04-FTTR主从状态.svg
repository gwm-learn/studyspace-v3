<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 04 · FTTR 主从状态：先主后从，再统一组网</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">主网关先完成 PON 注册，再发现并注册从网关，最后形成统一组网。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">主网关没上线，从网关就停在自己的注册阶段——这是「房间没网」最常见的原因。</text>
