<text x="552.28" y="384" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">光路 / 认证 / 版本</text>
<line x1="544.54" y1="284" x2="540" y2="350" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3 3"/>
<polygon points="540,350 545.11,341.33 536.13,340.71" fill="#dc2626"/>
<line x1="564.56" y1="350" x2="569.08" y2="284" stroke="#d97706" stroke-width="1.6" stroke-dasharray="3 3"/>
