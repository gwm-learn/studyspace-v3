<line x1="226" y1="142" x2="256" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="264" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">失败</text>
<rect x="60" y="240" width="92.52" height="44" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.2"/>
<text x="106.26" y="262" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">主：PON 注册</text>
<text x="106.26" y="274" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">OMCI / 业务配置</text>
<rect x="280" y="240" width="93.4" height="44" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.2"/>
