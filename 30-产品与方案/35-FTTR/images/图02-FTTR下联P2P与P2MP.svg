<text x="56" y="620" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="644" font-size="10.2" fill="#334155" xml:space="preserve">P2P 没有分光器：主网关光口数就是房间数上限，带宽独享、故障隔离。</text>
<text x="56" y="662" font-size="10.2" fill="#334155" xml:space="preserve">P2MP 主干共享：分光器与主干是单点，任一处损耗变化会同时影响所有分支。</text>
<text x="56" y="680" font-size="10.2" fill="#334155" xml:space="preserve">两种方式的从网关都不向运营商 OLT 注册；P2MP 下它注册的是主网关。</text>
<text x="56" y="698" font-size="10.2" fill="#334155" xml:space="preserve">全程衰耗口径：P2P 0–6 dB，P2MP 0–23 dB（团体标准征求意见稿，非产品规格）。</text>
