<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · 两种下联方式：P2P 独享，P2MP 共享</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">左：P2P，主网关每个下行口独占一纤到一间，中间没有分光器。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">右：P2MP，一个 PON 下行口经分光器分到各间，主干是共享段，也是单点。</text>
