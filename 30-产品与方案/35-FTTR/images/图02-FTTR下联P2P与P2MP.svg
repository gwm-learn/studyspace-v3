<text x="232.8" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">共享主干（P2MP）</text>
<text x="40" y="186" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">P2P：光口数就是房间数上限，链路互不影响</text>
