<text x="56" y="634" font-size="10.2" fill="#334155" xml:space="preserve">第①②段是主网关自己作为 ONU 的注册，与从网关无关。</text>
<text x="56" y="652" font-size="10.2" fill="#334155" xml:space="preserve">第④–⑦段是主从管理：发现、认证、配置下发、状态上报，全部终止在主网关。</text>
<text x="56" y="670" font-size="10.2" fill="#334155" xml:space="preserve">第③⑧段是平台侧：平台只与主网关建链，从网关状态由主网关代理。</text>
<text x="56" y="688" font-size="10.2" fill="#334155" xml:space="preserve">虚线表示周期上报；具体协议（TR-069、MQTT、私有）随厂商与运营商方案变化。</text>
