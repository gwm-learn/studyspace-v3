<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="520" viewBox="0 0 1020 520" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1020" height="520" fill="#ffffff"/>
<line x1="36" y1="112" x2="984" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · 光猫形态谱系：从桥接到 FTTR</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">集成度从左到右递增：桥接 → 路由 → 网关 → FTTR 主/从。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">承担的职责越多，故障面越大；选型先问「谁来拨号、谁来覆盖」。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#475569" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">早期</text>
<line x1="120" y1="142" x2="150" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">主流</text>
<line x1="204" y1="142" x2="234" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="242" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">延伸</text>
<line x1="70" y1="260" x2="970" y2="260" stroke="#cbd5e1" stroke-width="1.8"/>
<polygon points="160,255 155,260 160,265 165,260" fill="#475569"/>
<text x="160" y="242" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="600" text-anchor="middle">桥接型</text>
<text x="160" y="228" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">只做光电转换</text>
<polygon points="340,255 335,260 340,265 345,260" fill="#4f46e5"/>
<text x="340" y="284" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="600" text-anchor="middle">路由型</text>
<text x="340" y="298" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">自己拨号 + NAT</text>
<polygon points="520,255 515,260 520,265 525,260" fill="#4f46e5"/>
<text x="520" y="242" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="600" text-anchor="middle">网关型</text>
<text x="520" y="228" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">+ Wi-Fi / 语音 / IPTV</text>
<polygon points="700,255 695,260 700,265 705,260" fill="#0f9d58"/>
<text x="700" y="284" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="600" text-anchor="middle">FTTR 主</text>
<text x="700" y="298" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">+ 光纤下行</text>
<polygon points="880,255 875,260 880,265 885,260" fill="#0f9d58"/>
<text x="880" y="242" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="600" text-anchor="middle">FTTR 从</text>
<text x="880" y="228" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">延伸覆盖</text>
<rect x="70" y="350" width="900" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="86" y="380" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="86" y="404" font-size="10.2" fill="#334155" xml:space="preserve">桥接型把拨号与覆盖交给下游，故障定位简单；路由/网关型一体化，省设备但故障面大。</text>
<text x="86" y="422" font-size="10.2" fill="#334155" xml:space="preserve">FTTR 把「下行」也从网线换成光纤：主光猫管 PON 与 OMCI，从光猫只负责延伸覆盖。</text>
