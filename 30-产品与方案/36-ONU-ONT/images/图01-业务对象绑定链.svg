<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · 业务对象绑定链：五层绑上，业务才通</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">上行按 UNI → VLAN → GEM → T-CONT → PON 逐层封装，下行按反序解封装。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">OMCI 配的就是这条链上的 ME：少绑一层，业务就断在那一层。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">OMCI 创建的对象</text>
<line x1="186" y1="142" x2="216" y2="142" stroke="#475569" stroke-width="3"/>
<text x="224" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">上行封装方向</text>
<line x1="314" y1="142" x2="344" y2="142" stroke="#0891b2" stroke-width="3"/>
<text x="352" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">下行解封装</text>
<text x="36" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① 上行：逐层封装；下行：反序解封装</text>
<rect x="36" y="196" width="200" height="96" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="36" y="196" width="4.5" height="96" fill="#4f46e5" rx="2"/>
<text x="49" y="215" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">UNI-G</text>
<text x="49" y="232" font-size="9.6" fill="#334155" xml:space="preserve">LAN / Wi-Fi / FXS</text>
<text x="49" y="247.4" font-size="9.6" fill="#334155" xml:space="preserve">PVID、允许的 VLAN</text>
<text x="49" y="262.8" font-size="9.6" fill="#334155" xml:space="preserve">断点：终端拿不到地址</text>
<rect x="274" y="196" width="200" height="96" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="274" y="196" width="4.5" height="96" fill="#4f46e5" rx="2"/>
<text x="287" y="215" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">VLAN 过滤</text>
<text x="287" y="232" font-size="9.6" fill="#334155" xml:space="preserve">CVLAN ↔ SVLAN</text>
<text x="287" y="247.4" font-size="9.6" fill="#334155" xml:space="preserve">上行打标，下行剥标</text>
<text x="287" y="262.8" font-size="9.6" fill="#334155" xml:space="preserve">断点：上行通、下行不通</text>
<rect x="512" y="196" width="200" height="96" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="512" y="196" width="4.5" height="96" fill="#4f46e5" rx="2"/>
<text x="525" y="215" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">GEM Port</text>
<text x="525" y="232" font-size="9.6" fill="#334155" xml:space="preserve">GEM ID</text>
<text x="525" y="247.4" font-size="9.6" fill="#334155" xml:space="preserve">绑定到某个 T-CONT</text>
<text x="525" y="262.8" font-size="9.6" fill="#334155" xml:space="preserve">断点：配置成功、发不出去</text>
<rect x="750" y="196" width="200" height="96" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="750" y="196" width="4.5" height="96" fill="#4f46e5" rx="2"/>
<text x="763" y="215" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">T-CONT</text>
<text x="763" y="232" font-size="9.6" fill="#334155" xml:space="preserve">Alloc-ID + DBA</text>
<text x="763" y="247.4" font-size="9.6" fill="#334155" xml:space="preserve">上行带宽与优先级</text>
<text x="763" y="262.8" font-size="9.6" fill="#334155" xml:space="preserve">断点：高峰拥塞、低峰正常</text>
<rect x="988" y="196" width="200" height="96" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
