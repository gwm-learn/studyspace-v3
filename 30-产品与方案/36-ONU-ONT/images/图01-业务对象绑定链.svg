<text x="1001" y="232" font-size="9.6" fill="#334155" xml:space="preserve">上行时隙</text>
<text x="1001" y="247.4" font-size="9.6" fill="#334155" xml:space="preserve">OLT 授权后才可发</text>
<text x="1001" y="262.8" font-size="9.6" fill="#334155" xml:space="preserve">断点：PON 灯不常亮</text>
<line x1="238" y1="244" x2="272" y2="244" stroke="#475569" stroke-width="2"/>
<polygon points="272,244 263,239.5 263,248.5" fill="#475569"/>
<text x="255" y="234" font-size="9.2" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">打标</text>
<line x1="476" y1="244" x2="510" y2="244" stroke="#475569" stroke-width="2"/>
<polygon points="510,244 501,239.5 501,248.5" fill="#475569"/>
<text x="493" y="234" font-size="9.2" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">映射</text>
<line x1="714" y1="244" x2="748" y2="244" stroke="#475569" stroke-width="2"/>
<polygon points="748,244 739,239.5 739,248.5" fill="#475569"/>
<text x="731" y="234" font-size="9.2" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">绑定</text>
<line x1="952" y1="244" x2="986" y2="244" stroke="#475569" stroke-width="2"/>
<polygon points="986,244 977,239.5 977,248.5" fill="#475569"/>
<text x="969" y="234" font-size="9.2" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">调度</text>
<line x1="1088" y1="326" x2="136" y2="326" stroke="#0891b2" stroke-width="1.8" stroke-dasharray="3 3"/>
<polygon points="136,326 145,330.5 145,321.5" fill="#0891b2"/>
<text x="612" y="342" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">下行：PON → GEM → 剥 VLAN → UNI，按反序解封装</text>
<rect x="36" y="360" width="566" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="390" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">拿这条链定位故障</text>
<text x="52" y="414" font-size="10.2" fill="#334155" xml:space="preserve">① 从最靠左的环节查起：先看 UNI 侧终端是否拿到地址。</text>
<text x="52" y="432" font-size="10.2" fill="#334155" xml:space="preserve">② 再看 VLAN 是否双向转换，最后才怀疑 GEM / T-CONT。</text>
<text x="52" y="450" font-size="10.2" fill="#334155" xml:space="preserve">③ 每层都可能「配置成功但没绑上」，OLT 侧 ME 状态比现象可靠。</text>
<rect x="622" y="360" width="566" height="110" fill="#ecfeff" rx="10" stroke="#0891b2" stroke-width="1"/>
<text x="638" y="390" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">这条链管不到的部分</text>
<text x="638" y="414" font-size="10.2" fill="#334155" xml:space="preserve">组播走独立 GEM，复制点可能在 OLT，ONU 只做代理。</text>
<text x="638" y="432" font-size="10.2" fill="#334155" xml:space="preserve">TR-069 配的 Wi-Fi / 账号不在这条链上。</text>
<text x="638" y="450" font-size="10.2" fill="#334155" xml:space="preserve">PON 未注册时整条链不存在：先解决光路，再谈绑定。</text>
