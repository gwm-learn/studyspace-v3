<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1180" height="660" fill="#ffffff"/>
<line x1="36" y1="112" x2="1144" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 03 · 光猫选型判据：先定谁拨号，再定能力档位</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">四个形态不是四代产品，而是四种责任划分；选错档位，多花的钱买不到体验。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">每个分支下方写的是代价——选型报告里只写优点的，通常没算过这笔账。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#0891b2" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">只做管道</text>
<line x1="142" y1="142" x2="172" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="180" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">一体机</text>
<line x1="237" y1="142" x2="267" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="275" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">速率升级</text>
<line x1="343" y1="142" x2="373" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="381" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">全屋光纤</text>
<rect x="375" y="190" width="430" height="58" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="375" y="190" width="4.5" height="58" fill="#475569" rx="2"/>
<text x="388" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">三问定形态</text>
<text x="388" y="226" font-size="9.6" fill="#334155" xml:space="preserve">① 谁拨号：运营商只做管道，还是光猫自己拨？</text>
<text x="388" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">② 要不要 Wi-Fi/语音一体？③ 宽带内网超千兆了吗？④ 要全屋光纤吗？</text>
<rect x="36" y="308" width="263.5" height="72.8" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="36" y="308" width="4.5" height="72.8" fill="#0891b2" rx="2"/>
<text x="49" y="327" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">桥接型 SFU</text>
<text x="49" y="344" font-size="9.6" fill="#334155" xml:space="preserve">只做 PON ↔ 以太，拨号交给下游</text>
<text x="49" y="359.4" font-size="9.6" fill="#334155" xml:space="preserve">代价：下游设备不配合时故障难界定</text>
<line x1="461" y1="248" x2="167.75" y2="308" stroke="#0891b2" stroke-width="1.8"/>
<polygon points="167.75,308 177.47,310.6 175.67,301.79" fill="#0891b2"/>
<text x="46" y="400.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 验收 VLAN 透传与桥接带宽</text>
<rect x="317.5" y="308" width="263.5" height="72.8" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="317.5" y="308" width="4.5" height="72.8" fill="#4f46e5" rx="2"/>
<text x="330.5" y="327" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">路由型 HGU</text>
<text x="330.5" y="344" font-size="9.6" fill="#334155" xml:space="preserve">自己拨号 + NAT + Wi-Fi/语音</text>
<text x="330.5" y="359.4" font-size="9.6" fill="#334155" xml:space="preserve">代价：故障面最大，性能受 SoC 限制</text>
<line x1="547" y1="248" x2="449.25" y2="308" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="449.25,308 459.27,307.13 454.57,299.46" fill="#4f46e5"/>
<text x="327.5" y="400.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 验收拨号、NAT 性能、覆盖</text>
<rect x="599" y="308" width="263.5" height="72.8" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="599" y="308" width="4.5" height="72.8" fill="#d97706" rx="2"/>
<text x="612" y="327" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">10G 光猫</text>
<text x="612" y="344" font-size="9.6" fill="#334155" xml:space="preserve">宽带、内网、Wi-Fi 都超千兆才值</text>
<text x="612" y="359.4" font-size="9.6" fill="#334155" xml:space="preserve">代价：光模块、散热、成本同步上升</text>
<line x1="633" y1="248" x2="730.75" y2="308" stroke="#d97706" stroke-width="1.8"/>
<polygon points="730.75,308 725.43,299.46 720.73,307.13" fill="#d97706"/>
<text x="609" y="400.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 验收端到端能否真过千兆</text>
<rect x="880.5" y="308" width="263.5" height="72.8" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="880.5" y="308" width="4.5" height="72.8" fill="#0f9d58" rx="2"/>
<text x="893.5" y="327" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">FTTR 主 + 从</text>
<text x="893.5" y="344" font-size="9.6" fill="#334155" xml:space="preserve">大户型全屋覆盖，接受施工与主从依赖</text>
<text x="893.5" y="359.4" font-size="9.6" fill="#334155" xml:space="preserve">代价：从网关不注册 PON，故障域变长</text>
<line x1="719" y1="248" x2="1012.25" y2="308" stroke="#0f9d58" stroke-width="1.8"/>
<polygon points="1012.25,308 1004.33,301.79 1002.53,310.6" fill="#0f9d58"/>
<text x="890.5" y="400.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 验收主从回程、漫游、统一管理</text>
<rect x="36" y="470" width="536" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="500" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">三个不能省的判断</text>
<text x="52" y="524" font-size="10.2" fill="#334155" xml:space="preserve">① 先确认 OLT 侧支持哪种 PON：形态再好，上行不匹配也装不上。</text>
<text x="52" y="542" font-size="10.2" fill="#334155" xml:space="preserve">② 再确认运营商模板：桥接/路由是模板决定的，不是设备开关。</text>
<text x="52" y="560" font-size="10.2" fill="#334155" xml:space="preserve">③ 最后才比 Wi-Fi 与接口：前面两条不成立时，参数没有意义。</text>
<rect x="592" y="470" width="552" height="110" fill="#ecfeff" rx="10" stroke="#0891b2" stroke-width="1"/>
<text x="608" y="500" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">常见的选择性误判</text>
<text x="608" y="524" font-size="10.2" fill="#334155" xml:space="preserve">「10G 光猫一定更快」：瓶颈常在下游路由、Wi-Fi 或终端网卡。</text>
<text x="608" y="542" font-size="10.2" fill="#334155" xml:space="preserve">「FTTR 就是更好的光猫」：它是组网方案，从网关没有 PON 上行。</text>
<text x="608" y="560" font-size="10.2" fill="#334155" xml:space="preserve">「桥接更稳定」：桥接只是把故障转移给下游，不是消灭故障。</text>
<text x="36" y="606" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py 生成</text>
