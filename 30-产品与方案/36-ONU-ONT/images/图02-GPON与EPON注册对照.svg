<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1280" height="640" fill="#ffffff"/>
<line x1="36" y1="112" x2="1244" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · GPON 与 EPON 注册对照：同一件事，两套消息</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">两行都是「广播发现 → 测距 → 认证 → 分配标识 → 建管理通道」，差别在消息名与管理协议。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">看颜色分发起方：OLT 发起、ONU 应答、OLT 完成；注册成功只是能通信，业务还要配。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">OLT 发起</text>
<line x1="146.4" y1="142" x2="176.4" y2="142" stroke="#0891b2" stroke-width="3"/>
<text x="184.4" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">ONU 应答</text>
<line x1="256.8" y1="142" x2="286.8" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="294.8" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">OLT 完成注册</text>
<line x1="389.2" y1="142" x2="419.2" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="427.2" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">管理通道</text>
<text x="36" y="174" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① GPON / XG(S)-PON：PLOAM 消息 + OMCI</text>
<rect x="36" y="196" width="96" height="30" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.2"/>
<text x="84" y="214.6" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">GPON</text>
<rect x="150" y="180" width="168" height="68" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="150" y="180" width="4.5" height="68" fill="#0891b2" rx="2"/>
<text x="163" y="199" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">下行同步</text>
<text x="163" y="216" font-size="8.8" fill="#334155" xml:space="preserve">锁定 PSync、超帧</text>
<rect x="334" y="180" width="168" height="68" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="334" y="180" width="4.5" height="68" fill="#d97706" rx="2"/>
