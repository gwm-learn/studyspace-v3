<text x="347" y="216" font-size="8.8" fill="#334155" xml:space="preserve">OLT 广播请求，ONU 报 SN</text>
<line x1="320" y1="214" x2="332" y2="214" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="332,214 323,209.5 323,218.5" fill="#94a3b8"/>
<rect x="518" y="180" width="168" height="68" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="518" y="180" width="4.5" height="68" fill="#d97706" rx="2"/>
<text x="531" y="199" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">测距 Ranging</text>
<text x="531" y="216" font-size="8.8" fill="#334155" xml:space="preserve">算往返，得 EqD</text>
<line x1="504" y1="214" x2="516" y2="214" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="516,214 507,209.5 507,218.5" fill="#94a3b8"/>
<rect x="702" y="180" width="168" height="68" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="702" y="180" width="4.5" height="68" fill="#d97706" rx="2"/>
<text x="715" y="199" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">密码 / 注册 ID</text>
<text x="715" y="216" font-size="8.8" fill="#334155" xml:space="preserve">校验逻辑标识</text>
<line x1="688" y1="214" x2="700" y2="214" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="700,214 691,209.5 691,218.5" fill="#94a3b8"/>
<rect x="886" y="180" width="168" height="68" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="886" y="180" width="4.5" height="68" fill="#4f46e5" rx="2"/>
<text x="899" y="199" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">分配 ONU-ID</text>
<text x="899" y="216" font-size="8.8" fill="#334155" xml:space="preserve">Registration，进运行态</text>
<line x1="872" y1="214" x2="884" y2="214" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="884,214 875,209.5 875,218.5" fill="#94a3b8"/>
<rect x="1070" y="180" width="168" height="68" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="1070" y="180" width="4.5" height="68" fill="#0f9d58" rx="2"/>
<text x="1083" y="199" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">建 OMCC</text>
<text x="1083" y="216" font-size="8.8" fill="#334155" xml:space="preserve">OMCI 配业务</text>
<line x1="1056" y1="214" x2="1068" y2="214" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="1068,214 1059,209.5 1059,218.5" fill="#94a3b8"/>
<text x="36" y="306" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② EPON / 10G-EPON：MPCP 帧 + eOAM</text>
<rect x="36" y="328" width="96" height="30" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.2"/>
<text x="84" y="346.6" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">EPON</text>
<rect x="150" y="312" width="168" height="68" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="150" y="312" width="4.5" height="68" fill="#d97706" rx="2"/>
<text x="163" y="331" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">GATE 发现窗口</text>
<text x="163" y="348" font-size="8.8" fill="#334155" xml:space="preserve">OLT 开发现时隙</text>
<rect x="334" y="312" width="168" height="68" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="334" y="312" width="4.5" height="68" fill="#0891b2" rx="2"/>
<text x="347" y="331" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">REGISTER_REQ</text>
<text x="347" y="348" font-size="8.8" fill="#334155" xml:space="preserve">ONU 报 MAC 与能力</text>
<line x1="320" y1="346" x2="332" y2="346" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="332,346 323,341.5 323,350.5" fill="#94a3b8"/>
<rect x="518" y="312" width="168" height="68" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="518" y="312" width="4.5" height="68" fill="#d97706" rx="2"/>
<text x="531" y="331" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">REGISTER</text>
<text x="531" y="348" font-size="8.8" fill="#334155" xml:space="preserve">OLT 分配 LLID</text>
<line x1="504" y1="346" x2="516" y2="346" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="516,346 507,341.5 507,350.5" fill="#94a3b8"/>
<rect x="702" y="312" width="168" height="68" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="702" y="312" width="4.5" height="68" fill="#0891b2" rx="2"/>
<text x="715" y="331" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">REGISTER_ACK</text>
<text x="715" y="348" font-size="8.8" fill="#334155" xml:space="preserve">ONU 确认</text>
<line x1="688" y1="346" x2="700" y2="346" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="700,346 691,341.5 691,350.5" fill="#94a3b8"/>
<rect x="886" y="312" width="168" height="68" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="886" y="312" width="4.5" height="68" fill="#4f46e5" rx="2"/>
<text x="899" y="331" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">RTT 补偿</text>
<text x="899" y="348" font-size="8.8" fill="#334155" xml:space="preserve">时间戳算往返</text>
<line x1="872" y1="346" x2="884" y2="346" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="884,346 875,341.5 875,350.5" fill="#94a3b8"/>
<rect x="1070" y="312" width="168" height="68" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="1070" y="312" width="4.5" height="68" fill="#0f9d58" rx="2"/>
<text x="1083" y="331" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">eOAM 管理</text>
<text x="1083" y="348" font-size="8.8" fill="#334155" xml:space="preserve">不是 OMCI</text>
<line x1="1056" y1="346" x2="1068" y2="346" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="1068,346 1059,341.5 1059,350.5" fill="#94a3b8"/>
<text x="36" y="424" font-size="11" fill="#0f172a" xml:space="preserve" font-weight="700">共同骨架</text>
<text x="36" y="444" font-size="10.2" fill="#334155" xml:space="preserve">发现（谁在线上）→ 测距（差多远）→ 认证（是不是你）→ 分配标识（叫什么）→ 管理（怎么配）</text>
<rect x="36" y="470" width="566" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="500" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">为什么测距不能省</text>
<text x="52" y="524" font-size="10.2" fill="#334155" xml:space="preserve">同一根光纤上各 ONU 距离不同，上行若同时发就会在 OLT 端重叠。</text>
<text x="52" y="542" font-size="10.2" fill="#334155" xml:space="preserve">测距算出每台的均衡延迟，OLT 才能把时隙排开；EqD 错，表现为随机丢包。</text>
<rect x="622" y="470" width="566" height="92" fill="#ecfeff" rx="10" stroke="#0891b2" stroke-width="1"/>
<text x="638" y="500" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">容易混的一处</text>
<text x="638" y="524" font-size="10.2" fill="#334155" xml:space="preserve">OMCI 只属于 ITU 侧（GPON/XG(S)-PON）；EPON 的管理走 eOAM。</text>
<text x="638" y="542" font-size="10.2" fill="#334155" xml:space="preserve">两者都叫「注册成功」，但 EPON 没有 OMCC 这一步，别拿 OMCI 现象去套。</text>
