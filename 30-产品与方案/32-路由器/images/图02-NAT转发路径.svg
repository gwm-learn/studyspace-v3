<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="620" viewBox="0 0 1020 620" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1020" height="620" fill="#ffffff"/>
<line x1="36" y1="112" x2="984" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · 出方向与入方向的 NAT 路径</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">出方向先查路由再 SNAT；入方向先命中 conntrack 再还原，端口映射在 DNAT 阶段完成。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：注意 NAT 只改地址/端口，真正的放行由防火墙规则决定。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">出方向</text>
<line x1="131" y1="142" x2="161" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="169" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">入方向</text>
<line x1="226" y1="142" x2="256" y2="142" stroke="#0891b2" stroke-width="3"/>
<text x="264" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">关键表</text>
<rect x="36" y="190" width="108" height="90" fill="#eef2ff" rx="9" stroke="#4f46e5" stroke-width="1.2"/>
<text x="46" y="212" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">出方向</text>
<text x="46" y="228" font-size="9.4" fill="#64748b" xml:space="preserve">LAN → WAN</text>
<text x="46" y="246" font-size="9" fill="#64748b" xml:space="preserve">共享上网</text>
<rect x="154" y="190" width="158" height="82" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="154" y="190" width="4.5" height="82" fill="#4f46e5" rx="2"/>
<text x="167" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">内网主机</text>
<text x="167" y="226" font-size="8.8" fill="#334155" xml:space="preserve">源 IP:端口</text>
<line x1="312" y1="231" x2="322" y2="231" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="322,231 313,226.5 313,235.5" fill="#94a3b8"/>
<rect x="322" y="190" width="158" height="82" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="322" y="190" width="4.5" height="82" fill="#4f46e5" rx="2"/>
<text x="335" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">查路由</text>
<text x="335" y="226" font-size="8.8" fill="#334155" xml:space="preserve">默认路由 → WAN</text>
<line x1="480" y1="231" x2="490" y2="231" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="490,231 481,226.5 481,235.5" fill="#94a3b8"/>
<rect x="490" y="190" width="158" height="82" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="490" y="190" width="4.5" height="82" fill="#d97706" rx="2"/>
<text x="503" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">DNAT（可选）</text>
<text x="503" y="226" font-size="8.8" fill="#334155" xml:space="preserve">访问映射地址时</text>
<line x1="648" y1="231" x2="658" y2="231" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="658,231 649,226.5 649,235.5" fill="#94a3b8"/>
<rect x="658" y="190" width="158" height="82" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="658" y="190" width="4.5" height="82" fill="#0f9d58" rx="2"/>
<text x="671" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">SNAT</text>
<text x="671" y="226" font-size="8.8" fill="#334155" xml:space="preserve">改成 WAN 地址</text>
<line x1="816" y1="231" x2="826" y2="231" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="826,231 817,226.5 817,235.5" fill="#94a3b8"/>
<rect x="826" y="190" width="158" height="82" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="826" y="190" width="4.5" height="82" fill="#0891b2" rx="2"/>
<text x="839" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">WAN 发出</text>
<text x="839" y="226" font-size="8.8" fill="#334155" xml:space="preserve">conntrack 记录</text>
<rect x="36" y="300" width="108" height="90" fill="#f2fcf5" rx="9" stroke="#0f9d58" stroke-width="1.2"/>
<text x="46" y="322" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">入方向</text>
<text x="46" y="338" font-size="9.4" fill="#64748b" xml:space="preserve">WAN → LAN</text>
<text x="46" y="356" font-size="9" fill="#64748b" xml:space="preserve">端口映射/DMZ</text>
<rect x="154" y="300" width="158" height="82" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="154" y="300" width="4.5" height="82" fill="#0f9d58" rx="2"/>
<text x="167" y="319" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">外网请求</text>
<text x="167" y="336" font-size="8.8" fill="#334155" xml:space="preserve">目的: WAN 地址</text>
<line x1="312" y1="341" x2="322" y2="341" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="322,341 313,336.5 313,345.5" fill="#94a3b8"/>
<rect x="322" y="300" width="158" height="82" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="322" y="300" width="4.5" height="82" fill="#0f9d58" rx="2"/>
<text x="335" y="319" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">DNAT</text>
<text x="335" y="336" font-size="8.8" fill="#334155" xml:space="preserve">改到内网 IP:端口</text>
<line x1="480" y1="341" x2="490" y2="341" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="490,341 481,336.5 481,345.5" fill="#94a3b8"/>
<rect x="490" y="300" width="158" height="82" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="490" y="300" width="4.5" height="82" fill="#0f9d58" rx="2"/>
<text x="503" y="319" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">查路由</text>
<text x="503" y="336" font-size="8.8" fill="#334155" xml:space="preserve">到内网网段</text>
<line x1="648" y1="341" x2="658" y2="341" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="658,341 649,336.5 649,345.5" fill="#94a3b8"/>
<rect x="658" y="300" width="158" height="82" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="658" y="300" width="4.5" height="82" fill="#d97706" rx="2"/>
<text x="671" y="319" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">防火墙放行</text>
<text x="671" y="336" font-size="8.8" fill="#334155" xml:space="preserve">按 zone/规则</text>
<line x1="816" y1="341" x2="826" y2="341" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="826,341 817,336.5 817,345.5" fill="#94a3b8"/>
<rect x="826" y="300" width="158" height="82" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="826" y="300" width="4.5" height="82" fill="#0f9d58" rx="2"/>
<text x="839" y="319" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">内网主机</text>
<text x="839" y="336" font-size="8.8" fill="#334155" xml:space="preserve">收到请求</text>
<rect x="36" y="420" width="820" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="450" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="52" y="474" font-size="10.2" fill="#334155" xml:space="preserve">① 回包不需要重新查 NAT 规则，靠 conntrack 反向还原。</text>
<text x="52" y="492" font-size="10.2" fill="#334155" xml:space="preserve">② 内网用公网地址访问自家服务，需要额外的回环 NAT 规则。</text>
<text x="52" y="510" font-size="10.2" fill="#334155" xml:space="preserve">③ IPv6 不做 NAT，内网设备拿公网地址，安全边界完全依赖防火墙。</text>
<text x="36" y="548" font-size="12.3" fill="#64748b" xml:space="preserve">图源：30-产品与方案/32-路由器/01-路由转发与NAT方案.md</text>
<text x="36" y="566" font-size="12.3" fill="#64748b" xml:space="preserve">参考：RFC 3022 / RFC 4787</text>
