<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1440" height="600" fill="#ffffff"/>
<line x1="36" y1="112" x2="1404" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · 形态谱系：谁包含谁、谁是谁的俗称</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">左边是定义，右边是产品形态。实线＝包含 / 等同，虚线＝口语俗称。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：从 CPE 往下只有 PON 这一支会同时叫 ONU/ONT 和光猫；再往下才分桥接与路由。</text>
<rect x="60" y="210" width="200" height="64" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="60" y="210" width="4.5" height="64" fill="#4f46e5" rx="2"/>
<text x="73" y="229" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">CPE</text>
<text x="73" y="246" font-size="9.6" fill="#334155" xml:space="preserve">运营商用户侧设备</text>
<rect x="340" y="150" width="170" height="56" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="340" y="150" width="4.5" height="56" fill="#475569" rx="2"/>
<text x="353" y="169" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">xDSL CPE</text>
<text x="353" y="186" font-size="9.6" fill="#334155" xml:space="preserve">铜线 / 同轴</text>
<rect x="340" y="240" width="170" height="56" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="340" y="240" width="4.5" height="56" fill="#0f9d58" rx="2"/>
<text x="353" y="259" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">PON CPE</text>
<text x="353" y="276" font-size="9.6" fill="#334155" xml:space="preserve">PON 上行</text>
<rect x="340" y="330" width="170" height="56" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="340" y="330" width="4.5" height="56" fill="#475569" rx="2"/>
<text x="353" y="349" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">蜂窝 CPE</text>
<text x="353" y="366" font-size="9.6" fill="#334155" xml:space="preserve">4G / 5G</text>
<rect x="600" y="240" width="190" height="56" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="600" y="240" width="4.5" height="56" fill="#0f9d58" rx="2"/>
<text x="613" y="259" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">ONU / ONT</text>
<text x="613" y="276" font-size="9.6" fill="#334155" xml:space="preserve">PON 用户侧</text>
<rect x="600" y="340" width="190" height="50" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="600" y="340" width="4.5" height="50" fill="#d97706" rx="2"/>
<text x="613" y="359" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">光猫（俗称）</text>
<text x="613" y="376" font-size="9.6" fill="#334155" xml:space="preserve">家用口语</text>
<rect x="880" y="165" width="210" height="56" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="880" y="165" width="4.5" height="56" fill="#0891b2" rx="2"/>
<text x="893" y="184" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">SFU 桥接型</text>
<text x="893" y="201" font-size="9.6" fill="#334155" xml:space="preserve">只做光电转换</text>
<rect x="880" y="265" width="210" height="56" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="880" y="265" width="4.5" height="56" fill="#4f46e5" rx="2"/>
<text x="893" y="284" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">HGU 路由型</text>
<text x="893" y="301" font-size="9.6" fill="#334155" xml:space="preserve">路由 + Wi-Fi + 语音</text>
<line x1="260" y1="262" x2="340" y2="194" stroke="#475569" stroke-width="1.8"/>
