<polygon points="600,284 591,279.5 591,288.5" fill="#0f9d58"/>
<text x="555" y="277" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">等同</text>
<line x1="695" y1="296" x2="695" y2="340" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3 3"/>
<polygon points="695,340 699.5,331 690.5,331" fill="#d97706"/>
<line x1="790" y1="284" x2="880" y2="209" stroke="#0891b2" stroke-width="1.8"/>
<polygon points="880,209 870.21,211.3 875.97,218.22" fill="#0891b2"/>
