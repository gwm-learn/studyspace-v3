<polygon points="880,309 872.53,302.26 870.12,310.93" fill="#4f46e5"/>
<line x1="1108" y1="165" x2="1108" y2="321" stroke="#475569" stroke-width="1.6"/>
<line x1="1104" y1="165" x2="1112" y2="165" stroke="#475569" stroke-width="1.6"/>
<line x1="1104" y1="321" x2="1112" y2="321" stroke="#475569" stroke-width="1.6"/>
<text x="1118" y="246" font-size="10.4" fill="#475569" xml:space="preserve" font-weight="700">ONU/ONT 的产品形态</text>
<rect x="60" y="430" width="1120" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="76" y="460" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">三个容易归错类的对象</text>
<text x="76" y="484" font-size="10.2" fill="#334155" xml:space="preserve">FTTR 从网关：走主网关的光 / 以太回程，不是 ONU——它没有 PON 上行。</text>
<text x="76" y="502" font-size="10.2" fill="#334155" xml:space="preserve">AC：管理面设备，旁挂时不承载用户数据，不是网关。</text>
<text x="76" y="520" font-size="10.2" fill="#334155" xml:space="preserve">AP：二层桥接 + 空口接入，不是「无线的路由器」，一般不做 NAT / DHCP。</text>
<text x="36" y="564" font-size="12.3" fill="#64748b" xml:space="preserve">图源：images/图02-形态谱系.svg。依据本目录各子目录定义与 ITU-T G.984 / G.988 整理。</text>
</svg>
