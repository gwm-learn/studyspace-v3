<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1120" height="700" fill="#ffffff"/>
<line x1="36" y1="112" x2="1084" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 12 · 休眠与唤醒的状态与恢复路径</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">RUN 经 IDLE 进入 SUSPEND；唤醒后走 RESUMING 回到 RUN。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">任何一步失败都退回 RUN 并记录唤醒计数，而不是停在中间态。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">正常运行</text>
<line x1="142" y1="142" x2="172" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="180" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">低功耗状态</text>
<text x="36" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① 状态迁移</text>
<rect x="36" y="196" width="200" height="86" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="36" y="196" width="4.5" height="86" fill="#0f9d58" rx="2"/>
<text x="49" y="215" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">RUN</text>
<text x="49" y="232" font-size="8.8" fill="#334155" xml:space="preserve">业务运行，设备活跃</text>
<line x1="236" y1="239" x2="280" y2="239" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="280,239 271,234.5 271,243.5" fill="#94a3b8"/>
<rect x="280" y="196" width="200" height="86" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="280" y="196" width="4.5" height="86" fill="#d97706" rx="2"/>
<text x="293" y="215" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">IDLE</text>
<text x="293" y="232" font-size="8.8" fill="#334155" xml:space="preserve">runtime PM 关时钟/断电</text>
<line x1="480" y1="239" x2="524" y2="239" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="524,239 515,234.5 515,243.5" fill="#94a3b8"/>
<rect x="524" y="196" width="200" height="86" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="524" y="196" width="4.5" height="86" fill="#d97706" rx="2"/>
<text x="537" y="215" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">SUSPEND</text>
<text x="537" y="232" font-size="8.8" fill="#334155" xml:space="preserve">非唤醒域断电，DDR 自刷新</text>
<text x="537" y="247.4" font-size="8.8" fill="#334155" xml:space="preserve">失败：回 RUN 并计数</text>
<line x1="724" y1="239" x2="768" y2="239" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="768,239 759,234.5 759,243.5" fill="#94a3b8"/>
<rect x="768" y="196" width="200" height="86" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="768" y="196" width="4.5" height="86" fill="#d97706" rx="2"/>
<text x="781" y="215" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">RESUMING</text>
<text x="781" y="232" font-size="8.8" fill="#334155" xml:space="preserve">上电、恢复时钟</text>
<text x="781" y="247.4" font-size="8.8" fill="#334155" xml:space="preserve">按相反顺序 resume</text>
<line x1="868" y1="282" x2="868" y2="330" stroke="#0f9d58" stroke-width="1.6" stroke-dasharray="3 3"/>
<line x1="868" y1="330" x2="136" y2="330" stroke="#0f9d58" stroke-width="1.6" stroke-dasharray="3 3"/>
<line x1="136" y1="330" x2="136" y2="286" stroke="#0f9d58" stroke-width="1.6" stroke-dasharray="3 3"/>
<polygon points="136,286 131.5,295 140.5,295" fill="#0f9d58"/>
<text x="300" y="324" font-size="9.4" fill="#64748b" xml:space="preserve">恢复完成，回到 RUN</text>
<text x="36" y="388" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② 唤醒源（必须同时满足硬件掩码与驱动标记）</text>
<rect x="36" y="406" width="330" height="74" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="36" y="406" width="4.5" height="74" fill="#0891b2" rx="2"/>
<text x="49" y="425" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">GPIO 按键</text>
<text x="49" y="442" font-size="8.8" fill="#334155" xml:space="preserve">去抖后作为 wakeup source</text>
<rect x="392" y="406" width="330" height="74" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="392" y="406" width="4.5" height="74" fill="#0891b2" rx="2"/>
<text x="405" y="425" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">RTC 闹钟</text>
<text x="405" y="442" font-size="8.8" fill="#334155" xml:space="preserve">定时任务、定时上报</text>
<rect x="748" y="406" width="330" height="74" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="748" y="406" width="4.5" height="74" fill="#0891b2" rx="2"/>
<text x="761" y="425" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">网络 WoL / WoWLAN</text>
<text x="761" y="442" font-size="8.8" fill="#334155" xml:space="preserve">需 PHY 或无线固件保持供电</text>
<rect x="36" y="508" width="1042" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="538" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">③ 恢复顺序（错了就“能开机但外设废了”）</text>
<text x="52" y="562" font-size="10.2" fill="#334155" xml:space="preserve">电源域上电 → 时钟恢复 → 总线控制器 → 外设驱动 resume → 用户进程解冻。</text>
<text x="52" y="580" font-size="10.2" fill="#334155" xml:space="preserve">驱动必须保存自己改过的寄存器与 PHY 校准值，不能假设框架会兜底。</text>
<text x="52" y="598" font-size="10.2" fill="#334155" xml:space="preserve">深睡省电但恢复慢；频繁唤醒的场景，浅睡（s2idle）总账可能更省。</text>
<text x="36" y="646" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="664" font-size="12.3" fill="#64748b" xml:space="preserve">读图：绿色虚线是恢复完成后回到 RUN；任何一步失败都在 SUSPEND/IDLE 内回退，不带病停在中间态。</text>
</svg>
