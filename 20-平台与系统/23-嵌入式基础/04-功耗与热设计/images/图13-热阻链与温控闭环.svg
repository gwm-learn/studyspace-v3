<text x="941" y="369" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">温度回落</text>
<text x="941" y="386" font-size="8.8" fill="#334155" xml:space="preserve">带滞回，避免抖动</text>
<line x1="1006" y1="436" x2="1006" y2="470" stroke="#0f9d58" stroke-width="1.6" stroke-dasharray="3 3"/>
<line x1="1006" y1="470" x2="131" y2="470" stroke="#0f9d58" stroke-width="1.6" stroke-dasharray="3 3"/>
<line x1="131" y1="470" x2="131" y2="440" stroke="#0f9d58" stroke-width="1.6" stroke-dasharray="3 3"/>
<polygon points="131,440 126.5,449 135.5,449" fill="#0f9d58"/>
<rect x="36" y="500" width="1040" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="530" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">③ 阈值与取舍</text>
<text x="52" y="554" font-size="10.2" fill="#334155" xml:space="preserve">passive 按 Tj_max 留 10~20℃ 设置，critical 在器件极限之前；外壳可触及温度取更严者。</text>
<text x="52" y="572" font-size="10.2" fill="#334155" xml:space="preserve">滞回太小会频繁降频/启停风扇，太大则可能冲过保护点；采样周期与热惯性要匹配。</text>
<text x="52" y="590" font-size="10.2" fill="#334155" xml:space="preserve">无风扇靠导热垫 + 外壳，可靠性高但能力有限；风扇能力强，代价是噪音、积灰与寿命。</text>
<text x="36" y="646" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="664" font-size="12.3" fill="#64748b" xml:space="preserve">读图：上半部分每段热阻都是串联的，瓶颈在最差的一段；下半部分是一个带滞回的负反馈环。</text>
