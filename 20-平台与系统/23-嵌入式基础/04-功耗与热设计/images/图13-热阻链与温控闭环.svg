<text x="267" y="369" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">thermal zone</text>
<text x="267" y="386" font-size="8.8" fill="#334155" xml:space="preserve">周期采样，比较 trip</text>
<line x1="444" y1="393" x2="472" y2="393" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="472,393 463,388.5 463,397.5" fill="#94a3b8"/>
