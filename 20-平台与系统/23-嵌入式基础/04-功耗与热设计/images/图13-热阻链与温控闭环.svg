<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="700" viewBox="0 0 1160 700" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1160" height="700" fill="#ffffff"/>
<line x1="36" y1="112" x2="1124" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 13 · 热阻链与温控闭环</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">上：热量从结温经壳、界面材料、散热器降到环境，热阻串联相加。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">下：传感器 → thermal zone → 策略 → 降频/风扇 → 温度回落，带滞回避免抖动。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">热流路径</text>
