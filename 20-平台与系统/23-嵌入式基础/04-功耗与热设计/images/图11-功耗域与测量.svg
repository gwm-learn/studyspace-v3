<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1160" height="760" fill="#ffffff"/>
<line x1="36" y1="112" x2="1124" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 11 · 功耗域、测量点与预算</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">输入功率先经 DCDC/LDO，再分到 SoC、DDR、射频/PHY 与外设；每段都有损耗。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">测量点分“输入侧”和“分域侧”：前者看总账，后者定位谁在耗电。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">电源路径</text>
<line x1="142" y1="142" x2="172" y2="142" stroke="#0891b2" stroke-width="3"/>
<text x="180" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">功耗域</text>
<line x1="237" y1="142" x2="267" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="275" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">测量点</text>
<text x="36" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① 电源路径与功耗域</text>
<rect x="36" y="196" width="150" height="84" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="36" y="196" width="4.5" height="84" fill="#4f46e5" rx="2"/>
<text x="49" y="215" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">电源输入</text>
<text x="49" y="232" font-size="8.8" fill="#334155" xml:space="preserve">DC 12V / PoE</text>
<line x1="186" y1="238" x2="214" y2="238" stroke="#4f46e5" stroke-width="2.2"/>
<polygon points="214,238 205,233.5 205,242.5" fill="#4f46e5"/>
<rect x="214" y="196" width="180" height="84" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="214" y="196" width="4.5" height="84" fill="#4f46e5" rx="2"/>
<text x="227" y="215" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">DCDC / LDO</text>
<text x="227" y="232" font-size="8.8" fill="#334155" xml:space="preserve">效率 η 随负载变化</text>
<line x1="394" y1="238" x2="434" y2="238" stroke="#4f46e5" stroke-width="2.2"/>
<polygon points="434,238 425,233.5 425,242.5" fill="#4f46e5"/>
<text x="250" y="302" font-size="9.4" fill="#d97706" xml:space="preserve">测量点 A：输入侧，看总功耗与浪涌</text>
<rect x="434" y="190" width="660" height="196" fill="#ecfeff" rx="9" stroke="#0891b2" stroke-width="1"/>
<text x="448" y="212" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="700">功耗域（可独立关断/测量的部分）</text>
<rect x="448" y="226" width="632" height="32" fill="#ffffff" rx="4" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="458" y="240" font-size="9.8" fill="#0f172a" xml:space="preserve" font-weight="600">SoC 核心：CPU / GPU / NPU / ISP</text>
<text x="458" y="253" font-size="8.6" fill="#64748b" xml:space="preserve">峰值高，受 DVFS 影响</text>
<rect x="448" y="264" width="632" height="32" fill="#ffffff" rx="4" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="458" y="278" font-size="9.8" fill="#0f172a" xml:space="preserve" font-weight="600">DDR：颗粒 + 控制器</text>
<text x="458" y="291" font-size="8.6" fill="#64748b" xml:space="preserve">与带宽、刷新率相关</text>
<rect x="448" y="302" width="632" height="32" fill="#ffffff" rx="4" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="458" y="316" font-size="9.8" fill="#0f172a" xml:space="preserve" font-weight="600">射频与 PHY：WiFi / 以太网 / PON</text>
<text x="458" y="329" font-size="8.6" fill="#64748b" xml:space="preserve">发射瞬间峰值高，常开底噪</text>
<rect x="448" y="340" width="632" height="32" fill="#ffffff" rx="4" stroke="#cbd5e1" stroke-width="0.8"/>
<text x="458" y="354" font-size="9.8" fill="#0f172a" xml:space="preserve" font-weight="600">外设：USB / SD / LED / 传感器</text>
<text x="458" y="367" font-size="8.6" fill="#64748b" xml:space="preserve">单个小，常开累积</text>
<text x="448" y="400" font-size="9.4" fill="#d97706" xml:space="preserve">测量点 B：分域侧，逐域断开或用板载监控</text>
<text x="36" y="430" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② 三种测量手段</text>
<rect x="36" y="448" width="340" height="86" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="36" y="448" width="4.5" height="86" fill="#d97706" rx="2"/>
<text x="49" y="467" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">功耗仪 / 功率计</text>
<text x="49" y="484" font-size="8.8" fill="#334155" xml:space="preserve">整机输入，简单可信</text>
<text x="49" y="499.4" font-size="8.8" fill="#334155" xml:space="preserve">看不到分域与毫秒级尖峰</text>
<rect x="404" y="448" width="340" height="86" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="404" y="448" width="4.5" height="86" fill="#d97706" rx="2"/>
<text x="417" y="467" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">分流电阻 + 示波器</text>
<text x="417" y="484" font-size="8.8" fill="#334155" xml:space="preserve">可抓启动浪涌与瞬时峰值</text>
<text x="417" y="499.4" font-size="8.8" fill="#334155" xml:space="preserve">需断线改板，注意负担电压</text>
<rect x="772" y="448" width="340" height="86" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="772" y="448" width="4.5" height="86" fill="#d97706" rx="2"/>
<text x="785" y="467" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">板载监控（INA 类）</text>
<text x="785" y="484" font-size="8.8" fill="#334155" xml:space="preserve">可分域长期监控</text>
<text x="785" y="499.4" font-size="8.8" fill="#334155" xml:space="preserve">精度与采样率有限</text>
<rect x="36" y="560" width="1076" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="590" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">③ 预算公式</text>
<text x="52" y="614" font-size="10.2" fill="#334155" xml:space="preserve">P_total = Σ (P_domain_peak × duty) / η + P_standby，再留 20%~30% 余量。</text>
<text x="52" y="632" font-size="10.2" fill="#334155" xml:space="preserve">平均功耗决定散热与能耗，峰值功耗决定电源、保险丝、电感与电容选型。</text>
<text x="52" y="650" font-size="10.2" fill="#334155" xml:space="preserve">同一场景复测差异应控制在 ±5% 以内；差异大先查温度、DVFS 与后台任务。</text>
<text x="36" y="706" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="724" font-size="12.3" fill="#64748b" xml:space="preserve">读图：先看电源路径的分叉，再看两个测量点分别能回答什么问题。</text>
</svg>
