<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1180" height="720" fill="#ffffff"/>
<line x1="36" y1="112" x2="1144" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 07 · UART 帧格式与调试链路</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">8N1 一帧：起始位拉低，8 个数据位低位先发，无校验，停止位回到高。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">下半部分：从 SoC UART 到终端的四段链路，任何一段错都表现为乱码或无输出。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">空闲/停止（高）</text>
<line x1="181.6" y1="142" x2="211.6" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="219.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">起始位（低）</text>
<line x1="309.6" y1="142" x2="339.6" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="347.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">数据/校验位</text>
<text x="36" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① 一帧 8N1（低位先发）</text>
<line x1="96" y1="208" x2="96" y2="320" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="158" y1="208" x2="158" y2="320" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="220" y1="208" x2="220" y2="320" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="282" y1="208" x2="282" y2="320" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="344" y1="208" x2="344" y2="320" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="406" y1="208" x2="406" y2="320" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="468" y1="208" x2="468" y2="320" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="530" y1="208" x2="530" y2="320" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="592" y1="208" x2="592" y2="320" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="654" y1="208" x2="654" y2="320" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="716" y1="208" x2="716" y2="320" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="778" y1="208" x2="778" y2="320" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="96" y1="286" x2="158" y2="286" stroke="#d97706" stroke-width="3.2"/>
<text x="127" y="202" font-size="9.6" fill="#64748b" xml:space="preserve" text-anchor="middle">起始</text>
<line x1="158" y1="232" x2="220" y2="232" stroke="#4f46e5" stroke-width="3.2"/>
<text x="189" y="202" font-size="9.6" fill="#64748b" xml:space="preserve" text-anchor="middle">D0</text>
<line x1="158" y1="286" x2="158" y2="232" stroke="#475569" stroke-width="2"/>
<line x1="220" y1="286" x2="282" y2="286" stroke="#4f46e5" stroke-width="3.2"/>
<text x="251" y="202" font-size="9.6" fill="#64748b" xml:space="preserve" text-anchor="middle">D1</text>
<line x1="220" y1="232" x2="220" y2="286" stroke="#475569" stroke-width="2"/>
<line x1="282" y1="232" x2="344" y2="232" stroke="#4f46e5" stroke-width="3.2"/>
<text x="313" y="202" font-size="9.6" fill="#64748b" xml:space="preserve" text-anchor="middle">D2</text>
<line x1="282" y1="286" x2="282" y2="232" stroke="#475569" stroke-width="2"/>
<line x1="344" y1="232" x2="406" y2="232" stroke="#4f46e5" stroke-width="3.2"/>
<text x="375" y="202" font-size="9.6" fill="#64748b" xml:space="preserve" text-anchor="middle">D3</text>
<line x1="406" y1="286" x2="468" y2="286" stroke="#4f46e5" stroke-width="3.2"/>
<text x="437" y="202" font-size="9.6" fill="#64748b" xml:space="preserve" text-anchor="middle">D4</text>
<line x1="406" y1="232" x2="406" y2="286" stroke="#475569" stroke-width="2"/>
<line x1="468" y1="286" x2="530" y2="286" stroke="#4f46e5" stroke-width="3.2"/>
<text x="499" y="202" font-size="9.6" fill="#64748b" xml:space="preserve" text-anchor="middle">D5</text>
<line x1="530" y1="232" x2="592" y2="232" stroke="#4f46e5" stroke-width="3.2"/>
<text x="561" y="202" font-size="9.6" fill="#64748b" xml:space="preserve" text-anchor="middle">D6</text>
<line x1="530" y1="286" x2="530" y2="232" stroke="#475569" stroke-width="2"/>
<line x1="592" y1="286" x2="654" y2="286" stroke="#4f46e5" stroke-width="3.2"/>
<text x="623" y="202" font-size="9.6" fill="#64748b" xml:space="preserve" text-anchor="middle">D7</text>
<line x1="592" y1="232" x2="592" y2="286" stroke="#475569" stroke-width="2"/>
<line x1="654" y1="232" x2="716" y2="232" stroke="#4f46e5" stroke-width="3.2"/>
<text x="685" y="202" font-size="9.6" fill="#64748b" xml:space="preserve" text-anchor="middle">校验</text>
<line x1="654" y1="286" x2="654" y2="232" stroke="#475569" stroke-width="2"/>
<line x1="716" y1="232" x2="778" y2="232" stroke="#0f9d58" stroke-width="3.2"/>
<text x="747" y="202" font-size="9.6" fill="#64748b" xml:space="preserve" text-anchor="middle">停止</text>
<text x="60" y="236" font-size="9.6" fill="#64748b" xml:space="preserve" text-anchor="end">高</text>
<text x="60" y="290" font-size="9.6" fill="#64748b" xml:space="preserve" text-anchor="end">低</text>
<text x="36" y="338" font-size="9.8" fill="#64748b" xml:space="preserve">位宽 = 1 / 波特率；双方累计误差需控制在约 2%~3% 以内。</text>
<text x="36" y="386" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② 调试链路：四段都要对</text>
<rect x="36" y="404" width="230" height="80" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="36" y="404" width="4.5" height="80" fill="#4f46e5" rx="2"/>
<text x="49" y="423" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">SoC UART</text>
<text x="49" y="440" font-size="8.8" fill="#334155" xml:space="preserve">TX/RX，TTL 电平</text>
<line x1="266" y1="444" x2="306" y2="444" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="306,444 297,439.5 297,448.5" fill="#94a3b8"/>
<rect x="306" y="404" width="230" height="80" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="306" y="404" width="4.5" height="80" fill="#4f46e5" rx="2"/>
<text x="319" y="423" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">电平转换</text>
<text x="319" y="440" font-size="8.8" fill="#334155" xml:space="preserve">3.3V/1.8V ↔ RS-232</text>
<line x1="536" y1="444" x2="576" y2="444" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="576,444 567,439.5 567,448.5" fill="#94a3b8"/>
<rect x="576" y="404" width="230" height="80" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="576" y="404" width="4.5" height="80" fill="#4f46e5" rx="2"/>
<text x="589" y="423" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">USB 转串口</text>
<text x="589" y="440" font-size="8.8" fill="#334155" xml:space="preserve">芯片晶振误差影响高波特率</text>
<line x1="806" y1="444" x2="846" y2="444" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="846,444 837,439.5 837,448.5" fill="#94a3b8"/>
<rect x="846" y="404" width="230" height="80" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="846" y="404" width="4.5" height="80" fill="#0f9d58" rx="2"/>
<text x="859" y="423" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">终端</text>
<text x="859" y="440" font-size="8.8" fill="#334155" xml:space="preserve">115200 8N1 无流控</text>
<rect x="36" y="520" width="1090" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="550" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">③ 排障顺序</text>
<text x="52" y="574" font-size="10.2" fill="#334155" xml:space="preserve">无输出：先看 TX 有无波形，再看 GND 是否共地、TX/RX 是否交叉。</text>
<text x="52" y="592" font-size="10.2" fill="#334155" xml:space="preserve">固定乱码：波特率或时钟误差；偶尔错字：停止位/校验位不一致或线太长。</text>
<text x="52" y="610" font-size="10.2" fill="#334155" xml:space="preserve">只能收不能发：流控被打开但未接 RTS/CTS；输出卡住：对端未读、缓冲满。</text>
<text x="36" y="666" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="684" font-size="12.3" fill="#64748b" xml:space="preserve">读图：上半部分看帧的边界与电平，下半部分看信号要经过哪几段才到终端。</text>
</svg>
