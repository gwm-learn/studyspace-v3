<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 03 · BitBake 的解析、任务与产物</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">左：层与元数据定义“构建什么、怎么构建”；中：BitBake 解析并执行任务；右：产物落在 tmp/deploy。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">虚线：任务签名命中 sstate 时直接取缓存，不重新执行。</text>
