<line x1="428" y1="494" x2="470" y2="494" stroke="#0891b2" stroke-width="1.8" stroke-dasharray="3 3"/>
<polygon points="470,494 461,489.5 461,498.5" fill="#0891b2"/>
<text x="478" y="490" font-size="9.6" fill="#64748b" xml:space="preserve">sstate 命中：跳过任务，直接供给下游</text>
<rect x="36" y="546" width="1092" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="576" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="52" y="600" font-size="10.2" fill="#334155" xml:space="preserve">① 变量最终值可能跨多个层覆盖：不要只看 local.conf，用 bitbake -e &lt;recipe&gt; 确认。</text>
<text x="52" y="618" font-size="10.2" fill="#334155" xml:space="preserve">② 改了补丁/配方却复用旧产物：升 PR 或 cleansstate，再确认任务签名已变化。</text>
<text x="52" y="636" font-size="10.2" fill="#334155" xml:space="preserve">③ 产物只在 deploy 下才是“可交付”的；work/ 里的东西不能直接拿去烧录。</text>
