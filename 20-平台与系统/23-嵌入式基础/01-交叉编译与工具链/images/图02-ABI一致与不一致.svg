<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1160" height="660" fill="#ffffff"/>
<line x1="36" y1="112" x2="1124" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · ABI 一致与不一致的两条路径</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">上半条：指令集、调用约定、C 库、加载器四层一致，程序正常启动。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">下半条：同名 libc 被替换，编译与链接都能过，直到板上加载才失败。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">正常路径</text>
<line x1="142" y1="142" x2="172" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="180" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">错配路径</text>
<line x1="248" y1="142" x2="278" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="286" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">同名不同实现</text>
<text x="36" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① 正常：四层一致</text>
<rect x="36" y="192" width="120" height="78" fill="#f2fcf5" rx="9" stroke="#0f9d58" stroke-width="1.2"/>
<text x="46" y="214" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">一致</text>
<text x="46" y="230" font-size="9.4" fill="#64748b" xml:space="preserve">可运行</text>
<text x="46" y="248" font-size="9" fill="#64748b" xml:space="preserve">逐层核对</text>
<rect x="168" y="192" width="180" height="78" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="168" y="192" width="4.5" height="78" fill="#0f9d58" rx="2"/>
<text x="181" y="211" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">源码 + 头文件</text>
<text x="181" y="228" font-size="8.8" fill="#334155" xml:space="preserve">sysroot 提供</text>
<line x1="348" y1="231" x2="376" y2="231" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="376,231 367,226.5 367,235.5" fill="#94a3b8"/>
<rect x="376" y="192" width="180" height="78" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="376" y="192" width="4.5" height="78" fill="#0f9d58" rx="2"/>
<text x="389" y="211" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">编译 / 链接</text>
<text x="389" y="228" font-size="8.8" fill="#334155" xml:space="preserve">target-gcc</text>
<line x1="556" y1="231" x2="584" y2="231" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="584,231 575,226.5 575,235.5" fill="#94a3b8"/>
<rect x="584" y="192" width="180" height="78" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="584" y="192" width="4.5" height="78" fill="#0f9d58" rx="2"/>
<text x="597" y="211" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">目标 ELF</text>
<text x="597" y="228" font-size="8.8" fill="#334155" xml:space="preserve">架构/ABI 匹配</text>
<line x1="764" y1="231" x2="792" y2="231" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="792,231 783,226.5 783,235.5" fill="#94a3b8"/>
<rect x="792" y="192" width="200" height="78" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="792" y="192" width="4.5" height="78" fill="#0f9d58" rx="2"/>
<text x="805" y="211" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">板上启动</text>
<text x="805" y="228" font-size="8.8" fill="#334155" xml:space="preserve">加载器与库齐全</text>
<text x="36" y="306" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② 错配：编译链接都过，运行失败</text>
<rect x="36" y="322" width="120" height="78" fill="#fff5f5" rx="9" stroke="#dc2626" stroke-width="1.2"/>
<text x="46" y="344" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">错配</text>
<text x="46" y="360" font-size="9.4" fill="#64748b" xml:space="preserve">板上失败</text>
<text x="46" y="378" font-size="9" fill="#64748b" xml:space="preserve">按报错倒查</text>
<rect x="168" y="322" width="180" height="78" fill="#fff5f5" rx="8" stroke="#dc2626" stroke-width="1.1"/>
<rect x="168" y="322" width="4.5" height="78" fill="#dc2626" rx="2"/>
<text x="181" y="341" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">同一份源码</text>
<text x="181" y="358" font-size="8.8" fill="#334155" xml:space="preserve">看起来没变</text>
<line x1="348" y1="361" x2="374" y2="361" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="374,361 365,356.5 365,365.5" fill="#94a3b8"/>
<rect x="374" y="322" width="180" height="78" fill="#fff5f5" rx="8" stroke="#dc2626" stroke-width="1.1"/>
<rect x="374" y="322" width="4.5" height="78" fill="#dc2626" rx="2"/>
<text x="387" y="341" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">编译 / 链接通过</text>
<text x="387" y="358" font-size="8.8" fill="#334155" xml:space="preserve">用的是另一套 sysroot</text>
<line x1="554" y1="361" x2="580" y2="361" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="580,361 571,356.5 571,365.5" fill="#94a3b8"/>
<rect x="580" y="322" width="200" height="78" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="580" y="322" width="4.5" height="78" fill="#d97706" rx="2"/>
<text x="593" y="341" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">libc.so 同名</text>
<text x="593" y="358" font-size="8.8" fill="#334155" xml:space="preserve">glibc ↔ musl</text>
<text x="593" y="373.4" font-size="8.8" fill="#334155" xml:space="preserve">符号版本不同</text>
<line x1="780" y1="361" x2="806" y2="361" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="806,361 797,356.5 797,365.5" fill="#94a3b8"/>
<rect x="806" y="322" width="240" height="78" fill="#fff5f5" rx="8" stroke="#dc2626" stroke-width="1.1"/>
<rect x="806" y="322" width="4.5" height="78" fill="#dc2626" rx="2"/>
<text x="819" y="341" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">板上报错</text>
<text x="819" y="358" font-size="8.8" fill="#334155" xml:space="preserve">No such file or directory</text>
<text x="819" y="373.4" font-size="8.8" fill="#334155" xml:space="preserve">version not found</text>
<rect x="36" y="450" width="1080" height="128" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="480" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">③ 倒查顺序（从现象到根因）</text>
<text x="52" y="504" font-size="10.2" fill="#334155" xml:space="preserve">① 文件存在却报 No such file or directory → readelf -l 看 PT_INTERP，板上有无该加载器</text>
<text x="52" y="522" font-size="10.2" fill="#334155" xml:space="preserve">② Illegal instruction → readelf -A 看 CPU 架构标签与 VFP/浮点标志，核对 -march 与 SoC</text>
<text x="52" y="540" font-size="10.2" fill="#334155" xml:space="preserve">③ version &#x27;GLIBC_x.y&#x27; not found → strings libc.so.6 | grep GLIBC_，板上库比编译时旧</text>
<text x="52" y="558" font-size="10.2" fill="#334155" xml:space="preserve">④ 参数错乱或 malloc 崩溃 → 检查是否混入 host 的 .o/.so，或头文件与库版本不一致</text>
<text x="36" y="606" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="624" font-size="12.3" fill="#64748b" xml:space="preserve">读图：两条路径的差异只在“C 库层”这一格；其余步骤都能成功，所以不能用编译结果判断兼容性。</text>
</svg>
