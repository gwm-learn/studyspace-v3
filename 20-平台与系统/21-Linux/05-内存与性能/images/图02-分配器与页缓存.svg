<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · 分配器与页缓存：页、块、文件三层</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">buddy 管页，slab/kmalloc 管块，page cache 管文件。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">写先变 dirty，回写后才落盘；fsync 强制回写。</text>
