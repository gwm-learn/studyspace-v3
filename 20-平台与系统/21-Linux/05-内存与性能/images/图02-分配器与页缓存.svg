<text x="169" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">成功 / 就绪</text>
<line x1="256.8" y1="142" x2="286.8" y2="142" stroke="#0891b2" stroke-width="3"/>
<text x="294.8" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">辅助</text>
<line x1="340.8" y1="142" x2="370.8" y2="142" stroke="#d97706" stroke-width="3"/>
