<text x="504.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">风险 / 阻塞</text>
<rect x="36" y="190" width="158" height="82" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="36" y="190" width="4.5" height="82" fill="#4f46e5" rx="2"/>
<text x="49" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">buddy</text>
<text x="49" y="226" font-size="8.8" fill="#334155" xml:space="preserve">2^n 页</text>
<text x="49" y="241.4" font-size="8.8" fill="#334155" xml:space="preserve">alloc_pages</text>
<line x1="194" y1="231" x2="206" y2="231" stroke="#94a3b8" stroke-width="1.5"/>
