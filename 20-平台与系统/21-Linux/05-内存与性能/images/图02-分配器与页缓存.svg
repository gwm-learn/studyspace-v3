<text x="729" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">writeback</text>
<text x="729" y="226" font-size="8.8" fill="#334155" xml:space="preserve">dirty→磁盘</text>
<text x="729" y="241.4" font-size="8.8" fill="#334155" xml:space="preserve">fsync</text>
<rect x="36" y="310" width="1100" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="340" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图提示</text>
<text x="52" y="364" font-size="10.2" fill="#334155" xml:space="preserve">kmalloc 不能用于需要大块连续内存的场景。</text>
<text x="52" y="382" font-size="10.2" fill="#334155" xml:space="preserve">page cache 可回收，dirty 比例过高会抖动。</text>
<text x="36" y="426" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py</text>
