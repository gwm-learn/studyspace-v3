<text x="219" y="226" font-size="8.8" fill="#334155" xml:space="preserve">固定对象</text>
<text x="219" y="241.4" font-size="8.8" fill="#334155" xml:space="preserve">物理连续</text>
<line x1="364" y1="231" x2="376" y2="231" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="376,231 367,226.5 367,235.5" fill="#94a3b8"/>
