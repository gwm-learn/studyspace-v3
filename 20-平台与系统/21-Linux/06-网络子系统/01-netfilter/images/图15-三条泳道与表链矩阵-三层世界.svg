<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="706" viewBox="0 0 1660 706" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1660" height="706" fill="#ffffff"/>
<text x="36.0" y="42.0" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 15 · 拆开看（三层）：三条泳道分别怎么走，每条链上能挂哪四张表</text>
<text x="36.0" y="70.0" font-size="12.3" fill="#64748b" xml:space="preserve">上图是合起来的样子，这张拆开：同一时刻一个包只走其中一条，所以每条链上「该挂哪张表」也随之不同。</text>
<text x="36.0" y="92.0" font-size="12.3" fill="#64748b" xml:space="preserve">记法：链＝在哪拦（位置）；表＝拦下来干什么（用途）；规则＝具体拦谁、怎么处理。三条线不能混。</text>
