<text x="1037.0" y="371.0" font-size="12.2" fill="#0f172a" xml:space="preserve" font-weight="700">同一条链里，表按固定顺序执行</text>
<text x="1037.0" y="388.0" font-size="10.6" fill="#334155" xml:space="preserve">raw → mangle → nat → filter → security</text>
<text x="1037.0" y="403.4" font-size="10.6" fill="#334155" xml:space="preserve">顺序由内核 handler 的 priority 决定，不是写在命令里的</text>
<text x="1037.0" y="418.8" font-size="10.6" fill="#334155" xml:space="preserve">所以「先 DNAT 再过滤」是框架保证的，不靠命令顺序</text>
<rect x="1024.0" y="448.2" width="600.0" height="84.2" rx="8" fill="#f2fcf5" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="1024.0" y="448.2" width="4.5" height="84.2" rx="2" fill="#0f9d58"/>
<text x="1037.0" y="467.2" font-size="12.2" fill="#0f172a" xml:space="preserve" font-weight="700">为什么 filter 最常用</text>
<text x="1037.0" y="484.2" font-size="10.6" fill="#334155" xml:space="preserve">其余三张是「改包」用的（改地址 / 改头 / 绕过跟踪）</text>
<text x="1037.0" y="499.6" font-size="10.6" fill="#334155" xml:space="preserve">filter 是唯一专门用来「放行或丢弃」的表</text>
<text x="1037.0" y="515.0" font-size="10.6" fill="#334155" xml:space="preserve">日常说「加条防火墙规则」99% 指的是 -t filter</text>
<rect x="36.0" y="554.4" width="1588.0" height="99.6" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="36.0" y="554.4" width="4.5" height="99.6" rx="2" fill="#4f46e5"/>
<text x="49.0" y="573.4" font-size="12.2" fill="#0f172a" xml:space="preserve" font-weight="700">③ 一条命令走查：从敲下这条规则，到它挂在哪一格</text>
<text x="49.0" y="590.4" font-size="10.6" fill="#334155" xml:space="preserve">命令：ip6tables -t filter -A FORWARD -p ipv6-icmp --icmpv6-type 134 -j DROP</text>
<text x="49.0" y="605.8" font-size="10.6" fill="#334155" xml:space="preserve">→ 协议族 pf = PF_INET6（ip6tables）　链 hooknum = NF_INET_FORWARD　表 = filter　优先级 = 0（filter 表默认）</text>
<text x="49.0" y="621.2" font-size="10.6" fill="#334155" xml:space="preserve">→ 效果：只对「IPv6 的转发包」生效，且只对 ICMPv6 type 134（RA）起作用；桥转发的帧默认进不到这里</text>
<text x="49.0" y="636.6" font-size="10.6" fill="#334155" xml:space="preserve">→ 换成 ebtables -t filter -A FORWARD -p IPv6 -j DROP：pf 变成 PF_BRIDGE，这时才管得到桥转发的帧</text>
<text x="36.0" y="676.0" font-size="11.0" fill="#64748b" xml:space="preserve">说明：本图是 netfilter 通用机制的教学版；表/链的挂载点与执行顺序按 5.10 内核，具体表项以本机 iptables -t &lt;表&gt; -L 为准。</text>
</svg>