<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="850" viewBox="0 0 1660 850" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1660" height="850" fill="#ffffff"/>
<text x="36.0" y="42.0" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 14 · 包的一生（总览·三层）：三条泳道叠在同一张图上</text>
<text x="36.0" y="70.0" font-size="12.3" fill="#64748b" xml:space="preserve">先看合起来的样子：一个包进网关后只有三种命运——给我（A）、过路（B）、我自己发（C）。它们共用前段 PREROUTING 和后段 POSTROUTING，只在中间分岔。</text>
<text x="36.0" y="92.0" font-size="12.3" fill="#64748b" xml:space="preserve">记法：路由决策是分水岭。判定「给我的」走 INPUT，「不是给我的」走 FORWARD。本机自己造的新包，从 OUTPUT 直接汇入后段。</text>
<line x1="36" y1="112.0" x2="1624.0" y2="112.0" stroke="#e2e8f0" stroke-width="1.2"/>
<line x1="36.0" y1="142.0" x2="66.0" y2="142.0" stroke="#475569" stroke-width="3"/>
<text x="74.0" y="146.0" font-size="11.0" fill="#334155" xml:space="preserve" font-weight="600">共用段（A、B 都走）</text>
<line x1="218.6" y1="142.0" x2="248.6" y2="142.0" stroke="#0f9d58" stroke-width="3"/>
<text x="256.6" y="146.0" font-size="11.0" fill="#334155" xml:space="preserve" font-weight="600">A 给我</text>
<line x1="325.8" y1="142.0" x2="355.8" y2="142.0" stroke="#4f46e5" stroke-width="3"/>
<text x="363.8" y="146.0" font-size="11.0" fill="#334155" xml:space="preserve" font-weight="600">B 过路</text>
<line x1="432.9" y1="142.0" x2="462.9" y2="142.0" stroke="#d97706" stroke-width="3"/>
<text x="470.9" y="146.0" font-size="11.0" fill="#334155" xml:space="preserve" font-weight="600">C 我发</text>
<rect x="720.0" y="168.0" width="220.0" height="58.0" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.1"/>
<rect x="720.0" y="168.0" width="4.5" height="58.0" rx="2" fill="#475569"/>
<text x="733.0" y="187.0" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">网卡收包</text>
<text x="733.0" y="204.0" font-size="9.6" fill="#334155" xml:space="preserve">dev_queue_xmit 的反向：napi → netif_receive_skb</text>
<rect x="720.0" y="264.0" width="220.0" height="76.0" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.1"/>
<rect x="720.0" y="264.0" width="4.5" height="76.0" rx="2" fill="#475569"/>
<text x="733.0" y="283.0" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">PREROUTING</text>
<text x="733.0" y="300.0" font-size="9.6" fill="#334155" xml:space="preserve" font-family="'DejaVu Sans Mono','Noto Sans Mono CJK SC',monospace">raw / mangle / nat(DNAT)</text>
<rect x="720.0" y="378.0" width="220.0" height="76.0" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.1"/>
<rect x="720.0" y="378.0" width="4.5" height="76.0" rx="2" fill="#475569"/>
<text x="733.0" y="397.0" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">路由决策</text>
<text x="733.0" y="414.0" font-size="9.6" fill="#334155" xml:space="preserve">目的是本机？还是转发？</text>
<line x1="830.0" y1="454.0" x2="830.0" y2="472.0" stroke="#475569" stroke-width="2.4"/>
<polygon points="830.0,472.0 825.5,463.0 834.5,463.0" fill="#475569"/>
<text x="840.0" y="464.0" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">分水岭</text>
<rect x="400.0" y="492.0" width="200.0" height="76.0" rx="8" fill="#f2fcf5" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="400.0" y="492.0" width="4.5" height="76.0" rx="2" fill="#0f9d58"/>
<text x="413.0" y="511.0" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">INPUT</text>
<text x="591.0" y="511.0" font-size="10.2" fill="#0f9d58" xml:space="preserve" font-weight="700" text-anchor="end">A</text>
<text x="413.0" y="528.0" font-size="9.6" fill="#334155" xml:space="preserve">mangle / filter / security</text>
<text x="413.0" y="543.4" font-size="9.6" fill="#334155" xml:space="preserve">「给我的包」进本机前</text>
<rect x="960.0" y="492.0" width="200.0" height="76.0" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="960.0" y="492.0" width="4.5" height="76.0" rx="2" fill="#4f46e5"/>
<text x="973.0" y="511.0" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">FORWARD</text>
<text x="1151.0" y="511.0" font-size="10.2" fill="#4f46e5" xml:space="preserve" font-weight="700" text-anchor="end">B</text>
<text x="973.0" y="528.0" font-size="9.6" fill="#334155" xml:space="preserve">mangle / filter / security</text>
<text x="973.0" y="543.4" font-size="9.6" fill="#334155" xml:space="preserve">「过路的包」只中转</text>
<rect x="400.0" y="606.0" width="200.0" height="76.0" rx="8" fill="#f2fcf5" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="400.0" y="606.0" width="4.5" height="76.0" rx="2" fill="#0f9d58"/>
<text x="413.0" y="625.0" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">本机进程</text>
<text x="591.0" y="625.0" font-size="10.2" fill="#0f9d58" xml:space="preserve" font-weight="700" text-anchor="end">A</text>
<text x="413.0" y="642.0" font-size="9.6" fill="#334155" xml:space="preserve">socket / sshd / dnsmasq</text>
<rect x="960.0" y="606.0" width="220.0" height="76.0" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.1"/>
<rect x="960.0" y="606.0" width="4.5" height="76.0" rx="2" fill="#475569"/>
<text x="973.0" y="625.0" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">POSTROUTING</text>
<text x="973.0" y="642.0" font-size="9.6" fill="#334155" xml:space="preserve" font-family="'DejaVu Sans Mono','Noto Sans Mono CJK SC',monospace">mangle / nat(SNAT)</text>
<text x="973.0" y="657.4" font-size="9.6" fill="#334155" xml:space="preserve">所有出去的包都经过</text>
<rect x="400.0" y="720.0" width="200.0" height="76.0" rx="8" fill="#fff9ee" stroke="#d97706" stroke-width="1.1"/>
<rect x="400.0" y="720.0" width="4.5" height="76.0" rx="2" fill="#d97706"/>
<text x="413.0" y="739.0" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">OUTPUT</text>
<text x="591.0" y="739.0" font-size="10.2" fill="#d97706" xml:space="preserve" font-weight="700" text-anchor="end">C</text>
<text x="413.0" y="756.0" font-size="9.6" fill="#334155" xml:space="preserve">raw / mangle / nat / filter</text>
<text x="413.0" y="771.4" font-size="9.6" fill="#334155" xml:space="preserve">「我自己造的包」出门前</text>
<rect x="960.0" y="720.0" width="200.0" height="58.0" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.1"/>
<rect x="960.0" y="720.0" width="4.5" height="58.0" rx="2" fill="#475569"/>
<text x="973.0" y="739.0" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">网卡发出</text>
<text x="973.0" y="756.0" font-size="9.6" fill="#334155" xml:space="preserve">dev_queue_xmit → 驱动</text>
<path d="M 830.0 226.0 L 830.0 264.0" fill="none" stroke="#475569" stroke-width="2.4"/>
<polygon points="830.0,264.0 825.5,255.0 834.5,255.0" fill="#475569"/>
<path d="M 830.0 340.0 L 830.0 378.0" fill="none" stroke="#475569" stroke-width="2.4"/>
<polygon points="830.0,378.0 825.5,369.0 834.5,369.0" fill="#475569"/>
<path d="M 830.0 472.0 L 500.0 472.0 L 500.0 492.0" fill="none" stroke="#0f9d58" stroke-width="2.6"/>
<polygon points="500.0,492.0 495.5,483.0 504.5,483.0" fill="#0f9d58"/>
<path d="M 830.0 472.0 L 1060.0 472.0 L 1060.0 492.0" fill="none" stroke="#4f46e5" stroke-width="2.6"/>
<path d="M 1060.0 466.0 L 1060.0 492.0" fill="none" stroke="#4f46e5" stroke-width="2.6"/>
<polygon points="1060.0,492.0 1055.5,483.0 1064.5,483.0" fill="#4f46e5"/>
<path d="M 500.0 568.0 L 500.0 606.0" fill="none" stroke="#0f9d58" stroke-width="2.6"/>
<polygon points="500.0,606.0 495.5,597.0 504.5,597.0" fill="#0f9d58"/>
<path d="M 500.0 682.0 L 500.0 720.0" fill="none" stroke="#d97706" stroke-width="2.6"/>
<polygon points="500.0,720.0 495.5,711.0 504.5,711.0" fill="#d97706"/>
<path d="M 1060.0 568.0 L 1060.0 606.0" fill="none" stroke="#4f46e5" stroke-width="2.6"/>
<polygon points="1060.0,606.0 1055.5,597.0 1064.5,597.0" fill="#4f46e5"/>
<path d="M 1060.0 682.0 L 1060.0 720.0" fill="none" stroke="#475569" stroke-width="2.4"/>
<polygon points="1060.0,720.0 1055.5,711.0 1064.5,711.0" fill="#475569"/>
<path d="M 600.0 758.0 L 880.0 758.0 L 880.0 644.0 L 960.0 644.0" fill="none" stroke="#d97706" stroke-width="2.6"/>
<polygon points="960.0,644.0 951.0,639.5 951.0,648.5" fill="#d97706"/>
<rect x="36.0" y="168.0" width="300.0" height="84.2" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.1"/>
<rect x="36.0" y="168.0" width="4.5" height="84.2" rx="2" fill="#475569"/>
<text x="49.0" y="187.0" font-size="12.2" fill="#0f172a" xml:space="preserve" font-weight="700">共用段（灰线）</text>
<text x="49.0" y="204.0" font-size="10.6" fill="#334155" xml:space="preserve">收包 → PREROUTING：所有进来的包</text>
<text x="49.0" y="219.4" font-size="10.6" fill="#334155" xml:space="preserve">PREROUTING → 路由决策：还不知道去哪</text>
<text x="49.0" y="234.8" font-size="10.6" fill="#334155" xml:space="preserve">POSTROUTING → 发出：所有出去的包</text>
<rect x="36.0" y="266.2" width="300.0" height="84.2" rx="8" fill="#f2fcf5" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="36.0" y="266.2" width="4.5" height="84.2" rx="2" fill="#0f9d58"/>
<text x="49.0" y="285.2" font-size="12.2" fill="#0f172a" xml:space="preserve" font-weight="700">A · 给我（绿线）</text>
<text x="49.0" y="302.2" font-size="10.6" fill="#334155" xml:space="preserve">路由判定：目的地址是本机</text>
<text x="49.0" y="317.6" font-size="10.6" fill="#334155" xml:space="preserve">PREROUTING → INPUT → 本机进程</text>
<text x="49.0" y="333.0" font-size="10.6" fill="#334155" xml:space="preserve">典型：访问这台机器的 Web / SSH</text>
<rect x="36.0" y="364.4" width="300.0" height="84.2" rx="8" fill="#fff9ee" stroke="#d97706" stroke-width="1.1"/>
<rect x="36.0" y="364.4" width="4.5" height="84.2" rx="2" fill="#d97706"/>
<text x="49.0" y="383.4" font-size="12.2" fill="#0f172a" xml:space="preserve" font-weight="700">C · 我发（橙线）</text>
<text x="49.0" y="400.4" font-size="10.6" fill="#334155" xml:space="preserve">本机进程造出新包（不是转发别人的）</text>
<text x="49.0" y="415.8" font-size="10.6" fill="#334155" xml:space="preserve">OUTPUT → 汇入 POSTROUTING → 发出</text>
<text x="49.0" y="431.2" font-size="10.6" fill="#334155" xml:space="preserve">典型：设备自己发 RA、DNS 查询</text>
<rect x="1306.0" y="168.0" width="318.0" height="84.2" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="1306.0" y="168.0" width="4.5" height="84.2" rx="2" fill="#4f46e5"/>
<text x="1319.0" y="187.0" font-size="12.2" fill="#0f172a" xml:space="preserve" font-weight="700">B · 过路（蓝线）</text>
<text x="1319.0" y="204.0" font-size="10.6" fill="#334155" xml:space="preserve">路由判定：目的不是本机</text>
<text x="1319.0" y="219.4" font-size="10.6" fill="#334155" xml:space="preserve">PREROUTING → FORWARD → POSTROUTING</text>
<text x="1319.0" y="234.8" font-size="10.6" fill="#334155" xml:space="preserve">典型：网关帮 PC 转发上网</text>
<rect x="1306.0" y="266.2" width="318.0" height="84.2" rx="8" fill="#fff5f5" stroke="#dc2626" stroke-width="1.1"/>
<rect x="1306.0" y="266.2" width="4.5" height="84.2" rx="2" fill="#dc2626"/>
<text x="1319.0" y="285.2" font-size="12.2" fill="#0f172a" xml:space="preserve" font-weight="700">最常见的误解</text>
<text x="1319.0" y="302.2" font-size="10.6" fill="#334155" xml:space="preserve">「FORWARD = 转发」容易被读成「转发给别的机器」，</text>
<text x="1319.0" y="317.6" font-size="10.6" fill="#334155" xml:space="preserve">其实它专指「过路」：包不是给我的，我只是个中转站。</text>
<text x="1319.0" y="333.0" font-size="10.6" fill="#334155" xml:space="preserve">本机自己发的包走 OUTPUT，永远不经过 FORWARD。</text>
<rect x="1306.0" y="364.4" width="318.0" height="84.2" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.1"/>
<rect x="1306.0" y="364.4" width="4.5" height="84.2" rx="2" fill="#0891b2"/>
<text x="1319.0" y="383.4" font-size="12.2" fill="#0f172a" xml:space="preserve" font-weight="700">三条泳道不会同时走</text>
<text x="1319.0" y="400.4" font-size="10.6" fill="#334155" xml:space="preserve">同一个包只可能是三种命运之一。</text>
<text x="1319.0" y="415.8" font-size="10.6" fill="#334155" xml:space="preserve">排查第一步永远是问：它是给我的、过路的，还是我发的？</text>
<text x="1319.0" y="431.2" font-size="10.6" fill="#334155" xml:space="preserve">答错了，后面看哪条链都是白看。</text>
<text x="36.0" y="820.0" font-size="11.0" fill="#64748b" xml:space="preserve">这张图是三层世界（PF_INET/PF_INET6）的形态；二层世界（PF_BRIDGE）是同样的五个位置、另一套钩子，见 图 16。</text>
</svg>