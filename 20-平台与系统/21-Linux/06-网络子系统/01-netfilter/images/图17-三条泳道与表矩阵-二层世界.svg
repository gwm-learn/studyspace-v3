<text x="1024.0" y="152.0" font-size="12.0" fill="#0f172a" xml:space="preserve" font-weight="700">② 二层世界的三张表：每条链上允许挂哪些（✓＝允许）</text>
<rect x="1024.0" y="162.0" width="600.0" height="30.0" rx="6" fill="#f1f5f9"/>
