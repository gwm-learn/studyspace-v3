<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="660" viewBox="0 0 1660 660" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1660" height="660" fill="#ffffff"/>
<text x="36.0" y="42.0" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 17 · 拆开看（二层）：三条泳道分别怎么走，每条链能挂哪三张表</text>
<text x="36.0" y="70.0" font-size="12.3" fill="#64748b" xml:space="preserve">上一张是二层世界的合起来形态，这张拆开。链名前面多了 NF_BR_ 前缀，能挂的表也从四张变成三张（没有 raw、没有 security）。</text>
<text x="36.0" y="92.0" font-size="12.3" fill="#64748b" xml:space="preserve">二层世界的工具是 ebtables，它的表叫 filter / nat / broute —— 和三层世界的 filter / nat 名字相同但完全独立。</text>
