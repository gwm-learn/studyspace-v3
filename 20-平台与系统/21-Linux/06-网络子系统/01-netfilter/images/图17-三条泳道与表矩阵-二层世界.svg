<text x="1037.0" y="311.0" font-size="12.2" fill="#0f172a" xml:space="preserve" font-weight="700">二层世界只有三张表，不是漏写了</text>
<text x="1037.0" y="328.0" font-size="10.6" fill="#334155" xml:space="preserve">没有 raw：二层没有连接跟踪，也就没有「绕过跟踪」的需求</text>
<text x="1037.0" y="343.4" font-size="10.6" fill="#334155" xml:space="preserve">没有 mangle：ebtables 不改 TTL/DSCP，改包头是三层世界 mangle 的活</text>
<text x="1037.0" y="358.8" font-size="10.6" fill="#334155" xml:space="preserve">没有 security：SELinux 的 secmark 只挂在三层世界</text>
<rect x="1024.0" y="388.2" width="600.0" height="84.2" rx="8" fill="#fff9ee" stroke="#d97706" stroke-width="1.1"/>
<rect x="1024.0" y="388.2" width="4.5" height="84.2" rx="2" fill="#d97706"/>
<text x="1037.0" y="407.2" font-size="12.2" fill="#0f172a" xml:space="preserve" font-weight="700">broute：最容易被忽略的一张</text>
<text x="1037.0" y="424.2" font-size="10.6" fill="#334155" xml:space="preserve">作用：让桥把「本该转发」的帧上交三层处理（bridge routing）</text>
<text x="1037.0" y="439.6" font-size="10.6" fill="#334155" xml:space="preserve">链名是 BROUTING，挂在 PRE_ROUTING 上、优先级最前</text>
<text x="1037.0" y="455.0" font-size="10.6" fill="#334155" xml:space="preserve">典型用途：把某些帧从「桥转发」改判成「走路由」</text>
<rect x="36.0" y="508.0" width="1588.0" height="99.6" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.1"/>
<rect x="36.0" y="508.0" width="4.5" height="99.6" rx="2" fill="#0891b2"/>
<text x="49.0" y="527.0" font-size="12.2" fill="#0f172a" xml:space="preserve" font-weight="700">③ 一条 ebtables 命令走查：从敲下这条规则，到它挂在哪一格</text>
<text x="49.0" y="544.0" font-size="10.6" fill="#334155" xml:space="preserve">命令：ebtables -t filter -A FORWARD -p IPv6 --ip6-icmp-type router-advertisement -j DROP</text>
<text x="49.0" y="559.4" font-size="10.6" fill="#334155" xml:space="preserve">→ 协议族 pf = PF_BRIDGE（ebtables）　链 = NF_BR_FORWARD　表 = filter　优先级由 ebtables 的注册决定</text>
<text x="49.0" y="574.8" font-size="10.6" fill="#334155" xml:space="preserve">→ 效果：只对「桥转发的 IPv6 RA 帧」生效（不看 IP 地址，只看以太类型与 ICMPv6 类型）</text>
<text x="49.0" y="590.2" font-size="10.6" fill="#334155" xml:space="preserve">→ 对照：ip6tables -t filter -A FORWARD 写同名规则时 pf 是 PF_INET6，桥转发的帧要先被 br_netfilter 提升才看得到</text>
<text x="36.0" y="629.6" font-size="11.0" fill="#64748b" xml:space="preserve">说明：ebtables 的链名：filter 表用 INPUT/FORWARD/OUTPUT；nat 表用 PREROUTING/OUTPUT/POSTROUTING；broute 表用 BROUTING（挂在 NF_BR_PRE_ROUTING 上）。本图是机制教学版，具体表项以本机 ebtables -t &lt;表&gt; -L 为准。</text>
</svg>