<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="850" viewBox="0 0 1660 850" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1660" height="850" fill="#ffffff"/>
<text x="36.0" y="42.0" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 16 · 包的一生（总览·二层）：同样的三条泳道，换成以太帧</text>
<text x="36.0" y="70.0" font-size="12.3" fill="#64748b" xml:space="preserve">把上一张图的「IP 包」换成「以太帧」，五个检查站一个不少，但分水岭从「路由决策」变成「查 FDB（MAC 地址表）」。</text>
<text x="36.0" y="92.0" font-size="12.3" fill="#64748b" xml:space="preserve">三种命运还是那三种：上送本机（A）、桥转发（B）、本机发帧（C）。共用段也还在：前段 PRE_ROUTING、后段 POST_ROUTING。</text>
<line x1="36" y1="112.0" x2="1624.0" y2="112.0" stroke="#e2e8f0" stroke-width="1.2"/>
<line x1="36.0" y1="142.0" x2="66.0" y2="142.0" stroke="#475569" stroke-width="3"/>
<text x="74.0" y="146.0" font-size="11.0" fill="#334155" xml:space="preserve" font-weight="600">共用段（A、B 都走）</text>
<line x1="218.6" y1="142.0" x2="248.6" y2="142.0" stroke="#0f9d58" stroke-width="3"/>
<text x="256.6" y="146.0" font-size="11.0" fill="#334155" xml:space="preserve" font-weight="600">A 上送本机</text>
<line x1="348.9" y1="142.0" x2="378.9" y2="142.0" stroke="#4f46e5" stroke-width="3"/>
<text x="386.9" y="146.0" font-size="11.0" fill="#334155" xml:space="preserve" font-weight="600">B 桥转发</text>
<line x1="467.6" y1="142.0" x2="497.6" y2="142.0" stroke="#d97706" stroke-width="3"/>
<text x="505.6" y="146.0" font-size="11.0" fill="#334155" xml:space="preserve" font-weight="600">C 本机发帧</text>
<rect x="720.0" y="168.0" width="220.0" height="58.0" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.1"/>
<rect x="720.0" y="168.0" width="4.5" height="58.0" rx="2" fill="#475569"/>
<text x="733.0" y="187.0" font-size="11.6" fill="#0f172a" xml:space="preserve" font-weight="700">网卡收帧</text>
<text x="733.0" y="204.0" font-size="9.6" fill="#334155" xml:space="preserve" font-family="'DejaVu Sans Mono','Noto Sans Mono CJK SC',monospace">br_handle_frame()：帧里可能是 v4 / v6 / ARP</text>
<rect x="720.0" y="264.0" width="220.0" height="76.0" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.1"/>
<rect x="720.0" y="264.0" width="4.5" height="76.0" rx="2" fill="#475569"/>
<text x="733.0" y="283.0" font-size="11.6" fill="#0f172a" xml:space="preserve" font-weight="700">NF_BR_PRE_ROUTING</text>
<text x="733.0" y="300.0" font-size="9.6" fill="#334155" xml:space="preserve" font-family="'DejaVu Sans Mono','Noto Sans Mono CJK SC',monospace">ebtables broute / nat(DNAT)</text>
<rect x="720.0" y="378.0" width="220.0" height="76.0" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.1"/>
<rect x="720.0" y="378.0" width="4.5" height="76.0" rx="2" fill="#475569"/>
<text x="733.0" y="397.0" font-size="11.6" fill="#0f172a" xml:space="preserve" font-weight="700">桥查 FDB</text>
<text x="733.0" y="414.0" font-size="9.6" fill="#334155" xml:space="preserve">目的 MAC 是本机 / 桥自己，还是别的口？</text>
<line x1="830.0" y1="454.0" x2="830.0" y2="472.0" stroke="#475569" stroke-width="2.4"/>
<polygon points="830.0,472.0 825.5,463.0 834.5,463.0" fill="#475569"/>
<text x="840.0" y="464.0" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">分水岭</text>
<rect x="400.0" y="492.0" width="200.0" height="76.0" rx="8" fill="#f2fcf5" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="400.0" y="492.0" width="4.5" height="76.0" rx="2" fill="#0f9d58"/>
<text x="413.0" y="511.0" font-size="11.6" fill="#0f172a" xml:space="preserve" font-weight="700">NF_BR_LOCAL_IN</text>
<text x="591.0" y="511.0" font-size="10.2" fill="#0f9d58" xml:space="preserve" font-weight="700" text-anchor="end">A</text>
<text x="413.0" y="528.0" font-size="9.6" fill="#334155" xml:space="preserve">ebtables filter INPUT</text>
<text x="413.0" y="543.4" font-size="9.6" fill="#334155" xml:space="preserve">「发给本机的帧」上交前</text>
<rect x="960.0" y="492.0" width="200.0" height="76.0" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="960.0" y="492.0" width="4.5" height="76.0" rx="2" fill="#4f46e5"/>
<text x="973.0" y="511.0" font-size="11.6" fill="#0f172a" xml:space="preserve" font-weight="700">NF_BR_FORWARD</text>
<text x="1151.0" y="511.0" font-size="10.2" fill="#4f46e5" xml:space="preserve" font-weight="700" text-anchor="end">B</text>
<text x="973.0" y="528.0" font-size="9.6" fill="#334155" xml:space="preserve">ebtables filter FORWARD</text>
<text x="973.0" y="543.4" font-size="9.6" fill="#334155" xml:space="preserve">「过路的帧」只中转</text>
<rect x="400.0" y="606.0" width="200.0" height="76.0" rx="8" fill="#f2fcf5" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="400.0" y="606.0" width="4.5" height="76.0" rx="2" fill="#0f9d58"/>
<text x="413.0" y="625.0" font-size="11.6" fill="#0f172a" xml:space="preserve" font-weight="700">本机 IP 栈</text>
<text x="591.0" y="625.0" font-size="10.2" fill="#0f9d58" xml:space="preserve" font-weight="700" text-anchor="end">A</text>
<text x="413.0" y="642.0" font-size="9.6" fill="#334155" xml:space="preserve">剥掉以太头，按 v4 / v6 继续</text>
<rect x="960.0" y="606.0" width="220.0" height="76.0" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.1"/>
<rect x="960.0" y="606.0" width="4.5" height="76.0" rx="2" fill="#475569"/>
<text x="973.0" y="625.0" font-size="11.6" fill="#0f172a" xml:space="preserve" font-weight="700">NF_BR_POST_ROUTING</text>
<text x="973.0" y="642.0" font-size="9.6" fill="#334155" xml:space="preserve" font-family="'DejaVu Sans Mono','Noto Sans Mono CJK SC',monospace">ebtables nat(SNAT)</text>
<text x="973.0" y="657.4" font-size="9.6" fill="#334155" xml:space="preserve">帧发到出口口之前</text>
<rect x="400.0" y="720.0" width="200.0" height="76.0" rx="8" fill="#fff9ee" stroke="#d97706" stroke-width="1.1"/>
<rect x="400.0" y="720.0" width="4.5" height="76.0" rx="2" fill="#d97706"/>
<text x="413.0" y="739.0" font-size="11.6" fill="#0f172a" xml:space="preserve" font-weight="700">NF_BR_LOCAL_OUT</text>
<text x="591.0" y="739.0" font-size="10.2" fill="#d97706" xml:space="preserve" font-weight="700" text-anchor="end">C</text>
<text x="413.0" y="756.0" font-size="9.6" fill="#334155" xml:space="preserve">ebtables filter OUTPUT</text>
<text x="413.0" y="771.4" font-size="9.6" fill="#334155" xml:space="preserve">「本机造的帧」出门前</text>
<rect x="960.0" y="720.0" width="200.0" height="58.0" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.1"/>
<rect x="960.0" y="720.0" width="4.5" height="58.0" rx="2" fill="#475569"/>
<text x="973.0" y="739.0" font-size="11.6" fill="#0f172a" xml:space="preserve" font-weight="700">网卡发出</text>
<text x="973.0" y="756.0" font-size="9.6" fill="#334155" xml:space="preserve">dev_queue_xmit → 驱动</text>
<path d="M 830.0 226.0 L 830.0 264.0" fill="none" stroke="#475569" stroke-width="2.4"/>
<polygon points="830.0,264.0 825.5,255.0 834.5,255.0" fill="#475569"/>
<path d="M 830.0 340.0 L 830.0 378.0" fill="none" stroke="#475569" stroke-width="2.4"/>
<polygon points="830.0,378.0 825.5,369.0 834.5,369.0" fill="#475569"/>
<path d="M 830.0 472.0 L 500.0 472.0 L 500.0 492.0" fill="none" stroke="#0f9d58" stroke-width="2.6"/>
<polygon points="500.0,492.0 495.5,483.0 504.5,483.0" fill="#0f9d58"/>
<path d="M 830.0 472.0 L 1060.0 472.0 L 1060.0 492.0" fill="none" stroke="#4f46e5" stroke-width="2.6"/>
<path d="M 1060.0 466.0 L 1060.0 492.0" fill="none" stroke="#4f46e5" stroke-width="2.6"/>
<polygon points="1060.0,492.0 1055.5,483.0 1064.5,483.0" fill="#4f46e5"/>
<path d="M 500.0 568.0 L 500.0 606.0" fill="none" stroke="#0f9d58" stroke-width="2.6"/>
<polygon points="500.0,606.0 495.5,597.0 504.5,597.0" fill="#0f9d58"/>
<path d="M 500.0 682.0 L 500.0 720.0" fill="none" stroke="#d97706" stroke-width="2.6"/>
<polygon points="500.0,720.0 495.5,711.0 504.5,711.0" fill="#d97706"/>
<path d="M 1060.0 568.0 L 1060.0 606.0" fill="none" stroke="#4f46e5" stroke-width="2.6"/>
<polygon points="1060.0,606.0 1055.5,597.0 1064.5,597.0" fill="#4f46e5"/>
<path d="M 1060.0 682.0 L 1060.0 720.0" fill="none" stroke="#475569" stroke-width="2.4"/>
<polygon points="1060.0,720.0 1055.5,711.0 1064.5,711.0" fill="#475569"/>
<path d="M 600.0 758.0 L 880.0 758.0 L 880.0 644.0 L 960.0 644.0" fill="none" stroke="#d97706" stroke-width="2.6"/>
<polygon points="960.0,644.0 951.0,639.5 951.0,648.5" fill="#d97706"/>
<rect x="36.0" y="168.0" width="300.0" height="84.2" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.1"/>
<rect x="36.0" y="168.0" width="4.5" height="84.2" rx="2" fill="#475569"/>
<text x="49.0" y="187.0" font-size="12.2" fill="#0f172a" xml:space="preserve" font-weight="700">共用段（灰线）</text>
<text x="49.0" y="204.0" font-size="10.6" fill="#334155" xml:space="preserve">收帧 → PRE_ROUTING：所有进来的帧</text>
<text x="49.0" y="219.4" font-size="10.6" fill="#334155" xml:space="preserve">PRE_ROUTING → 查 FDB：还不知道去哪</text>
<text x="49.0" y="234.8" font-size="10.6" fill="#334155" xml:space="preserve">POST_ROUTING → 发出：所有出去的帧</text>
<rect x="36.0" y="266.2" width="300.0" height="84.2" rx="8" fill="#f2fcf5" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="36.0" y="266.2" width="4.5" height="84.2" rx="2" fill="#0f9d58"/>
<text x="49.0" y="285.2" font-size="12.2" fill="#0f172a" xml:space="preserve" font-weight="700">A · 上送本机（绿线）</text>
<text x="49.0" y="302.2" font-size="10.6" fill="#334155" xml:space="preserve">查 FDB：目的 MAC 是本机 / 桥自己</text>
<text x="49.0" y="317.6" font-size="10.6" fill="#334155" xml:space="preserve">PRE_ROUTING → LOCAL_IN → 本机 IP 栈</text>
<text x="49.0" y="333.0" font-size="10.6" fill="#334155" xml:space="preserve">典型：发给网关自己的 DHCP / 管理报文</text>
<rect x="36.0" y="364.4" width="300.0" height="84.2" rx="8" fill="#fff9ee" stroke="#d97706" stroke-width="1.1"/>
<rect x="36.0" y="364.4" width="4.5" height="84.2" rx="2" fill="#d97706"/>
<text x="49.0" y="383.4" font-size="12.2" fill="#0f172a" xml:space="preserve" font-weight="700">C · 本机发帧（橙线）</text>
<text x="49.0" y="400.4" font-size="10.6" fill="#334155" xml:space="preserve">本机 IP 栈造出帧（不是转发别人的）</text>
<text x="49.0" y="415.8" font-size="10.6" fill="#334155" xml:space="preserve">LOCAL_OUT → 汇入 POST_ROUTING → 出口</text>
<text x="49.0" y="431.2" font-size="10.6" fill="#334155" xml:space="preserve">典型：设备自己给 LAN 发 RA</text>
<rect x="1306.0" y="168.0" width="318.0" height="84.2" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="1306.0" y="168.0" width="4.5" height="84.2" rx="2" fill="#4f46e5"/>
<text x="1319.0" y="187.0" font-size="12.2" fill="#0f172a" xml:space="preserve" font-weight="700">B · 桥转发（蓝线）</text>
<text x="1319.0" y="204.0" font-size="10.6" fill="#334155" xml:space="preserve">查 FDB：目的 MAC 是另一个口</text>
<text x="1319.0" y="219.4" font-size="10.6" fill="#334155" xml:space="preserve">PRE_ROUTING → FORWARD → POST_ROUTING</text>
<text x="1319.0" y="234.8" font-size="10.6" fill="#334155" xml:space="preserve">典型：交换机行为 —— 二层转发的主要场景</text>
<rect x="1306.0" y="266.2" width="318.0" height="84.2" rx="8" fill="#fff5f5" stroke="#dc2626" stroke-width="1.1"/>
<rect x="1306.0" y="266.2" width="4.5" height="84.2" rx="2" fill="#dc2626"/>
<text x="1319.0" y="285.2" font-size="12.2" fill="#0f172a" xml:space="preserve" font-weight="700">和三层世界最大的不同</text>
<text x="1319.0" y="302.2" font-size="10.6" fill="#334155" xml:space="preserve">分水岭不是路由表，是 FDB（MAC 表）；它不看 IP 地址。</text>
<text x="1319.0" y="317.6" font-size="10.6" fill="#334155" xml:space="preserve">帧在桥里走完这一圈，压根没上三层 ——</text>
<text x="1319.0" y="333.0" font-size="10.6" fill="#334155" xml:space="preserve">所以 iptables / ip6tables 在这条路上一个钩子都碰不到。</text>
<rect x="1306.0" y="364.4" width="318.0" height="84.2" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.1"/>
<rect x="1306.0" y="364.4" width="4.5" height="84.2" rx="2" fill="#0891b2"/>
<text x="1319.0" y="383.4" font-size="12.2" fill="#0f172a" xml:space="preserve" font-weight="700">为什么会误以为「配了就该生效」</text>
<text x="1319.0" y="400.4" font-size="10.6" fill="#334155" xml:space="preserve">配置手段都在三层世界，报文的命运却发生在二层世界。</text>
<text x="1319.0" y="415.8" font-size="10.6" fill="#334155" xml:space="preserve">两个世界的链名一模一样（都有 FORWARD），所以看着像同一件事。</text>
<text x="1319.0" y="431.2" font-size="10.6" fill="#334155" xml:space="preserve">这就是「配置都对、报文还是漏」的常见原因。</text>
<text x="36.0" y="820.0" font-size="11.0" fill="#64748b" xml:space="preserve">对照关系：三层世界的 PREROUTING/INPUT/FORWARD/OUTPUT/POSTROUTING ↔ 二层世界的 NF_BR_PRE_ROUTING/LOCAL_IN/FORWARD/LOCAL_OUT/POST_ROUTING；本图只画二层世界，两套并排见 图 18。</text>
</svg>