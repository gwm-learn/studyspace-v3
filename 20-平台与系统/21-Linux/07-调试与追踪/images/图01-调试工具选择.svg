<text x="242" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">卡死</text>
<line x1="288" y1="142" x2="318" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="326" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">性能</text>
<rect x="455" y="180" width="210" height="58" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="455" y="180" width="4.5" height="58" fill="#475569" rx="2"/>
<text x="468" y="199" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">现象是什么？</text>
<text x="468" y="216" font-size="9.6" fill="#334155" xml:space="preserve">先分类，再选工具</text>
<rect x="40" y="290" width="246.5" height="72.8" fill="#fff5f5" rx="8" stroke="#dc2626" stroke-width="1.1"/>
<rect x="40" y="290" width="4.5" height="72.8" fill="#dc2626" rx="2"/>
<text x="53" y="309" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">① 崩溃 / oops</text>
<text x="53" y="326" font-size="9.6" fill="#334155" xml:space="preserve">dmesg 看 call trace</text>
<text x="53" y="341.4" font-size="9.6" fill="#334155" xml:space="preserve">kdump 拿 vmcore</text>
<line x1="497" y1="238" x2="163.25" y2="290" stroke="#dc2626" stroke-width="1.8"/>
<polygon points="163.25,290 172.84,293.06 171.45,284.17" fill="#dc2626"/>
<text x="50" y="382.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 先看符号与偏移，再看代码</text>
<rect x="304.5" y="290" width="246.5" height="72.8" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="304.5" y="290" width="4.5" height="72.8" fill="#d97706" rx="2"/>
<text x="317.5" y="309" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">② 内存异常</text>
<text x="317.5" y="326" font-size="9.6" fill="#334155" xml:space="preserve">kmemleak / slabinfo</text>
<text x="317.5" y="341.4" font-size="9.6" fill="#334155" xml:space="preserve">slab 与 buddy 分布</text>
<line x1="539" y1="238" x2="427.75" y2="290" stroke="#d97706" stroke-width="1.8"/>
<polygon points="427.75,290 437.81,290.27 434,282.11" fill="#d97706"/>
<text x="314.5" y="382.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 先确认是泄漏还是碎片</text>
