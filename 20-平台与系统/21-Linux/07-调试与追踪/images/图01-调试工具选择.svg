<text x="582" y="309" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">③ 卡死 / 死锁</text>
<text x="582" y="326" font-size="9.6" fill="#334155" xml:space="preserve">sysrq 抓栈</text>
<text x="582" y="341.4" font-size="9.6" fill="#334155" xml:space="preserve">lockdep 查锁序</text>
<line x1="581" y1="238" x2="692.25" y2="290" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="692.25,290 686,282.11 682.19,290.27" fill="#4f46e5"/>
<text x="579" y="382.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 先抓现场，别急着重启</text>
<rect x="833.5" y="290" width="246.5" height="72.8" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="833.5" y="290" width="4.5" height="72.8" fill="#0f9d58" rx="2"/>
<text x="846.5" y="309" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">④ 性能问题</text>
<text x="846.5" y="326" font-size="9.6" fill="#334155" xml:space="preserve">perf / ftrace</text>
<text x="846.5" y="341.4" font-size="9.6" fill="#334155" xml:space="preserve">iostat / ss</text>
<line x1="623" y1="238" x2="956.75" y2="290" stroke="#0f9d58" stroke-width="1.8"/>
<polygon points="956.75,290 948.55,284.17 947.16,293.06" fill="#0f9d58"/>
<text x="843.5" y="382.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 先定位热点，再谈优化</text>
<rect x="40" y="440" width="1040" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="470" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="494" font-size="10.2" fill="#334155" xml:space="preserve">「卡死」时重启会毁掉现场：先 sysrq 抓栈、再决定是否重启。</text>
<text x="56" y="512" font-size="10.2" fill="#334155" xml:space="preserve">性能问题不要先改代码：perf 找不到热点时，先怀疑指标选错了。</text>
