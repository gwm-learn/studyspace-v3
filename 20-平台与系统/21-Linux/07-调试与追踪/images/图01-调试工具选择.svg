<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · 调试工具选择：先问现象，再选工具</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">四类现象各自对应不同工具；选错工具会得到「看起来正常」的假结论。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">准则是：先缩小到内核/用户态、再缩小到时间点。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">崩溃</text>
