<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">进程有独立 mm/files/fs；线程共享这些资源，属于同一线程组。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">fork 创建新 task，exec 替换映像，exit 变 zombie 等父进程 wait。</text>
