<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1200" height="980" fill="#ffffff"/>
<line x1="36" y1="112" x2="1164" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 05 · 块设备与 MMC：页缓存 → bio → 驱动</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">块设备读写先过 page cache，再由块层合并/调度成请求。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">MMC 在块设备之下再分 card/protocol/host 三层。</text>
<rect x="150" y="190" width="420" height="54" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="150" y="190" width="4.5" height="54" fill="#0f9d58" rx="2"/>
<text x="163" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">VFS</text>
<text x="163" y="226" font-size="9.6" fill="#334155" xml:space="preserve">文件接口 / page cache</text>
<rect x="150" y="276" width="510" height="54" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="150" y="276" width="4.5" height="54" fill="#4f46e5" rx="2"/>
<text x="163" y="295" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">文件系统 / 裸设备</text>
<text x="163" y="312" font-size="9.6" fill="#334155" xml:space="preserve">ext4/ubifs 或 /dev/mmcblk</text>
<rect x="150" y="362" width="600" height="54" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="150" y="362" width="4.5" height="54" fill="#d97706" rx="2"/>
<text x="163" y="381" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">块层</text>
<text x="163" y="398" font-size="9.6" fill="#334155" xml:space="preserve">bio/request/blk-mq</text>
<rect x="150" y="448" width="690" height="54" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="150" y="448" width="4.5" height="54" fill="#0891b2" rx="2"/>
<text x="163" y="467" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">块设备驱动</text>
<text x="163" y="484" font-size="9.6" fill="#334155" xml:space="preserve">gendisk/queue_rq</text>
<rect x="150" y="534" width="780" height="54" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="150" y="534" width="4.5" height="54" fill="#4f46e5" rx="2"/>
<text x="163" y="553" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">MMC card 层</text>
<text x="163" y="570" font-size="9.6" fill="#334155" xml:space="preserve">块设备/分区</text>
<rect x="150" y="620" width="870" height="54" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="150" y="620" width="4.5" height="54" fill="#d97706" rx="2"/>
<text x="163" y="639" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">MMC protocol 层</text>
<text x="163" y="656" font-size="9.6" fill="#334155" xml:space="preserve">CMD/响应/数据</text>
<rect x="150" y="706" width="960" height="54" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="150" y="706" width="4.5" height="54" fill="#475569" rx="2"/>
<text x="163" y="725" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">MMC host 层</text>
<text x="163" y="742" font-size="9.6" fill="#334155" xml:space="preserve">控制器/DMA/中断</text>
<line x1="112" y1="215" x2="112" y2="728" stroke="#4f46e5" stroke-width="2.2" stroke-dasharray="3 3"/>
<polygon points="112,728 116.5,719 107.5,719" fill="#4f46e5"/>
<text x="56" y="465.5" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">自下而上</text>
<line x1="1132" y1="728" x2="1132" y2="215" stroke="#0f9d58" stroke-width="2.2" stroke-dasharray="3 3"/>
<polygon points="1132,215 1127.5,224 1136.5,224" fill="#0f9d58"/>
<text x="1142" y="465.5" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">调用</text>
<rect x="36" y="798" width="1100" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="828" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图提示</text>
<text x="52" y="852" font-size="10.2" fill="#334155" xml:space="preserve">块设备有缓存和随机访问；字符设备没有。</text>
<text x="52" y="870" font-size="10.2" fill="#334155" xml:space="preserve">MMC 时序/总线宽度/电压影响稳定性。</text>
<text x="36" y="926" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py</text>
<text x="36" y="944" font-size="12.3" fill="#64748b" xml:space="preserve">颜色只做辅助，先看箭头与文字标签。</text>
</svg>
