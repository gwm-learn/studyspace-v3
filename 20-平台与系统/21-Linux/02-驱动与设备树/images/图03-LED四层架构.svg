<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="800" viewBox="0 0 1180 800" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1180" height="800" fill="#ffffff"/>
<line x1="36" y1="112" x2="1144" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 03 · LED 四层架构：驱动、核心、触发器、sysfs</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">驱动只实现亮度回调；核心建 sysfs；trigger 决定何时亮。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">硬件可能是 GPIO、PWM、I2C/SPI 控制器。</text>
<rect x="150" y="190" width="420" height="54" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="150" y="190" width="4.5" height="54" fill="#475569" rx="2"/>
<text x="163" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">硬件</text>
<text x="163" y="226" font-size="9.6" fill="#334155" xml:space="preserve">GPIO / PWM / I2C / SPI</text>
<rect x="150" y="276" width="510" height="54" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="150" y="276" width="4.5" height="54" fill="#4f46e5" rx="2"/>
<text x="163" y="295" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">硬件驱动</text>
<text x="163" y="312" font-size="9.6" fill="#334155" xml:space="preserve">brightness_set / blink_set</text>
<rect x="150" y="362" width="600" height="54" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="150" y="362" width="4.5" height="54" fill="#0f9d58" rx="2"/>
<text x="163" y="381" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">LED 核心</text>
<text x="163" y="398" font-size="9.6" fill="#334155" xml:space="preserve">led-class / led-core</text>
<rect x="150" y="448" width="690" height="54" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="150" y="448" width="4.5" height="54" fill="#d97706" rx="2"/>
<text x="163" y="467" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">触发器</text>
<text x="163" y="484" font-size="9.6" fill="#334155" xml:space="preserve">timer / heartbeat / netdev</text>
<rect x="150" y="534" width="780" height="54" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="150" y="534" width="4.5" height="54" fill="#0891b2" rx="2"/>
<text x="163" y="553" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">用户空间</text>
<text x="163" y="570" font-size="9.6" fill="#334155" xml:space="preserve">/sys/class/leds/&lt;name&gt;/</text>
<line x1="112" y1="215" x2="112" y2="556" stroke="#4f46e5" stroke-width="2.2" stroke-dasharray="3 3"/>
<polygon points="112,556 116.5,547 107.5,547" fill="#4f46e5"/>
<text x="56" y="379.5" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">自下而上</text>
<line x1="952" y1="556" x2="952" y2="215" stroke="#0f9d58" stroke-width="2.2" stroke-dasharray="3 3"/>
<polygon points="952,215 947.5,224 956.5,224" fill="#0f9d58"/>
<text x="962" y="379.5" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">调用</text>
<rect x="36" y="626" width="1100" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="656" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图提示</text>
<text x="52" y="680" font-size="10.2" fill="#334155" xml:space="preserve">原子回调用 brightness_set，可能睡眠用 _blocking。</text>
<text x="52" y="698" font-size="10.2" fill="#334155" xml:space="preserve">trigger 与硬件解耦，同一 LED 可切换事件源。</text>
<text x="36" y="746" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py</text>
<text x="36" y="764" font-size="12.3" fill="#64748b" xml:space="preserve">颜色只做辅助，先看箭头与文字标签。</text>
</svg>
