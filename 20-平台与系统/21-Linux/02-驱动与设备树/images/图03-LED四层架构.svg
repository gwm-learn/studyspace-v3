<text x="716" y="244" font-size="10.2" fill="#334155" xml:space="preserve">改「闪烁规律」动 trigger；改「用哪个引脚」动设备树；改「亮灭极性」动驱动。</text>
<text x="716" y="262" font-size="10.2" fill="#334155" xml:space="preserve">三者混在一起调，最容易出现「软件都对、灯就是不亮」。</text>
