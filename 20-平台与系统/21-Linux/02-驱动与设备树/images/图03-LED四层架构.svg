<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">从上到下：用户接口 → LED 核心（trigger）→ LED class 驱动 → 硬件（GPIO/PWM）。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">trigger 决定「什么时候亮」，底层驱动只负责「怎么亮」。</text>
