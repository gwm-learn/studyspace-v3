<text x="56" y="480" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="504" font-size="10.2" fill="#334155" xml:space="preserve">分离的好处：同一驱动可服务多个同类设备；新增设备只改设备树，不改驱动。</text>
<text x="56" y="522" font-size="10.2" fill="#334155" xml:space="preserve">probe 没被调用，先查 compatible/id 是否匹配，而不是先怀疑驱动代码。</text>
