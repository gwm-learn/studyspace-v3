<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 09 · 驱动分层与「设备/驱动分离」：匹配靠总线</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">左边是分层：应用 → 子系统 → 核心 → 具体驱动 → 总线 → 硬件。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">右边是关键机制：设备与驱动各自注册，由总线按 id/compatible 匹配。</text>
