<text x="490" y="270.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">框架</text>
<rect x="40" y="298" width="460" height="46" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.1"/>
<text x="52" y="324.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">核心：注册、匹配、电源管理</text>
<text x="490" y="324.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">总线核心</text>
<rect x="40" y="352" width="460" height="46" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.1"/>
