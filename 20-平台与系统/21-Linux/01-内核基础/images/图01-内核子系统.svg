<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">用户态通过系统调用进入内核，再由五个子系统分别处理。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">中断/异常也会进入内核，但不经过系统调用。</text>
