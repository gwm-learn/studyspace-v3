<text x="473" y="261.4" font-size="9.6" fill="#334155" xml:space="preserve">不能睡眠</text>
<rect x="700" y="120" width="190" height="70" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
