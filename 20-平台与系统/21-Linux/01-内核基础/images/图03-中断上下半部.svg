<rect x="36" y="430" width="1100" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="460" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图提示</text>
<text x="52" y="484" font-size="10.2" fill="#334155" xml:space="preserve">中断上下文不能拿 mutex、不能等 IO。</text>
<text x="52" y="502" font-size="10.2" fill="#334155" xml:space="preserve">中断风暴会占满 CPU，先看 /proc/interrupts。</text>
