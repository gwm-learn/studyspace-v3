<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1180" height="600" fill="#ffffff"/>
<line x1="36" y1="112" x2="1144" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 03 · 中断上下半部：上半部救火，下半部收尾</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">硬中断只做清中断、读状态、调度下半部；耗时工作交给 softirq 或 workqueue。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">分界线是能不能睡眠：软中断不能，workqueue 可以。</text>
