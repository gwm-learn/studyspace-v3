<text x="787" y="226" font-size="9.6" fill="#334155" xml:space="preserve">respawn 策略</text>
<text x="787" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">重启或放弃</text>
<rect x="36" y="310" width="760" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="340" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">关键点</text>
<text x="52" y="364" font-size="10.2" fill="#334155" xml:space="preserve">只有 USE_PROCD=1 且调用 procd_open_instance 的服务才由 procd 托管。</text>
<text x="52" y="382" font-size="10.2" fill="#334155" xml:space="preserve">respawn 阈值防止崩溃循环；看门狗需要服务主动喂狗。</text>
