<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · procd：init、服务与看门狗</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">procd 同时扮演 init 和服务管理器；每个服务由 init 脚本声明实例。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：左侧是启动链，右侧是服务实例的生命周期。</text>
