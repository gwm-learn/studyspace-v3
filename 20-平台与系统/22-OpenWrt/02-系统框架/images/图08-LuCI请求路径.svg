<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="600" viewBox="0 0 1220 600" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1220" height="600" fill="#ffffff"/>
<line x1="36" y1="112" x2="1184" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 08 · LuCI：一次页面请求与一次保存各走了哪些层</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">上半是打开页面：uhttpd → dispatcher → controller → model/view。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">下半是保存：校验 → 写 UCI → commit → 服务 reload。写配置不经过 ubus。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">请求/渲染</text>
<line x1="148.6" y1="142" x2="178.6" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="186.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">保存/生效</text>
<line x1="261.2" y1="142" x2="291.2" y2="142" stroke="#0891b2" stroke-width="3"/>
<text x="299.2" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">状态查询</text>
<text x="40" y="186" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① 打开页面</text>
<rect x="40" y="200" width="158" height="84" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="40" y="200" width="4.5" height="84" fill="#475569" rx="2"/>
<text x="53" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">浏览器</text>
<text x="53" y="236" font-size="9.6" fill="#334155" xml:space="preserve">HTTP 请求</text>
<line x1="198" y1="242" x2="218" y2="242" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="218,242 209,237.5 209,246.5" fill="#94a3b8"/>
<rect x="218" y="200" width="158" height="84" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="218" y="200" width="4.5" height="84" fill="#4f46e5" rx="2"/>
<text x="231" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">uhttpd</text>
<text x="231" y="236" font-size="9.6" fill="#334155" xml:space="preserve">/cgi-bin/luci</text>
<text x="231" y="251.4" font-size="9.6" fill="#334155" xml:space="preserve">只做 HTTP</text>
<line x1="376" y1="242" x2="396" y2="242" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="396,242 387,237.5 387,246.5" fill="#94a3b8"/>
<rect x="396" y="200" width="158" height="84" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="396" y="200" width="4.5" height="84" fill="#4f46e5" rx="2"/>
<text x="409" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">dispatcher</text>
<text x="409" y="236" font-size="9.6" fill="#334155" xml:space="preserve">解析 URL</text>
<text x="409" y="251.4" font-size="9.6" fill="#334155" xml:space="preserve">匹配菜单/ACL</text>
<line x1="554" y1="242" x2="574" y2="242" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="574,242 565,237.5 565,246.5" fill="#94a3b8"/>
<rect x="574" y="200" width="158" height="84" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="574" y="200" width="4.5" height="84" fill="#4f46e5" rx="2"/>
<text x="587" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">controller</text>
<text x="587" y="236" font-size="9.6" fill="#334155" xml:space="preserve">entry() 注册路由</text>
<text x="587" y="251.4" font-size="9.6" fill="#334155" xml:space="preserve">调 model/view</text>
<line x1="732" y1="242" x2="752" y2="242" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="752,242 743,237.5 743,246.5" fill="#94a3b8"/>
<rect x="752" y="200" width="158" height="84" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="752" y="200" width="4.5" height="84" fill="#0891b2" rx="2"/>
<text x="765" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">model / view</text>
<text x="765" y="236" font-size="9.6" fill="#334155" xml:space="preserve">取数据、渲染</text>
<text x="765" y="251.4" font-size="9.6" fill="#334155" xml:space="preserve">需要状态时查 ubus</text>
<text x="40" y="316" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② 保存配置</text>
<rect x="40" y="330" width="158" height="84" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="40" y="330" width="4.5" height="84" fill="#0f9d58" rx="2"/>
<text x="53" y="349" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">表单提交</text>
<text x="53" y="366" font-size="9.6" fill="#334155" xml:space="preserve">同一 controller 路径</text>
<line x1="198" y1="372" x2="218" y2="372" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="218,372 209,367.5 209,376.5" fill="#94a3b8"/>
<rect x="218" y="330" width="158" height="84" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="218" y="330" width="4.5" height="84" fill="#0f9d58" rx="2"/>
<text x="231" y="349" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">校验</text>
<text x="231" y="366" font-size="9.6" fill="#334155" xml:space="preserve">类型/依赖/范围</text>
<line x1="376" y1="372" x2="396" y2="372" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="396,372 387,367.5 387,376.5" fill="#94a3b8"/>
<rect x="396" y="330" width="158" height="84" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="396" y="330" width="4.5" height="84" fill="#0f9d58" rx="2"/>
<text x="409" y="349" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">写 UCI</text>
<text x="409" y="366" font-size="9.6" fill="#334155" xml:space="preserve">内存副本</text>
<line x1="554" y1="372" x2="574" y2="372" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="574,372 565,367.5 565,376.5" fill="#94a3b8"/>
<rect x="574" y="330" width="158" height="84" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="574" y="330" width="4.5" height="84" fill="#0f9d58" rx="2"/>
<text x="587" y="349" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">commit</text>
<text x="587" y="366" font-size="9.6" fill="#334155" xml:space="preserve">/etc/config/*</text>
<line x1="732" y1="372" x2="752" y2="372" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="752,372 743,367.5 743,376.5" fill="#94a3b8"/>
<rect x="752" y="330" width="158" height="84" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="752" y="330" width="4.5" height="84" fill="#0f9d58" rx="2"/>
<text x="765" y="349" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">服务 reload</text>
<text x="765" y="366" font-size="9.6" fill="#334155" xml:space="preserve">on_after_commit</text>
<text x="765" y="381.4" font-size="9.6" fill="#334155" xml:space="preserve">或显式调用</text>
<rect x="40" y="450" width="1130" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="480" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点（边界）</text>
<text x="56" y="504" font-size="10.2" fill="#334155" xml:space="preserve">· “保存成功”只代表写盘成功；第 5 步没做，现象就是“配置改了、系统没变”。</text>
<text x="56" y="522" font-size="10.2" fill="#334155" xml:space="preserve">· ubus/rpcd 只在“查状态、执行受控命令”时出现；它不负责写配置。</text>
<text x="36" y="564" font-size="12.3" fill="#64748b" xml:space="preserve">图源：OpenWrt 官方 LuCI 文档与源码结构；本仓库 03-UCI、02-ubus 的既有结论。</text>
</svg>
