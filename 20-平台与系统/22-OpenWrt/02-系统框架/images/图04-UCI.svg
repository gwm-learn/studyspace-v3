<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1040" height="500" fill="#ffffff"/>
<line x1="36" y1="112" x2="1004" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 04 · UCI：三层结构到生效链路</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">配置文件是文本，UCI 提供统一读写；commit 只落盘，reload 才生效。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：左侧是文件结构，右侧是从修改到服务重载的路径。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">结构</text>
<line x1="120" y1="142" x2="150" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">写入</text>
<line x1="204" y1="142" x2="234" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="242" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">生效</text>
<text x="36" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① 文件三层</text>
<rect x="36" y="190" width="420" height="30" fill="#f1f5f9" rx="6"/>
<text x="44" y="210" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="start">层级</text>
<text x="246" y="210" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">示例</text>
<text x="386" y="210" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">作用</text>
<rect x="36" y="220" width="420" height="30" fill="#ffffff"/>
<line x1="36" y1="220" x2="456" y2="220" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="240" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">config</text>
<text x="246" y="240" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">config interface &#x27;lan&#x27;</text>
<text x="386" y="240" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">一类配置实例</text>
<rect x="36" y="250" width="420" height="30" fill="#ffffff"/>
<line x1="36" y1="250" x2="456" y2="250" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="270" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">option</text>
<text x="246" y="270" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">option proto &#x27;static&#x27;</text>
<text x="386" y="270" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">单值键</text>
<rect x="36" y="280" width="420" height="30" fill="#ffffff"/>
<line x1="36" y1="280" x2="456" y2="280" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="300" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">list</text>
<text x="246" y="300" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">list dns &#x27;1.1.1.1&#x27;</text>
<text x="386" y="300" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">多值键</text>
<line x1="36" y1="310" x2="456" y2="310" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="500" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② 修改到生效</text>
<rect x="500" y="190" width="158" height="84" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="500" y="190" width="4.5" height="84" fill="#4f46e5" rx="2"/>
<text x="513" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">uci set</text>
<text x="513" y="226" font-size="8.8" fill="#334155" xml:space="preserve">改内存副本</text>
<line x1="658" y1="232" x2="670" y2="232" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="670,232 661,227.5 661,236.5" fill="#94a3b8"/>
<rect x="670" y="190" width="158" height="84" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="670" y="190" width="4.5" height="84" fill="#d97706" rx="2"/>
<text x="683" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">uci commit</text>
<text x="683" y="226" font-size="8.8" fill="#334155" xml:space="preserve">写 /etc/config</text>
<line x1="828" y1="232" x2="840" y2="232" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="840,232 831,227.5 831,236.5" fill="#94a3b8"/>
<rect x="840" y="190" width="158" height="84" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="840" y="190" width="4.5" height="84" fill="#0f9d58" rx="2"/>
<text x="853" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">reload</text>
<text x="853" y="226" font-size="8.8" fill="#334155" xml:space="preserve">服务重新读取</text>
<rect x="36" y="330" width="760" height="92" fill="#fff5f5" rx="10" stroke="#dc2626" stroke-width="1"/>
<text x="52" y="360" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">误判</text>
<text x="52" y="384" font-size="10.2" fill="#334155" xml:space="preserve">commit 成功不等于服务已使用新配置；网络类配置通常还要 reload/restart。</text>
<text x="52" y="402" font-size="10.2" fill="#334155" xml:space="preserve">直接编辑文件后，运行中的服务不会自动感知。</text>
<text x="36" y="446" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="464" font-size="12.3" fill="#64748b" xml:space="preserve">OpenWrt 系统框架 · 结构示意，细节以对应版本源码为准</text>
</svg>
