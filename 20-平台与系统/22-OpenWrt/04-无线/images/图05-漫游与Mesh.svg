<svg xmlns="http://www.w3.org/2000/svg" width="840" height="640" viewBox="0 0 840 640" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="840" height="640" fill="#ffffff"/>
<line x1="36" y1="112" x2="804" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 05 · 漫游与 Mesh：终端决定切换，网络只提供信息</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">802.11k 提供邻居信息，11v 提供引导，11r 缩短认证；EasyMesh 管多 AP。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：先看终端与两个 AP 的连接，再看三种辅助协议的分工。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">终端</text>
<line x1="120" y1="142" x2="150" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">AP</text>
<line x1="195.2" y1="142" x2="225.2" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="233.2" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">控制</text>
<text x="36" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① 漫游三角</text>
<rect x="36" y="190" width="220" height="90" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="36" y="190" width="4.5" height="90" fill="#d97706" rx="2"/>
<text x="49" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">终端 STA</text>
<text x="49" y="226" font-size="9.6" fill="#334155" xml:space="preserve">测量/决策</text>
<text x="49" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">发起重关联</text>
<rect x="300" y="190" width="220" height="90" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="300" y="190" width="4.5" height="90" fill="#4f46e5" rx="2"/>
<text x="313" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">AP1</text>
<text x="313" y="226" font-size="9.6" fill="#334155" xml:space="preserve">当前 BSS</text>
<rect x="564" y="190" width="220" height="90" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="564" y="190" width="4.5" height="90" fill="#4f46e5" rx="2"/>
<text x="577" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">AP2</text>
<text x="577" y="226" font-size="9.6" fill="#334155" xml:space="preserve">目标 BSS</text>
<line x1="256" y1="220" x2="300" y2="220" stroke="#94a3b8" stroke-width="1.6"/>
<polygon points="300,220 291,215.5 291,224.5" fill="#94a3b8"/>
<line x1="520" y1="250" x2="564" y2="250" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="3 3"/>
<polygon points="564,250 555,245.5 555,254.5" fill="#94a3b8"/>
<text x="36" y="310" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② 三种辅助</text>
<rect x="36" y="324" width="760" height="30" fill="#f1f5f9" rx="6"/>
<text x="44" y="344" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="start">协议</text>
<text x="416" y="344" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">作用</text>
<text x="669.33" y="344" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">不是</text>
<rect x="36" y="354" width="760" height="30" fill="#ffffff"/>
<line x1="36" y1="354" x2="796" y2="354" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="374" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">802.11k</text>
<text x="416" y="374" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">邻居报告/无线测量</text>
<text x="669.33" y="374" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">不触发切换</text>
<rect x="36" y="384" width="760" height="30" fill="#ffffff"/>
<line x1="36" y1="384" x2="796" y2="384" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="404" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">802.11v</text>
<text x="416" y="404" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">BSS 过渡管理/引导</text>
<text x="669.33" y="404" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">不保证终端听从</text>
<rect x="36" y="414" width="760" height="30" fill="#ffffff"/>
<line x1="36" y1="414" x2="796" y2="414" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="434" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">802.11r</text>
<text x="416" y="434" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">快速 BSS 过渡（FT）</text>
<text x="669.33" y="434" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">不负责选目标</text>
<rect x="36" y="444" width="760" height="30" fill="#ffffff"/>
<line x1="36" y1="444" x2="796" y2="444" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="464" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">EasyMesh</text>
<text x="416" y="464" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">多 AP 控制/管理</text>
<text x="669.33" y="464" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">不等于 802.11 漫游协议</text>
<line x1="36" y1="474" x2="796" y2="474" stroke="#e2e8f0" stroke-width="0.8"/>
<rect x="36" y="470" width="760" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="500" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">边界</text>
<text x="52" y="524" font-size="10.2" fill="#334155" xml:space="preserve">漫游决策在终端；网络侧只能提供信息、引导和更快的认证。</text>
<text x="52" y="542" font-size="10.2" fill="#334155" xml:space="preserve">Mesh 是回程/组网形态，和“终端在 AP 间切换”不是同一件事。</text>
<text x="36" y="586" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="604" font-size="12.3" fill="#64748b" xml:space="preserve">OpenWrt 无线 · 结构示意，细节以对应版本源码为准</text>
</svg>
