<text x="217" y="343" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">hostapd</text>
<text x="217" y="360" font-size="8.8" fill="#334155" xml:space="preserve">AP 认证/关联</text>
<line x1="362" y1="366" x2="372" y2="366" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="372,366 363,361.5 363,370.5" fill="#94a3b8"/>
<rect x="372" y="324" width="158" height="84" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
