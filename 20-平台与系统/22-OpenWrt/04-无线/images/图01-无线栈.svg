<rect x="372" y="190" width="4.5" height="88" fill="#4f46e5" rx="2"/>
<text x="385" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">mac80211</text>
<text x="385" y="226" font-size="8.8" fill="#334155" xml:space="preserve">MLME/聚合/队列</text>
<line x1="530" y1="234" x2="540" y2="234" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="540,234 531,229.5 531,238.5" fill="#94a3b8"/>
