<text x="385" y="343" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">wpa_supplicant</text>
<text x="385" y="360" font-size="8.8" fill="#334155" xml:space="preserve">STA 连接</text>
<line x1="530" y1="366" x2="540" y2="366" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="540,366 531,361.5 531,370.5" fill="#94a3b8"/>
<rect x="540" y="324" width="158" height="84" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="540" y="324" width="4.5" height="84" fill="#d97706" rx="2"/>
<text x="553" y="343" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">OpenWrt UCI</text>
<text x="553" y="360" font-size="8.8" fill="#334155" xml:space="preserve">wifi 脚本生成配置</text>
<rect x="36" y="430" width="760" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="460" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">边界</text>
<text x="52" y="484" font-size="10.2" fill="#334155" xml:space="preserve">FullMAC 驱动可能跳过 mac80211，直接对接 cfg80211；功能支持以驱动为准。</text>
<text x="52" y="502" font-size="10.2" fill="#334155" xml:space="preserve">UCI 不是实时协议，最终仍由 hostapd/wpa_supplicant 通过 nl80211 下发。</text>
<text x="36" y="546" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="564" font-size="12.3" fill="#64748b" xml:space="preserve">OpenWrt 无线 · 结构示意，细节以对应版本源码为准</text>
</svg>
