<text x="553" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">cfg80211</text>
<text x="553" y="226" font-size="8.8" fill="#334155" xml:space="preserve">配置 API/监管域</text>
<text x="36" y="310" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② 用户态</text>
