<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">用户态</text>
<line x1="215" y1="142" x2="245" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="253" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">配置</text>
<text x="36" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① 内核与驱动</text>
