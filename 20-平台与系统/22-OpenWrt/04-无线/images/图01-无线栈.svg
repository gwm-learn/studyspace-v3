<svg xmlns="http://www.w3.org/2000/svg" width="840" height="600" viewBox="0 0 840 600" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="840" height="600" fill="#ffffff"/>
<line x1="36" y1="112" x2="804" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · Linux 无线栈：从驱动到 hostapd</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">内核分 cfg80211/mac80211 两层，用户态通过 nl80211 配置；OpenWrt 再用 UCI 包一层。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：自下而上看数据路径，自上而下看配置路径。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">内核</text>
