<text x="823" y="356" font-size="9.6" fill="#334155" xml:space="preserve">自建路径</text>
<rect x="1000" y="320" width="130" height="62" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="1000" y="320" width="4.5" height="62" fill="#d97706" rx="2"/>
<text x="1013" y="339" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">MP3</text>
<text x="1013" y="356" font-size="9.6" fill="#334155" xml:space="preserve">自建路径</text>
<line x1="905" y1="262" x2="880" y2="320" stroke="#d97706" stroke-width="1.6" stroke-dasharray="3 3"/>
<polygon points="880,320 887.69,313.52 879.43,309.95" fill="#d97706"/>
<line x1="955" y1="262" x2="1055" y2="320" stroke="#d97706" stroke-width="1.6" stroke-dasharray="3 3"/>
<polygon points="1055,320 1049.47,311.59 1044.96,319.38" fill="#d97706"/>
<line x1="940" y1="351" x2="1000" y2="351" stroke="#d97706" stroke-width="1.6" stroke-dasharray="3 3"/>
<polygon points="1000,351 991,346.5 991,355.5" fill="#d97706"/>
<text x="820" y="420" font-size="9.6" fill="#64748b" xml:space="preserve">HWMP 自己选路，不经过 Controller，</text>
<text x="820" y="440" font-size="9.6" fill="#64748b" xml:space="preserve">与 EasyMesh 回程是两套机制。</text>
<text x="36" y="526" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py 生成</text>
