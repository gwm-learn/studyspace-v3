<text x="873" y="236" font-size="9.6" fill="#334155" xml:space="preserve">Mesh 节点</text>
<rect x="810" y="320" width="130" height="62" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="810" y="320" width="4.5" height="62" fill="#d97706" rx="2"/>
