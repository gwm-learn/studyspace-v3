<text x="833" y="226" font-size="8.8" fill="#334155" xml:space="preserve">nl80211</text>
<text x="833" y="241.4" font-size="8.8" fill="#334155" xml:space="preserve">启动 BSS</text>
<rect x="36" y="410" width="760" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="440" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">边界</text>
<text x="52" y="464" font-size="10.2" fill="#334155" xml:space="preserve">不要直接改 /var/run 下的生成配置，reload 会被覆盖。</text>
<text x="52" y="482" font-size="10.2" fill="#334155" xml:space="preserve">多个 wifi-iface 可以共享同一 radio，但信道/带宽由 radio 决定。</text>
