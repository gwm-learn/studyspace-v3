<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">UCI 描述射频与接口，wifi 脚本生成 hostapd 配置并启动进程。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：左侧是配置对象，中间是生成脚本，右侧是运行进程。</text>
