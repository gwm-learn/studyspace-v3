<text x="681" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">生成补丁</text>
<text x="681" y="226" font-size="8.8" fill="#334155" xml:space="preserve">quilt/git</text>
<line x1="826" y1="233" x2="836" y2="233" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="836,233 827,228.5 827,237.5" fill="#94a3b8"/>
