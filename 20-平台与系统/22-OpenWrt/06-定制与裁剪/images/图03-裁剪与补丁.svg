<text x="849" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">编译验证</text>
<text x="849" y="226" font-size="8.8" fill="#334155" xml:space="preserve">clean build</text>
<line x1="994" y1="233" x2="1004" y2="233" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="1004,233 995,228.5 995,237.5" fill="#94a3b8"/>
<rect x="1004" y="190" width="158" height="86" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="1004" y="190" width="4.5" height="86" fill="#4f46e5" rx="2"/>
<text x="1017" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">升级复基</text>
<text x="1017" y="226" font-size="8.8" fill="#334155" xml:space="preserve">rebase/refresh</text>
<rect x="36" y="360" width="760" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="390" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">边界</text>
<text x="52" y="414" font-size="10.2" fill="#334155" xml:space="preserve">补丁越多，升级合并成本越高；能放产品包就不改上游。</text>
<text x="52" y="432" font-size="10.2" fill="#334155" xml:space="preserve">裁剪后必须回归启动、网络、升级三条链路。</text>
<text x="36" y="486" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
