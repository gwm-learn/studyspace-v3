<text x="246" y="240" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">rootfs 变小</text>
<text x="386" y="240" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">功能缺失</text>
<rect x="36" y="250" width="420" height="30" fill="#ffffff"/>
<line x1="36" y1="250" x2="456" y2="250" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="270" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">去调试/语言</text>
<text x="246" y="270" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">显著变小</text>
<text x="386" y="270" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">排障困难</text>
<rect x="36" y="280" width="420" height="30" fill="#ffffff"/>
<line x1="36" y1="280" x2="456" y2="280" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="300" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">压缩/块大小</text>
<text x="246" y="300" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">镜像变小</text>
<text x="386" y="300" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">启动/性能</text>
<rect x="36" y="310" width="420" height="30" fill="#ffffff"/>
<line x1="36" y1="310" x2="456" y2="310" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="330" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">kernel 裁剪</text>
<text x="246" y="330" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">内核变小</text>
<text x="386" y="330" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">驱动缺失</text>
<line x1="36" y1="340" x2="456" y2="340" stroke="#e2e8f0" stroke-width="0.8"/>
