<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 03 · 裁剪与补丁：先做预算，再动刀</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">裁剪不是“删文件”，而是从包选择和镜像格式入手；补丁要能随版本维护。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：左侧是裁剪手段，右侧是补丁生命周期。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
