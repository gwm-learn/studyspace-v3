<text x="246" y="210" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">影响</text>
<text x="386" y="210" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">风险</text>
