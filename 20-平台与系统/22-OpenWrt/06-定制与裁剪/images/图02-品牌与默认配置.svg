<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">默认配置有两条路：构建时放进 rootfs，或首次启动用 uci-defaults 生成。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：先看文件来源，再看首次启动脚本与清理。</text>
