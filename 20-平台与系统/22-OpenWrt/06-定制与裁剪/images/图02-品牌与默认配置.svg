<text x="52" y="478" font-size="10.2" fill="#334155" xml:space="preserve">uci-defaults 只在首次启动/清 overlay 后执行；升级保留配置时不会重跑。</text>
<text x="52" y="496" font-size="10.2" fill="#334155" xml:space="preserve">直接改 /etc/config 的默认文件，可能被包升级或 overlay 覆盖。</text>
<text x="36" y="546" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="564" font-size="12.3" fill="#64748b" xml:space="preserve">OpenWrt 定制与裁剪 · 结构示意，具体路径以目标分支为准</text>
