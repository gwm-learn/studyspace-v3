<svg xmlns="http://www.w3.org/2000/svg" width="840" height="640" viewBox="0 0 840 640" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="840" height="640" fill="#ffffff"/>
<line x1="36" y1="112" x2="804" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 04 · failsafe：在 preinit 阶段截住系统</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">failsafe 不重刷固件，只跳过正常启动并暴露一个最小管理入口。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：先看触发时机，再看可用的恢复动作。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#475569" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">启动</text>
<line x1="120" y1="142" x2="150" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">救援</text>
<line x1="204" y1="142" x2="234" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="242" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">恢复</text>
<text x="36" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① 启动分叉</text>
<rect x="36" y="190" width="158" height="88" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="36" y="190" width="4.5" height="88" fill="#475569" rx="2"/>
<text x="49" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">bootloader</text>
<text x="49" y="226" font-size="8.8" fill="#334155" xml:space="preserve">加载内核</text>
<line x1="194" y1="234" x2="206" y2="234" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="206,234 197,229.5 197,238.5" fill="#94a3b8"/>
<rect x="206" y="190" width="158" height="88" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="206" y="190" width="4.5" height="88" fill="#d97706" rx="2"/>
<text x="219" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">preinit</text>
<text x="219" y="226" font-size="8.8" fill="#334155" xml:space="preserve">检测 failsafe</text>
<text x="219" y="241.4" font-size="8.8" fill="#334155" xml:space="preserve">按键/标志</text>
<line x1="364" y1="234" x2="376" y2="234" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="376,234 367,229.5 367,238.5" fill="#94a3b8"/>
<rect x="376" y="190" width="158" height="88" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="376" y="190" width="4.5" height="88" fill="#0f9d58" rx="2"/>
<text x="389" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">正常 init</text>
<text x="389" y="226" font-size="8.8" fill="#334155" xml:space="preserve">挂 overlay</text>
<text x="389" y="241.4" font-size="8.8" fill="#334155" xml:space="preserve">启动服务</text>
<line x1="534" y1="234" x2="546" y2="234" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="546,234 537,229.5 537,238.5" fill="#94a3b8"/>
<rect x="546" y="190" width="158" height="88" fill="#fff5f5" rx="8" stroke="#dc2626" stroke-width="1.1"/>
<rect x="546" y="190" width="4.5" height="88" fill="#dc2626" rx="2"/>
<text x="559" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">failsafe</text>
<text x="559" y="226" font-size="8.8" fill="#334155" xml:space="preserve">最小网络</text>
<text x="559" y="241.4" font-size="8.8" fill="#334155" xml:space="preserve">管理入口</text>
<text x="36" y="310" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② 恢复动作</text>
<rect x="36" y="324" width="760" height="30" fill="#f1f5f9" rx="6"/>
<text x="44" y="344" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="start">动作</text>
<text x="416" y="344" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">影响</text>
<text x="669.33" y="344" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">适用</text>
<rect x="36" y="354" width="760" height="30" fill="#ffffff"/>
<line x1="36" y1="354" x2="796" y2="354" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="374" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">firstboot</text>
<text x="416" y="374" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">清空 overlay</text>
<text x="669.33" y="374" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">配置错/忘记密码</text>
<rect x="36" y="384" width="760" height="30" fill="#ffffff"/>
<line x1="36" y1="384" x2="796" y2="384" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="404" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">挂载 overlay 修复</text>
<text x="416" y="404" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">保留数据</text>
<text x="669.33" y="404" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">配置可救</text>
<rect x="36" y="414" width="760" height="30" fill="#ffffff"/>
<line x1="36" y1="414" x2="796" y2="414" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="434" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">重新刷写</text>
<text x="416" y="434" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">替换系统</text>
<text x="669.33" y="434" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">系统损坏</text>
<line x1="36" y1="444" x2="796" y2="444" stroke="#e2e8f0" stroke-width="0.8"/>
<rect x="36" y="460" width="760" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="490" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">边界</text>
<text x="52" y="514" font-size="10.2" fill="#334155" xml:space="preserve">failsafe 的地址/入口因版本和板型不同，常见是固定 LAN 地址。</text>
<text x="52" y="532" font-size="10.2" fill="#334155" xml:space="preserve">bootloader 损坏时 failsafe 也进不去，需要串口/烧录器。</text>
<text x="36" y="586" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="604" font-size="12.3" fill="#64748b" xml:space="preserve">OpenWrt 升级与恢复 · 结构示意，分区名以目标板为准</text>
</svg>
