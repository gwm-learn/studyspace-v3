<text x="52" y="388" font-size="10.2" fill="#334155" xml:space="preserve">校验不通过应中止；-F 强制刷入可能把不兼容镜像写进设备。</text>
<text x="52" y="406" font-size="10.2" fill="#334155" xml:space="preserve">写入阶段掉电/断电最危险；带后备电池或双分区可降低风险。</text>
