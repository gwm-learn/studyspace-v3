<text x="52" y="484" font-size="10.2" fill="#334155" xml:space="preserve">通用 OpenWrt sysupgrade 默认不是 A/B；双分区通常由厂商/平台脚本实现。</text>
<text x="52" y="502" font-size="10.2" fill="#334155" xml:space="preserve">overlay 跨分区共享时，配置兼容性要单独验证。</text>
