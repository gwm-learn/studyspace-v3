<line x1="812" y1="412" x2="812" y2="493" stroke="#4f46e5" stroke-width="1.6"/>
<text x="824" y="370" font-size="10.4" fill="#4f46e5" xml:space="preserve" font-weight="700">A 槽</text>
<text x="824" y="458" font-size="10.4" fill="#4f46e5" xml:space="preserve" font-weight="700">B 槽</text>
<rect x="880" y="192" width="300" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="896" y="222" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">env 里至少要存三样</text>
<text x="896" y="246" font-size="10.2" fill="#334155" xml:space="preserve">① 当前槽位指向谁</text>
<text x="896" y="264" font-size="10.2" fill="#334155" xml:space="preserve">② bootcount 与 bootlimit</text>
<text x="896" y="282" font-size="10.2" fill="#334155" xml:space="preserve">③ pending / confirmed 标志</text>
<rect x="880" y="336" width="300" height="110" fill="#fff5f5" rx="10" stroke="#dc2626" stroke-width="1"/>
<text x="896" y="366" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">改 env 前</text>
<text x="896" y="390" font-size="10.2" fill="#334155" xml:space="preserve">先 fw_printenv &gt; /tmp/env.bak</text>
<text x="896" y="408" font-size="10.2" fill="#334155" xml:space="preserve">单份 env 写坏 = 无法启动</text>
<text x="896" y="426" font-size="10.2" fill="#334155" xml:space="preserve">双份 env 不是所有板子都有</text>
<rect x="60" y="570" width="1120" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="76" y="600" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="76" y="624" font-size="10.2" fill="#334155" xml:space="preserve">容量账：翻倍的是镜像区（kernel + rootfs），配置层只有一份——按「镜像 ×2 + 配置 ×1」估算。</text>
<text x="76" y="642" font-size="10.2" fill="#334155" xml:space="preserve">新式布局把 kernel + DTB + rootfs 合成一个 FIT 分区：分区数变少，但「两套 + 一个指针」的逻辑不变。</text>
