<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">左：单槽，系统区只有一份。右：A/B，kernel 与 rootfs 各两份，配置层仍然只有一份。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">真正决定从哪启动的是 u-boot-env 里的变量，不是分区名字。</text>
