<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="840" height="520" fill="#ffffff"/>
<line x1="36" y1="112" x2="804" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · 升级与恢复：三条路径，三种代价</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">sysupgrade 保留配置换系统；factory 重刷完整镜像；failsafe 只救配置层。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：先看是否保留配置，再看是否动 bootloader/分区。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">保留配置</text>
<line x1="142" y1="142" x2="172" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="180" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">重刷</text>
<line x1="226" y1="142" x2="256" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="264" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">救援</text>
<text x="36" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① 路径对比</text>
<rect x="36" y="190" width="760" height="30" fill="#f1f5f9" rx="6"/>
<text x="44" y="210" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="start">路径</text>
<text x="321" y="210" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">动什么</text>
<text x="511" y="210" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">保留配置</text>
<text x="701" y="210" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">典型场景</text>
<rect x="36" y="220" width="760" height="30" fill="#ffffff"/>
<line x1="36" y1="220" x2="796" y2="220" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="240" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">sysupgrade</text>
<text x="321" y="240" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">kernel+rootfs</text>
<text x="511" y="240" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">是</text>
<text x="701" y="240" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">版本升级</text>
<rect x="36" y="250" width="760" height="30" fill="#ffffff"/>
<line x1="36" y1="250" x2="796" y2="250" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="270" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">factory 烧录</text>
<text x="321" y="270" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">完整分区</text>
<text x="511" y="270" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">否</text>
<text x="701" y="270" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">首烧/变砖恢复</text>
<rect x="36" y="280" width="760" height="30" fill="#ffffff"/>
<line x1="36" y1="280" x2="796" y2="280" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="300" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">failsafe</text>
<text x="321" y="300" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">仅 overlay</text>
<text x="511" y="300" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">否</text>
<text x="701" y="300" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">配置错/忘记密码</text>
<rect x="36" y="310" width="760" height="30" fill="#ffffff"/>
<line x1="36" y1="310" x2="796" y2="310" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="330" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">A/B 回滚</text>
<text x="321" y="330" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">切换启动分区</text>
<text x="511" y="330" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">是</text>
<text x="701" y="330" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">高可靠产品</text>
<line x1="36" y1="340" x2="796" y2="340" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="36" y="340" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② 决策顺序</text>
<rect x="36" y="354" width="158" height="84" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="36" y="354" width="4.5" height="84" fill="#475569" rx="2"/>
<text x="49" y="373" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">能进系统？</text>
<text x="49" y="390" font-size="8.8" fill="#334155" xml:space="preserve">SSH/Web</text>
<line x1="194" y1="396" x2="208" y2="396" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="208,396 199,391.5 199,400.5" fill="#94a3b8"/>
<rect x="208" y="354" width="158" height="84" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="208" y="354" width="4.5" height="84" fill="#0f9d58" rx="2"/>
<text x="221" y="373" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">配置要保留？</text>
<text x="221" y="390" font-size="8.8" fill="#334155" xml:space="preserve">sysupgrade</text>
<line x1="366" y1="396" x2="380" y2="396" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="380,396 371,391.5 371,400.5" fill="#94a3b8"/>
<rect x="380" y="354" width="158" height="84" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="380" y="354" width="4.5" height="84" fill="#d97706" rx="2"/>
<text x="393" y="373" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">系统损坏？</text>
<text x="393" y="390" font-size="8.8" fill="#334155" xml:space="preserve">factory/failsafe</text>
<line x1="538" y1="396" x2="552" y2="396" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="552,396 543,391.5 543,400.5" fill="#94a3b8"/>
<rect x="552" y="354" width="158" height="84" fill="#fff5f5" rx="8" stroke="#dc2626" stroke-width="1.1"/>
<rect x="552" y="354" width="4.5" height="84" fill="#dc2626" rx="2"/>
<text x="565" y="373" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">能回滚？</text>
<text x="565" y="390" font-size="8.8" fill="#334155" xml:space="preserve">A/B/双分区</text>
<text x="36" y="466" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="484" font-size="12.3" fill="#64748b" xml:space="preserve">OpenWrt 升级与恢复 · 结构示意，分区名以目标板为准</text>
