<text x="52" y="484" font-size="10.2" fill="#334155" xml:space="preserve">少量差异、可联网：opkg；出厂一致性、弱网：ImageBuilder 或 SDK。</text>
<text x="52" y="502" font-size="10.2" fill="#334155" xml:space="preserve">SDK 用于编译单个包，ImageBuilder 不编译，只拼装。</text>
