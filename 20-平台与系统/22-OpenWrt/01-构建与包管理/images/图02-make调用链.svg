<rect x="36" y="320" width="760" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="350" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">两段式设计</text>
<text x="52" y="374" font-size="10.2" fill="#334155" xml:space="preserve">第一次 make 生成 .config 与临时规则；再次 make 才进入实际编译。</text>
<text x="52" y="392" font-size="10.2" fill="#334155" xml:space="preserve">package/feeds/ 是 feeds install 后建立的符号链接，不是源码副本。</text>
<text x="36" y="446" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="464" font-size="12.3" fill="#64748b" xml:space="preserve">OpenWrt 构建与包管理 · 结构示意，细节以对应版本源码为准</text>
</svg>
