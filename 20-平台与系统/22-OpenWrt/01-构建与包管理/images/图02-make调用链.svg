<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · make 调用链：从顶层到单个包</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">顶层 make 只做分派；真正的规则分散在 include/、target/、package/。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：实线是主调用，虚线是按需进入的子流程。</text>
