<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="840" height="560" fill="#ffffff"/>
<line x1="36" y1="112" x2="804" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 03 · 配置三级：Target / Subtarget / Device</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">三级选择逐层收窄，最终决定可选的包、内核参数与镜像格式。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：先看左侧层级，再看右侧被它约束的对象。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">平台</text>
<line x1="120" y1="142" x2="150" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">设备</text>
<line x1="204" y1="142" x2="234" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="242" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">约束</text>
<text x="36" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① 选择层级</text>
<rect x="36" y="190" width="158" height="86" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="36" y="190" width="4.5" height="86" fill="#4f46e5" rx="2"/>
<text x="49" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">Target</text>
<text x="49" y="226" font-size="9.6" fill="#334155" xml:space="preserve">CPU 架构</text>
<text x="49" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">如 mediatek</text>
<line x1="194" y1="233" x2="216" y2="233" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="216,233 207,228.5 207,237.5" fill="#94a3b8"/>
<rect x="216" y="190" width="158" height="86" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="216" y="190" width="4.5" height="86" fill="#4f46e5" rx="2"/>
<text x="229" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">Subtarget</text>
<text x="229" y="226" font-size="9.6" fill="#334155" xml:space="preserve">SoC/启动介质</text>
<text x="229" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">如 filogic</text>
<line x1="374" y1="233" x2="396" y2="233" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="396,233 387,228.5 387,237.5" fill="#94a3b8"/>
<rect x="396" y="190" width="158" height="86" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="396" y="190" width="4.5" height="86" fill="#0f9d58" rx="2"/>
<text x="409" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">Device</text>
<text x="409" y="226" font-size="9.6" fill="#334155" xml:space="preserve">具体板型</text>
<text x="409" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">DTS/分区</text>
<text x="36" y="318" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② 每级决定什么</text>
<rect x="36" y="332" width="760" height="30" fill="#f1f5f9" rx="6"/>
<text x="44" y="352" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="start">层级</text>
<text x="416" y="352" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">决定</text>
<text x="669.33" y="352" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">典型配置</text>
<rect x="36" y="362" width="760" height="30" fill="#ffffff"/>
<line x1="36" y1="362" x2="796" y2="362" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="382" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">Target</text>
<text x="416" y="382" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">架构与工具链</text>
<text x="669.33" y="382" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">CONFIG_TARGET_mediatek</text>
<rect x="36" y="392" width="760" height="30" fill="#ffffff"/>
<line x1="36" y1="392" x2="796" y2="392" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="412" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">Subtarget</text>
<text x="416" y="412" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">SoC 与内核</text>
<text x="669.33" y="412" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">CONFIG_TARGET_filogic</text>
<rect x="36" y="422" width="760" height="30" fill="#ffffff"/>
<line x1="36" y1="422" x2="796" y2="422" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="442" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">Device</text>
<text x="416" y="442" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">DTS/镜像/分区</text>
<text x="669.33" y="442" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">CONFIG_TARGET_DEVICE_*</text>
<rect x="36" y="452" width="760" height="30" fill="#ffffff"/>
<line x1="36" y1="452" x2="796" y2="452" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="472" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">Package</text>
<text x="416" y="472" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">进不进 rootfs</text>
<text x="669.33" y="472" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">CONFIG_PACKAGE_*</text>
<line x1="36" y1="482" x2="796" y2="482" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="36" y="506" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="524" font-size="12.3" fill="#64748b" xml:space="preserve">OpenWrt 构建与包管理 · 结构示意，细节以对应版本源码为准</text>
</svg>
