<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 05 · 镜像生成：内核、rootfs 与设备定义汇合</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">镜像不是“编译完自然有”，而是由 Device/Profile 规则显式拼装。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：三条输入汇入镜像配方，再按启动介质产出不同文件。</text>
