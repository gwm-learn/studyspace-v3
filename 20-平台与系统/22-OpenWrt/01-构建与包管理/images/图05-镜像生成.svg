<text x="657" y="385.4" font-size="9.6" fill="#334155" xml:space="preserve">factory.ubi / .bin</text>
<rect x="36" y="430" width="760" height="74" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="460" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">为什么容易错</text>
<text x="52" y="484" font-size="10.2" fill="#334155" xml:space="preserve">设备定义决定分区与镜像名；换板型却沿用旧镜像，通常在这里出问题。</text>
