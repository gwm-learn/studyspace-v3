<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 04 · NAT 与 offload：首包走栈，后续包走快路径</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">conntrack 记录五元组映射；offload 让已建立连接绕过部分钩子。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：上半是首包，下半是命中 offload 后的后续包。</text>
