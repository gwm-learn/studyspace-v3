<text x="393" y="356" font-size="8.8" fill="#334155" xml:space="preserve">跳过部分钩子</text>
<rect x="36" y="430" width="760" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="460" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">边界</text>
<text x="52" y="484" font-size="10.2" fill="#334155" xml:space="preserve">offload 命中后，mangle/防火墙计数可能不再增长，容易误判为规则失效。</text>
<text x="52" y="502" font-size="10.2" fill="#334155" xml:space="preserve">硬件 offload 依赖驱动与芯片，不是所有平台都支持。</text>
