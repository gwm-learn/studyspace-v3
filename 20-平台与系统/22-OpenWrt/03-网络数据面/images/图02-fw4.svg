<text x="853" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">nftables</text>
<text x="853" y="226" font-size="8.8" fill="#334155" xml:space="preserve">table inet fw4</text>
<text x="853" y="241.4" font-size="8.8" fill="#334155" xml:space="preserve">chain/rule</text>
<rect x="36" y="410" width="760" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="440" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">边界</text>
<text x="52" y="464" font-size="10.2" fill="#334155" xml:space="preserve">自定义规则优先放 /etc/nftables.d/，不要直接改生成文件。</text>
<text x="52" y="482" font-size="10.2" fill="#334155" xml:space="preserve">fw3 与 fw4 的规则语法不同，迁移时不能只换包名。</text>
<text x="36" y="526" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
