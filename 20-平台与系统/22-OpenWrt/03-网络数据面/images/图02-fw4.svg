<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · fw4：UCI 配置编译成 nftables 规则</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">fw4 不是守护进程，而是“配置到规则集”的编译器；reload 时重建表。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：左侧是 UCI 语义，中间是 fw4，右侧是内核里的 nft 表/链。</text>
