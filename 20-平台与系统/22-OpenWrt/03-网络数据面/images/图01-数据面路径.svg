<text x="721" y="226" font-size="8.8" fill="#334155" xml:space="preserve">zone 策略</text>
<text x="721" y="241.4" font-size="8.8" fill="#334155" xml:space="preserve">放行/丢弃</text>
<text x="36" y="310" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② 出向与队列</text>
