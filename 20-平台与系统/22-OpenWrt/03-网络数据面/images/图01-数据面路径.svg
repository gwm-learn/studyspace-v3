<text x="385" y="241.4" font-size="8.8" fill="#334155" xml:space="preserve">conntrack</text>
<line x1="530" y1="234" x2="540" y2="234" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="540,234 531,229.5 531,238.5" fill="#94a3b8"/>
