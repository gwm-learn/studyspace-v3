<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="920" height="600" fill="#ffffff"/>
<line x1="36" y1="112" x2="884" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · 数据面总览：一个包从 WAN 到 LAN</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">接入、路由/NAT、转发、队列四段；每段由不同组件配置，但共用内核路径。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：先看上行链路，再看包在防火墙与转发之间的分叉。</text>
