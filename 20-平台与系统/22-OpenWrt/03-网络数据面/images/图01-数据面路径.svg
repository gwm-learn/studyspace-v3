<text x="393" y="343" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">LAN 口</text>
<text x="393" y="360" font-size="8.8" fill="#334155" xml:space="preserve">bridge/VLAN</text>
<text x="393" y="375.4" font-size="8.8" fill="#334155" xml:space="preserve">交换机</text>
<rect x="36" y="430" width="760" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="460" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">边界</text>
<text x="52" y="484" font-size="10.2" fill="#334155" xml:space="preserve">硬件 offload 会让部分包绕过内核钩子；调试时先确认 offload 状态。</text>
<text x="52" y="502" font-size="10.2" fill="#334155" xml:space="preserve">桥转发的帧走二层路径，不经过三层的 FORWARD 链。</text>
<text x="36" y="546" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="564" font-size="12.3" fill="#64748b" xml:space="preserve">OpenWrt 网络数据面 · 结构示意，细节以对应版本源码为准</text>
