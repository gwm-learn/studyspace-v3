<text x="56" y="994" font-size="10.2" fill="#334155" xml:space="preserve">· 判据是“一句话能回答”的：能不能登录、有没有地址、能不能解析。答不上来说明还缺证据。</text>
<text x="56" y="1012" font-size="10.2" fill="#334155" xml:space="preserve">· 同一现象可能跨越两层（如 DNS 失败既有服务层也有上游网络），先取最靠近现象的那层证据。</text>
<text x="36" y="1064" font-size="12.3" fill="#64748b" xml:space="preserve">图源：本仓库各篇“异常分支/判据”的汇总；OpenWrt 官方调试文档。</text>
