<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1100" viewBox="0 0 1280 1100" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1280" height="1100" fill="#ffffff"/>
<line x1="36" y1="112" x2="1244" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · 分层排障：从现象到层的决策树</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">每个菱形只问一个“一句话判据”；失败分支指向“下一层”，不是“下一条命令”。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">先判层，再取证，最后二分。</text>
