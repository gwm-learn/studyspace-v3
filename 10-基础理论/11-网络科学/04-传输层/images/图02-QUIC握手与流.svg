<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1180" height="680" fill="#ffffff"/>
<line x1="36" y1="112" x2="1144" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · QUIC 握手与流：1-RTT 建链，流级恢复</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">首次连接 1-RTT 完成 TLS 1.3 握手；复用会话可 0-RTT。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">每条流独立编号与重传，一条流丢包不阻塞其他流。</text>
<rect x="36" y="180" width="190" height="46" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="36" y="180" width="4.5" height="46" fill="#4f46e5" rx="2"/>
<text x="49" y="199" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">客户端</text>
<line x1="131" y1="226" x2="131" y2="500" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="316" y="180" width="190" height="46" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="316" y="180" width="4.5" height="46" fill="#0f9d58" rx="2"/>
<text x="329" y="199" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">服务端</text>
<line x1="411" y1="226" x2="411" y2="500" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="131" y1="270" x2="411" y2="270" stroke="#475569" stroke-width="2"/>
<polygon points="411,270 402,265.5 402,274.5" fill="#475569"/>
<text x="277" y="262" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">Initial（ClientHello）</text>
<line x1="411" y1="314" x2="131" y2="314" stroke="#475569" stroke-width="2"/>
<polygon points="131,314 140,318.5 140,309.5" fill="#475569"/>
<text x="277" y="306" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">Handshake（ServerHello）</text>
<line x1="131" y1="358" x2="411" y2="358" stroke="#475569" stroke-width="2"/>
<polygon points="411,358 402,353.5 402,362.5" fill="#475569"/>
<text x="277" y="350" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">1-RTT：流 1/2/3 数据</text>
<line x1="411" y1="402" x2="131" y2="402" stroke="#475569" stroke-width="2"/>
<polygon points="131,402 140,406.5 140,397.5" fill="#475569"/>
<text x="277" y="394" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">ACK / 流级重传</text>
<line x1="131" y1="446" x2="411" y2="446" stroke="#475569" stroke-width="2" stroke-dasharray="3 3"/>
<polygon points="411,446 402,441.5 402,450.5" fill="#475569"/>
<text x="277" y="438" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">0-RTT（复用会话，可选）</text>
<rect x="36" y="500" width="1100" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="530" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图提示</text>
<text x="52" y="554" font-size="10.2" fill="#334155" xml:space="preserve">QUIC 跑在 UDP 上，但自己实现可靠、拥塞控制与加密。</text>
<text x="52" y="572" font-size="10.2" fill="#334155" xml:space="preserve">连接 ID 支持 Wi-Fi/蜂窝切换不断连。</text>
<text x="36" y="626" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py</text>
<text x="36" y="644" font-size="12.3" fill="#64748b" xml:space="preserve">颜色只做辅助，先看箭头方向与文字标签。</text>
</svg>
