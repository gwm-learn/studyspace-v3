<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="540" viewBox="0 0 1180 540" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1180" height="540" fill="#ffffff"/>
<line x1="36" y1="112" x2="1144" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 03 · UDP 无状态：没有握手，也没有连接状态</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">UDP 只有端口绑定和收发队列；没有 SYN/ESTABLISHED/FIN。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">可靠性、顺序、重传全部由应用或 QUIC 自己实现。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">主路径</text>
<line x1="131" y1="142" x2="161" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="169" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">成功 / 到本机</text>
<line x1="267.8" y1="142" x2="297.8" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="305.8" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">注意 / 本机发出</text>
<rect x="40" y="200" width="240" height="120" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="40" y="200" width="4.5" height="120" fill="#4f46e5" rx="2"/>
<text x="53" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">TCP</text>
<text x="53" y="236" font-size="9.6" fill="#334155" xml:space="preserve">SYN → ESTABLISHED</text>
<text x="53" y="251.4" font-size="9.6" fill="#334155" xml:space="preserve">FIN → TIME-WAIT</text>
<text x="53" y="266.8" font-size="9.6" fill="#334155" xml:space="preserve">状态机 11 种</text>
<rect x="360" y="200" width="240" height="120" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="360" y="200" width="4.5" height="120" fill="#0f9d58" rx="2"/>
<text x="373" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">UDP</text>
<text x="373" y="236" font-size="9.6" fill="#334155" xml:space="preserve">bind 端口</text>
<text x="373" y="251.4" font-size="9.6" fill="#334155" xml:space="preserve">send / recv</text>
<text x="373" y="266.8" font-size="9.6" fill="#334155" xml:space="preserve">无连接状态</text>
<rect x="660" y="200" width="220" height="90" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="660" y="200" width="4.5" height="90" fill="#d97706" rx="2"/>
<text x="673" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">应用层</text>
<text x="673" y="236" font-size="9.6" fill="#334155" xml:space="preserve">超时/重传/去重</text>
<text x="673" y="251.4" font-size="9.6" fill="#334155" xml:space="preserve">或交给 QUIC</text>
<line x1="280" y1="260" x2="360" y2="260" stroke="#475569" stroke-width="2" stroke-dasharray="3 3"/>
<polygon points="360,260 351,255.5 351,264.5" fill="#475569"/>
<text x="326" y="253" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">对比</text>
<line x1="600" y1="253.79" x2="660" y2="250.69" stroke="#d97706" stroke-width="2"/>
<polygon points="660,250.69 650.78,246.66 651.24,255.65" fill="#d97706"/>
<text x="636" y="245.24" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">可靠性自管</text>
<rect x="36" y="370" width="1100" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="400" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图提示</text>
<text x="52" y="424" font-size="10.2" fill="#334155" xml:space="preserve">UDP 校验和 IPv4 可选、IPv6 强制。</text>
<text x="52" y="442" font-size="10.2" fill="#334155" xml:space="preserve">QUIC 在 UDP 上重建可靠流与拥塞控制。</text>
<text x="36" y="486" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py</text>
<text x="36" y="504" font-size="12.3" fill="#64748b" xml:space="preserve">颜色只做辅助，先看箭头方向与文字标签。</text>
