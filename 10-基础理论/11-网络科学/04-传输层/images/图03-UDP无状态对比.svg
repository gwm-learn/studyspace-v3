<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="980" height="640" fill="#ffffff"/>
<line x1="36" y1="112" x2="944" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 03 · UDP 无状态：和 TCP 比，少了哪几层</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">UDP 只有端口绑定与收发队列，没有连接、确认、顺序、流控。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">缺的能力没有消失，只是搬到了应用层或 QUIC 里自己实现。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">TCP 提供</text>
<line x1="146.4" y1="142" x2="176.4" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="184.4" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">UDP 不提供</text>
<rect x="40" y="190" width="900" height="34" fill="#f1f5f9" rx="6"/>
<text x="48" y="210" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="start">维度</text>
<text x="490" y="210" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">TCP</text>
<text x="790" y="210" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">UDP</text>
<rect x="40" y="224" width="900" height="38" fill="#ffffff"/>
<line x1="40" y1="224" x2="940" y2="224" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="48" y="244" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">连接</text>
<text x="490" y="244" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">三次握手</text>
<text x="790" y="244" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">无连接，bind 即可收发</text>
<rect x="40" y="262" width="900" height="38" fill="#ffffff"/>
<line x1="40" y1="262" x2="940" y2="262" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="48" y="282" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">可靠</text>
<text x="490" y="282" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">确认 + 超时重传</text>
<text x="790" y="282" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">不保证送达</text>
<rect x="40" y="300" width="900" height="38" fill="#ffffff"/>
<line x1="40" y1="300" x2="940" y2="300" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="48" y="320" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">顺序</text>
<text x="490" y="320" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">按序交付</text>
<text x="790" y="320" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">不保证顺序</text>
<rect x="40" y="338" width="900" height="38" fill="#ffffff"/>
<line x1="40" y1="338" x2="940" y2="338" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="48" y="358" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">流控 / 拥塞</text>
<text x="490" y="358" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">滑动窗口 + 拥塞控制</text>
<text x="790" y="358" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">无</text>
<rect x="40" y="376" width="900" height="38" fill="#ffffff"/>
<line x1="40" y1="376" x2="940" y2="376" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="48" y="396" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">失败感知</text>
<text x="490" y="396" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">RST / FIN</text>
<text x="790" y="396" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">只能靠超时或上层判断</text>
<rect x="40" y="414" width="900" height="38" fill="#ffffff"/>
<line x1="40" y1="414" x2="940" y2="414" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="48" y="434" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">头部与状态</text>
<text x="490" y="434" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">20 字节起 + 连接状态</text>
<text x="790" y="434" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">8 字节，无状态</text>
<line x1="40" y1="452" x2="940" y2="452" stroke="#e2e8f0" stroke-width="0.8"/>
<rect x="40" y="470" width="900" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="500" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="524" font-size="10.2" fill="#334155" xml:space="preserve">UDP 校验和在 IPv4 可选、IPv6 强制；关掉它省不了多少，却会让坏包进入应用层。</text>
<text x="56" y="542" font-size="10.2" fill="#334155" xml:space="preserve">QUIC 在 UDP 上重建了可靠、顺序、拥塞控制——「用 UDP」不等于「不可靠」，要看上层做了什么。</text>
<text x="36" y="586" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py 生成</text>
<text x="36" y="604" font-size="12.3" fill="#64748b" xml:space="preserve">本篇：10-基础理论/11-网络科学/04-传输层/02-UDP与QUIC.md</text>
</svg>
