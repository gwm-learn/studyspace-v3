<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · BDP 与 bufferbloat：管道多粗 × 路多长</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">BDP = 带宽 × RTT，决定在途数据量；窗口小于 BDP 就吃不饱。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">缓冲区太大 → 排队时延升高，吞吐好看但交互卡顿。</text>
