<text x="935" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">FIN-WAIT-2</text>
<text x="935" y="226" font-size="8.8" fill="#334155" xml:space="preserve">等对方 FIN</text>
<line x1="1062" y1="226" x2="1114" y2="226" stroke="#475569" stroke-width="2"/>
<polygon points="1114,226 1105,221.5 1105,230.5" fill="#475569"/>
<text x="1088" y="212" font-size="8.8" fill="#64748b" xml:space="preserve" text-anchor="middle">收到FIN</text>
<rect x="1114" y="190" width="140" height="72" fill="#fff5f5" rx="8" stroke="#dc2626" stroke-width="1.1"/>
<rect x="1114" y="190" width="4.5" height="72" fill="#dc2626" rx="2"/>
<text x="1127" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">TIME-WAIT</text>
<text x="1127" y="226" font-size="8.8" fill="#334155" xml:space="preserve">等 2MSL</text>
<line x1="1254" y1="226" x2="1306" y2="226" stroke="#475569" stroke-width="2"/>
<polygon points="1306,226 1297,221.5 1297,230.5" fill="#475569"/>
<text x="1280" y="212" font-size="8.8" fill="#64748b" xml:space="preserve" text-anchor="middle">2MSL</text>
<rect x="1306" y="190" width="140" height="72" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="1306" y="190" width="4.5" height="72" fill="#475569" rx="2"/>
<text x="1319" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">CLOSED</text>
<text x="1319" y="226" font-size="8.8" fill="#334155" xml:space="preserve">结束</text>
<rect x="36" y="302" width="108" height="90" fill="#f2fcf5" rx="9" stroke="#0f9d58" stroke-width="1.2"/>
<text x="46" y="324" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">服务端</text>
<text x="46" y="340" font-size="9" fill="#64748b" xml:space="preserve">被动打开</text>
<text x="46" y="353" font-size="9" fill="#64748b" xml:space="preserve">被动关闭</text>
<rect x="154" y="302" width="140" height="72" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="154" y="302" width="4.5" height="72" fill="#475569" rx="2"/>
<text x="167" y="321" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">CLOSED</text>
<text x="167" y="338" font-size="8.8" fill="#334155" xml:space="preserve">初始</text>
<line x1="294" y1="338" x2="346" y2="338" stroke="#475569" stroke-width="2"/>
<polygon points="346,338 337,333.5 337,342.5" fill="#475569"/>
<text x="320" y="324" font-size="8.8" fill="#64748b" xml:space="preserve" text-anchor="middle">listen</text>
<rect x="346" y="302" width="140" height="72" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="346" y="302" width="4.5" height="72" fill="#0f9d58" rx="2"/>
<text x="359" y="321" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">LISTEN</text>
<text x="359" y="338" font-size="8.8" fill="#334155" xml:space="preserve">等待连接</text>
<line x1="486" y1="338" x2="538" y2="338" stroke="#475569" stroke-width="2"/>
<polygon points="538,338 529,333.5 529,342.5" fill="#475569"/>
<text x="512" y="324" font-size="8.8" fill="#64748b" xml:space="preserve" text-anchor="middle">SYN</text>
<rect x="538" y="302" width="140" height="72" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="538" y="302" width="4.5" height="72" fill="#4f46e5" rx="2"/>
<text x="551" y="321" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">SYN-RCVD</text>
<text x="551" y="338" font-size="8.8" fill="#334155" xml:space="preserve">收到 SYN</text>
<line x1="678" y1="338" x2="730" y2="338" stroke="#475569" stroke-width="2"/>
<polygon points="730,338 721,333.5 721,342.5" fill="#475569"/>
