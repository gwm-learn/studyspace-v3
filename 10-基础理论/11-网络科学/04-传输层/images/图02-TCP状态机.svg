<line x1="890.96" y1="452" x2="960" y2="452" stroke="#475569" stroke-width="1.6"/>
<polygon points="960,452 951,447.5 951,456.5" fill="#475569"/>
<text x="925.48" y="445" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">ACK</text>
<rect x="60" y="500" width="1040" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="76" y="530" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="76" y="554" font-size="10.2" fill="#334155" xml:space="preserve">两条主线都从 CLOSED 回到 CLOSED；TIME-WAIT 等 2MSL，保证最后 ACK 可达并让旧报文消亡。</text>
<text x="76" y="572" font-size="10.2" fill="#334155" xml:space="preserve">收到 RST 时可以从多数状态直接回 CLOSED，不必走完这条链。</text>
