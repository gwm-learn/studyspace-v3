<rect x="730" y="302" width="4.5" height="72" fill="#0f9d58" rx="2"/>
<text x="743" y="321" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">ESTABLISHED</text>
<text x="743" y="338" font-size="8.8" fill="#334155" xml:space="preserve">可传数据</text>
<line x1="870" y1="338" x2="922" y2="338" stroke="#475569" stroke-width="2"/>
<polygon points="922,338 913,333.5 913,342.5" fill="#475569"/>
<text x="896" y="324" font-size="8.8" fill="#64748b" xml:space="preserve" text-anchor="middle">收到FIN</text>
<rect x="922" y="302" width="140" height="72" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="922" y="302" width="4.5" height="72" fill="#d97706" rx="2"/>
<text x="935" y="321" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">CLOSE-WAIT</text>
<text x="935" y="338" font-size="8.8" fill="#334155" xml:space="preserve">等应用关闭</text>
<line x1="1062" y1="338" x2="1114" y2="338" stroke="#475569" stroke-width="2"/>
<polygon points="1114,338 1105,333.5 1105,342.5" fill="#475569"/>
<text x="1088" y="324" font-size="8.8" fill="#64748b" xml:space="preserve" text-anchor="middle">应用关闭</text>
<rect x="1114" y="302" width="140" height="72" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="1114" y="302" width="4.5" height="72" fill="#d97706" rx="2"/>
<text x="1127" y="321" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">LAST-ACK</text>
<text x="1127" y="338" font-size="8.8" fill="#334155" xml:space="preserve">等最后 ACK</text>
<line x1="1254" y1="338" x2="1306" y2="338" stroke="#475569" stroke-width="2"/>
<polygon points="1306,338 1297,333.5 1297,342.5" fill="#475569"/>
<text x="1280" y="324" font-size="8.8" fill="#64748b" xml:space="preserve" text-anchor="middle">ACK</text>
<rect x="1306" y="302" width="140" height="72" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="1306" y="302" width="4.5" height="72" fill="#475569" rx="2"/>
<text x="1319" y="321" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">CLOSED</text>
<text x="1319" y="338" font-size="8.8" fill="#334155" xml:space="preserve">结束</text>
<rect x="36" y="420" width="1280" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="450" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图提示</text>
<text x="52" y="474" font-size="10.2" fill="#334155" xml:space="preserve">同时关闭会出现 CLOSING，少见但合法。</text>
<text x="52" y="492" font-size="10.2" fill="#334155" xml:space="preserve">收到 RST 可从多数状态直接回 CLOSED。</text>
