<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="680" viewBox="0 0 1140 680" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1140" height="680" fill="#ffffff"/>
<line x1="36" y1="112" x2="1104" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · TCP 状态机：两条主线，外加一条同时关闭的分支</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">客户端与服务端各走一条主线，都从 CLOSED 回到 CLOSED。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">CLOSING 只在双方同时发 FIN 时出现；它不常用，但缺了会说不清 2MSL 之前发生了什么。</text>
