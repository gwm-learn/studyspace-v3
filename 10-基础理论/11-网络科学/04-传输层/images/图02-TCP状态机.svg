<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1500" height="600" fill="#ffffff"/>
<line x1="36" y1="112" x2="1464" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · TCP 状态机：两条主线，不画所有分支</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">客户端主线：SYN-SENT → ESTABLISHED → FIN-WAIT → TIME-WAIT。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">服务端主线：LISTEN → SYN-RCVD → ESTABLISHED → CLOSE-WAIT → LAST-ACK。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">主路径</text>
<line x1="131" y1="142" x2="161" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="169" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">成功 / 到本机</text>
<rect x="36" y="190" width="108" height="90" fill="#eef2ff" rx="9" stroke="#4f46e5" stroke-width="1.2"/>
<text x="46" y="212" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">客户端</text>
<text x="46" y="228" font-size="9" fill="#64748b" xml:space="preserve">主动打开</text>
<text x="46" y="241" font-size="9" fill="#64748b" xml:space="preserve">主动关闭</text>
<rect x="154" y="190" width="140" height="72" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="154" y="190" width="4.5" height="72" fill="#475569" rx="2"/>
<text x="167" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">CLOSED</text>
<text x="167" y="226" font-size="8.8" fill="#334155" xml:space="preserve">初始</text>
<line x1="294" y1="226" x2="346" y2="226" stroke="#475569" stroke-width="2"/>
<polygon points="346,226 337,221.5 337,230.5" fill="#475569"/>
<text x="320" y="212" font-size="8.8" fill="#64748b" xml:space="preserve" text-anchor="middle">主动SYN</text>
<rect x="346" y="190" width="140" height="72" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="346" y="190" width="4.5" height="72" fill="#4f46e5" rx="2"/>
<text x="359" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">SYN-SENT</text>
<text x="359" y="226" font-size="8.8" fill="#334155" xml:space="preserve">已发 SYN</text>
<line x1="486" y1="226" x2="538" y2="226" stroke="#475569" stroke-width="2"/>
<polygon points="538,226 529,221.5 529,230.5" fill="#475569"/>
<text x="512" y="212" font-size="8.8" fill="#64748b" xml:space="preserve" text-anchor="middle">SYN+ACK</text>
<rect x="538" y="190" width="140" height="72" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="538" y="190" width="4.5" height="72" fill="#0f9d58" rx="2"/>
<text x="551" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">ESTABLISHED</text>
<text x="551" y="226" font-size="8.8" fill="#334155" xml:space="preserve">可传数据</text>
<line x1="678" y1="226" x2="730" y2="226" stroke="#475569" stroke-width="2"/>
<polygon points="730,226 721,221.5 721,230.5" fill="#475569"/>
<text x="704" y="212" font-size="8.8" fill="#64748b" xml:space="preserve" text-anchor="middle">主动FIN</text>
<rect x="730" y="190" width="140" height="72" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="730" y="190" width="4.5" height="72" fill="#d97706" rx="2"/>
<text x="743" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">FIN-WAIT-1</text>
<text x="743" y="226" font-size="8.8" fill="#334155" xml:space="preserve">已发 FIN</text>
<line x1="870" y1="226" x2="922" y2="226" stroke="#475569" stroke-width="2"/>
<polygon points="922,226 913,221.5 913,230.5" fill="#475569"/>
<text x="896" y="212" font-size="8.8" fill="#64748b" xml:space="preserve" text-anchor="middle">ACK</text>
<rect x="922" y="190" width="140" height="72" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
