<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · UDP 与 QUIC 封装：8 字节头，可靠搬到用户态</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">UDP 只加 8 字节头；QUIC 在 UDP 之上实现可靠流、加密与多路复用。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">HTTP/3 跑在 QUIC 上，不经过 TCP。</text>
