<text x="56" y="554" font-size="10.2" fill="#334155" xml:space="preserve">两套过期机制互不相干：订阅过期只是收不到事件，端口映射过期会直接断掉外部访问。</text>
<text x="56" y="572" font-size="10.2" fill="#334155" xml:space="preserve">SSDP 组播不出广播域，跨网段发现会失败；UPnP 也没有认证，局域网内谁都能申请映射。</text>
