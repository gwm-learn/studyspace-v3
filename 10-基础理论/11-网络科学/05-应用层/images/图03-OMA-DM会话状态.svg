<svg xmlns="http://www.w3.org/2000/svg" width="840" height="680" viewBox="0 0 840 680" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="840" height="680" fill="#ffffff"/>
<line x1="36" y1="112" x2="804" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 03 · OMA-DM 会话：Package 一来一回</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">Server 发 Alert 触发会话，之后双方交替发 Package；每个 Package 都是一次 HTTP 往返。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">与会话状态无关的是 DM 树本身——它才是最终被改动的对象。</text>
