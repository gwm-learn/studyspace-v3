<text x="176" y="405" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">Package 4：确认 / 结束</text>
<rect x="40" y="500" width="760" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="530" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="554" font-size="10.2" fill="#334155" xml:space="preserve">Atomic 语义保证一组命令全成功或全回滚；失败按策略重试或终止会话。</text>
<text x="56" y="572" font-size="10.2" fill="#334155" xml:space="preserve">Bootstrap 先下发服务器地址与凭据，之后才有可能发起会话。</text>
