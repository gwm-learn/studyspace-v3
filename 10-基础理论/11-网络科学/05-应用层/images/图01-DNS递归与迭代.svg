<text x="56" y="664" font-size="10.2" fill="#334155" xml:space="preserve">客户端只发一次递归查询；右边三段是解析器替它做的迭代。</text>
<text x="56" y="682" font-size="10.2" fill="#334155" xml:space="preserve">NXDOMAIN 也会被缓存（RFC 2308）；DoH/DoT 只保护链路，不改变这套逐级查询。</text>
