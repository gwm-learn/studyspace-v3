<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1400" height="720" fill="#ffffff"/>
<line x1="36" y1="112" x2="1364" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · DNS 递归与迭代：客户端只问一次</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">客户端向递归解析器发递归查询，解析器替它逐级迭代。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">根 → TLD → 权威，每级只指下一站；缓存命中则直接返回。</text>
<rect x="36" y="180" width="190" height="46" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="36" y="180" width="4.5" height="46" fill="#0f9d58" rx="2"/>
<text x="49" y="199" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">客户端</text>
<line x1="131" y1="226" x2="131" y2="544" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="316" y="180" width="190" height="46" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="316" y="180" width="4.5" height="46" fill="#4f46e5" rx="2"/>
<text x="329" y="199" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">递归解析器</text>
<line x1="411" y1="226" x2="411" y2="544" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="596" y="180" width="190" height="46" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="596" y="180" width="4.5" height="46" fill="#475569" rx="2"/>
<text x="609" y="199" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">根</text>
<line x1="691" y1="226" x2="691" y2="544" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="876" y="180" width="190" height="46" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="876" y="180" width="4.5" height="46" fill="#475569" rx="2"/>
<text x="889" y="199" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">TLD</text>
<line x1="971" y1="226" x2="971" y2="544" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="1156" y="180" width="190" height="46" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="1156" y="180" width="4.5" height="46" fill="#d97706" rx="2"/>
<text x="1169" y="199" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">权威</text>
<line x1="1251" y1="226" x2="1251" y2="544" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="131" y1="270" x2="411" y2="270" stroke="#475569" stroke-width="2"/>
<polygon points="411,270 402,265.5 402,274.5" fill="#475569"/>
<text x="277" y="262" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">递归查询 www.example.com</text>
<line x1="411" y1="314" x2="691" y2="314" stroke="#475569" stroke-width="2"/>
<polygon points="691,314 682,309.5 682,318.5" fill="#475569"/>
<text x="557" y="306" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">迭代：.com 归谁？</text>
<line x1="411" y1="358" x2="971" y2="358" stroke="#475569" stroke-width="2"/>
<polygon points="971,358 962,353.5 962,362.5" fill="#475569"/>
<text x="697" y="350" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">迭代：example.com 归谁？</text>
<line x1="411" y1="402" x2="1251" y2="402" stroke="#475569" stroke-width="2"/>
<polygon points="1251,402 1242,397.5 1242,406.5" fill="#475569"/>
<text x="837" y="394" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">迭代：www 的 A？</text>
<line x1="1251" y1="446" x2="411" y2="446" stroke="#475569" stroke-width="2"/>
<polygon points="411,446 420,450.5 420,441.5" fill="#475569"/>
<text x="837" y="438" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">A 记录 + TTL</text>
<line x1="411" y1="490" x2="131" y2="490" stroke="#475569" stroke-width="2" stroke-dasharray="3 3"/>
<polygon points="131,490 140,494.5 140,485.5" fill="#475569"/>
<text x="277" y="482" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">最终答案（可缓存）</text>
<rect x="36" y="544" width="1100" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="574" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图提示</text>
<text x="52" y="598" font-size="10.2" fill="#334155" xml:space="preserve">NXDOMAIN 也会负缓存（RFC 2308）。</text>
<text x="52" y="616" font-size="10.2" fill="#334155" xml:space="preserve">DoH/DoT 保护链路，DNSSEC 保护记录本身。</text>
<text x="36" y="666" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py</text>
<text x="36" y="684" font-size="12.3" fill="#64748b" xml:space="preserve">颜色只做辅助，先看箭头方向与文字标签。</text>
</svg>
