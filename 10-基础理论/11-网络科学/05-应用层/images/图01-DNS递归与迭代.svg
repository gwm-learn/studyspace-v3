<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">实线是查询，虚线是应答；每一级只回「下一级找谁」（referral），不代查。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">命中缓存时，解析器直接回最终答案，不再走右侧三段。</text>
