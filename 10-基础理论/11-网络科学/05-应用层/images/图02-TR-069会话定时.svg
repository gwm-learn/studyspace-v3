<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1100" height="520" fill="#ffffff"/>
<line x1="36" y1="112" x2="1064" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · TR-069 会话定时：三件与时间有关的事</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">周期上报、反向连接、失败重试是三套独立机制，不要串成一条链。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">CWMP 是短会话：每次 HTTP 往返独立，没有长连接状态。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">周期</text>
<line x1="120" y1="142" x2="150" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">反向</text>
<line x1="204" y1="142" x2="234" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="242" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">重试</text>
<rect x="40" y="190" width="320" height="132" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="40" y="190" width="4.5" height="132" fill="#4f46e5" rx="2"/>
<text x="53" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">① 周期上报</text>
<text x="53" y="226" font-size="9.6" fill="#334155" xml:space="preserve">PeriodicInformInterval：周期</text>
<text x="53" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">PeriodicInformTime：首次时刻</text>
<text x="53" y="256.8" font-size="9.6" fill="#334155" xml:space="preserve">上电另发 BOOTSTRAP / BOOT</text>
<rect x="390" y="190" width="320" height="132" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="390" y="190" width="4.5" height="132" fill="#d97706" rx="2"/>
<text x="403" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">② 反向连接</text>
<text x="403" y="226" font-size="9.6" fill="#334155" xml:space="preserve">ACS 发 Connection Request</text>
<text x="403" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">CPE 回连并发 Inform（Event=6）</text>
<text x="403" y="256.8" font-size="9.6" fill="#334155" xml:space="preserve">ACS 在响应里下发任务</text>
<rect x="740" y="190" width="320" height="132" fill="#fff5f5" rx="8" stroke="#dc2626" stroke-width="1.1"/>
<rect x="740" y="190" width="4.5" height="132" fill="#dc2626" rx="2"/>
<text x="753" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">③ 失败重试</text>
<text x="753" y="226" font-size="9.6" fill="#334155" xml:space="preserve">Inform 失败按退避重试</text>
<text x="753" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">带 RetryCount 计数</text>
<text x="753" y="256.8" font-size="9.6" fill="#334155" xml:space="preserve">会话本身有 HTTP 超时</text>
<rect x="40" y="350" width="1020" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="380" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="404" font-size="10.2" fill="#334155" xml:space="preserve">反向连接只是「叫醒」CPE，配置并不在 Connection Request 里下发，而是在随后的 Inform 响应里。</text>
<text x="56" y="422" font-size="10.2" fill="#334155" xml:space="preserve">周期与反向可以同时存在：ACS 等不到下一个周期时用反向连接；周期上报保证长时间静默后仍能对齐状态。</text>
<text x="36" y="466" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py 生成</text>
<text x="36" y="484" font-size="12.3" fill="#64748b" xml:space="preserve">本篇：10-基础理论/11-网络科学/05-应用层/07-TR-069.md</text>
</svg>
