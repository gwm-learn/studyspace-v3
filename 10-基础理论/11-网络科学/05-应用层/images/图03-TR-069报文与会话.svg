<text x="43" y="229" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">CPE</text>
<text x="43" y="246" font-size="9.6" fill="#334155" xml:space="preserve">HTTP 客户端</text>
<text x="43" y="261.4" font-size="9.6" fill="#334155" xml:space="preserve">发 Inform</text>
<rect x="650" y="210" width="180" height="76" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="650" y="210" width="4.5" height="76" fill="#4f46e5" rx="2"/>
<text x="663" y="229" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">ACS</text>
<text x="663" y="246" font-size="9.6" fill="#334155" xml:space="preserve">HTTP 服务端</text>
<text x="663" y="261.4" font-size="9.6" fill="#334155" xml:space="preserve">下发 RPC</text>
<rect x="290" y="180" width="260" height="110" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="290" y="180" width="4.5" height="110" fill="#d97706" rx="2"/>
<text x="303" y="199" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">SOAP Envelope</text>
<text x="303" y="216" font-size="9.6" fill="#334155" xml:space="preserve">Header：CWMP ID</text>
<text x="303" y="231.4" font-size="9.6" fill="#334155" xml:space="preserve">Body：Inform / RPC</text>
<rect x="290" y="340" width="260" height="90" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
