<text x="52" y="510" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图提示</text>
<text x="52" y="534" font-size="10.2" fill="#334155" xml:space="preserve">Connection Request 只触发 CPE 回连，不直接下发配置。</text>
<text x="52" y="552" font-size="10.2" fill="#334155" xml:space="preserve">数据模型版本（TR-098/181）要对齐。</text>
<text x="36" y="606" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py</text>
<text x="36" y="624" font-size="12.3" fill="#64748b" xml:space="preserve">颜色只做辅助，先看箭头方向与文字标签。</text>
