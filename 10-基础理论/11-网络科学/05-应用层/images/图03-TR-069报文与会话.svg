<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1100" height="620" fill="#ffffff"/>
<line x1="36" y1="112" x2="1064" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 03 · TR-069 报文结构：HTTP 里套一个 SOAP 信封</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">外层是 HTTP（端口 7547），里面是 SOAP Envelope：Header 带 CWMP ID，Body 装 Inform 或 RPC。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">一次 HTTP 往返就是一个 CWMP 会话；会话与反向连接见本目录图 01。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#475569" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">传输载体</text>
<line x1="142" y1="142" x2="172" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="180" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">会话标识</text>
<line x1="248" y1="142" x2="278" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="286" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">业务内容</text>
<rect x="40" y="190" width="640" height="38" fill="#f8fafc" rx="6" stroke="#475569" stroke-width="1.1"/>
<text x="52" y="212.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">HTTP POST / 200（端口 7547）</text>
<text x="670" y="212.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">传输载体</text>
<rect x="40" y="234" width="640" height="38" fill="#f8fafc" rx="6" stroke="#475569" stroke-width="1.1"/>
<text x="52" y="256.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">SOAP Envelope</text>
<text x="670" y="256.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">XML 容器</text>
<rect x="40" y="278" width="640" height="38" fill="#fff9ee" rx="6" stroke="#d97706" stroke-width="1.1"/>
<text x="52" y="300.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">SOAP Header：CWMP ID</text>
<text x="670" y="300.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">请求/响应必须一致</text>
<rect x="40" y="322" width="640" height="38" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.1"/>
<text x="52" y="344.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">SOAP Body：Inform</text>
<text x="670" y="344.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">事件上报</text>
<rect x="40" y="366" width="640" height="38" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.1"/>
<text x="52" y="388.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">SOAP Body：RPC</text>
<text x="670" y="388.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">Get/Set/Download/Reboot</text>
<rect x="720" y="190" width="340" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="736" y="220" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">两个容易混的点</text>
<text x="736" y="244" font-size="10.2" fill="#334155" xml:space="preserve">Header 的 CWMP ID 用于配对请求与响应；</text>
<text x="736" y="262" font-size="10.2" fill="#334155" xml:space="preserve">响应可以只有 Header、没有 Body——那是「空响应」，不是出错。</text>
<rect x="40" y="420" width="1020" height="110" fill="#eef2ff" rx="10" stroke="#4f46e5" stroke-width="1"/>
<text x="56" y="450" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">常见 RPC（都在 Body 里）</text>
<text x="56" y="474" font-size="10.2" fill="#334155" xml:space="preserve">读：GetParameterNames / GetParameterValues / GetParameterAttributes</text>
<text x="56" y="492" font-size="10.2" fill="#334155" xml:space="preserve">写：SetParameterValues / AddObject / DeleteObject</text>
<text x="56" y="510" font-size="10.2" fill="#334155" xml:space="preserve">动作：Download（固件/配置）、Upload、Reboot、FactoryReset</text>
<text x="36" y="566" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py 生成</text>
<text x="36" y="584" font-size="12.3" fill="#64748b" xml:space="preserve">本篇：10-基础理论/11-网络科学/05-应用层/07-TR-069.md</text>
</svg>
