<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">请求/响应</text>
<line x1="148.6" y1="142" x2="178.6" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="186.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">告警</text>
<line x1="232.6" y1="142" x2="262.6" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="270.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">数据模型</text>
<rect x="40" y="250" width="260" height="92" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="40" y="250" width="4.5" height="92" fill="#4f46e5" rx="2"/>
<text x="53" y="269" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">NMS（管理者）</text>
<text x="53" y="286" font-size="9.6" fill="#334155" xml:space="preserve">轮询 Get/GetNext/GetBulk</text>
<text x="53" y="301.4" font-size="9.6" fill="#334155" xml:space="preserve">写 Set，收 Trap/Inform</text>
<rect x="400" y="250" width="260" height="92" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="400" y="250" width="4.5" height="92" fill="#0f9d58" rx="2"/>
<text x="413" y="269" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">Agent（代理）</text>
<text x="413" y="286" font-size="9.6" fill="#334155" xml:space="preserve">响应请求，读本机 MIB</text>
<text x="413" y="301.4" font-size="9.6" fill="#334155" xml:space="preserve">主动上报 Trap/Inform</text>
<rect x="760" y="250" width="260" height="92" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
