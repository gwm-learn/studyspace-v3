<line x1="530" y1="342" x2="530" y2="380" stroke="#d97706" stroke-width="1.6" stroke-dasharray="3 3"/>
<line x1="530" y1="380" x2="170" y2="380" stroke="#d97706" stroke-width="1.6" stroke-dasharray="3 3"/>
