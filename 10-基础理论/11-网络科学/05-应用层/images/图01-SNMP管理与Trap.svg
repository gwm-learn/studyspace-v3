<polygon points="170,342 165.5,351 174.5,351" fill="#d97706"/>
<text x="350" y="372" font-size="9.4" fill="#d97706" xml:space="preserve" font-weight="600" text-anchor="middle">UDP 162 告警（Trap / Inform）</text>
<line x1="660" y1="330" x2="760" y2="330" stroke="#0f9d58" stroke-width="1.8"/>
<polygon points="760,330 751,325.5 751,334.5" fill="#0f9d58"/>
<text x="710" y="323" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">读 / 写</text>
<rect x="40" y="400" width="1000" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="430" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="454" font-size="10.2" fill="#334155" xml:space="preserve">MIB 不是数据库进程，是「OID 树 + 取值规则」；Agent 负责把它映射到本机实现。</text>
<text x="56" y="472" font-size="10.2" fill="#334155" xml:space="preserve">v1/v2c 的团体名是明文共享密钥，v3 才有用户与认证；生产环境至少配 ACL。</text>
