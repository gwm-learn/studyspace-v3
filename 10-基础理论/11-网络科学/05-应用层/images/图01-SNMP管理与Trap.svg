<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">NMS 管、Agent 代、MIB 存；一条通道问变量（161），一条通道报警（162）。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">具体报文顺序见本目录图 02，这里只看「谁拥有什么」。</text>
