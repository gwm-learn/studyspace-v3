<text x="773" y="269" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">MIB（OID 树）</text>
<text x="773" y="286" font-size="9.6" fill="#334155" xml:space="preserve">对象类型由 SMI 定义</text>
<text x="773" y="301.4" font-size="9.6" fill="#334155" xml:space="preserve">OID → 值，随设备实现</text>
<line x1="300" y1="330" x2="400" y2="330" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="400,330 391,325.5 391,334.5" fill="#4f46e5"/>
