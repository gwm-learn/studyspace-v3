<svg xmlns="http://www.w3.org/2000/svg" width="980" height="780" viewBox="0 0 980 780" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="980" height="780" fill="#ffffff"/>
<line x1="36" y1="112" x2="944" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 03 · DHCPv6 前缀委派：四步换一段 /56，再切给各 LAN</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">Solicit → Advertise → Request → Reply 是协议交互；「切分 /64」是网关内部动作，画成自环。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">每个 LAN 用 RA 下发自己的 /64，终端 SLAAC 生成地址，不需要 NAT。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">请求前缀</text>
<line x1="142" y1="142" x2="172" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="180" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">下发地址</text>
<rect x="40" y="190" width="190" height="42" fill="#f1f5f9" rx="8" stroke="#4f46e5" stroke-width="1"/>
<text x="52" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">家庭网关</text>
<rect x="270" y="190" width="190" height="42" fill="#f1f5f9" rx="8" stroke="#d97706" stroke-width="1"/>
<text x="282" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">上游 DHCPv6</text>
<rect x="500" y="190" width="190" height="42" fill="#f1f5f9" rx="8" stroke="#0f9d58" stroke-width="1"/>
<text x="512" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">LAN 主机</text>
<line x1="135" y1="232" x2="135" y2="544" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="365" y1="232" x2="365" y2="544" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="595" y1="232" x2="595" y2="544" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="135" y1="260" x2="365" y2="260" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="365,260 356,255.5 356,264.5" fill="#4f46e5"/>
<text x="141" y="253" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">Solicit（IA_PD）</text>
<line x1="365" y1="298" x2="135" y2="298" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="3 3"/>
<polygon points="135,298 144,302.5 144,293.5" fill="#4f46e5"/>
<text x="141" y="291" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">Advertise（候选前缀）</text>
<line x1="135" y1="336" x2="365" y2="336" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="365,336 356,331.5 356,340.5" fill="#4f46e5"/>
<text x="141" y="329" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">Request（选定前缀）</text>
<line x1="365" y1="374" x2="135" y2="374" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="3 3"/>
<polygon points="135,374 144,378.5 144,369.5" fill="#4f46e5"/>
<text x="141" y="367" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">Reply（确认 2001:db8:abcd::/56）</text>
<line x1="135" y1="412" x2="169" y2="412" stroke="#475569" stroke-width="1.8"/>
<line x1="169" y1="412" x2="169" y2="426" stroke="#475569" stroke-width="1.8"/>
<line x1="169" y1="426" x2="141" y2="426" stroke="#475569" stroke-width="1.8"/>
<polygon points="137,426 146,430.5 146,421.5" fill="#475569"/>
<text x="141" y="405" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">按 LAN 切分 /64（内部）</text>
<line x1="135" y1="450" x2="595" y2="450" stroke="#0f9d58" stroke-width="1.8"/>
<polygon points="595,450 586,445.5 586,454.5" fill="#0f9d58"/>
<text x="141" y="443" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">RA：下发 /64 前缀</text>
<line x1="595" y1="488" x2="135" y2="488" stroke="#0f9d58" stroke-width="1.8" stroke-dasharray="3 3"/>
<polygon points="135,488 144,492.5 144,483.5" fill="#0f9d58"/>
<text x="141" y="481" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">SLAAC / DAD 完成</text>
<line x1="135" y1="526" x2="365" y2="526" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="365,526 356,521.5 356,530.5" fill="#4f46e5"/>
<text x="141" y="519" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">RENEW / REBIND（到期前）</text>
<rect x="40" y="610" width="900" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="640" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="664" font-size="10.2" fill="#334155" xml:space="preserve">PD 让下游每个 LAN 都有全局前缀；前缀长度不匹配（比如上游给 /60 仍按 /64 切）会导致地址规划失败。</text>
<text x="56" y="682" font-size="10.2" fill="#334155" xml:space="preserve">自环那条不是协议报文——它是网关拿到前缀后的本地动作，别和 DHCPv6 交互混为一谈。</text>
<text x="36" y="726" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py 生成</text>
