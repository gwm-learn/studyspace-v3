<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 03 · HTTP 连接与流：1.1 串行、2 多路复用、3 独立流</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">1.1 一条连接串行处理请求；2 在 TCP 上分帧多路复用；3 每条流独立重传。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">连接状态与流状态分开看：连接断，所有流都断。</text>
