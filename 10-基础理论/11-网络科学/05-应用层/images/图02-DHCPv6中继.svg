<svg xmlns="http://www.w3.org/2000/svg" width="880" height="780" viewBox="0 0 880 780" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="880" height="780" fill="#ffffff"/>
<line x1="36" y1="112" x2="844" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · DHCPv6 中继：RELAY-FORW / RELAY-REPL 一来一回</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">中继把客户端报文整体封装进 RELAY-FORW，服务器用 RELAY-REPL 原路带回。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">四步交互各走两趟：客户端↔中继、中继↔服务器。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">客户端 ↔ 中继</text>
<line x1="177.2" y1="142" x2="207.2" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="215.2" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">中继 ↔ 服务器</text>
<rect x="40" y="190" width="190" height="42" fill="#f1f5f9" rx="8" stroke="#0f9d58" stroke-width="1"/>
<text x="52" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">客户端</text>
<rect x="270" y="190" width="190" height="42" fill="#f1f5f9" rx="8" stroke="#4f46e5" stroke-width="1"/>
<text x="282" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">中继</text>
<rect x="500" y="190" width="190" height="42" fill="#f1f5f9" rx="8" stroke="#d97706" stroke-width="1"/>
<text x="512" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">服务器</text>
<line x1="135" y1="232" x2="135" y2="544" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="365" y1="232" x2="365" y2="544" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="595" y1="232" x2="595" y2="544" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="135" y1="260" x2="365" y2="260" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="365,260 356,255.5 356,264.5" fill="#4f46e5"/>
<text x="141" y="253" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">SOLICIT（组播）</text>
<line x1="365" y1="298" x2="595" y2="298" stroke="#d97706" stroke-width="1.8"/>
<polygon points="595,298 586,293.5 586,302.5" fill="#d97706"/>
<text x="371" y="291" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">RELAY-FORW（封装 SOLICIT）</text>
<line x1="595" y1="336" x2="365" y2="336" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3 3"/>
<polygon points="365,336 374,340.5 374,331.5" fill="#d97706"/>
<text x="371" y="329" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">RELAY-REPL（封装 ADVERTISE）</text>
<line x1="365" y1="374" x2="135" y2="374" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="3 3"/>
<polygon points="135,374 144,378.5 144,369.5" fill="#4f46e5"/>
<text x="141" y="367" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">ADVERTISE</text>
<line x1="135" y1="412" x2="365" y2="412" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="365,412 356,407.5 356,416.5" fill="#4f46e5"/>
<text x="141" y="405" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">REQUEST</text>
<line x1="365" y1="450" x2="595" y2="450" stroke="#d97706" stroke-width="1.8"/>
<polygon points="595,450 586,445.5 586,454.5" fill="#d97706"/>
<text x="371" y="443" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">RELAY-FORW（封装 REQUEST）</text>
<line x1="595" y1="488" x2="365" y2="488" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3 3"/>
<polygon points="365,488 374,492.5 374,483.5" fill="#d97706"/>
<text x="371" y="481" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">RELAY-REPL（封装 REPLY）</text>
<line x1="365" y1="526" x2="135" y2="526" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="3 3"/>
<polygon points="135,526 144,530.5 144,521.5" fill="#4f46e5"/>
<text x="141" y="519" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">REPLY</text>
<rect x="40" y="610" width="800" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="640" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="664" font-size="10.2" fill="#334155" xml:space="preserve">RELAY-FORW 里带链路地址（link-address），服务器据此知道客户端在哪个链路。</text>
<text x="56" y="682" font-size="10.2" fill="#334155" xml:space="preserve">前缀委派（IA_PD）也走同一条中继路径，只是选项不同。</text>
