<text x="52" y="598" font-size="10.2" fill="#334155" xml:space="preserve">CWMP = SOAP over HTTP(S)，常见端口 7547。</text>
<text x="52" y="616" font-size="10.2" fill="#334155" xml:space="preserve">固件升级要校验签名、防断电、可回滚。</text>
