<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1180" height="720" fill="#ffffff"/>
<line x1="36" y1="112" x2="1144" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · TR-069：CPE 主动上报，ACS 反向触发</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">CPE 发 Inform，ACS 在响应里下发 RPC；周期上报由 Interval 控制。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">ACS 要主动管理时先发 Connection Request，触发 CPE 回连。</text>
