<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="560" viewBox="0 0 1020 560" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1020" height="560" fill="#ffffff"/>
<line x1="36" y1="112" x2="984" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · HTTP 版本演进：每一步解决一种阻塞</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">1.0 每次请求重建连接；1.1 持久连接；2 多路复用；3 用 QUIC 消除 TCP 级阻塞。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">语义（方法/状态码/头）基本没变，变的是传输方式——具体连接模型见本目录图 03。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#475569" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">早期</text>
<line x1="120" y1="142" x2="150" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">多路复用</text>
<line x1="226" y1="142" x2="256" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="264" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">QUIC</text>
<line x1="70" y1="300" x2="970" y2="300" stroke="#cbd5e1" stroke-width="1.8"/>
<polygon points="182.5,295 177.5,300 182.5,305 187.5,300" fill="#475569"/>
<text x="182.5" y="282" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="600" text-anchor="middle">HTTP/1.0</text>
<text x="182.5" y="268" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">1996 · 每请求一条连接</text>
<polygon points="407.5,295 402.5,300 407.5,305 412.5,300" fill="#475569"/>
<text x="407.5" y="324" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="600" text-anchor="middle">HTTP/1.1</text>
<text x="407.5" y="338" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">1997 · 持久连接 + 管道化</text>
<polygon points="632.5,295 627.5,300 632.5,305 637.5,300" fill="#4f46e5"/>
<text x="632.5" y="282" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="600" text-anchor="middle">HTTP/2</text>
<text x="632.5" y="268" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">2015 · 二进制分帧 + 多路复用</text>
<polygon points="857.5,295 852.5,300 857.5,305 862.5,300" fill="#0f9d58"/>
<text x="857.5" y="324" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="600" text-anchor="middle">HTTP/3</text>
<text x="857.5" y="338" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">2022 · QUIC + 独立流</text>
<rect x="70" y="380" width="900" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="86" y="410" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="86" y="434" font-size="10.2" fill="#334155" xml:space="preserve">1.1 的管道化在应用层仍是「按序响应」，所以没解决队头阻塞；2 解决了请求级，3 才解决 TCP 级。</text>
<text x="86" y="452" font-size="10.2" fill="#334155" xml:space="preserve">UDP 上的 HTTP/3 容易被网络策略拦截，部署前先确认链路放行。</text>
<text x="36" y="506" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py 生成</text>
<text x="36" y="524" font-size="12.3" fill="#64748b" xml:space="preserve">本篇：10-基础理论/11-网络科学/05-应用层/04-HTTP.md</text>
</svg>
