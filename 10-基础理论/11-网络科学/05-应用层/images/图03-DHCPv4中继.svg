<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1180" height="720" fill="#ffffff"/>
<line x1="36" y1="112" x2="1144" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 03 · DHCPv4 中继：用 giaddr 找到客户端子网</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">客户端广播 DISCOVER，中继把它单播给服务器，并填 giaddr。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">服务器按 giaddr 选地址池，应答经中继回传给客户端。</text>
