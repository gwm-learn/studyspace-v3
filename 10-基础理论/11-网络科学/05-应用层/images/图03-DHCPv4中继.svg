<rect x="36" y="544" width="1100" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="574" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图提示</text>
<text x="52" y="598" font-size="10.2" fill="#334155" xml:space="preserve">没有 giaddr，服务器不知道客户端属于哪个子网。</text>
<text x="52" y="616" font-size="10.2" fill="#334155" xml:space="preserve">option 82 可携带端口/用户信息做差异化分配。</text>
