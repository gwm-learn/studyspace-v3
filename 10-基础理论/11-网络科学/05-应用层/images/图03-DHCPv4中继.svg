<text x="609" y="199" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">服务器</text>
<line x1="691" y1="226" x2="691" y2="544" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="131" y1="270" x2="411" y2="270" stroke="#475569" stroke-width="2"/>
<polygon points="411,270 402,265.5 402,274.5" fill="#475569"/>
<text x="277" y="262" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">DISCOVER（广播）</text>
