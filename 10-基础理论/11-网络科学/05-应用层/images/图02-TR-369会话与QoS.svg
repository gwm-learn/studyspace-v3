<text x="56" y="614" font-size="10.2" fill="#334155" xml:space="preserve">QoS 0：最多一次，可能丢；QoS 1：至少一次，可能重复；QoS 2：恰好一次，开销最大。选哪个看消息能不能重复执行。</text>
<text x="56" y="632" font-size="10.2" fill="#334155" xml:space="preserve">订阅要限定 topic 权限：Broker 是信任中心，主题串错会让第三方看到不该看的数据。</text>
