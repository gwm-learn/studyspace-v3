<polygon points="590,488 581,483.5 581,492.5" fill="#dc2626"/>
<text x="176" y="481" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">断线 → 退避重连</text>
<rect x="40" y="560" width="880" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
