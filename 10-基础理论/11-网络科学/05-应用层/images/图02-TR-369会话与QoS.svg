<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">QoS 0/1/2 是消息投递语义，不是流程中的一步；断线重连是失败路径。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">Agent 与 Controller 都是客户端，都连 Broker——角色关系见本目录图 01。</text>
