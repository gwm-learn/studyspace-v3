<rect x="40" y="610" width="760" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="640" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="664" font-size="10.2" fill="#334155" xml:space="preserve">UPnP 没有认证，局域网内谁都能申请端口映射——这是它最大的安全争议。</text>
<text x="56" y="682" font-size="10.2" fill="#334155" xml:space="preserve">SSDP 组播不过路由器，跨网段/跨 VLAN 的发现通常失败，需要中继或手动指定。</text>
