<polygon points="83.9,294 79.4,303 88.4,303" fill="#dc2626"/>
<text x="496.22" y="356" font-size="9.4" fill="#dc2626" xml:space="preserve" font-weight="600" text-anchor="middle">到期 / 收到 NAK</text>
<rect x="60" y="400" width="1000" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="76" y="430" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="76" y="454" font-size="10.2" fill="#334155" xml:space="preserve">T1/T2 是租期的比例，不是固定值；续租是单播，重绑定是广播。</text>
<text x="76" y="472" font-size="10.2" fill="#334155" xml:space="preserve">收到 NAK 或租约到期才回 INIT——续租成功不存在「重新开始」这一步。</text>
