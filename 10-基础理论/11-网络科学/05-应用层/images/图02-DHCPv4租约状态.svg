<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · DHCPv4 租约状态：续租成功要回 BOUND</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">主链是 INIT → BOUND；T1 单播续租、T2 广播重绑定，续租成功都回到 BOUND。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">只有租约彻底到期或被 NAK，才回 INIT 重新 DORA。</text>
