<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1100" height="740" fill="#ffffff"/>
<line x1="36" y1="112" x2="1064" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 04 · OSPF 与 BGP 邻居状态：两条独立的状态链</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">OSPF 七态、BGP 六态；BGP 的 Connect/Active 是重试循环，不是前进。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">两者都先建邻接、再谈路由：OSPF 到 Full、BGP 到 Established 才开始交换路由。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">正常推进</text>
<line x1="142" y1="142" x2="172" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="180" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">已完成</text>
<line x1="237" y1="142" x2="267" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="275" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">失败/重试</text>
<text x="60" y="182" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① OSPF：Down → Full（7 态）</text>
<rect x="60" y="210" width="46.48" height="44" fill="#f8fafc" rx="6" stroke="#475569" stroke-width="1.2"/>
<text x="83.24" y="232" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">Down</text>
<text x="83.24" y="244" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">初始</text>
<rect x="180" y="210" width="70.16" height="44" fill="#fff9ee" rx="6" stroke="#d97706" stroke-width="1.2"/>
<text x="215.08" y="232" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">Init</text>
<text x="215.08" y="244" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">收到 Hello</text>
<rect x="300" y="210" width="56.4" height="44" fill="#fff9ee" rx="6" stroke="#d97706" stroke-width="1.2"/>
<text x="328.2" y="232" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">2-Way</text>
<text x="328.2" y="244" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">双向通信</text>
<rect x="430" y="210" width="64.84" height="44" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.2"/>
<text x="462.42" y="232" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">ExStart</text>
<text x="462.42" y="244" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">主从选举</text>
<rect x="560" y="210" width="70.96" height="44" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.2"/>
<text x="595.48" y="232" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">Exchange</text>
<text x="595.48" y="244" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">交换 DBD</text>
<rect x="700" y="210" width="64.84" height="44" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.2"/>
<text x="732.42" y="232" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">Loading</text>
<text x="732.42" y="244" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">请求 LSA</text>
<rect x="840" y="210" width="56.4" height="44" fill="#f2fcf5" rx="6" stroke="#0f9d58" stroke-width="1.2"/>
<text x="868.2" y="232" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">Full</text>
<text x="868.2" y="244" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">邻接完成</text>
<line x1="106.48" y1="232" x2="180" y2="232" stroke="#475569" stroke-width="1.6"/>
<polygon points="180,232 171,227.5 171,236.5" fill="#475569"/>
<text x="143.24" y="225" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">收 Hello</text>
<line x1="250.16" y1="232" x2="300" y2="232" stroke="#d97706" stroke-width="1.6"/>
<polygon points="300,232 291,227.5 291,236.5" fill="#d97706"/>
<text x="275.08" y="225" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">含自身 RID</text>
<line x1="356.4" y1="232" x2="430" y2="232" stroke="#d97706" stroke-width="1.6"/>
<polygon points="430,232 421,227.5 421,236.5" fill="#d97706"/>
<text x="393.2" y="225" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">DR 选举后</text>
<line x1="494.84" y1="232" x2="560" y2="232" stroke="#4f46e5" stroke-width="1.6"/>
<polygon points="560,232 551,227.5 551,236.5" fill="#4f46e5"/>
<text x="527.42" y="225" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">主从确定</text>
<line x1="630.96" y1="232" x2="700" y2="232" stroke="#4f46e5" stroke-width="1.6"/>
<polygon points="700,232 691,227.5 691,236.5" fill="#4f46e5"/>
<text x="665.48" y="225" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">DBD 完</text>
<line x1="764.84" y1="232" x2="840" y2="232" stroke="#0f9d58" stroke-width="1.6"/>
<polygon points="840,232 831,227.5 831,236.5" fill="#0f9d58"/>
<text x="802.42" y="225" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">LSU 补齐</text>
<text x="60" y="300" font-size="9.4" fill="#64748b" xml:space="preserve">非 DR/BDR 之间停在 2-Way；Dead 计时器超时回 Down。</text>
<text x="60" y="350" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② BGP：Idle → Established（6 态）</text>
<rect x="60" y="380" width="71.88" height="44" fill="#f8fafc" rx="6" stroke="#475569" stroke-width="1.2"/>
<text x="95.94" y="402" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">Idle</text>
<text x="95.94" y="414" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">初始 / 出错</text>
<rect x="190" y="380" width="80.48" height="44" fill="#fff9ee" rx="6" stroke="#d97706" stroke-width="1.2"/>
<text x="230.24" y="402" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">Connect</text>
<text x="230.24" y="414" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">发起 TCP 179</text>
<rect x="360" y="380" width="70.96" height="44" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.2"/>
<text x="395.48" y="402" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">OpenSent</text>
<text x="395.48" y="414" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">已发 OPEN</text>
<rect x="540" y="380" width="89.32" height="44" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.2"/>
<text x="584.66" y="402" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">OpenConfirm</text>
<text x="584.66" y="414" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">等 Keepalive</text>
<rect x="730" y="380" width="89.32" height="44" fill="#f2fcf5" rx="6" stroke="#0f9d58" stroke-width="1.2"/>
<text x="774.66" y="402" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">Established</text>
<text x="774.66" y="414" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">交换 Update</text>
<rect x="190" y="480" width="59.84" height="44" fill="#fff5f5" rx="6" stroke="#dc2626" stroke-width="1.2"/>
<text x="219.92" y="502" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">Active</text>
<text x="219.92" y="514" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">重试 TCP</text>
<line x1="131.88" y1="402" x2="190" y2="402" stroke="#475569" stroke-width="1.6"/>
<polygon points="190,402 181,397.5 181,406.5" fill="#475569"/>
<text x="160.94" y="395" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">启动</text>
<line x1="270.48" y1="402" x2="360" y2="402" stroke="#4f46e5" stroke-width="1.6"/>
<polygon points="360,402 351,397.5 351,406.5" fill="#4f46e5"/>
<text x="315.24" y="395" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">TCP 建立</text>
<line x1="430.96" y1="402" x2="540" y2="402" stroke="#4f46e5" stroke-width="1.6"/>
<polygon points="540,402 531,397.5 531,406.5" fill="#4f46e5"/>
<text x="485.48" y="395" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">收 OPEN</text>
<line x1="629.32" y1="402" x2="730" y2="402" stroke="#0f9d58" stroke-width="1.6"/>
<polygon points="730,402 721,397.5 721,406.5" fill="#0f9d58"/>
<text x="679.66" y="395" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">收 Keepalive</text>
<line x1="230.24" y1="424" x2="219.92" y2="480" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3 3"/>
<polygon points="219.92,480 225.98,471.96 217.13,470.33" fill="#dc2626"/>
<text x="225.08" y="445" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">TCP 失败</text>
<line x1="219.92" y1="480" x2="219.92" y2="428" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3 3"/>
<polygon points="219.92,428 215.42,437 224.42,437" fill="#dc2626"/>
<text x="259.84" y="460" font-size="9.4" fill="#64748b" xml:space="preserve">重试</text>
<rect x="60" y="560" width="1000" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="76" y="590" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="76" y="614" font-size="10.2" fill="#334155" xml:space="preserve">BGP 的 Connect → Active 是「TCP 连不上，换一种方式重试」，不是进度；连上之后才进 OpenSent。</text>
<text x="76" y="632" font-size="10.2" fill="#334155" xml:space="preserve">Hold 计时器（默认 180s）超时、收到 Notification，或配置变化，都会回到 Idle 重新开始。</text>
<text x="36" y="686" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py 生成</text>
<text x="36" y="704" font-size="12.3" fill="#64748b" xml:space="preserve">本篇：10-基础理论/11-网络科学/03-网络层/04-路由与路由协议.md</text>
</svg>
