<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 04 · OSPF 与 BGP 邻居状态：先建邻接，再谈路由</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">OSPF 从 Down 到 Full 要同步数据库；Full 才参与 SPF。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">BGP 从 Idle 到 Established 先建 TCP 会话，再交换 Update。</text>
