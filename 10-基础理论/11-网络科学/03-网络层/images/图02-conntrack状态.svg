<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1000" height="620" fill="#ffffff"/>
<line x1="36" y1="112" x2="964" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · conntrack 状态：查表结果，不是一条时间线</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">NEW 与 ESTABLISHED 是同一条连接的两个阶段；INVALID 不是它的后继，而是查表失败。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">RELATED 由已建立连接派生，会生成独立表项。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">连接阶段</text>
<line x1="142" y1="142" x2="172" y2="142" stroke="#0891b2" stroke-width="3"/>
<text x="180" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">派生新表项</text>
<line x1="259" y1="142" x2="289" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="297" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">查表失败</text>
<rect x="60" y="250" width="95.96" height="44" fill="#f8fafc" rx="6" stroke="#475569" stroke-width="1.2"/>
<text x="107.98" y="272" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">报文到达</text>
<text x="107.98" y="284" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">查 conntrack 表</text>
<rect x="230" y="250" width="73.6" height="44" fill="#fff9ee" rx="6" stroke="#d97706" stroke-width="1.2"/>
<text x="266.8" y="272" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">NEW</text>
<text x="266.8" y="284" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">首包，建表项</text>
<rect x="400" y="250" width="89.32" height="44" fill="#f2fcf5" rx="6" stroke="#0f9d58" stroke-width="1.2"/>
<text x="444.66" y="272" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">ESTABLISHED</text>
<text x="444.66" y="284" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">双向都通过</text>
<rect x="620" y="160" width="118.32" height="44" fill="#ecfeff" rx="6" stroke="#0891b2" stroke-width="1.2"/>
<text x="679.16" y="182" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">RELATED</text>
<text x="679.16" y="194" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">FTP 数据 / ICMP 错误</text>
<rect x="400" y="360" width="121.76" height="44" fill="#fff5f5" rx="6" stroke="#dc2626" stroke-width="1.2"/>
<text x="460.88" y="382" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">INVALID</text>
<text x="460.88" y="394" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">畸形 / 超时 / 状态不符</text>
<line x1="155.96" y1="272" x2="230" y2="272" stroke="#475569" stroke-width="1.8"/>
<polygon points="230,272 221,267.5 221,276.5" fill="#475569"/>
<text x="192.98" y="265" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">无表项</text>
<line x1="303.6" y1="272" x2="400" y2="272" stroke="#0f9d58" stroke-width="1.8"/>
<polygon points="400,272 391,267.5 391,276.5" fill="#0f9d58"/>
<text x="351.8" y="265" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">收到回包</text>
<line x1="489.32" y1="272" x2="620" y2="182" stroke="#0891b2" stroke-width="1.6" stroke-dasharray="3 3"/>
<polygon points="620,182 610.04,183.4 615.14,190.81" fill="#0891b2"/>
<text x="554.66" y="220" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">派生</text>
<line x1="155.96" y1="272" x2="400" y2="382" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3 3"/>
<polygon points="400,382 393.64,374.2 389.95,382.4" fill="#dc2626"/>
<text x="277.98" y="320" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">查表失败</text>
<rect x="60" y="450" width="900" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="76" y="480" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="76" y="504" font-size="10.2" fill="#334155" xml:space="preserve">INVALID 的上一跳是「报文」，不是 ESTABLISHED——已建立的连接不会因为超时变成 INVALID，超时是表项被删除。</text>
<text x="76" y="522" font-size="10.2" fill="#334155" xml:space="preserve">只有新连接的首包走 NAT 规则，后续包由 conntrack 直接翻译；表满时表现为「老连接正常、新连接建不上」。</text>
<text x="36" y="566" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py 生成</text>
<text x="36" y="584" font-size="12.3" fill="#64748b" xml:space="preserve">本篇：10-基础理论/11-网络科学/03-网络层/05-NAT.md</text>
</svg>
