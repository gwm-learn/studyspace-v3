<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="580" viewBox="0 0 1180 580" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1180" height="580" fill="#ffffff"/>
<line x1="36" y1="112" x2="1144" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · IPv4 分片字段：同一 ID，按 8 字节偏移</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">Identification 让目的主机把分片归到同一个包。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">DF 禁止分片，MF 表示还有后续，Offset 以 8 字节为单位。</text>
