<text x="111" y="261" font-size="8.8" fill="#64748b" xml:space="preserve" text-anchor="middle">16b</text>
<rect x="186" y="220" width="70" height="54" fill="#fff5f5" rx="4" stroke="#dc2626" stroke-width="1.1"/>
<text x="221" y="244" font-size="9.6" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">DF</text>
<text x="221" y="261" font-size="8.8" fill="#64748b" xml:space="preserve" text-anchor="middle">1b</text>
<rect x="256" y="220" width="70" height="54" fill="#fff9ee" rx="4" stroke="#d97706" stroke-width="1.1"/>
<text x="291" y="244" font-size="9.6" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">MF</text>
<text x="291" y="261" font-size="8.8" fill="#64748b" xml:space="preserve" text-anchor="middle">1b</text>
<rect x="326" y="220" width="150" height="54" fill="#ecfeff" rx="4" stroke="#0891b2" stroke-width="1.1"/>
<text x="401" y="244" font-size="9.6" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">片偏移</text>
<text x="401" y="261" font-size="8.8" fill="#64748b" xml:space="preserve" text-anchor="middle">13b</text>
<rect x="476" y="220" width="150" height="54" fill="#eef2ff" rx="4" stroke="#4f46e5" stroke-width="1.1"/>
<text x="551" y="244" font-size="9.6" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">总长度</text>
<text x="551" y="261" font-size="8.8" fill="#64748b" xml:space="preserve" text-anchor="middle">16b</text>
<line x1="36" y1="301" x2="54" y2="301" stroke="#0891b2" stroke-width="3"/>
<text x="62" y="308" font-size="9.4" fill="#334155" xml:space="preserve">标识 · 16b · 同一数据报共享</text>
<line x1="596" y1="301" x2="614" y2="301" stroke="#dc2626" stroke-width="3"/>
<text x="622" y="308" font-size="9.4" fill="#334155" xml:space="preserve">DF · 1b · 禁止分片</text>
<line x1="36" y1="325" x2="54" y2="325" stroke="#d97706" stroke-width="3"/>
<text x="62" y="332" font-size="9.4" fill="#334155" xml:space="preserve">MF · 1b · 还有分片</text>
<line x1="596" y1="325" x2="614" y2="325" stroke="#0891b2" stroke-width="3"/>
<text x="622" y="332" font-size="9.4" fill="#334155" xml:space="preserve">片偏移 · 13b · 单位 8 字节</text>
<line x1="36" y1="349" x2="54" y2="349" stroke="#4f46e5" stroke-width="3"/>
<text x="62" y="356" font-size="9.4" fill="#334155" xml:space="preserve">总长度 · 16b · 本片长度</text>
<rect x="36" y="400" width="1100" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="430" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图提示</text>
<text x="52" y="454" font-size="10.2" fill="#334155" xml:space="preserve">除最后一片外，每片数据长度必须是 8 的倍数。</text>
<text x="52" y="472" font-size="10.2" fill="#334155" xml:space="preserve">丢一片，整个数据报报废。</text>
