<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="620" viewBox="0 0 1140 620" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1140" height="620" fill="#ffffff"/>
<line x1="36" y1="112" x2="1104" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · SNAT 与 DNAT：改地址，记映射</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">两条路径方向相反：SNAT 改源地址出网，DNAT 改目的地址入网。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">只有新连接的首包走 NAT 规则，后续包由 conntrack 直接翻译。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">SNAT</text>
<line x1="124.4" y1="142" x2="154.4" y2="142" stroke="#0891b2" stroke-width="3"/>
<text x="162.4" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">DNAT</text>
<line x1="212.8" y1="142" x2="242.8" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="250.8" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">回程 / 还原</text>
<text x="40" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① SNAT：内网访问公网</text>
<rect x="40" y="200" width="180.24" height="44" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.2"/>
<text x="130.12" y="222" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">内网发包</text>
<text x="130.12" y="234" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">192.168.1.10:5000 → 8.8.8.8:53</text>
<rect x="310" y="200" width="166.48" height="44" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.2"/>
<text x="393.24" y="222" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">改源</text>
<text x="393.24" y="234" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">→ 1.2.3.4:6000，记 conntrack</text>
<rect x="580" y="200" width="106.28" height="44" fill="#f2fcf5" rx="6" stroke="#0f9d58" stroke-width="1.2"/>
<text x="633.14" y="222" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">服务器回包</text>
<text x="633.14" y="234" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">目的 1.2.3.4:6000</text>
<rect x="850" y="200" width="123.48" height="44" fill="#f2fcf5" rx="6" stroke="#0f9d58" stroke-width="1.2"/>
<text x="911.74" y="222" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">查表还原</text>
<text x="911.74" y="234" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">→ 192.168.1.10:5000</text>
<line x1="220.24" y1="222" x2="310" y2="222" stroke="#4f46e5" stroke-width="1.6"/>
<polygon points="310,222 301,217.5 301,226.5" fill="#4f46e5"/>
<line x1="476.48" y1="222" x2="580" y2="222" stroke="#475569" stroke-width="1.6"/>
<polygon points="580,222 571,217.5 571,226.5" fill="#475569"/>
<line x1="686.28" y1="222" x2="850" y2="222" stroke="#0f9d58" stroke-width="1.6"/>
<polygon points="850,222 841,217.5 841,226.5" fill="#0f9d58"/>
<text x="40" y="330" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② DNAT：公网访问内网（端口映射）</text>
<rect x="40" y="354" width="83.92" height="44" fill="#ecfeff" rx="6" stroke="#0891b2" stroke-width="1.2"/>
<text x="81.96" y="376" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">公网访问</text>
<text x="81.96" y="388" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">1.2.3.4:8080</text>
<rect x="310" y="354" width="181.96" height="44" fill="#ecfeff" rx="6" stroke="#0891b2" stroke-width="1.2"/>
<text x="400.98" y="376" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">改目的</text>
<text x="400.98" y="388" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">→ 192.168.1.20:80，记 conntrack</text>
<rect x="580" y="354" width="113.16" height="44" fill="#f2fcf5" rx="6" stroke="#0f9d58" stroke-width="1.2"/>
<text x="636.58" y="376" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">内网回包</text>
<text x="636.58" y="388" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">源 192.168.1.20:80</text>
<rect x="850" y="354" width="171.64" height="44" fill="#f2fcf5" rx="6" stroke="#0f9d58" stroke-width="1.2"/>
<text x="935.82" y="376" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">源改回</text>
<text x="935.82" y="388" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">→ 1.2.3.4:8080，常需 SNAT 配合</text>
<line x1="123.92" y1="376" x2="310" y2="376" stroke="#0891b2" stroke-width="1.6"/>
<polygon points="310,376 301,371.5 301,380.5" fill="#0891b2"/>
<line x1="491.96" y1="376" x2="580" y2="376" stroke="#475569" stroke-width="1.6"/>
<polygon points="580,376 571,371.5 571,380.5" fill="#475569"/>
<line x1="693.16" y1="376" x2="850" y2="376" stroke="#0f9d58" stroke-width="1.6"/>
<polygon points="850,376 841,371.5 841,380.5" fill="#0f9d58"/>
<rect x="40" y="450" width="1060" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="480" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="504" font-size="10.2" fill="#334155" xml:space="preserve">「记 conntrack」是两条路径的共同点：没有会话表，回包就不知道还原成谁。</text>
<text x="56" y="522" font-size="10.2" fill="#334155" xml:space="preserve">NAT 不是防火墙：隐藏内网 ≠ 访问控制；对称 NAT 下 P2P 打洞最难，常需中继。</text>
<text x="36" y="566" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py 生成</text>
