<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1180" height="640" fill="#ffffff"/>
<line x1="36" y1="112" x2="1144" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · VRRP 主备切换：终端只认虚拟网关</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">Master 持有虚拟 IP/MAC 并周期通告；Backup 收不到就接管。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">切换后发免费 ARP，刷新虚拟 IP → 虚拟 MAC 的映射。</text>
