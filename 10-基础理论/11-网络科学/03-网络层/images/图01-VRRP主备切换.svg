<text x="53" y="391.4" font-size="9.6" fill="#334155" xml:space="preserve">不知道主备</text>
<rect x="330" y="180" width="190" height="64" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
