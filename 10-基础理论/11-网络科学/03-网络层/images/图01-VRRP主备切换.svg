<rect x="36" y="460" width="1100" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="490" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图提示</text>
<text x="52" y="514" font-size="10.2" fill="#334155" xml:space="preserve">双 Master 常见于组播被隔离或 VRID 冲突。</text>
<text x="52" y="532" font-size="10.2" fill="#334155" xml:space="preserve">VRRP 只保网关，不保上行链路与会话状态。</text>
<text x="36" y="586" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py</text>
