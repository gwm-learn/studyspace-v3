<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">缺片补齐就重组完成；计时器到期就整包丢弃——两者是并行分支，不是先后步骤。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">ICMP 超时是可选动作，由丢弃触发。</text>
