<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">等待</text>
<line x1="204" y1="142" x2="234" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="242" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">丢弃</text>
<rect x="60" y="250" width="121.76" height="44" fill="#f8fafc" rx="6" stroke="#475569" stroke-width="1.2"/>
<text x="120.88" y="272" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">分片到达</text>
<text x="120.88" y="284" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">按 ID/源/目的/协议聚合</text>
<rect x="250" y="250" width="62.8" height="44" fill="#fff9ee" rx="6" stroke="#d97706" stroke-width="1.2"/>
<text x="281.4" y="272" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">缓存等待</text>
<text x="281.4" y="284" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">缺片就等</text>
<rect x="450" y="175" width="123.48" height="44" fill="#f2fcf5" rx="6" stroke="#0f9d58" stroke-width="1.2"/>
<text x="511.74" y="197" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">重组完成</text>
<text x="511.74" y="209" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">按 offset 拼好，交上层</text>
