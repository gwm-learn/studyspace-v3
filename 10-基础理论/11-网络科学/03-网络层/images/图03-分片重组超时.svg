<text x="746.9" y="367" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">ICMP 超时（可选）</text>
<text x="746.9" y="379" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">通知源端</text>
