<polygon points="450,197 439.94,197.37 444.26,205.27" fill="#0f9d58"/>
<text x="381.4" y="227.5" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">缺片补齐</text>
<line x1="312.8" y1="272" x2="450" y2="367" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3 3"/>
<polygon points="450,367 445.16,358.18 440.04,365.58" fill="#dc2626"/>
<text x="381.4" y="312.5" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">超时 30–60s</text>
<line x1="558" y1="367" x2="690" y2="367" stroke="#475569" stroke-width="1.6" stroke-dasharray="3 3"/>
<polygon points="690,367 681,362.5 681,371.5" fill="#475569"/>
<text x="624" y="360" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">可选</text>
<rect x="60" y="440" width="940" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="76" y="470" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="76" y="494" font-size="10.2" fill="#334155" xml:space="preserve">「重组完成」和「超时丢弃」都从「缓存等待」分出：一个包不可能既重组成功又超时。</text>
<text x="76" y="512" font-size="10.2" fill="#334155" xml:space="preserve">超时值 IPv4 常见 30–60 秒、IPv6 建议 60 秒；分片攻击靠队列上限 + 超时双重防御。</text>
