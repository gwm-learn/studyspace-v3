<text x="504" y="367" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">超时丢弃</text>
<text x="504" y="379" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">计时器到期，整包丢弃</text>
