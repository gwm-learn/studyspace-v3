<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1180" height="680" fill="#ffffff"/>
<line x1="36" y1="112" x2="1144" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 03 · IPv6 NDP：NS/NA 取代 ARP，RS/RA 配地址</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">解析邻居用 NS/NA；主机用 RS 请求 RA，按前缀做 SLAAC。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">地址可用前用 NS 做 DAD，收到 NA 说明冲突。</text>
<rect x="36" y="180" width="190" height="46" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="36" y="180" width="4.5" height="46" fill="#0f9d58" rx="2"/>
<text x="49" y="199" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">主机</text>
<line x1="131" y1="226" x2="131" y2="500" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="316" y="180" width="190" height="46" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="316" y="180" width="4.5" height="46" fill="#4f46e5" rx="2"/>
<text x="329" y="199" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">邻居</text>
<line x1="411" y1="226" x2="411" y2="500" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="596" y="180" width="190" height="46" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="596" y="180" width="4.5" height="46" fill="#d97706" rx="2"/>
<text x="609" y="199" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">路由器</text>
<line x1="691" y1="226" x2="691" y2="500" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="131" y1="270" x2="411" y2="270" stroke="#475569" stroke-width="2"/>
<polygon points="411,270 402,265.5 402,274.5" fill="#475569"/>
<text x="277" y="262" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">NS：谁是 2001:db8::B？</text>
<line x1="411" y1="314" x2="131" y2="314" stroke="#475569" stroke-width="2"/>
<polygon points="131,314 140,318.5 140,309.5" fill="#475569"/>
<text x="277" y="306" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">NA：我是，MAC 是…</text>
<line x1="131" y1="358" x2="691" y2="358" stroke="#475569" stroke-width="2" stroke-dasharray="3 3"/>
<polygon points="691,358 682,353.5 682,362.5" fill="#475569"/>
<text x="417" y="350" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">RS：请发路由器通告</text>
<line x1="691" y1="402" x2="131" y2="402" stroke="#475569" stroke-width="2" stroke-dasharray="3 3"/>
<polygon points="131,402 140,406.5 140,397.5" fill="#475569"/>
<text x="417" y="394" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">RA：前缀 / MTU / M/O/A</text>
<line x1="131" y1="446" x2="131" y2="446" stroke="#475569" stroke-width="2"/>
<polygon points="131,446 122,441.5 122,450.5" fill="#475569"/>
<text x="137" y="438" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">DAD：NS 问自己地址</text>
<rect x="36" y="500" width="1100" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="530" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图提示</text>
<text x="52" y="554" font-size="10.2" fill="#334155" xml:space="preserve">NS/NA 用组播，不用广播。</text>
<text x="52" y="572" font-size="10.2" fill="#334155" xml:space="preserve">RA 的 A/M/O 决定 SLAAC 与 DHCPv6 组合。</text>
<text x="36" y="626" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py</text>
