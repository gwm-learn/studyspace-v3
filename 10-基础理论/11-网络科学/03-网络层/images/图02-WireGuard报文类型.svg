<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="860" height="640" fill="#ffffff"/>
<line x1="36" y1="112" x2="824" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · WireGuard 报文类型：三步握手 + 一个 Cookie 分支</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">Initiation → Response → Transport Data 是正常路径；Cookie Reply 是负载过高时的替代分支。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">没有明文协商，算法套件固定；重协商（rekey）走的是同一套报文。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">正常路径</text>
<line x1="142" y1="142" x2="172" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="180" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">应答</text>
<line x1="226" y1="142" x2="256" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="264" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">异常分支</text>
<rect x="40" y="190" width="260" height="42" fill="#f1f5f9" rx="8" stroke="#4f46e5" stroke-width="1"/>
<text x="52" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">发起方</text>
<rect x="500" y="190" width="260" height="42" fill="#f1f5f9" rx="8" stroke="#0f9d58" stroke-width="1"/>
<text x="512" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">响应方</text>
<line x1="170" y1="232" x2="170" y2="392" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="630" y1="232" x2="630" y2="392" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="170" y1="260" x2="630" y2="260" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="630,260 621,255.5 621,264.5" fill="#4f46e5"/>
<text x="176" y="253" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">① Handshake Initiation（携带加密身份）</text>
<line x1="630" y1="298" x2="170" y2="298" stroke="#0f9d58" stroke-width="1.8" stroke-dasharray="3 3"/>
<polygon points="170,298 179,302.5 179,293.5" fill="#0f9d58"/>
<text x="176" y="291" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">② Handshake Response（完成密钥）</text>
<line x1="170" y1="336" x2="630" y2="336" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="630,336 621,331.5 621,340.5" fill="#4f46e5"/>
<text x="176" y="329" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">③ Transport Data（加密 IP 包 + 计数器）</text>
<line x1="630" y1="374" x2="170" y2="374" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3 3"/>
<polygon points="170,374 179,378.5 179,369.5" fill="#dc2626"/>
<text x="176" y="367" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">异常：Cookie Reply（负载高，要求带 MAC 重试）</text>
<rect x="40" y="470" width="780" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="500" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="524" font-size="10.2" fill="#334155" xml:space="preserve">Cookie Reply 只在响应方承受压力时出现：它不建立密钥，只要求对方证明地址可达，防 DoS。</text>
<text x="56" y="542" font-size="10.2" fill="#334155" xml:space="preserve">Transport Data 的计数器用于防重放；收到超窗口的包直接丢弃，不会重传。</text>
<text x="36" y="586" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py 生成</text>
<text x="36" y="604" font-size="12.3" fill="#64748b" xml:space="preserve">本篇：10-基础理论/11-网络科学/03-网络层/09-WireGuard.md</text>
</svg>
