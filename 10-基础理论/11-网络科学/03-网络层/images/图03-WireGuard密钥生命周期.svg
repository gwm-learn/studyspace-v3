<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 03 · WireGuard 密钥生命周期：重协商是循环，旧密钥有宽限</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">Rekey 不结束会话，而是换一把新密钥，回到「使用」。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">旧密钥不会立刻作废：超过 reject-after 硬上限才真正失效。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">主链</text>
