<text x="114" y="272" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">握手</text>
<text x="114" y="284" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">Noise_IK · 1-RTT</text>
<rect x="240" y="250" width="120.04" height="44" fill="#f2fcf5" rx="6" stroke="#0f9d58" stroke-width="1.2"/>
<text x="300.02" y="272" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">使用</text>
<text x="300.02" y="284" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">加密 IP 包，计数防重放</text>
<rect x="470" y="250" width="121.76" height="44" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.2"/>
<text x="530.88" y="272" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">Rekey</text>
<text x="530.88" y="284" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">约 2 分钟 / 消息数上限</text>
<rect x="470" y="360" width="93.4" height="44" fill="#fff9ee" rx="6" stroke="#d97706" stroke-width="1.2"/>
<text x="516.7" y="382" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">旧密钥（宽限）</text>
<text x="516.7" y="394" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">仍可解密旧包</text>
<rect x="720" y="360" width="128.64" height="44" fill="#fff5f5" rx="6" stroke="#dc2626" stroke-width="1.2"/>
<text x="784.32" y="382" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">失效</text>
<text x="784.32" y="394" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">超 reject-after 硬上限</text>
<line x1="168" y1="272" x2="240" y2="272" stroke="#4f46e5" stroke-width="1.8"/>
