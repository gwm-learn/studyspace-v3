<text x="204" y="265" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">会话密钥就绪</text>
<line x1="360.04" y1="272" x2="470" y2="272" stroke="#d97706" stroke-width="1.8"/>
<polygon points="470,272 461,267.5 461,276.5" fill="#d97706"/>
<text x="415.02" y="265" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">到时间 / 到消息数</text>
<line x1="563.4" y1="382" x2="720" y2="382" stroke="#dc2626" stroke-width="1.8"/>
<polygon points="720,382 711,377.5 711,386.5" fill="#dc2626"/>
<text x="641.7" y="375" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">超硬上限</text>
<line x1="360.04" y1="272" x2="470" y2="382" stroke="#d97706" stroke-width="1.6" stroke-dasharray="3 3"/>
<polygon points="470,382 466.82,372.45 460.45,378.82" fill="#d97706"/>
<text x="415.02" y="320" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">被新密钥替换</text>
<line x1="530.88" y1="250" x2="530.88" y2="196" stroke="#4f46e5" stroke-width="1.8"/>
<line x1="530.88" y1="196" x2="300.02" y2="196" stroke="#4f46e5" stroke-width="1.8"/>
<line x1="300.02" y1="196" x2="300.02" y2="250" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="300.02,250 304.52,241 295.52,241" fill="#4f46e5"/>
<text x="415.45" y="188" font-size="9.6" fill="#4f46e5" xml:space="preserve" font-weight="600" text-anchor="middle">新密钥生效，重新计时</text>
<rect x="60" y="450" width="1000" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="76" y="480" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="76" y="504" font-size="10.2" fill="#334155" xml:space="preserve">重协商是循环：发起方到 2 分钟左右主动换密钥，对端在宽限期内仍能用旧密钥解密，避免在途包被丢弃。</text>
<text x="76" y="522" font-size="10.2" fill="#334155" xml:space="preserve">真正「拒绝」只发生在超过 reject-after（时间或消息数）之后；PersistentKeepalive 只维持 NAT 映射，不参与密钥生命周期。</text>
