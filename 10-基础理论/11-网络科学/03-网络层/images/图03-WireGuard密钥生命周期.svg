<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">新旧并存</text>
<line x1="226" y1="142" x2="256" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="264" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">失效</text>
