<rect x="36" y="396" width="1100" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="426" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图提示</text>
<text x="52" y="450" font-size="10.2" fill="#334155" xml:space="preserve">到 10.1.2.9 的包命中 /24，而不是 /8 或默认路由。</text>
<text x="52" y="468" font-size="10.2" fill="#334155" xml:space="preserve">管理距离决定“信谁”，metric 决定“同协议内谁更优”。</text>
