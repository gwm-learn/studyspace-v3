<text x="349.7" y="272" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">Backup</text>
<text x="349.7" y="284" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">监听通告，准备接管</text>
<rect x="560" y="250" width="114.88" height="44" fill="#f2fcf5" rx="6" stroke="#0f9d58" stroke-width="1.2"/>
<text x="617.44" y="272" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">Master</text>
