<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">启动后进入 Initialize，参与选举；未当选进入 Backup。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">Backup 超时未收到通告就升为 Master；Master 故障后回到 Backup。</text>
