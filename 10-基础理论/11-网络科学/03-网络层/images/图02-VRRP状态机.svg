<text x="483.57" y="188" font-size="9.6" fill="#dc2626" xml:space="preserve" font-weight="600" text-anchor="middle">收到更高优先级通告</text>
<line x1="617.44" y1="294" x2="617.44" y2="340" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3 3"/>
<line x1="617.44" y1="340" x2="104.54" y2="340" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3 3"/>
<line x1="104.54" y1="340" x2="104.54" y2="294" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3 3"/>
<polygon points="104.54,294 100.04,303 109.04,303" fill="#dc2626"/>
<text x="360.99" y="356" font-size="9.6" fill="#dc2626" xml:space="preserve" font-weight="600" text-anchor="middle">接口 down / 配置变化</text>
<rect x="60" y="410" width="900" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="76" y="440" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="76" y="464" font-size="10.2" fill="#334155" xml:space="preserve">「抢占」是 Backup → Master 方向：高优先级备机等 Skew_Time 后主动接管；Master 不会因为「被抢占」而自己降级，它是收到了更高优先级的通告才让位。</text>
<text x="76" y="482" font-size="10.2" fill="#334155" xml:space="preserve">上电即主：优先级 255 或拥有虚拟 IP 的设备从 Initialize 直接进 Master。</text>
