<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">转发中</text>
<line x1="215" y1="142" x2="245" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="253" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">让位 / 失效</text>
<rect x="60" y="250" width="89.08" height="44" fill="#f8fafc" rx="6" stroke="#475569" stroke-width="1.2"/>
<text x="104.54" y="272" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">Initialize</text>
<text x="104.54" y="284" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">启动 / 配置变化</text>
