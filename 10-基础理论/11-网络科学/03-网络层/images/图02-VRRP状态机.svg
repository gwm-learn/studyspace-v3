<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · VRRP 状态机：三个状态与四条迁移</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">主链 Initialize → Backup → Master；抢占是 Backup 抢 Master，不是 Master 让位给「抢占」。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">Master 让位只有一种原因：收到更高优先级的通告（或被关闭）。</text>
