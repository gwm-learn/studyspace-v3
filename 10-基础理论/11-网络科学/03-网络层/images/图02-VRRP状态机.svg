<text x="479.7" y="265" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">Master_Down 超时 / 抢占</text>
<line x1="617.44" y1="250" x2="617.44" y2="196" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3 3"/>
<line x1="617.44" y1="196" x2="349.7" y2="196" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3 3"/>
