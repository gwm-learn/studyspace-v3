<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="480" viewBox="0 0 1180 480" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1180" height="480" fill="#ffffff"/>
<line x1="36" y1="112" x2="1144" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · 物理层发送接收链：比特怎么上路</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">MAC 交出比特流，PHY 负责编码、串行化、驱动；接收端反向恢复。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">链路 up 只说明信号与协商就绪，不代表对端可达。</text>
