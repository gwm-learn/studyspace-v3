<text x="729" y="226" font-size="8.8" fill="#334155" xml:space="preserve">均衡 / 时钟恢复</text>
<text x="729" y="241.4" font-size="8.8" fill="#334155" xml:space="preserve">判决</text>
<line x1="874" y1="231" x2="886" y2="231" stroke="#94a3b8" stroke-width="1.5"/>
