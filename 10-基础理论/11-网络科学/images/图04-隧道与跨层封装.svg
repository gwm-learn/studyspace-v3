<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1180" height="600" fill="#ffffff"/>
<line x1="36" y1="112" x2="1144" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 04 · 隧道与跨层：按载荷归层</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">同样的 UDP 外层，承载以太帧就归链路层，承载 IP 包就归网络层。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">看“承载对象”一列，而不是看端口号。</text>
<rect x="36" y="190" width="1100" height="30" fill="#f1f5f9" rx="6"/>
