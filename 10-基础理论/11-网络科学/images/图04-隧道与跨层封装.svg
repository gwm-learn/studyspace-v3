<line x1="36" y1="400" x2="1136" y2="400" stroke="#e2e8f0" stroke-width="0.8"/>
<rect x="36" y="426" width="1100" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="456" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图提示</text>
<text x="52" y="480" font-size="10.2" fill="#334155" xml:space="preserve">L2TP 跑 UDP 但归链路层，因为承载 PPP 帧。</text>
