<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · L2TP 隧道与会话：一条隧道，多条 PPP</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">LAC 把 PPP 帧封进 L2TP，经 UDP 送到 LNS；LNS 终结 PPP。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">隧道是外层，会话是内层；一个隧道可承载多个 PPP 会话。</text>
