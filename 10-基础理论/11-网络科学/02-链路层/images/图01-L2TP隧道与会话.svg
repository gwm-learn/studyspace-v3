<text x="1230" y="403.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">内层载荷</text>
<rect x="40" y="446" width="1240" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="476" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="500" font-size="10.2" fill="#334155" xml:space="preserve">一个 Tunnel ID 下可以有多条 Session ID：隧道断了，所有会话一起断；单条会话断开不影响其他。</text>
<text x="56" y="518" font-size="10.2" fill="#334155" xml:space="preserve">控制消息可靠（序号 + 重传），数据消息不可靠；封装开销约 38–42 字节，要注意 MTU/MSS。</text>
