<text x="912" y="357.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">L2TP 头：Session ID</text>
<text x="1230" y="357.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">每条 PPP</text>
