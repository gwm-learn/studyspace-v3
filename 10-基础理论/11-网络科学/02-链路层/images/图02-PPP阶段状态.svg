<text x="76" y="374" font-size="10.2" fill="#334155" xml:space="preserve">失败不回退到上一步，而是回到起点 Dead：Establish/Authenticate/Network 任一步失败，链路都要重新建。</text>
<text x="76" y="392" font-size="10.2" fill="#334155" xml:space="preserve">Open 之后靠 LCP Echo 保活；对端静默超时会先回到 Terminate，再回到 Dead。</text>
