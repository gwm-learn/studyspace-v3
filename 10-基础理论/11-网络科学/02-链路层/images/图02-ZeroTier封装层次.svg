<text x="163" y="312" font-size="9.6" fill="#334155" xml:space="preserve">虚拟交换机 / 广播组播</text>
<rect x="150" y="362" width="600" height="54" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="150" y="362" width="4.5" height="54" fill="#d97706" rx="2"/>
<text x="163" y="381" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">VL1</text>
<text x="163" y="398" font-size="9.6" fill="#334155" xml:space="preserve">身份、加密、HELLO、中继</text>
