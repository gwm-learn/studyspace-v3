<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · ZeroTier 封装层次：以太帧套进 UDP</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">内层是以太帧，VL2 做虚拟交换机，VL1 负责身份、加密与路径。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">外层仍是普通 UDP/IP，所以能穿过大多数 NAT。</text>
