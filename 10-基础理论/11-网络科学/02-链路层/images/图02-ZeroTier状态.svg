<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="560" viewBox="0 0 1140 560" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1140" height="560" fill="#ffffff"/>
<line x1="36" y1="112" x2="1104" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · ZeroTier 的四种状态：身份、权限、路径、接口</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">四者是并列的四个方面，不是四个步骤；任何一项不对，表现都是「连不上」。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">只有身份在本地持久，其余三项都随控制器和网络变化。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#475569" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">本地</text>
<line x1="120" y1="142" x2="150" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">控制器下发</text>
<line x1="237" y1="142" x2="267" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="275" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">动态</text>
<line x1="321" y1="142" x2="351" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="359" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">网络定义</text>
<rect x="40" y="190" width="250" height="168" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="40" y="190" width="4.5" height="168" fill="#475569" rx="2"/>
<text x="53" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">① 身份（本地持久）</text>
<text x="53" y="226" font-size="9.6" fill="#334155" xml:space="preserve">40 位地址 + 公私钥</text>
<text x="53" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">换机器要迁移，否则等于新节点</text>
<text x="53" y="256.8" font-size="9.6" fill="#334155" xml:space="preserve">坏了：无法加入任何网络</text>
<rect x="310" y="190" width="250" height="168" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="310" y="190" width="4.5" height="168" fill="#4f46e5" rx="2"/>
<text x="323" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">② 成员权限（控制器）</text>
<text x="323" y="226" font-size="9.6" fill="#334155" xml:space="preserve">是否授权、允许的 IP/路由</text>
<text x="323" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">定期刷新；控制器不可达时保留最后一次</text>
<text x="323" y="256.8" font-size="9.6" fill="#334155" xml:space="preserve">坏了：被踢出或权限过期</text>
<rect x="580" y="190" width="250" height="168" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="580" y="190" width="4.5" height="168" fill="#0f9d58" rx="2"/>
<text x="593" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">③ 对端路径（动态）</text>
<text x="593" y="226" font-size="9.6" fill="#334155" xml:space="preserve">直连优先，打不通走 root 中继</text>
<text x="593" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">HELLO 保活，路径会随时间切换</text>
<text x="593" y="256.8" font-size="9.6" fill="#334155" xml:space="preserve">坏了：UDP 9993 被拦则退化为中继</text>
<rect x="850" y="190" width="250" height="168" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="850" y="190" width="4.5" height="168" fill="#d97706" rx="2"/>
<text x="863" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">④ 虚拟接口（网络定义）</text>
<text x="863" y="226" font-size="9.6" fill="#334155" xml:space="preserve">IP / 路由 / MTU 来自网络定义</text>
<text x="863" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">二层接口，承载以太帧</text>
<text x="863" y="256.8" font-size="9.6" fill="#334155" xml:space="preserve">坏了：MTU 不匹配会丢大包</text>
<rect x="40" y="392" width="1060" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="422" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="446" font-size="10.2" fill="#334155" xml:space="preserve">排障顺序建议：先看身份与授权（能不能加入），再看路径（能不能直连），最后看接口参数（能不能通）。</text>
<text x="56" y="464" font-size="10.2" fill="#334155" xml:space="preserve">控制器不可达时节点会保留最后一次配置继续工作——这也是「配置改了但没生效」的常见原因。</text>
<text x="36" y="506" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py 生成</text>
<text x="36" y="524" font-size="12.3" fill="#64748b" xml:space="preserve">本篇：10-基础理论/11-网络科学/02-链路层/08-ZeroTier.md</text>
</svg>
