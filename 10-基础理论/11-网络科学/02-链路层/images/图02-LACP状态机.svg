<text x="76" y="374" font-size="10.2" fill="#334155" xml:space="preserve">四个状态只出现一次：Negotiating 是「正在协商」，不是「再次协商」——回退是走回退边，不是新状态。</text>
<text x="76" y="392" font-size="10.2" fill="#334155" xml:space="preserve">快模式 1s 发送 / 3s 超时；慢模式 30s / 90s。两端模式不一致时，一端判失效、另一端仍在发送，成员会反复上下线。</text>
