<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · STP/RSTP 端口状态：怎么进入转发，怎么退回去</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">STP 是一条主链加两条回退边；RSTP 把它压成三种状态，不是另一条支线。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">定时器只在 STP 中强依赖：Max Age 20s、Forward Delay 15s。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">主链</text>
