<text x="60" y="400" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② RSTP（802.1w）：3 种状态</text>
<rect x="60" y="420" width="83.2" height="44" fill="#f8fafc" rx="6" stroke="#475569" stroke-width="1.2"/>
