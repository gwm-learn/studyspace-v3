<line x1="415.64" y1="442" x2="520" y2="442" stroke="#0f9d58" stroke-width="1.8"/>
<polygon points="520,442 511,437.5 511,446.5" fill="#0f9d58"/>
<text x="467.82" y="435" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">学习完成</text>
<rect x="60" y="500" width="880" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="76" y="530" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="76" y="554" font-size="10.2" fill="#334155" xml:space="preserve">两套状态不是「新旧两条支线」：RSTP 把 Disabled/Blocking/Listening 合并成 Discarding，所以只有三种。</text>
<text x="76" y="572" font-size="10.2" fill="#334155" xml:space="preserve">RSTP 靠握手快速收敛，定时器只用于超时判定；边缘端口（接终端）可直接进 Forwarding。</text>
