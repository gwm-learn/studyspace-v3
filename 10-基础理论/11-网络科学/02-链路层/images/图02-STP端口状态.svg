<rect x="520" y="420" width="83.2" height="44" fill="#f2fcf5" rx="6" stroke="#0f9d58" stroke-width="1.2"/>
<text x="561.6" y="442" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">Forwarding</text>
<text x="561.6" y="454" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">转发数据</text>
<line x1="143.2" y1="442" x2="330" y2="442" stroke="#475569" stroke-width="1.8"/>
