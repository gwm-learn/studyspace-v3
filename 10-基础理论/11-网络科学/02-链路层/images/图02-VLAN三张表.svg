<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1100" height="640" fill="#ffffff"/>
<line x1="36" y1="112" x2="1064" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · VLAN 的三张表：三份数据，一次查表链</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">三张表是并列的数据结构，不是流程的三个步骤；一次转发要依次查它们。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">静态的两张（VLAN 表、端口表）配置变才变，FDB 是数据面学出来的、会老化。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">静态配置</text>
<line x1="142" y1="142" x2="172" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="180" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">动态学习</text>
<rect x="40" y="190" width="320" height="156" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="40" y="190" width="4.5" height="156" fill="#4f46e5" rx="2"/>
<text x="53" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">VLAN 表</text>
<text x="53" y="226" font-size="9.6" fill="#334155" xml:space="preserve">谁写：静态配置（或 GVRP）</text>
<text x="53" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">内容：VID → 成员端口集合</text>
<text x="53" y="256.8" font-size="9.6" fill="#334155" xml:space="preserve">生命周期：配置变化才变</text>
<rect x="390" y="190" width="320" height="156" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="390" y="190" width="4.5" height="156" fill="#0f9d58" rx="2"/>
<text x="403" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">FDB（MAC 表）</text>
<text x="403" y="226" font-size="9.6" fill="#334155" xml:space="preserve">谁写：数据面学习「源 MAC + VID」</text>
<text x="403" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">内容：MAC+VID → 出端口</text>
<text x="403" y="256.8" font-size="9.6" fill="#334155" xml:space="preserve">生命周期：老化（默认约 300s）</text>
<rect x="740" y="190" width="320" height="156" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="740" y="190" width="4.5" height="156" fill="#4f46e5" rx="2"/>
<text x="753" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">端口 VLAN 表</text>
<text x="753" y="226" font-size="9.6" fill="#334155" xml:space="preserve">谁写：静态配置（每端口一条）</text>
<text x="753" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">内容：PVID / tagged / untagged / allowed</text>
<text x="753" y="256.8" font-size="9.6" fill="#334155" xml:space="preserve">生命周期：配置变化才变</text>
<text x="40" y="386" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">一次转发的查表顺序</text>
<rect x="40" y="404" width="109.72" height="36" fill="#f8fafc" rx="6" stroke="#475569" stroke-width="1.2"/>
<text x="94.86" y="425.6" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">① 入端口打 PVID</text>
<rect x="250" y="404" width="105.64" height="36" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.2"/>
<text x="302.82" y="425.6" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">② 查 VLAN 成员</text>
<rect x="440" y="404" width="109.72" height="36" fill="#f2fcf5" rx="6" stroke="#0f9d58" stroke-width="1.2"/>
<text x="494.86" y="425.6" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">③ 查 FDB 找出口</text>
<rect x="640" y="404" width="179.08" height="36" fill="#fff9ee" rx="6" stroke="#d97706" stroke-width="1.2"/>
<text x="729.54" y="425.6" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">④ 出端口 tagged / untagged</text>
<line x1="149.72" y1="422" x2="250" y2="422" stroke="#475569" stroke-width="1.6"/>
<polygon points="250,422 241,417.5 241,426.5" fill="#475569"/>
<line x1="355.64" y1="422" x2="440" y2="422" stroke="#4f46e5" stroke-width="1.6"/>
<polygon points="440,422 431,417.5 431,426.5" fill="#4f46e5"/>
<line x1="549.72" y1="422" x2="640" y2="422" stroke="#0f9d58" stroke-width="1.6"/>
<polygon points="640,422 631,417.5 631,426.5" fill="#0f9d58"/>
<rect x="40" y="470" width="1020" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="500" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="524" font-size="10.2" fill="#334155" xml:space="preserve">FDB 按「MAC + VID」存：同一个 MAC 在不同 VLAN 各有一份，所以 VLAN 之间不会互相学到。</text>
<text x="56" y="542" font-size="10.2" fill="#334155" xml:space="preserve">两端 native VLAN / PVID 不一致是最常见的串 VLAN 原因——帧在一边不带标签、另一边按默认 VLAN 收。</text>
<text x="36" y="586" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py 生成</text>
