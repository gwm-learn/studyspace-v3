<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1180" height="520" fill="#ffffff"/>
<line x1="36" y1="112" x2="1144" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · VLAN 的三张表：配置、学习、端口规则</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">VLAN 表是静态配置；FDB 动态学习，按 VLAN 隔离；端口表决定 PVID 与 tagged/untagged。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">三张表要一起看，才能解释“为什么这个帧从这个口出去”。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">主路径</text>
<line x1="131" y1="142" x2="161" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="169" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">成功 / 到本机</text>
<line x1="267.8" y1="142" x2="297.8" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="305.8" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">注意 / 本机发出</text>
<rect x="40" y="200" width="210" height="92" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="40" y="200" width="4.5" height="92" fill="#4f46e5" rx="2"/>
<text x="53" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">VLAN 表</text>
<text x="53" y="236" font-size="9.6" fill="#334155" xml:space="preserve">VID / 名称</text>
<text x="53" y="251.4" font-size="9.6" fill="#334155" xml:space="preserve">成员端口</text>
<rect x="300" y="200" width="210" height="92" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="300" y="200" width="4.5" height="92" fill="#0f9d58" rx="2"/>
<text x="313" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">FDB</text>
<text x="313" y="236" font-size="9.6" fill="#334155" xml:space="preserve">VLAN + MAC</text>
<text x="313" y="251.4" font-size="9.6" fill="#334155" xml:space="preserve">→ 端口 / 老化</text>
<rect x="560" y="200" width="210" height="92" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="560" y="200" width="4.5" height="92" fill="#d97706" rx="2"/>
<text x="573" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">端口 VLAN 表</text>
<text x="573" y="236" font-size="9.6" fill="#334155" xml:space="preserve">PVID</text>
<text x="573" y="251.4" font-size="9.6" fill="#334155" xml:space="preserve">allowed / tagged</text>
<line x1="250" y1="246" x2="300" y2="246" stroke="#4f46e5" stroke-width="2"/>
<polygon points="300,246 291,241.5 291,250.5" fill="#4f46e5"/>
<text x="281" y="239" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">按 VLAN 查表</text>
<line x1="560" y1="246" x2="510" y2="246" stroke="#d97706" stroke-width="2"/>
<polygon points="510,246 519,250.5 519,241.5" fill="#d97706"/>
<text x="541" y="239" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">入端口归属</text>
<rect x="36" y="342" width="1100" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="372" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图提示</text>
<text x="52" y="396" font-size="10.2" fill="#334155" xml:space="preserve">MAC 表按 VLAN 隔离，同一 MAC 在不同 VLAN 各一份。</text>
<text x="52" y="414" font-size="10.2" fill="#334155" xml:space="preserve">native VLAN/PVID 不一致会串 VLAN。</text>
<text x="36" y="466" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py</text>
<text x="36" y="484" font-size="12.3" fill="#64748b" xml:space="preserve">颜色只做辅助，先看箭头方向与文字标签。</text>
