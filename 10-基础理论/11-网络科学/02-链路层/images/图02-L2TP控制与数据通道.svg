<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · L2TP 控制通道与数据通道：可靠与不可靠分开</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">同一对 LAC/LNS 之间有两条逻辑通道，互不影响。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">控制通道要可靠（序号 + 重传），数据通道不重传、不排序。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">控制（可靠）</text>
<line x1="164" y1="142" x2="194" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="202" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">数据（不可靠）</text>
<rect x="40" y="190" width="180" height="230" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="40" y="190" width="4.5" height="230" fill="#4f46e5" rx="2"/>
<text x="53" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">LAC</text>
<text x="53" y="226" font-size="9.6" fill="#334155" xml:space="preserve">同一对设备</text>
<text x="53" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">Tunnel ID</text>
<rect x="900" y="190" width="180" height="230" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="900" y="190" width="4.5" height="230" fill="#4f46e5" rx="2"/>
<text x="913" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">LNS</text>
<text x="913" y="226" font-size="9.6" fill="#334155" xml:space="preserve">终结隧道</text>
<text x="913" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">Session ID</text>
<rect x="280" y="210" width="540" height="84" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="280" y="210" width="4.5" height="84" fill="#d97706" rx="2"/>
<text x="293" y="229" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">控制通道（可靠）</text>
<text x="293" y="246" font-size="9.6" fill="#334155" xml:space="preserve">SCCRQ / ICRQ / HELLO / ZLB ACK</text>
<text x="293" y="261.4" font-size="9.6" fill="#334155" xml:space="preserve">Ns/Nr 序号 + 超时重传</text>
<rect x="280" y="320" width="540" height="84" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="280" y="320" width="4.5" height="84" fill="#0f9d58" rx="2"/>
<text x="293" y="339" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">数据通道（不可靠）</text>
<text x="293" y="356" font-size="9.6" fill="#334155" xml:space="preserve">只封装 PPP 帧</text>
<text x="293" y="371.4" font-size="9.6" fill="#334155" xml:space="preserve">不重传、不排序、不做流控</text>
