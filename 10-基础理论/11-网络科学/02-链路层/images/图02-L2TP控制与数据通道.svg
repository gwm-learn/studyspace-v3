<polygon points="900,362 891,357.5 891,366.5" fill="#0f9d58"/>
<rect x="40" y="450" width="1040" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="480" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="504" font-size="10.2" fill="#334155" xml:space="preserve">控制消息丢了会重传，数据消息丢了交给上层（PPP 之上的 TCP 等）恢复。</text>
<text x="56" y="522" font-size="10.2" fill="#334155" xml:space="preserve">UDP 1701 只用于建立；隧道建立后双方可以协商改用其他端口，抓包时别只盯 1701。</text>
