<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1180" height="600" fill="#ffffff"/>
<line x1="36" y1="112" x2="1144" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · ARP 同网段与跨网段：问的是下一跳</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">同网段广播问目的主机；跨网段广播问网关。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">请求是广播，应答是单播；缓存会老化，也会被伪造。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">成功 / 到本机</text>
<line x1="172.8" y1="142" x2="202.8" y2="142" stroke="#475569" stroke-width="3"/>
<text x="210.8" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">中性</text>
<line x1="256.8" y1="142" x2="286.8" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="294.8" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">注意 / 本机发出</text>
<line x1="404.6" y1="142" x2="434.6" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="442.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">主路径</text>
<rect x="36" y="190" width="108" height="90" fill="#f2fcf5" rx="9" stroke="#0f9d58" stroke-width="1.2"/>
<text x="46" y="212" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">同网段</text>
<text x="46" y="228" font-size="9" fill="#64748b" xml:space="preserve">目的 IP 在本网段</text>
<text x="46" y="241" font-size="9" fill="#64748b" xml:space="preserve">直接问目的 MAC</text>
<rect x="154" y="190" width="158" height="82" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="154" y="190" width="4.5" height="82" fill="#475569" rx="2"/>
<text x="167" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">查缓存</text>
<text x="167" y="226" font-size="8.8" fill="#334155" xml:space="preserve">命中直接封装</text>
<text x="167" y="241.4" font-size="8.8" fill="#334155" xml:space="preserve">未命中先缓存</text>
<line x1="312" y1="231" x2="324" y2="231" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="324,231 315,226.5 315,235.5" fill="#94a3b8"/>
<rect x="324" y="190" width="158" height="82" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="324" y="190" width="4.5" height="82" fill="#d97706" rx="2"/>
<text x="337" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">广播请求</text>
<text x="337" y="226" font-size="8.8" fill="#334155" xml:space="preserve">谁是 192.168.1.20</text>
<text x="337" y="241.4" font-size="8.8" fill="#334155" xml:space="preserve">目的 MAC 全 F</text>
<line x1="482" y1="231" x2="494" y2="231" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="494,231 485,226.5 485,235.5" fill="#94a3b8"/>
<rect x="494" y="190" width="158" height="82" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="494" y="190" width="4.5" height="82" fill="#0f9d58" rx="2"/>
<text x="507" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">单播应答</text>
<text x="507" y="226" font-size="8.8" fill="#334155" xml:space="preserve">我是，MAC 是 BB</text>
<text x="507" y="241.4" font-size="8.8" fill="#334155" xml:space="preserve">写入缓存</text>
<line x1="652" y1="231" x2="664" y2="231" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="664,231 655,226.5 655,235.5" fill="#94a3b8"/>
<rect x="664" y="190" width="158" height="82" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="664" y="190" width="4.5" height="82" fill="#4f46e5" rx="2"/>
<text x="677" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">封装发送</text>
<text x="677" y="226" font-size="8.8" fill="#334155" xml:space="preserve">目的 MAC=BB</text>
<text x="677" y="241.4" font-size="8.8" fill="#334155" xml:space="preserve">帧发出去</text>
<rect x="36" y="302" width="108" height="90" fill="#eef2ff" rx="9" stroke="#4f46e5" stroke-width="1.2"/>
<text x="46" y="324" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">跨网段</text>
<text x="46" y="340" font-size="9" fill="#64748b" xml:space="preserve">目的 IP 不在本网段</text>
<text x="46" y="353" font-size="9" fill="#64748b" xml:space="preserve">下一跳是网关</text>
<rect x="154" y="302" width="158" height="82" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="154" y="302" width="4.5" height="82" fill="#475569" rx="2"/>
<text x="167" y="321" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">查路由</text>
<text x="167" y="338" font-size="8.8" fill="#334155" xml:space="preserve">下一跳 = 网关</text>
<text x="167" y="353.4" font-size="8.8" fill="#334155" xml:space="preserve">ARP 问网关</text>
<line x1="312" y1="343" x2="324" y2="343" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="324,343 315,338.5 315,347.5" fill="#94a3b8"/>
<rect x="324" y="302" width="158" height="82" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="324" y="302" width="4.5" height="82" fill="#d97706" rx="2"/>
<text x="337" y="321" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">广播问网关</text>
<text x="337" y="338" font-size="8.8" fill="#334155" xml:space="preserve">目标 IP = 网关</text>
<text x="337" y="353.4" font-size="8.8" fill="#334155" xml:space="preserve">不是目的主机</text>
<line x1="482" y1="343" x2="494" y2="343" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="494,343 485,338.5 485,347.5" fill="#94a3b8"/>
<rect x="494" y="302" width="158" height="82" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="494" y="302" width="4.5" height="82" fill="#0f9d58" rx="2"/>
<text x="507" y="321" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">网关应答</text>
<text x="507" y="338" font-size="8.8" fill="#334155" xml:space="preserve">回自己的 MAC</text>
<text x="507" y="353.4" font-size="8.8" fill="#334155" xml:space="preserve">写入缓存</text>
<line x1="652" y1="343" x2="664" y2="343" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="664,343 655,338.5 655,347.5" fill="#94a3b8"/>
<rect x="664" y="302" width="158" height="82" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="664" y="302" width="4.5" height="82" fill="#4f46e5" rx="2"/>
<text x="677" y="321" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">交给网关</text>
<text x="677" y="338" font-size="8.8" fill="#334155" xml:space="preserve">IP 目的不变</text>
<text x="677" y="353.4" font-size="8.8" fill="#334155" xml:space="preserve">MAC 逐跳改变</text>
<rect x="36" y="420" width="1100" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="450" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图提示</text>
<text x="52" y="474" font-size="10.2" fill="#334155" xml:space="preserve">跨网段时 IP 头目的地址始终是最终主机。</text>
<text x="52" y="492" font-size="10.2" fill="#334155" xml:space="preserve">免费 ARP 用于宣告、冲突检测和主备切换。</text>
<text x="36" y="546" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py</text>
<text x="36" y="564" font-size="12.3" fill="#64748b" xml:space="preserve">颜色只做辅助，先看箭头方向与文字标签。</text>
</svg>
