<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1200" height="520" fill="#ffffff"/>
<line x1="36" y1="112" x2="1164" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 04 · 静态库抽取：一次从左到右的扫描</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">归档成员只有在「当前还有未定义符号」时才会被拉入；顺序错了，符号就补不上。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#475569" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">目标文件</text>
<line x1="142" y1="142" x2="172" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="180" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">归档成员</text>
<line x1="248" y1="142" x2="278" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="286" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">已解析</text>
<text x="40" y="178" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">链接器按命令行顺序扫描</text>
<rect x="40" y="200" width="250" height="86" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="40" y="200" width="4.5" height="86" fill="#475569" rx="2"/>
<text x="53" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">main.o</text>
<text x="281" y="219" font-size="10.2" fill="#475569" xml:space="preserve" font-weight="700" text-anchor="end">①</text>
<text x="53" y="236" font-size="9.6" fill="#334155" xml:space="preserve">未定义：foo, printf</text>
<line x1="290" y1="243" x2="310" y2="243" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="310,243 301,238.5 301,247.5" fill="#94a3b8"/>
<rect x="310" y="200" width="250" height="86" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="310" y="200" width="4.5" height="86" fill="#d97706" rx="2"/>
<text x="323" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">libfoo.a</text>
<text x="551" y="219" font-size="10.2" fill="#d97706" xml:space="preserve" font-weight="700" text-anchor="end">②</text>
<text x="323" y="236" font-size="9.6" fill="#334155" xml:space="preserve">抽出 foo.o</text>
<text x="323" y="251.4" font-size="9.6" fill="#334155" xml:space="preserve">新未定义：bar</text>
<line x1="560" y1="243" x2="580" y2="243" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="580,243 571,238.5 571,247.5" fill="#94a3b8"/>
<rect x="580" y="200" width="250" height="86" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="580" y="200" width="4.5" height="86" fill="#4f46e5" rx="2"/>
<text x="593" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">libbar.a</text>
<text x="821" y="219" font-size="10.2" fill="#4f46e5" xml:space="preserve" font-weight="700" text-anchor="end">③</text>
<text x="593" y="236" font-size="9.6" fill="#334155" xml:space="preserve">抽出 bar.o</text>
<text x="593" y="251.4" font-size="9.6" fill="#334155" xml:space="preserve">bar 已解析</text>
<line x1="830" y1="243" x2="850" y2="243" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="850,243 841,238.5 841,247.5" fill="#94a3b8"/>
<rect x="850" y="200" width="250" height="86" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="850" y="200" width="4.5" height="86" fill="#0f9d58" rx="2"/>
<text x="863" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">hello</text>
<text x="1091" y="219" font-size="10.2" fill="#0f9d58" xml:space="preserve" font-weight="700" text-anchor="end">④</text>
<text x="863" y="236" font-size="9.6" fill="#334155" xml:space="preserve">符号齐全</text>
<text x="863" y="251.4" font-size="9.6" fill="#334155" xml:space="preserve">可以链接</text>
<rect x="40" y="350" width="1120" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="380" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="404" font-size="10.2" fill="#334155" xml:space="preserve">main.o 先产生未定义 foo；扫到 libfoo.a 时才会抽 foo.o。</text>
<text x="56" y="422" font-size="10.2" fill="#334155" xml:space="preserve">foo.o 又引入未定义 bar，所以 libbar.a 必须排在 libfoo.a 后面。</text>
<text x="56" y="440" font-size="10.2" fill="#334155" xml:space="preserve">归档里没有被需要的成员不会进最终二进制；--start-group 只用于循环依赖。</text>
<text x="36" y="484" font-size="12.3" fill="#64748b" xml:space="preserve">图源：10-基础理论/13-计算机基础/images/图04-静态库抽取顺序.svg</text>
</svg>
