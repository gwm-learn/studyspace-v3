<text x="76" y="572" font-size="10.2" fill="#334155" xml:space="preserve">I4 在第 6 拍停顿：I2 的 load 结果还没写回，转发也来不及。</text>
<text x="76" y="590" font-size="10.2" fill="#334155" xml:space="preserve">若 I4 是分支且预测失败，后面已取的指令要标记为冲刷。</text>
<text x="36" y="644" font-size="12.3" fill="#64748b" xml:space="preserve">图源：经典五级流水线模型；实际处理器的发射宽度、乱序窗口更复杂。</text>
