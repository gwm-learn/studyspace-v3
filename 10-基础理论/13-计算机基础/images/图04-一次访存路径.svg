<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1200" height="740" fill="#ffffff"/>
<line x1="36" y1="112" x2="1164" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 04 · 一次访存：地址翻译与数据查找</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">上半段决定「数据在哪」，下半段决定「等多久」；两条失败路径都在翻译段。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">快路径</text>
<line x1="131" y1="142" x2="161" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="169" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">慢路径</text>
<line x1="226" y1="142" x2="256" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="264" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">失败 / 异常</text>
<text x="40" y="178" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① 先翻译地址：TLB 命中是快路径</text>
<rect x="495" y="190" width="210" height="58" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="495" y="190" width="4.5" height="58" fill="#475569" rx="2"/>
<text x="508" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">CPU 发出虚拟地址</text>
<rect x="40" y="310" width="361.33" height="72.8" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="40" y="310" width="4.5" height="72.8" fill="#0f9d58" rx="2"/>
<text x="53" y="329" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">TLB 命中</text>
<text x="53" y="346" font-size="9.6" fill="#334155" xml:space="preserve">页表项已在 TLB</text>
<text x="53" y="361.4" font-size="9.6" fill="#334155" xml:space="preserve">直接得到物理地址</text>
<line x1="547.5" y1="248" x2="220.67" y2="310" stroke="#0f9d58" stroke-width="1.8"/>
<polygon points="220.67,310 230.35,312.74 228.67,303.9" fill="#0f9d58"/>
<text x="50" y="402.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 进入 Cache 层次</text>
<rect x="419.33" y="310" width="361.33" height="72.8" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="419.33" y="310" width="4.5" height="72.8" fill="#d97706" rx="2"/>
<text x="432.33" y="329" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">TLB 未命中</text>
<text x="432.33" y="346" font-size="9.6" fill="#334155" xml:space="preserve">遍历 4 级页表</text>
<text x="432.33" y="361.4" font-size="9.6" fill="#334155" xml:space="preserve">命中后回填 TLB</text>
<line x1="600" y1="248" x2="600" y2="310" stroke="#d97706" stroke-width="1.8"/>
<polygon points="600,310 604.5,301 595.5,301" fill="#d97706"/>
<text x="429.33" y="402.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 通常几十周期</text>
<rect x="798.67" y="310" width="361.33" height="72.8" fill="#fff5f5" rx="8" stroke="#dc2626" stroke-width="1.1"/>
<rect x="798.67" y="310" width="4.5" height="72.8" fill="#dc2626" rx="2"/>
<text x="811.67" y="329" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">页表项无效</text>
<text x="811.67" y="346" font-size="9.6" fill="#334155" xml:space="preserve">页未驻留 / 权限不符</text>
<text x="811.67" y="361.4" font-size="9.6" fill="#334155" xml:space="preserve">缺页或保护异常</text>
<line x1="652.5" y1="248" x2="979.33" y2="310" stroke="#dc2626" stroke-width="1.8"/>
<polygon points="979.33,310 971.33,303.9 969.65,312.74" fill="#dc2626"/>
<text x="808.67" y="402.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 内核处理后重试指令</text>
<text x="40" y="432" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② 再取数据：逐级向下，命中就回填上层</text>
<rect x="40" y="444" width="250" height="86" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="40" y="444" width="4.5" height="86" fill="#0f9d58" rx="2"/>
<text x="53" y="463" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">L1 Cache</text>
<text x="53" y="480" font-size="9.6" fill="#334155" xml:space="preserve">16–64 KB / 核</text>
<text x="53" y="495.4" font-size="9.6" fill="#334155" xml:space="preserve">~1 ns</text>
<line x1="290" y1="487" x2="310" y2="487" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="310,487 301,482.5 301,491.5" fill="#94a3b8"/>
<rect x="310" y="444" width="250" height="86" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="310" y="444" width="4.5" height="86" fill="#4f46e5" rx="2"/>
<text x="323" y="463" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">L2 Cache</text>
<text x="323" y="480" font-size="9.6" fill="#334155" xml:space="preserve">256 KB–2 MB / 核</text>
<text x="323" y="495.4" font-size="9.6" fill="#334155" xml:space="preserve">~3–10 ns</text>
<line x1="560" y1="487" x2="580" y2="487" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="580,487 571,482.5 571,491.5" fill="#94a3b8"/>
<rect x="580" y="444" width="250" height="86" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="580" y="444" width="4.5" height="86" fill="#4f46e5" rx="2"/>
<text x="593" y="463" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">L3 Cache</text>
<text x="593" y="480" font-size="9.6" fill="#334155" xml:space="preserve">几 MB–几十 MB</text>
<text x="593" y="495.4" font-size="9.6" fill="#334155" xml:space="preserve">~10–30 ns</text>
<line x1="830" y1="487" x2="850" y2="487" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="850,487 841,482.5 841,491.5" fill="#94a3b8"/>
<rect x="850" y="444" width="250" height="86" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="850" y="444" width="4.5" height="86" fill="#d97706" rx="2"/>
<text x="863" y="463" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">主存 DRAM</text>
<text x="863" y="480" font-size="9.6" fill="#334155" xml:space="preserve">GB 级</text>
<text x="863" y="495.4" font-size="9.6" fill="#334155" xml:space="preserve">~60–120 ns</text>
<rect x="40" y="560" width="1120" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="590" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="614" font-size="10.2" fill="#334155" xml:space="preserve">命中：把整行回填上层，下次访问同一行就不再向下。</text>
<text x="56" y="632" font-size="10.2" fill="#334155" xml:space="preserve">未命中：继续向下；到 DRAM 仍未命中就由内存控制器取数。</text>
<text x="56" y="650" font-size="10.2" fill="#334155" xml:space="preserve">TLB miss 只是「翻译缓存没命中」，缺页是「页不在内存」，别混为一谈。</text>
<text x="36" y="704" font-size="12.3" fill="#64748b" xml:space="preserve">图源：10-基础理论/13-计算机基础/images/图04-一次访存路径.svg</text>
</svg>
