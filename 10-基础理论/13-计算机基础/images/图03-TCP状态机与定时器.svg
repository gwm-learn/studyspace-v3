<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="880" viewBox="0 0 1160 880" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1160" height="880" fill="#ffffff"/>
<line x1="36" y1="112" x2="1124" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">TCP 状态机：建立与关闭两条主线</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">建立：CLOSED → LISTEN/SYN_SENT → ESTABLISHED。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">关闭：主动方走 FIN_WAIT/TIME_WAIT，被动方走 CLOSE_WAIT/LAST_ACK。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">建立</text>
<line x1="120" y1="142" x2="150" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">主动关闭</text>
<line x1="226" y1="142" x2="256" y2="142" stroke="#475569" stroke-width="3"/>
<text x="264" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">被动关闭</text>
<line x1="332" y1="142" x2="362" y2="142" stroke="#0891b2" stroke-width="3"/>
<text x="370" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">等待/回收</text>
<text x="60" y="190" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">建立连接</text>
<rect x="60" y="220" width="170" height="64" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="60" y="220" width="4.5" height="64" fill="#475569" rx="2"/>
<text x="73" y="239" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">CLOSED</text>
<text x="73" y="256" font-size="8.8" fill="#334155" xml:space="preserve">无连接</text>
<rect x="300" y="220" width="180" height="64" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="300" y="220" width="4.5" height="64" fill="#0f9d58" rx="2"/>
<text x="313" y="239" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">LISTEN</text>
<text x="313" y="256" font-size="8.8" fill="#334155" xml:space="preserve">服务端监听</text>
<rect x="60" y="350" width="170" height="64" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="60" y="350" width="4.5" height="64" fill="#0f9d58" rx="2"/>
<text x="73" y="369" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">SYN_SENT</text>
<text x="73" y="386" font-size="8.8" fill="#334155" xml:space="preserve">客户端已发 SYN</text>
<rect x="300" y="350" width="180" height="64" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="300" y="350" width="4.5" height="64" fill="#0f9d58" rx="2"/>
<text x="313" y="369" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">SYN_RCVD</text>
<text x="313" y="386" font-size="8.8" fill="#334155" xml:space="preserve">收到 SYN，回 SYN+ACK</text>
<rect x="300" y="480" width="180" height="64" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="300" y="480" width="4.5" height="64" fill="#0f9d58" rx="2"/>
<text x="313" y="499" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">ESTABLISHED</text>
<text x="313" y="516" font-size="8.8" fill="#334155" xml:space="preserve">可读写</text>
<line x1="230" y1="240" x2="300" y2="240" stroke="#0f9d58" stroke-width="1.8"/>
<polygon points="300,240 291,235.5 291,244.5" fill="#0f9d58"/>
<text x="261" y="232" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">listen</text>
<line x1="145" y1="284" x2="145" y2="350" stroke="#0f9d58" stroke-width="1.8"/>
<polygon points="145,350 149.5,341 140.5,341" fill="#0f9d58"/>
<text x="151" y="317" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">connect</text>
<line x1="390" y1="284" x2="390" y2="350" stroke="#0f9d58" stroke-width="1.6"/>
<polygon points="390,350 394.5,341 385.5,341" fill="#0f9d58"/>
<text x="396" y="317" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">recv SYN</text>
<line x1="145" y1="414" x2="300" y2="480" stroke="#0f9d58" stroke-width="1.8"/>
<polygon points="300,480 293.48,472.33 289.96,480.61" fill="#0f9d58"/>
<text x="212.5" y="461" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">recv SYN+ACK</text>
<line x1="390" y1="414" x2="390" y2="480" stroke="#0f9d58" stroke-width="1.8"/>
<polygon points="390,480 394.5,471 385.5,471" fill="#0f9d58"/>
<text x="396" y="447" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">recv ACK</text>
<text x="620" y="190" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">关闭连接</text>
<rect x="620" y="220" width="180" height="64" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="620" y="220" width="4.5" height="64" fill="#0f9d58" rx="2"/>
<text x="633" y="239" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">ESTABLISHED</text>
<text x="633" y="256" font-size="8.8" fill="#334155" xml:space="preserve">可读写</text>
<rect x="900" y="220" width="180" height="64" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="900" y="220" width="4.5" height="64" fill="#d97706" rx="2"/>
<text x="913" y="239" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">FIN_WAIT_1</text>
<text x="913" y="256" font-size="8.8" fill="#334155" xml:space="preserve">主动方已发 FIN</text>
<rect x="900" y="350" width="180" height="64" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="900" y="350" width="4.5" height="64" fill="#d97706" rx="2"/>
<text x="913" y="369" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">FIN_WAIT_2</text>
<text x="913" y="386" font-size="8.8" fill="#334155" xml:space="preserve">等对端 FIN</text>
<rect x="900" y="480" width="180" height="64" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="900" y="480" width="4.5" height="64" fill="#0891b2" rx="2"/>
<text x="913" y="499" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">TIME_WAIT</text>
<text x="913" y="516" font-size="8.8" fill="#334155" xml:space="preserve">等 2MSL</text>
<rect x="620" y="350" width="180" height="64" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="620" y="350" width="4.5" height="64" fill="#475569" rx="2"/>
<text x="633" y="369" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">CLOSE_WAIT</text>
<text x="633" y="386" font-size="8.8" fill="#334155" xml:space="preserve">对端已关，本端未 close</text>
<rect x="620" y="480" width="180" height="64" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="620" y="480" width="4.5" height="64" fill="#475569" rx="2"/>
<text x="633" y="499" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">LAST_ACK</text>
<text x="633" y="516" font-size="8.8" fill="#334155" xml:space="preserve">已发 FIN，等 ACK</text>
<line x1="800" y1="240" x2="900" y2="240" stroke="#d97706" stroke-width="1.8"/>
<polygon points="900,240 891,235.5 891,244.5" fill="#d97706"/>
<text x="844" y="232" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">close / FIN</text>
<line x1="990" y1="284" x2="990" y2="350" stroke="#d97706" stroke-width="1.8"/>
<polygon points="990,350 994.5,341 985.5,341" fill="#d97706"/>
<text x="996" y="317" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">ACK</text>
<line x1="990" y1="414" x2="990" y2="480" stroke="#d97706" stroke-width="1.8"/>
<polygon points="990,480 994.5,471 985.5,471" fill="#d97706"/>
<text x="996" y="447" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">FIN</text>
<line x1="710" y1="284" x2="710" y2="350" stroke="#475569" stroke-width="1.6"/>
<polygon points="710,350 714.5,341 705.5,341" fill="#475569"/>
<text x="716" y="317" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">recv FIN</text>
<line x1="710" y1="414" x2="710" y2="480" stroke="#475569" stroke-width="1.8"/>
<polygon points="710,480 714.5,471 705.5,471" fill="#475569"/>
<text x="716" y="447" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">close / FIN</text>
<rect x="900" y="600" width="180" height="60" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="900" y="600" width="4.5" height="60" fill="#475569" rx="2"/>
<text x="913" y="619" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">CLOSED</text>
<text x="913" y="636" font-size="8.8" fill="#334155" xml:space="preserve">连接消失</text>
<line x1="990" y1="544" x2="990" y2="600" stroke="#0891b2" stroke-width="1.8"/>
<polygon points="990,600 994.5,591 985.5,591" fill="#0891b2"/>
<text x="996" y="572" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">2MSL</text>
<rect x="60" y="700" width="1060" height="110" fill="#f2fcf5" rx="10" stroke="#0f9d58" stroke-width="1"/>
<text x="76" y="730" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图</text>
<text x="76" y="754" font-size="10.2" fill="#334155" xml:space="preserve">TIME_WAIT 只出现在主动关闭方；被动关闭方通常在 CLOSE_WAIT 等应用 close。</text>
<text x="76" y="772" font-size="10.2" fill="#334155" xml:space="preserve">双方同时关闭会经过 CLOSING，图中省略；完整状态见 11-网络科学/TCP。</text>
<text x="76" y="790" font-size="10.2" fill="#334155" xml:space="preserve">重传、keepalive、2MSL 都是定时器行为，应用层仍应设置自己的超时。</text>
<text x="36" y="844" font-size="12.3" fill="#64748b" xml:space="preserve">图源：RFC 9293 TCP 状态机简化；只保留编程时最常见的路径。</text>
</svg>
