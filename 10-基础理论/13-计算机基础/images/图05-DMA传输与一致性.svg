<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1200" height="640" fill="#ffffff"/>
<line x1="36" y1="112" x2="1164" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 05 · DMA 传输：谁在搬数据，谁在等</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">CPU 只负责准备与收尾；真正的数据搬运由设备完成。虚线是完成通知。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">驱动 / CPU</text>
<line x1="159.6" y1="142" x2="189.6" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="197.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">设备 / DMA</text>
<line x1="283.2" y1="142" x2="313.2" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="321.2" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">内存</text>
<rect x="40" y="190" width="300" height="42" fill="#f1f5f9" rx="8" stroke="#4f46e5" stroke-width="1"/>
<text x="52" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">驱动 / CPU</text>
<rect x="400" y="190" width="300" height="42" fill="#f1f5f9" rx="8" stroke="#d97706" stroke-width="1"/>
<text x="412" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">DMA 设备</text>
<rect x="760" y="190" width="300" height="42" fill="#f1f5f9" rx="8" stroke="#0f9d58" stroke-width="1"/>
<text x="772" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">内存</text>
<line x1="190" y1="232" x2="190" y2="430" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="550" y1="232" x2="550" y2="430" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="910" y1="232" x2="910" y2="430" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="190" y1="260" x2="910" y2="260" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="910,260 901,255.5 901,264.5" fill="#4f46e5"/>
<text x="196" y="253" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">① 分配缓冲区，建立 DMA 映射</text>
<line x1="190" y1="298" x2="550" y2="298" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="550,298 541,293.5 541,302.5" fill="#4f46e5"/>
<text x="196" y="291" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">② 写地址 / 长度，启动传输</text>
<line x1="550" y1="336" x2="910" y2="336" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="910,336 901,331.5 901,340.5" fill="#4f46e5"/>
<text x="556" y="329" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">③ 设备直接读写内存（不经 CPU）</text>
<line x1="550" y1="374" x2="190" y2="374" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="3 3"/>
<polygon points="190,374 199,378.5 199,369.5" fill="#94a3b8"/>
<text x="196" y="367" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">④ 传输完成，发中断</text>
<line x1="190" y1="412" x2="910" y2="412" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="910,412 901,407.5 901,416.5" fill="#4f46e5"/>
<text x="196" y="405" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">⑤ 回收缓冲区，取消映射</text>
<rect x="40" y="470" width="1120" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="500" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="524" font-size="10.2" fill="#334155" xml:space="preserve">所有权：缓冲区交给设备后 CPU 不能再碰；完成中断之后才交回。</text>
<text x="56" y="542" font-size="10.2" fill="#334155" xml:space="preserve">流式 DMA 的 Cache 维护看方向：to-device 启动前 clean，from-device 读取前 invalidate。</text>
<text x="56" y="560" font-size="10.2" fill="#334155" xml:space="preserve">一致性 DMA 由硬件 snoop，驱动省事但设备更贵；两种模式不能凭经验混用。</text>
<text x="36" y="604" font-size="12.3" fill="#64748b" xml:space="preserve">图源：10-基础理论/13-计算机基础/images/图05-DMA传输与一致性.svg</text>
</svg>
