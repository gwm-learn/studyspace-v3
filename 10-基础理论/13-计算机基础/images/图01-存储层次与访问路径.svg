<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1040" height="620" fill="#ffffff"/>
<line x1="36" y1="112" x2="1004" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">存储层次：用局部性换延迟</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">CPU 每快一档，内存的相对等待就更贵；Cache 把常用数据放在近处。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">地址拆成 tag / index / offset，先定位组，再比对 tag。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">快、小、贵</text>
<line x1="153" y1="142" x2="183" y2="142" stroke="#475569" stroke-width="3"/>
<text x="191" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">慢、大、便宜</text>
<line x1="281" y1="142" x2="311" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="319" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">一次搬入整行</text>
<rect x="60" y="190" width="240" height="52" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="60" y="190" width="4.5" height="52" fill="#0f9d58" rx="2"/>
<text x="73" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">寄存器</text>
<text x="73" y="226" font-size="8.8" fill="#334155" xml:space="preserve">几十–几百字节 · &lt; 1 ns · 编译器 / 汇编管理</text>
<line x1="180" y1="242" x2="180" y2="254" stroke="#94a3b8" stroke-width="1.4"/>
<polygon points="180,254 184.5,245 175.5,245" fill="#94a3b8"/>
<rect x="60" y="254" width="280" height="52" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="60" y="254" width="4.5" height="52" fill="#0f9d58" rx="2"/>
<text x="73" y="273" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">L1 Cache</text>
<text x="73" y="290" font-size="8.8" fill="#334155" xml:space="preserve">16–64 KB / 核 · ~1 ns · 指令与数据热区</text>
<line x1="200" y1="306" x2="200" y2="318" stroke="#94a3b8" stroke-width="1.4"/>
<polygon points="200,318 204.5,309 195.5,309" fill="#94a3b8"/>
<rect x="60" y="318" width="320" height="52" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="60" y="318" width="4.5" height="52" fill="#0891b2" rx="2"/>
<text x="73" y="337" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">L2 Cache</text>
<text x="73" y="354" font-size="8.8" fill="#334155" xml:space="preserve">256 KB–2 MB / 核 · ~3–10 ns · L1 的后备</text>
<line x1="220" y1="370" x2="220" y2="382" stroke="#94a3b8" stroke-width="1.4"/>
<polygon points="220,382 224.5,373 215.5,373" fill="#94a3b8"/>
<rect x="60" y="382" width="360" height="52" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="60" y="382" width="4.5" height="52" fill="#0891b2" rx="2"/>
<text x="73" y="401" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">L3 Cache</text>
<text x="73" y="418" font-size="8.8" fill="#334155" xml:space="preserve">几 MB–几十 MB · ~10–30 ns · 多核共享</text>
<line x1="240" y1="434" x2="240" y2="446" stroke="#94a3b8" stroke-width="1.4"/>
<polygon points="240,446 244.5,437 235.5,437" fill="#94a3b8"/>
<rect x="60" y="446" width="400" height="52" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="60" y="446" width="4.5" height="52" fill="#d97706" rx="2"/>
<text x="73" y="465" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">主存 DRAM</text>
<text x="73" y="482" font-size="8.8" fill="#334155" xml:space="preserve">GB 级 · ~60–120 ns · 运行中的代码和数据</text>
<line x1="260" y1="498" x2="260" y2="510" stroke="#94a3b8" stroke-width="1.4"/>
<polygon points="260,510 264.5,501 255.5,501" fill="#94a3b8"/>
<rect x="60" y="510" width="440" height="52" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="60" y="510" width="4.5" height="52" fill="#475569" rx="2"/>
<text x="73" y="529" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">SSD / HDD</text>
<text x="73" y="546" font-size="8.8" fill="#334155" xml:space="preserve">GB–TB · µs–ms · 持久化数据</text>
<text x="560" y="200" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">Cache 行结构（以 64 B 行为例）</text>
<rect x="560" y="220" width="170" height="52" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="560" y="220" width="4.5" height="52" fill="#4f46e5" rx="2"/>
<text x="573" y="239" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">tag</text>
<text x="573" y="256" font-size="8.8" fill="#334155" xml:space="preserve">高位：判断是不是同一行</text>
<rect x="740" y="220" width="140" height="52" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="740" y="220" width="4.5" height="52" fill="#0891b2" rx="2"/>
<text x="753" y="239" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">index</text>
<text x="753" y="256" font-size="8.8" fill="#334155" xml:space="preserve">选组：落在哪一组</text>
<rect x="890" y="220" width="110" height="52" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="890" y="220" width="4.5" height="52" fill="#d97706" rx="2"/>
<text x="903" y="239" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">offset</text>
<text x="903" y="256" font-size="8.8" fill="#334155" xml:space="preserve">块内偏移：0–63</text>
<text x="560" y="300" font-size="10.4" fill="#64748b" xml:space="preserve">虚拟/物理地址位 → 组号 → 行内偏移</text>
<rect x="560" y="320" width="440" height="110" fill="#fff5f5" rx="10" stroke="#dc2626" stroke-width="1"/>
<text x="576" y="350" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">一次 miss 搬入整行</text>
<text x="576" y="374" font-size="10.2" fill="#334155" xml:space="preserve">行大小常见 64 B；顺序访问能吃到空间局部性。</text>
<text x="576" y="392" font-size="10.2" fill="#334155" xml:space="preserve">随机访问每 64 B 才用几个字节，带宽被浪费。</text>
<text x="576" y="410" font-size="10.2" fill="#334155" xml:space="preserve">两个核写同一行的不同变量 → 伪共享。</text>
<rect x="560" y="440" width="440" height="110" fill="#f2fcf5" rx="10" stroke="#0f9d58" stroke-width="1"/>
<text x="576" y="470" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图</text>
<text x="576" y="494" font-size="10.2" fill="#334155" xml:space="preserve">左侧是容量/延迟的折中，不是“越上层越重要”。</text>
<text x="576" y="512" font-size="10.2" fill="#334155" xml:space="preserve">右侧说明为什么数组顺序遍历通常快于链表。</text>
<text x="576" y="530" font-size="10.2" fill="#334155" xml:space="preserve">TLB 是页表的缓存，和 Cache 不是一回事。</text>
<text x="36" y="584" font-size="12.3" fill="#64748b" xml:space="preserve">图源：通用计算机体系结构模型；延迟为数量级，随平台变化。</text>
</svg>
