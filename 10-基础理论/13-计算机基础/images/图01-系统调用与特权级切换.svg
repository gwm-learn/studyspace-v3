<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="960" height="820" fill="#ffffff"/>
<line x1="36" y1="112" x2="924" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">系统调用：一次受控的特权级切换</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">用户态只能通过 trap 进入内核；内核校验参数后再调用具体实现。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">返回值与 errno 通过约定寄存器带回，用户态恢复执行。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#0891b2" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">用户态</text>
<line x1="131" y1="142" x2="161" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="169" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">内核态</text>
<line x1="226" y1="142" x2="256" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="264" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">返回路径</text>
<line x1="250" y1="210" x2="250" y2="660" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="3 3"/>
<line x1="750" y1="210" x2="750" y2="660" stroke="#e2e8f0" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="250" y="195" font-size="12" fill="#0891b2" xml:space="preserve" font-weight="700" text-anchor="middle">用户态</text>
<text x="750" y="195" font-size="12" fill="#4f46e5" xml:space="preserve" font-weight="700" text-anchor="middle">内核态</text>
<rect x="80" y="240" width="340" height="66" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="80" y="240" width="4.5" height="66" fill="#0891b2" rx="2"/>
<text x="93" y="259" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">应用代码</text>
<text x="93" y="276" font-size="9.6" fill="#334155" xml:space="preserve">read(fd, buf, n)</text>
<text x="93" y="291.4" font-size="9.6" fill="#334155" xml:space="preserve">普通函数调用，还不知道内核存在</text>
<rect x="80" y="350" width="340" height="66" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="80" y="350" width="4.5" height="66" fill="#0891b2" rx="2"/>
<text x="93" y="369" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">libc 包装</text>
<text x="93" y="386" font-size="9.6" fill="#334155" xml:space="preserve">准备 syscall 号与参数寄存器</text>
<text x="93" y="401.4" font-size="9.6" fill="#334155" xml:space="preserve">执行 syscall / svc 指令</text>
<rect x="80" y="540" width="340" height="66" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="80" y="540" width="4.5" height="66" fill="#0f9d58" rx="2"/>
<text x="93" y="559" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">返回用户态</text>
<text x="93" y="576" font-size="9.6" fill="#334155" xml:space="preserve">成功：字节数；失败：-1 + errno</text>
<text x="93" y="591.4" font-size="9.6" fill="#334155" xml:space="preserve">可能需要重试 EINTR/EAGAIN</text>
<rect x="580" y="350" width="340" height="58" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="580" y="350" width="4.5" height="58" fill="#4f46e5" rx="2"/>
<text x="593" y="369" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">保存上下文，切换内核栈</text>
<text x="593" y="386" font-size="9.6" fill="#334155" xml:space="preserve">PC、寄存器、栈指针存入内核结构</text>
<rect x="580" y="420" width="340" height="58" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="580" y="420" width="4.5" height="58" fill="#4f46e5" rx="2"/>
<text x="593" y="439" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">查表与参数校验</text>
<text x="593" y="456" font-size="9.6" fill="#334155" xml:space="preserve">syscall 号 → 处理函数；校验 fd/buf/权限</text>
<rect x="580" y="490" width="340" height="58" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="580" y="490" width="4.5" height="58" fill="#4f46e5" rx="2"/>
<text x="593" y="509" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">VFS / 驱动执行</text>
<text x="593" y="526" font-size="9.6" fill="#334155" xml:space="preserve">可能阻塞：睡眠、调度、等待 IO</text>
<rect x="580" y="560" width="340" height="58" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="580" y="560" width="4.5" height="58" fill="#0f9d58" rx="2"/>
<text x="593" y="579" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">恢复上下文</text>
<text x="593" y="596" font-size="9.6" fill="#334155" xml:space="preserve">把返回值写回约定寄存器，返回用户态</text>
<line x1="250" y1="306" x2="250" y2="350" stroke="#0891b2" stroke-width="1.8"/>
<polygon points="250,350 254.5,341 245.5,341" fill="#0891b2"/>
<line x1="420" y1="383" x2="580" y2="383" stroke="#4f46e5" stroke-width="2"/>
<polygon points="580,383 571,378.5 571,387.5" fill="#4f46e5"/>
<text x="450" y="375" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">syscall 指令（trap）</text>
<line x1="750" y1="408" x2="750" y2="420" stroke="#4f46e5" stroke-width="1.6"/>
<polygon points="750,420 754.5,411 745.5,411" fill="#4f46e5"/>
<line x1="750" y1="478" x2="750" y2="490" stroke="#4f46e5" stroke-width="1.6"/>
<polygon points="750,490 754.5,481 745.5,481" fill="#4f46e5"/>
<line x1="750" y1="548" x2="750" y2="560" stroke="#4f46e5" stroke-width="1.6"/>
<polygon points="750,560 754.5,551 745.5,551" fill="#4f46e5"/>
<line x1="580" y1="589" x2="420" y2="573" stroke="#0f9d58" stroke-width="2"/>
<polygon points="420,573 428.51,578.37 429.4,569.42" fill="#0f9d58"/>
<text x="490" y="599" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">返回值 / errno</text>
<rect x="80" y="660" width="840" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="96" y="690" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">边界</text>
<text x="96" y="714" font-size="10.2" fill="#334155" xml:space="preserve">系统调用不是普通函数：参数指针来自用户态，内核必须逐项校验。</text>
<text x="96" y="732" font-size="10.2" fill="#334155" xml:space="preserve">阻塞发生在内核里；被信号打断时可能返回 EINTR，调用者要决定是否重试。</text>
<text x="36" y="784" font-size="12.3" fill="#64748b" xml:space="preserve">图源：通用 OS 系统调用模型；具体陷入指令与寄存器随架构变化。</text>
</svg>
