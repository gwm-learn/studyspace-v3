<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 03 · 多址：多个用户怎样共享同一段资源</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">多址解决「谁在什么时候、用什么资源发」；双工解决「收发能不能同时进行」。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">四张小题按频率、时间、码字、时频二维四种切法排列，颜色代表不同用户。</text>
