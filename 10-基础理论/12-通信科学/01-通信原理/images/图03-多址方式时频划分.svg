<text x="516" y="508" font-size="9.6" fill="#334155" xml:space="preserve">把子载波按需分给用户，调度粒度最细。</text>
<text x="36" y="540" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">双工：上行为和下行怎么分</text>
<rect x="36" y="556" width="928" height="30" fill="#f1f5f9" rx="6"/>
<text x="44" y="576" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="start">方式</text>
<text x="384" y="576" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">怎么分</text>
<text x="616" y="576" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">优点</text>
<text x="848" y="576" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">代价/边界</text>
<rect x="36" y="586" width="928" height="28" fill="#ffffff"/>
<line x1="36" y1="586" x2="964" y2="586" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="606" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">FDD</text>
<text x="384" y="606" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">上行、下行各用一段频率</text>
<text x="616" y="606" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">收发可同时，时延稳定</text>
<text x="848" y="606" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">频谱成对，零散频段难用</text>
<rect x="36" y="614" width="928" height="28" fill="#ffffff"/>
<line x1="36" y1="614" x2="964" y2="614" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="634" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">TDD</text>
<text x="384" y="634" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">同一频率按时间分上下行</text>
<text x="616" y="634" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">频谱利用率高，配比可调</text>
<text x="848" y="634" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">需要保护间隔，远距离受限</text>
<rect x="36" y="642" width="928" height="28" fill="#ffffff"/>
<line x1="36" y1="642" x2="964" y2="642" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="662" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">半双工</text>
<text x="384" y="662" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">收发分时，但不能同时</text>
<text x="616" y="662" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">实现简单、成本低</text>
<text x="848" y="662" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">吞吐与实时性受影响</text>
<rect x="36" y="670" width="928" height="28" fill="#ffffff"/>
<line x1="36" y1="670" x2="964" y2="670" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="690" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">全双工</text>
<text x="384" y="690" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">同频同时收发</text>
<text x="616" y="690" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">理论吞吐翻倍</text>
<text x="848" y="690" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">自干扰消除难度大</text>
<line x1="36" y1="698" x2="964" y2="698" stroke="#e2e8f0" stroke-width="0.8"/>
