<text x="258" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">gNB</text>
<rect x="456" y="190" width="180" height="42" fill="#f1f5f9" rx="8" stroke="#475569" stroke-width="1"/>
<text x="468" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">AMF</text>
<rect x="666" y="190" width="180" height="42" fill="#f1f5f9" rx="8" stroke="#475569" stroke-width="1"/>
<text x="678" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">SMF</text>
