<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="800" viewBox="0 0 1140 800" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1140" height="800" fill="#ffffff"/>
<line x1="36" y1="112" x2="1104" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 21 · PDU 会话建立：QoS 规则怎么下到终端和基站</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">SMF 一面向 UPF 下发 N4 规则，一面把 QoS 规则装进 NAS 给 UE，还要给 gNB 会话上下文。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">三份描述必须一致，否则会出现“终端想发、UPF 不认”。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">请求/响应</text>
<line x1="148.6" y1="142" x2="178.6" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="186.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">N4 规则下发</text>
<line x1="274.4" y1="142" x2="304.4" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="312.4" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">数据</text>
