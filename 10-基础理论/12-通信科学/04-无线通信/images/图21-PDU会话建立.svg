<text x="132" y="481" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">RRC Reconfiguration（建 DRB）</text>
<line x1="336" y1="526" x2="546" y2="526" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="3 3"/>
<polygon points="546,526 537,521.5 537,530.5" fill="#4f46e5"/>
