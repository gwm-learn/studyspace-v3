<line x1="546" y1="564" x2="126" y2="564" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="126,564 135,568.5 135,559.5" fill="#4f46e5"/>
<text x="132" y="557" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">PDU Session Establishment Accept（QoS 规则）</text>
<line x1="126" y1="602" x2="966" y2="602" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3 3"/>
<polygon points="966,602 957,597.5 957,606.5" fill="#d97706"/>
<text x="132" y="595" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">数据（SDAP 打 QFI）</text>
<rect x="36" y="646" width="1050" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="676" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点（边界）</text>
<text x="52" y="700" font-size="10.2" fill="#334155" xml:space="preserve">· 会话建立是“三份描述对齐”：UPF 的 N4 规则、UE 的 QoS 规则、gNB 的会话上下文。</text>
<text x="52" y="718" font-size="10.2" fill="#334155" xml:space="preserve">· 只建会话不等于有 QoS 保障：还要看 gNB 是否把它映射成合适的 DRB，以及空口有没有资源。</text>
<text x="36" y="764" font-size="12.3" fill="#64748b" xml:space="preserve">图源：3GPP 23.502 / 23.501 / 24.501 的会话建立与 QoS 规则；课程材料《5G 基础信令培训》。</text>
</svg>
