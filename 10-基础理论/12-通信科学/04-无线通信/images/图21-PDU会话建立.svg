<line x1="966" y1="232" x2="966" y2="620" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="126" y1="260" x2="546" y2="260" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="546,260 537,255.5 537,264.5" fill="#4f46e5"/>
<text x="132" y="253" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">PDU Session Establishment Request（DNN/S-NSSAI）</text>
<line x1="546" y1="298" x2="756" y2="298" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="756,298 747,293.5 747,302.5" fill="#4f46e5"/>
<text x="552" y="291" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">SM Context Create（选 SMF）</text>
<line x1="756" y1="336" x2="966" y2="336" stroke="#0f9d58" stroke-width="1.8"/>
<polygon points="966,336 957,331.5 957,340.5" fill="#0f9d58"/>
<text x="762" y="329" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">N4：建立 PDR/FAR/QER</text>
