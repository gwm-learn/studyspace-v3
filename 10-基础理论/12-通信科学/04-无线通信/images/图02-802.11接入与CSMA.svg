<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="740" viewBox="0 0 1040 740" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1040" height="740" fill="#ffffff"/>
<line x1="36" y1="112" x2="1004" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · 802.11：先听后发、冲突避免，再认证关联</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">Wi-Fi 的 MAC 是 CSMA/CA：发送前先监听，空闲后还要随机退避，收到 ACK 才算成功。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">接入网络则要经过扫描、认证、关联（以及 WPA 四次握手），之后才能传数据。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">信道忙</text>
<line x1="131" y1="142" x2="161" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="169" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">竞争窗口</text>
<line x1="237" y1="142" x2="267" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="275" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">数据</text>
<line x1="321" y1="142" x2="351" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="359" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">确认</text>
<line x1="40" y1="240" x2="960" y2="240" stroke="#475569" stroke-width="1.6"/>
<text x="40" y="264" font-size="9.4" fill="#64748b" xml:space="preserve">时间 →</text>
<rect x="60" y="194" width="140" height="30" fill="#dc2626" rx="3" stroke="#dc2626" stroke-width="1"/>
<text x="130" y="214" font-size="9.2" fill="#ffffff" xml:space="preserve" font-weight="700" text-anchor="middle">信道忙</text>
<rect x="210" y="194" width="70" height="30" fill="#d97706" rx="3" stroke="#d97706" stroke-width="1"/>
<text x="245" y="214" font-size="8.8" fill="#ffffff" xml:space="preserve" font-weight="700" text-anchor="middle">DIFS</text>
<rect x="290" y="194" width="120" height="30" fill="#d97706" rx="3" stroke="#d97706" stroke-width="1"/>
<text x="350" y="214" font-size="9" fill="#ffffff" xml:space="preserve" font-weight="700" text-anchor="middle">随机退避</text>
<rect x="420" y="194" width="200" height="30" fill="#4f46e5" rx="3" stroke="#4f46e5" stroke-width="1"/>
<text x="520" y="214" font-size="9.6" fill="#ffffff" xml:space="preserve" font-weight="700" text-anchor="middle">DATA</text>
<rect x="630" y="194" width="60" height="30" fill="#0f9d58" rx="3" stroke="#0f9d58" stroke-width="1"/>
<text x="660" y="214" font-size="8.6" fill="#ffffff" xml:space="preserve" font-weight="700" text-anchor="middle">SIFS</text>
<rect x="700" y="194" width="100" height="30" fill="#0f9d58" rx="3" stroke="#0f9d58" stroke-width="1"/>
<text x="750" y="214" font-size="9.4" fill="#ffffff" xml:space="preserve" font-weight="700" text-anchor="middle">ACK</text>
<text x="60" y="178" font-size="9.4" fill="#0f172a" xml:space="preserve" font-weight="700">帧交换（简化）</text>
<text x="40" y="310" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">接入流程：扫描 → 认证 → 关联</text>
<rect x="40" y="330" width="158" height="88" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="40" y="330" width="4.5" height="88" fill="#4f46e5" rx="2"/>
<text x="53" y="349" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">① 扫描</text>
<text x="53" y="366" font-size="9.6" fill="#334155" xml:space="preserve">被动听 Beacon</text>
<text x="53" y="381.4" font-size="9.6" fill="#334155" xml:space="preserve">主动发 Probe</text>
<line x1="198" y1="374" x2="208" y2="374" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="208,374 199,369.5 199,378.5" fill="#94a3b8"/>
<rect x="208" y="330" width="158" height="88" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="208" y="330" width="4.5" height="88" fill="#0891b2" rx="2"/>
<text x="221" y="349" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">② 认证</text>
<text x="221" y="366" font-size="9.6" fill="#334155" xml:space="preserve">开放/共享密钥</text>
<text x="221" y="381.4" font-size="9.6" fill="#334155" xml:space="preserve">或 WPA 握手</text>
<line x1="366" y1="374" x2="376" y2="374" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="376,374 367,369.5 367,378.5" fill="#94a3b8"/>
<rect x="376" y="330" width="158" height="88" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="376" y="330" width="4.5" height="88" fill="#0f9d58" rx="2"/>
<text x="389" y="349" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">③ 关联</text>
<text x="389" y="366" font-size="9.6" fill="#334155" xml:space="preserve">Association Request</text>
<text x="389" y="381.4" font-size="9.6" fill="#334155" xml:space="preserve">分配 AID</text>
<line x1="534" y1="374" x2="544" y2="374" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="544,374 535,369.5 535,378.5" fill="#94a3b8"/>
<rect x="544" y="330" width="158" height="88" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="544" y="330" width="4.5" height="88" fill="#d97706" rx="2"/>
<text x="557" y="349" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">④ 安全</text>
<text x="557" y="366" font-size="9.6" fill="#334155" xml:space="preserve">WPA2/WPA3 四次握手</text>
<text x="557" y="381.4" font-size="9.6" fill="#334155" xml:space="preserve">派生密钥</text>
<line x1="702" y1="374" x2="712" y2="374" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="712,374 703,369.5 703,378.5" fill="#94a3b8"/>
<rect x="712" y="330" width="158" height="88" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="712" y="330" width="4.5" height="88" fill="#0f9d58" rx="2"/>
<text x="725" y="349" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">⑤ 数据传输</text>
<text x="725" y="366" font-size="9.6" fill="#334155" xml:space="preserve">To DS/From DS</text>
<text x="725" y="381.4" font-size="9.6" fill="#334155" xml:space="preserve">ACK/重传</text>
<text x="40" y="470" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">为什么 Wi-Fi 需要 ACK 和退避</text>
<rect x="40" y="488" width="920" height="30" fill="#f1f5f9" rx="6"/>
<text x="48" y="508" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="start">机制</text>
<text x="500" y="508" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">解决什么</text>
<text x="806.67" y="508" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">代价</text>
<rect x="40" y="518" width="920" height="28" fill="#ffffff"/>
<line x1="40" y1="518" x2="960" y2="518" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="48" y="538" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">CSMA/CA</text>
<text x="500" y="538" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">无线不能像以太网那样边发边听冲突</text>
<text x="806.67" y="538" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">监听 + 退避增加时延</text>
<rect x="40" y="546" width="920" height="28" fill="#ffffff"/>
<line x1="40" y1="546" x2="960" y2="546" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="48" y="566" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">随机退避</text>
<text x="500" y="566" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">多个站点同时空闲时错开发送</text>
<text x="806.67" y="566" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">高负载下退避窗口增大</text>
<rect x="40" y="574" width="920" height="28" fill="#ffffff"/>
<line x1="40" y1="574" x2="960" y2="574" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="48" y="594" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">ACK/重传</text>
<text x="500" y="594" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">无线误码率高，帧可能丢失</text>
<text x="806.67" y="594" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">占用空口时间</text>
<rect x="40" y="602" width="920" height="28" fill="#ffffff"/>
<line x1="40" y1="602" x2="960" y2="602" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="48" y="622" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">RTS/CTS</text>
<text x="500" y="622" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">隐藏终端问题</text>
<text x="806.67" y="622" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">短帧开销，低负载不划算</text>
<rect x="40" y="630" width="920" height="28" fill="#ffffff"/>
<line x1="40" y1="630" x2="960" y2="630" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="48" y="650" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">EDCA</text>
<text x="500" y="650" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">不同业务优先级</text>
<text x="806.67" y="650" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">参数配置复杂</text>
<line x1="40" y1="658" x2="960" y2="658" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="36" y="686" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="704" font-size="12.3" fill="#64748b" xml:space="preserve">说明：时序为简化示意；DIFS/SIFS/退避窗口的具体取值以 IEEE 802.11 与 PHY 类型为准。</text>
</svg>
