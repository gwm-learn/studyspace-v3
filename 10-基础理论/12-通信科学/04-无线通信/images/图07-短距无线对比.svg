<text x="636" y="210" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">ZigBee</text>
<text x="876" y="210" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">Thread</text>
<rect x="36" y="220" width="960" height="30" fill="#ffffff"/>
<line x1="36" y1="220" x2="996" y2="220" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="240" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">标准</text>
<text x="396" y="240" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">Bluetooth SIG</text>
<text x="636" y="240" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">IEEE 802.15.4 + ZigBee</text>
<text x="876" y="240" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">IEEE 802.15.4 + Thread Group</text>
