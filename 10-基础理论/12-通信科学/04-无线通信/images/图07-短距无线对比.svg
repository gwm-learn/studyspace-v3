<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1080" height="760" fill="#ffffff"/>
<line x1="36" y1="112" x2="1044" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 07 · 短距无线：BLE、ZigBee、Thread 各管一段场景</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">三者都工作在 2.4 GHz（Thread/ZigBee 也可用 sub-GHz），但协议栈、拓扑和功耗目标不同。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">BLE 偏“手机外设/低功耗点对点”，ZigBee/Thread 偏“多跳自组网/家居设备”。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">BLE</text>
<line x1="117.8" y1="142" x2="147.8" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="155.8" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">ZigBee</text>
<line x1="219.4" y1="142" x2="249.4" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="257.4" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">Thread</text>
<line x1="321" y1="142" x2="351" y2="142" stroke="#475569" stroke-width="3"/>
<text x="359" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">共同点</text>
<rect x="36" y="190" width="960" height="30" fill="#f1f5f9" rx="6"/>
