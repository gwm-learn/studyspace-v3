<text x="44" y="360" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">功耗</text>
<text x="396" y="360" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">极低（纽扣电池）</text>
<text x="636" y="360" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">低</text>
<text x="876" y="360" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">低</text>
<rect x="36" y="370" width="960" height="30" fill="#ffffff"/>
<line x1="36" y1="370" x2="996" y2="370" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="390" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">典型</text>
<text x="396" y="390" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">手环/耳机/传感器</text>
<text x="636" y="390" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">灯控/传感器</text>
<text x="876" y="390" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">智能家居/ Matter</text>
