<rect x="36" y="450" width="4.5" height="88" fill="#475569" rx="2"/>
<text x="49" y="469" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">应用</text>
<text x="49" y="486" font-size="9.6" fill="#334155" xml:space="preserve">GATT/GAP</text>
<text x="49" y="501.4" font-size="9.6" fill="#334155" xml:space="preserve">ZCL</text>
<text x="49" y="516.8" font-size="9.6" fill="#334155" xml:space="preserve">Matter/应用</text>
<line x1="194" y1="494" x2="206" y2="494" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="206,494 197,489.5 197,498.5" fill="#94a3b8"/>
<rect x="206" y="450" width="158" height="88" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="206" y="450" width="4.5" height="88" fill="#4f46e5" rx="2"/>
<text x="219" y="469" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">网络</text>
<text x="219" y="486" font-size="9.6" fill="#334155" xml:space="preserve">BLE Mesh</text>
<text x="219" y="501.4" font-size="9.6" fill="#334155" xml:space="preserve">ZigBee 网络层</text>
<text x="219" y="516.8" font-size="9.6" fill="#334155" xml:space="preserve">IPv6/6LoWPAN</text>
<line x1="364" y1="494" x2="376" y2="494" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="376,494 367,489.5 367,498.5" fill="#94a3b8"/>
<rect x="376" y="450" width="158" height="88" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="376" y="450" width="4.5" height="88" fill="#0f9d58" rx="2"/>
<text x="389" y="469" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">链路/MAC</text>
<text x="389" y="486" font-size="9.6" fill="#334155" xml:space="preserve">BLE Link Layer</text>
<text x="389" y="501.4" font-size="9.6" fill="#334155" xml:space="preserve">IEEE 802.15.4 MAC</text>
<text x="389" y="516.8" font-size="9.6" fill="#334155" xml:space="preserve">IEEE 802.15.4 MAC</text>
<line x1="534" y1="494" x2="546" y2="494" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="546,494 537,489.5 537,498.5" fill="#94a3b8"/>
