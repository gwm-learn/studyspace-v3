<rect x="546" y="450" width="4.5" height="88" fill="#d97706" rx="2"/>
<text x="559" y="469" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">物理层</text>
<text x="559" y="486" font-size="9.6" fill="#334155" xml:space="preserve">2.4 GHz GFSK</text>
<text x="559" y="501.4" font-size="9.6" fill="#334155" xml:space="preserve">2.4 GHz O-QPSK</text>
<text x="559" y="516.8" font-size="9.6" fill="#334155" xml:space="preserve">2.4 GHz O-QPSK</text>
<rect x="36" y="570" width="960" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="600" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图</text>
<text x="52" y="624" font-size="10.2" fill="#334155" xml:space="preserve">① 先看“是不是 IP”：Thread 原生 IPv6，适合与互联网直接互通；BLE/ZigBee 通常要网关。</text>
<text x="52" y="642" font-size="10.2" fill="#334155" xml:space="preserve">② 再看“拓扑”：点对点选 BLE，多跳自组网选 ZigBee/Thread。</text>
<text x="52" y="660" font-size="10.2" fill="#334155" xml:space="preserve">③ 最后看“生态”：Matter 主要跑在 Thread/Wi-Fi 上，BLE 多用于配网/外设。</text>
<text x="36" y="706" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="724" font-size="12.3" fill="#64748b" xml:space="preserve">说明：协议栈为简化分层，未列全安全/传输层；具体以 Bluetooth Core、ZigBee 3.0、Thread 1.3 规范为准。</text>
</svg>
