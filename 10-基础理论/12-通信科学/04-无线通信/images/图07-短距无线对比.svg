<text x="396" y="270" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">2.4 GHz（含广播）</text>
<text x="636" y="270" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">2.4 GHz / sub-GHz</text>
<text x="876" y="270" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">2.4 GHz</text>
<rect x="36" y="280" width="960" height="30" fill="#ffffff"/>
<line x1="36" y1="280" x2="996" y2="280" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="300" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">拓扑</text>
<text x="396" y="300" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">点对点/星形/ Mesh（BLE Mesh）</text>
<text x="636" y="300" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">Mesh（协调器/路由器/终端）</text>
<text x="876" y="300" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">Mesh（边界路由器/路由器/终端）</text>
<rect x="36" y="310" width="960" height="30" fill="#ffffff"/>
<line x1="36" y1="310" x2="996" y2="310" stroke="#e2e8f0" stroke-width="0.8"/>
