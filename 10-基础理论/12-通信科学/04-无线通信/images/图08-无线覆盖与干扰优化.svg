<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="760" viewBox="0 0 1040 760" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1040" height="760" fill="#ffffff"/>
<line x1="36" y1="112" x2="1004" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 08 · 无线覆盖与干扰：先分清“弱”还是“脏”</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">覆盖问题看接收功率/SNR，干扰问题看同频/邻频能量；两者现象相似，处理方式相反。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">优化顺序：先定位（覆盖/干扰/容量），再动参数（功率/信道/天线/带宽）。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">覆盖</text>
<line x1="120" y1="142" x2="150" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">干扰</text>
<line x1="204" y1="142" x2="234" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="242" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">容量</text>
<line x1="288" y1="142" x2="318" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="326" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">观测</text>
<text x="36" y="170" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① 先判断问题类型</text>
<rect x="36" y="190" width="158" height="84" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="36" y="190" width="4.5" height="84" fill="#475569" rx="2"/>
<text x="49" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">现象</text>
<text x="49" y="226" font-size="9.6" fill="#334155" xml:space="preserve">掉线/速率低</text>
<text x="49" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">时延抖动</text>
<line x1="194" y1="232" x2="204" y2="232" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="204,232 195,227.5 195,236.5" fill="#94a3b8"/>
<rect x="204" y="190" width="158" height="84" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="204" y="190" width="4.5" height="84" fill="#d97706" rx="2"/>
<text x="217" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">看 RSSI</text>
<text x="217" y="226" font-size="9.6" fill="#334155" xml:space="preserve">弱 → 覆盖</text>
<text x="217" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">强 → 继续</text>
<line x1="362" y1="232" x2="372" y2="232" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="372,232 363,227.5 363,236.5" fill="#94a3b8"/>
<rect x="372" y="190" width="158" height="84" fill="#fff5f5" rx="8" stroke="#dc2626" stroke-width="1.1"/>
<rect x="372" y="190" width="4.5" height="84" fill="#dc2626" rx="2"/>
<text x="385" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">看 SNR/SINR</text>
<text x="385" y="226" font-size="9.6" fill="#334155" xml:space="preserve">低 → 干扰/噪声</text>
<text x="385" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">高 → 容量</text>
<line x1="530" y1="232" x2="540" y2="232" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="540,232 531,227.5 531,236.5" fill="#94a3b8"/>
<rect x="540" y="190" width="158" height="84" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="540" y="190" width="4.5" height="84" fill="#4f46e5" rx="2"/>
<text x="553" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">看信道利用</text>
<text x="553" y="226" font-size="9.6" fill="#334155" xml:space="preserve">高 → 拥塞</text>
<text x="553" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">低 → 配置</text>
<line x1="698" y1="232" x2="708" y2="232" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="708,232 699,227.5 699,236.5" fill="#94a3b8"/>
<rect x="708" y="190" width="158" height="84" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="708" y="190" width="4.5" height="84" fill="#0f9d58" rx="2"/>
<text x="721" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">动作</text>
<text x="721" y="226" font-size="9.6" fill="#334155" xml:space="preserve">功率/天线/信道</text>
<text x="721" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">带宽/调度</text>
<text x="36" y="320" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② 常见手段与代价</text>
<rect x="36" y="338" width="960" height="30" fill="#f1f5f9" rx="6"/>
<text x="44" y="358" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="start">手段</text>
<text x="516" y="358" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">解决什么</text>
<text x="836" y="358" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">代价/边界</text>
<rect x="36" y="368" width="960" height="30" fill="#ffffff"/>
<line x1="36" y1="368" x2="996" y2="368" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="388" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">提高发射功率</text>
<text x="516" y="388" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">覆盖弱</text>
<text x="836" y="388" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">干扰邻区、法规上限、终端上行不改善</text>
<rect x="36" y="398" width="960" height="30" fill="#ffffff"/>
<line x1="36" y1="398" x2="996" y2="398" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="418" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">换信道/降带宽</text>
<text x="516" y="418" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">同频/邻频干扰</text>
<text x="836" y="418" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">容量下降、需要终端支持</text>
<rect x="36" y="428" width="960" height="30" fill="#ffffff"/>
<line x1="36" y1="428" x2="996" y2="428" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="448" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">调整天线/位置</text>
<text x="516" y="448" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">覆盖盲区/方向</text>
<text x="836" y="448" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">施工成本、美化/物业限制</text>
<rect x="36" y="458" width="960" height="30" fill="#ffffff"/>
<line x1="36" y1="458" x2="996" y2="458" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="478" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">增加 AP/小区</text>
<text x="516" y="478" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">容量/覆盖</text>
<text x="836" y="478" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">投资、切换/同频协调</text>
<rect x="36" y="488" width="960" height="30" fill="#ffffff"/>
<line x1="36" y1="488" x2="996" y2="488" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="508" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">MIMO/波束赋形</text>
<text x="516" y="508" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">容量/覆盖</text>
<text x="836" y="508" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">终端能力、信道估计</text>
<rect x="36" y="518" width="960" height="30" fill="#ffffff"/>
<line x1="36" y1="518" x2="996" y2="518" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="538" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">降低复用/调度优化</text>
<text x="516" y="538" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">同频干扰</text>
<text x="836" y="538" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">容量与公平性权衡</text>
<line x1="36" y1="548" x2="996" y2="548" stroke="#e2e8f0" stroke-width="0.8"/>
<rect x="36" y="560" width="960" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="590" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图</text>
<text x="52" y="614" font-size="10.2" fill="#334155" xml:space="preserve">① 覆盖弱：RSSI 低、SNR 也低 → 先补功率/天线/位置；但终端上行可能仍是瓶颈。</text>
<text x="52" y="632" font-size="10.2" fill="#334155" xml:space="preserve">② 干扰大：RSSI 不低、SNR/SINR 低 → 先换信道/降带宽/隔离，不要盲目加功率。</text>
<text x="52" y="650" font-size="10.2" fill="#334155" xml:space="preserve">③ 容量不足：RSSI/SNR 都好但信道利用率高 → 加 AP/小区、改调度、上更高频段。</text>
