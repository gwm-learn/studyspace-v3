<text x="56" y="630" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点（边界）</text>
<text x="56" y="654" font-size="10.2" fill="#334155" xml:space="preserve">· 4G 是“固定接口连固定网元”，5G 是“注册 + 发现 + 调用”：加网元不用改拓扑，切片按需组合。</text>
<text x="56" y="672" font-size="10.2" fill="#334155" xml:space="preserve">· 代价：服务发现、版本兼容、SBI 的 TLS/mTLS 与限流变成新的运维面。</text>
<text x="36" y="724" font-size="12.3" fill="#64748b" xml:space="preserve">图源：3GPP 23.501 / 23.502 的服务化架构描述；课程材料《5G 基础信令培训》。</text>
