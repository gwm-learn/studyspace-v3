<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="760" viewBox="0 0 1260 760" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1260" height="760" fill="#ffffff"/>
<line x1="36" y1="112" x2="1224" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 17 · 5GC 服务化架构：网元注册到 NRF，按服务互相调用</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">每个 NF 启动时把能力注册到 NRF，调用方按“服务名 + 版本”发现对端。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">控制面之间走 SBI（HTTP/2 + JSON），SMF 用 N4 控制 UPF。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">控制面 NF</text>
<line x1="150.8" y1="142" x2="180.8" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="188.8" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">用户面</text>
<line x1="245.8" y1="142" x2="275.8" y2="142" stroke="#0891b2" stroke-width="3"/>
<text x="283.8" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">服务注册/发现</text>
<text x="40" y="178" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">控制面网元（只处理信令）</text>
<rect x="40" y="192" width="270" height="90" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
