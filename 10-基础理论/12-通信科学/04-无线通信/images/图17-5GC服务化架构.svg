<text x="53" y="228" font-size="9.6" fill="#334155" xml:space="preserve">注册/鉴权/移动性</text>
<text x="53" y="243.4" font-size="9.6" fill="#334155" xml:space="preserve">NAS 信令终结</text>
<rect x="340" y="192" width="270" height="90" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="340" y="192" width="4.5" height="90" fill="#4f46e5" rx="2"/>
