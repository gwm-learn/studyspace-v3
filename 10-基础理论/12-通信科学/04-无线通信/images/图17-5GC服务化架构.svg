<text x="53" y="498" font-size="9.6" fill="#334155" xml:space="preserve">转发/限速/计费</text>
<text x="53" y="513.4" font-size="9.6" fill="#334155" xml:space="preserve">可下沉到边缘</text>
<rect x="340" y="462" width="270" height="90" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="340" y="462" width="4.5" height="90" fill="#4f46e5" rx="2"/>
<text x="353" y="481" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">AUSF</text>
<text x="353" y="498" font-size="9.6" fill="#334155" xml:space="preserve">鉴权服务端</text>
<text x="353" y="513.4" font-size="9.6" fill="#334155" xml:space="preserve">与 UDM 配合</text>
<rect x="640" y="462" width="270" height="90" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="640" y="462" width="4.5" height="90" fill="#4f46e5" rx="2"/>
<text x="653" y="481" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">NSSF</text>
<text x="653" y="498" font-size="9.6" fill="#334155" xml:space="preserve">选择切片实例</text>
<text x="653" y="513.4" font-size="9.6" fill="#334155" xml:space="preserve">按 S-NSSAI</text>
<rect x="940" y="462" width="270" height="90" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="940" y="462" width="4.5" height="90" fill="#475569" rx="2"/>
<text x="953" y="481" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">DN / AF</text>
<text x="953" y="498" font-size="9.6" fill="#334155" xml:space="preserve">外部数据网络</text>
<text x="953" y="513.4" font-size="9.6" fill="#334155" xml:space="preserve">业务侧策略请求</text>
