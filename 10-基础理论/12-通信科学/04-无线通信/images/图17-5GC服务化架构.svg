<text x="353" y="228" font-size="9.6" fill="#334155" xml:space="preserve">PDU 会话</text>
<text x="353" y="243.4" font-size="9.6" fill="#334155" xml:space="preserve">选择并控制 UPF</text>
<rect x="640" y="192" width="270" height="90" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="640" y="192" width="4.5" height="90" fill="#4f46e5" rx="2"/>
<text x="653" y="211" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">PCF</text>
<text x="653" y="228" font-size="9.6" fill="#334155" xml:space="preserve">策略决策</text>
<text x="653" y="243.4" font-size="9.6" fill="#334155" xml:space="preserve">PCC 规则</text>
<rect x="940" y="192" width="270" height="90" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="940" y="192" width="4.5" height="90" fill="#4f46e5" rx="2"/>
<text x="953" y="211" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">UDM</text>
<text x="953" y="228" font-size="9.6" fill="#334155" xml:space="preserve">统一签约数据</text>
<text x="953" y="243.4" font-size="9.6" fill="#334155" xml:space="preserve">鉴权向量</text>
<rect x="40" y="330" width="1170" height="70" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="40" y="330" width="4.5" height="70" fill="#0891b2" rx="2"/>
<text x="53" y="349" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">NRF · 服务注册与发现（NF Repository Function）</text>
<text x="1201" y="349" font-size="10.2" fill="#0891b2" xml:space="preserve" font-weight="700" text-anchor="end">SBI</text>
<text x="53" y="366" font-size="9.6" fill="#334155" xml:space="preserve">每个 NF 注册“我能提供什么服务”；调用方按服务名查询实例地址与版本。</text>
<text x="40" y="448" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">用户面与辅助功能</text>
