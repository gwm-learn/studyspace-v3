<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="720" viewBox="0 0 1320 720" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1320" height="720" fill="#ffffff"/>
<line x1="36" y1="112" x2="1284" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 13 · 层二协议栈与信道映射：三条信道是三层接口</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">左边是协议栈，右边是三类信道。注意 MAC 同时面对逻辑信道和传输信道。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">PHY 只认传输信道；逻辑信道描述“传什么”，传输信道描述“怎么传”。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">用户面/数据</text>
<line x1="159.6" y1="142" x2="189.6" y2="142" stroke="#0891b2" stroke-width="3"/>
<text x="197.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">逻辑信道</text>
<line x1="265.6" y1="142" x2="295.6" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="303.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">传输信道</text>
<rect x="60" y="200" width="420" height="46" fill="#ecfeff" rx="6" stroke="#0891b2" stroke-width="1.1"/>
<text x="72" y="226.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">SDAP（5G）</text>
<text x="470" y="226.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">QoS 流 ↔ DRB</text>
<rect x="60" y="254" width="420" height="46" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.1"/>
<text x="72" y="280.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">PDCP</text>
<text x="470" y="280.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">头压缩/加密/重排序</text>
<rect x="60" y="308" width="420" height="46" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.1"/>
<text x="72" y="334.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">RLC</text>
<text x="470" y="334.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">分段/ARQ</text>
<rect x="60" y="362" width="420" height="46" fill="#fff9ee" rx="6" stroke="#d97706" stroke-width="1.1"/>
<text x="72" y="388.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">MAC</text>
<text x="470" y="388.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">调度/HARQ/复用</text>
<rect x="60" y="416" width="420" height="46" fill="#f8fafc" rx="6" stroke="#475569" stroke-width="1.1"/>
<text x="72" y="442.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">PHY</text>
<text x="470" y="442.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">编码/调制/映射</text>
<rect x="760" y="200" width="520" height="96" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="760" y="200" width="4.5" height="96" fill="#0891b2" rx="2"/>
<text x="773" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">逻辑信道（MAC ↔ RLC）</text>
<text x="1271" y="219" font-size="10.2" fill="#0891b2" xml:space="preserve" font-weight="700" text-anchor="end">传什么</text>
<text x="773" y="236" font-size="9.6" fill="#334155" xml:space="preserve">BCCH / PCCH / CCCH / DCCH / DTCH</text>
<rect x="760" y="316" width="520" height="96" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="760" y="316" width="4.5" height="96" fill="#0f9d58" rx="2"/>
<text x="773" y="335" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">传输信道（PHY ↔ MAC）</text>
<text x="1271" y="335" font-size="10.2" fill="#0f9d58" xml:space="preserve" font-weight="700" text-anchor="end">怎么传</text>
<text x="773" y="352" font-size="9.6" fill="#334155" xml:space="preserve">BCH / PCH / DL-SCH / MCH</text>
<text x="773" y="367.4" font-size="9.6" fill="#334155" xml:space="preserve">UL-SCH / RACH</text>
<rect x="760" y="432" width="520" height="96" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="760" y="432" width="4.5" height="96" fill="#475569" rx="2"/>
<text x="773" y="451" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">物理信道（真正占资源）</text>
<text x="1271" y="451" font-size="10.2" fill="#475569" xml:space="preserve" font-weight="700" text-anchor="end">RE/PRB</text>
<text x="773" y="468" font-size="9.6" fill="#334155" xml:space="preserve">PBCH / PDCCH / PDSCH / PRACH</text>
<text x="773" y="483.4" font-size="9.6" fill="#334155" xml:space="preserve">PUSCH / PUCCH</text>
<line x1="480" y1="331" x2="760" y2="248" stroke="#0891b2" stroke-width="1.8"/>
<polygon points="760,248 750.09,246.24 752.65,254.87" fill="#0891b2"/>
<line x1="480" y1="385" x2="760" y2="364" stroke="#0f9d58" stroke-width="1.8"/>
<polygon points="760,364 750.69,360.19 751.36,369.16" fill="#0f9d58"/>
<line x1="480" y1="439" x2="760" y2="480" stroke="#475569" stroke-width="1.8"/>
<polygon points="760,480 751.75,474.24 750.44,483.15" fill="#475569"/>
<rect x="60" y="566" width="1220" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="76" y="596" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="76" y="620" font-size="10.2" fill="#334155" xml:space="preserve">· 一条逻辑信道映射到哪条传输信道是标准固定的（如 BCCH → BCH 与 DL-SCH），不可配置。</text>
<text x="76" y="638" font-size="10.2" fill="#334155" xml:space="preserve">· 一个传输块（TB）里可以复用多条逻辑信道的 SDU，靠 MAC 头里的 LCID 区分。</text>
<text x="36" y="684" font-size="12.3" fill="#64748b" xml:space="preserve">图源：3GPP 36.300 / 38.300 的层二结构与信道映射；课程材料《lte-层二协议》《5G 基础信令培训》。</text>
</svg>
