<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="720" viewBox="0 0 1140 720" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1140" height="720" fill="#ffffff"/>
<line x1="36" y1="112" x2="1104" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 12 · Xn 切换：测量、准备、执行、路径更新</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">前两段是准备（信令走 Xn），中间是执行（终端在目标小区接入），最后是核心网更新路径。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">数据转发走 Xn-U，和路径更新是两条独立的事。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">信令</text>
<line x1="120" y1="142" x2="150" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">数据/路径</text>
<rect x="60" y="190" width="200" height="42" fill="#f1f5f9" rx="8" stroke="#4f46e5" stroke-width="1"/>
<text x="72" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">UE</text>
<rect x="310" y="190" width="200" height="42" fill="#f1f5f9" rx="8" stroke="#475569" stroke-width="1"/>
<text x="322" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">源 gNB</text>
<rect x="560" y="190" width="200" height="42" fill="#f1f5f9" rx="8" stroke="#475569" stroke-width="1"/>
<text x="572" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">目标 gNB</text>
<rect x="810" y="190" width="200" height="42" fill="#f1f5f9" rx="8" stroke="#0f9d58" stroke-width="1"/>
<text x="822" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">AMF / UPF</text>
<line x1="160" y1="232" x2="160" y2="544" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="410" y1="232" x2="410" y2="544" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="660" y1="232" x2="660" y2="544" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="910" y1="232" x2="910" y2="544" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="160" y1="260" x2="410" y2="260" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="410,260 401,255.5 401,264.5" fill="#4f46e5"/>
<text x="166" y="253" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">MeasurementReport（A3）</text>
<line x1="410" y1="298" x2="660" y2="298" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="660,298 651,293.5 651,302.5" fill="#4f46e5"/>
<text x="416" y="291" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">Handover Request</text>
<line x1="660" y1="336" x2="410" y2="336" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="410,336 419,340.5 419,331.5" fill="#4f46e5"/>
<text x="416" y="329" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">Handover Request Ack（含接入参数）</text>
<line x1="410" y1="374" x2="160" y2="374" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="160,374 169,378.5 169,369.5" fill="#4f46e5"/>
<text x="166" y="367" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">RRCReconfiguration（切换命令）</text>
<line x1="410" y1="412" x2="660" y2="412" stroke="#0f9d58" stroke-width="1.8" stroke-dasharray="3 3"/>
<polygon points="660,412 651,407.5 651,416.5" fill="#0f9d58"/>
<text x="416" y="405" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">数据转发（Xn-U，未确认包）</text>
<line x1="160" y1="450" x2="660" y2="450" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="660,450 651,445.5 651,454.5" fill="#4f46e5"/>
<text x="166" y="443" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">随机接入（非竞争前导）</text>
<line x1="660" y1="488" x2="910" y2="488" stroke="#0f9d58" stroke-width="1.8"/>
<polygon points="910,488 901,483.5 901,492.5" fill="#0f9d58"/>
<text x="666" y="481" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">Path Switch / Handover Notify</text>
<line x1="660" y1="526" x2="410" y2="526" stroke="#475569" stroke-width="1.8"/>
<polygon points="410,526 419,530.5 419,521.5" fill="#475569"/>
<text x="416" y="519" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">UE Context Release</text>
<rect x="60" y="570" width="1040" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="76" y="600" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点（边界）</text>
<text x="76" y="624" font-size="10.2" fill="#334155" xml:space="preserve">· 切换由接入网决策，核心网只做路径更新——先查覆盖/邻区/PCI/Xn 链路，再查核心网。</text>
<text x="76" y="642" font-size="10.2" fill="#334155" xml:space="preserve">· T304 保护“发命令 → 完成切换”这段；超时会触发重建（回源或选新小区）。</text>
<text x="36" y="684" font-size="12.3" fill="#64748b" xml:space="preserve">图源：3GPP 38.300 / 38.331 / 23.502 的切换流程；课程材料《5G 基础信令培训》。</text>
</svg>
