<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="500" viewBox="0 0 1140 500" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1140" height="500" fill="#ffffff"/>
<line x1="36" y1="112" x2="1104" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 26 · 毫米波下行链路预算：dB 的加减法</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">以 28 GHz、200 m、400 MHz 为例，把链路预算拆成五项。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">颜色只做辅助：带负号的是损耗，绿色是结果；数字为示意假设，不是设备规格。</text>
<text x="60" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">下行视距：EIRP → 路径损耗 → 阵列增益 → 接收电平</text>
<rect x="60" y="200" width="196" height="82" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="60" y="200" width="4.5" height="82" fill="#4f46e5" rx="2"/>
<text x="73" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">gNB EIRP +55 dBm</text>
<text x="73" y="236" font-size="9.6" fill="#334155" xml:space="preserve">发射功率 + 阵列增益</text>
<text x="73" y="251.4" font-size="9.6" fill="#334155" xml:space="preserve">示意值</text>
<line x1="256" y1="241" x2="268" y2="241" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="268,241 259,236.5 259,245.5" fill="#94a3b8"/>
<rect x="268" y="200" width="196" height="82" fill="#fff5f5" rx="8" stroke="#dc2626" stroke-width="1.1"/>
<rect x="268" y="200" width="4.5" height="82" fill="#dc2626" rx="2"/>
<text x="281" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">路径损耗 −107 dB</text>
<text x="281" y="236" font-size="9.6" fill="#334155" xml:space="preserve">200 m @ 28 GHz</text>
<text x="281" y="251.4" font-size="9.6" fill="#334155" xml:space="preserve">FSPL 主导</text>
<line x1="464" y1="241" x2="476" y2="241" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="476,241 467,236.5 467,245.5" fill="#94a3b8"/>
<rect x="476" y="200" width="196" height="82" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="476" y="200" width="4.5" height="82" fill="#d97706" rx="2"/>
<text x="489" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">大气/雨衰 −1 dB</text>
<text x="489" y="236" font-size="9.6" fill="#334155" xml:space="preserve">28 GHz 晴天</text>
<text x="489" y="251.4" font-size="9.6" fill="#334155" xml:space="preserve">60 GHz 另算</text>
<line x1="672" y1="241" x2="684" y2="241" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="684,241 675,236.5 675,245.5" fill="#94a3b8"/>
<rect x="684" y="200" width="196" height="82" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="684" y="200" width="4.5" height="82" fill="#0891b2" rx="2"/>
<text x="697" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">UE 阵列 +10 dB</text>
<text x="697" y="236" font-size="9.6" fill="#334155" xml:space="preserve">4×4 面板</text>
<text x="697" y="251.4" font-size="9.6" fill="#334155" xml:space="preserve">必须对准</text>
<line x1="880" y1="241" x2="892" y2="241" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="892,241 883,236.5 883,245.5" fill="#94a3b8"/>
<rect x="892" y="200" width="196" height="82" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="892" y="200" width="4.5" height="82" fill="#0f9d58" rx="2"/>
<text x="905" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">接收 −43 dBm</text>
<text x="905" y="236" font-size="9.6" fill="#334155" xml:space="preserve">噪声 −81 dBm</text>
<text x="905" y="251.4" font-size="9.6" fill="#334155" xml:space="preserve">SNR ≈ 38 dB</text>
<rect x="60" y="330" width="1028" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="76" y="360" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读这笔账要注意什么</text>
<text x="76" y="384" font-size="10.2" fill="#334155" xml:space="preserve">① 这是下行视距：遮挡 25 dB 后 SNR 掉到约 13 dB；500 m 再加遮挡只剩约 5 dB。</text>
<text x="76" y="402" font-size="10.2" fill="#334155" xml:space="preserve">② 上行更紧：终端 EIRP 和天线口径都比基站小，小区半径通常由上行与遮挡决定。</text>
<text x="76" y="420" font-size="10.2" fill="#334155" xml:space="preserve">③ 噪声底按 −174 + 10log10(BW) + NF 估算；带宽翻倍，噪声底加 3 dB。</text>
<text x="36" y="464" font-size="12.3" fill="#64748b" xml:space="preserve">图源：本篇按 FSPL 与噪声底公式估算，参数为示意假设；公式见 01-射频与天线/00-无线传播与射频基础。</text>
</svg>
