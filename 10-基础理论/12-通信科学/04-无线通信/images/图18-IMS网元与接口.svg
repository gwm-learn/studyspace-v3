<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 18 · IMS 网元与接口：SIP 走 CSCF，签约在 HSS，策略在 PCRF</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">实线是 SIP（Mw 接口），虚线是 Diameter（Cx/Rx）。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">P-CSCF 是终端进入 IMS 的门，S-CSCF 是会话控制的核心。</text>
