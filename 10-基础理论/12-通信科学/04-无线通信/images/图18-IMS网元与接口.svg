<text x="56" y="624" font-size="10.2" fill="#334155" xml:space="preserve">· 注册时 I-CSCF 先问 HSS“这个用户归哪个 S-CSCF”，之后 S-CSCF 把注册状态写回 HSS。</text>
<text x="56" y="642" font-size="10.2" fill="#334155" xml:space="preserve">· 呼叫建立后，P-CSCF 通过 Rx 向 PCRF 申请语音专用承载（QCI 1 / 5QI 1）。</text>
<text x="56" y="660" font-size="10.2" fill="#334155" xml:space="preserve">· MGCF/MGW 只在和 2G/3G 电路域或 PSTN 互通时出现，纯 IMS 到 IMS 的呼叫不经过它。</text>
<text x="36" y="704" font-size="12.3" fill="#64748b" xml:space="preserve">图源：3GPP 23.228 / 24.229 / 23.203 的 IMS 与 PCC 描述；课程材料《VoLTE 笔记》《SDX55 平台 VoLTE 简介》。</text>
