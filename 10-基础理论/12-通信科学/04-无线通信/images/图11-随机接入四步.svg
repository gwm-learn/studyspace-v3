<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="680" viewBox="0 0 1160 680" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1160" height="680" fill="#ffffff"/>
<line x1="36" y1="112" x2="1124" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 11 · 基于竞争的随机接入：Msg1~Msg4</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">四步交换：前导 → 响应 → 身份 → 竞争解决。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">Msg1 不带身份，Msg3 才带；Msg4 把 Msg3 原样回显做比对。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">信令</text>
<line x1="120" y1="142" x2="150" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">超时/失败</text>
<rect x="130" y="190" width="240" height="42" fill="#f1f5f9" rx="8" stroke="#4f46e5" stroke-width="1"/>
<text x="142" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">UE</text>
<rect x="590" y="190" width="240" height="42" fill="#f1f5f9" rx="8" stroke="#0f9d58" stroke-width="1"/>
<text x="602" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">gNB</text>
<line x1="250" y1="232" x2="250" y2="506" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="710" y1="232" x2="710" y2="506" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="250" y1="260" x2="710" y2="260" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="710,260 701,255.5 701,264.5" fill="#4f46e5"/>
<text x="256" y="253" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">Msg1 · PRACH 前导（64 选 1）</text>
<line x1="710" y1="298" x2="250" y2="298" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="250,298 259,302.5 259,293.5" fill="#4f46e5"/>
<text x="256" y="291" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">Msg2 · RAR：TA + 上行 grant + TC-RNTI</text>
<line x1="250" y1="336" x2="710" y2="336" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="710,336 701,331.5 701,340.5" fill="#4f46e5"/>
<text x="256" y="329" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">Msg3 · RRCSetupRequest（带 UE 标识）</text>
<line x1="710" y1="374" x2="250" y2="374" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="250,374 259,378.5 259,369.5" fill="#4f46e5"/>
<text x="256" y="367" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">Msg4 · 竞争解决：回显 Msg3 的 CCCH SDU</text>
<line x1="250" y1="412" x2="284" y2="412" stroke="#0f9d58" stroke-width="1.8"/>
<line x1="284" y1="412" x2="284" y2="426" stroke="#0f9d58" stroke-width="1.8"/>
<line x1="284" y1="426" x2="256" y2="426" stroke="#0f9d58" stroke-width="1.8"/>
<polygon points="252,426 261,430.5 261,421.5" fill="#0f9d58"/>
<text x="256" y="405" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">比对一致：TC-RNTI 转正为 C-RNTI</text>
<line x1="250" y1="450" x2="284" y2="450" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3 3"/>
<line x1="284" y1="450" x2="284" y2="464" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3 3"/>
<line x1="284" y1="464" x2="256" y2="464" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3 3"/>
<polygon points="252,464 261,468.5 261,459.5" fill="#dc2626"/>
<text x="256" y="443" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">RAR 窗口超时：功率攀升重发</text>
<line x1="250" y1="488" x2="284" y2="488" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3 3"/>
<line x1="284" y1="488" x2="284" y2="502" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3 3"/>
<line x1="284" y1="502" x2="256" y2="502" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3 3"/>
<polygon points="252,502 261,506.5 261,497.5" fill="#dc2626"/>
<text x="256" y="481" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">竞争解决失败：退避后重来</text>
<rect x="130" y="532" width="980" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="146" y="562" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点（边界）</text>
<text x="146" y="586" font-size="10.2" fill="#334155" xml:space="preserve">· 同小区同一时刻只有 64 个前导可用，两个终端选中同一个就冲突，靠退避重试。</text>
<text x="146" y="604" font-size="10.2" fill="#334155" xml:space="preserve">· 非竞争接入由网络指定专用前导（切换/恢复），没有 Msg3/Msg4 的竞争解决。</text>
<text x="36" y="644" font-size="12.3" fill="#64748b" xml:space="preserve">图源：3GPP 36.321 / 38.321 随机接入过程；课程材料《6-LTE-随机接入过程》。</text>
</svg>
