<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1280" height="680" fill="#ffffff"/>
<line x1="36" y1="112" x2="1244" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · 语音网演进：信令与媒体一步步分开</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">上方时间轴是代际，下方矩阵对比信令、媒体与核心设备。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">看两件事：信令从 ISUP 换成 SIP；媒体从独占时隙换成共享 IP 包。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">代际里程碑</text>
<line x1="80" y1="236" x2="1160" y2="236" stroke="#cbd5e1" stroke-width="1.8"/>
<polygon points="188,231 183,236 188,241 193,236" fill="#4f46e5"/>
<text x="188" y="218" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="600" text-anchor="middle">PSTN</text>
<text x="188" y="204" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">电路交换</text>
<polygon points="404,231 399,236 404,241 409,236" fill="#4f46e5"/>
<text x="404" y="260" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="600" text-anchor="middle">VoIP</text>
<text x="404" y="274" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">H.323 / SIP</text>
<polygon points="620,231 615,236 620,241 625,236" fill="#4f46e5"/>
<text x="620" y="218" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="600" text-anchor="middle">NGN</text>
<text x="620" y="204" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">软交换</text>
<polygon points="836,231 831,236 836,241 841,236" fill="#4f46e5"/>
<text x="836" y="260" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="600" text-anchor="middle">IMS</text>
<text x="836" y="274" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">SIP 统一</text>
<polygon points="1052,231 1047,236 1052,241 1057,236" fill="#4f46e5"/>
<text x="1052" y="218" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="600" text-anchor="middle">VoLTE/VoNR</text>
<text x="1052" y="204" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">蜂窝承载</text>
<rect x="80" y="300" width="1160" height="30" fill="#f1f5f9" rx="6"/>
<text x="88" y="320" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="start">阶段</text>
<text x="428" y="320" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">信令</text>
<text x="660" y="320" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">媒体</text>
<text x="892" y="320" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">核心设备</text>
<text x="1124" y="320" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">关键变化</text>
<rect x="80" y="330" width="1160" height="34" fill="#ffffff"/>
<line x1="80" y1="330" x2="1240" y2="330" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="88" y="350" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">PSTN</text>
<text x="428" y="350" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">ISUP / SS7</text>
<text x="660" y="350" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">64 kbps PCM 时隙</text>
<text x="892" y="350" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">程控交换机</text>
<text x="1124" y="350" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">通话独占一条 64 kbps</text>
<rect x="80" y="364" width="1160" height="34" fill="#ffffff"/>
<line x1="80" y1="364" x2="1240" y2="364" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="88" y="384" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">VoIP</text>
<text x="428" y="384" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">H.323 / SIP</text>
<text x="660" y="384" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">RTP over UDP</text>
<text x="892" y="384" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">网关 / IP-PBX</text>
<text x="1124" y="384" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">语音变成数据包</text>
<rect x="80" y="398" width="1160" height="34" fill="#ffffff"/>
<line x1="80" y1="398" x2="1240" y2="398" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="88" y="418" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">NGN</text>
<text x="428" y="418" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">SIP / BICC + H.248</text>
<text x="660" y="418" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">RTP</text>
<text x="892" y="418" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">MGC + MGW</text>
<text x="1124" y="418" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">控制与承载分离</text>
<rect x="80" y="432" width="1160" height="34" fill="#ffffff"/>
<line x1="80" y1="432" x2="1240" y2="432" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="88" y="452" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">IMS</text>
<text x="428" y="452" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">SIP</text>
<text x="660" y="452" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">RTP / SRTP</text>
<text x="892" y="452" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">CSCF + AS + MGW</text>
<text x="1124" y="452" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">统一 SIP，业务由 AS 提供</text>
<rect x="80" y="466" width="1160" height="34" fill="#ffffff"/>
<line x1="80" y1="466" x2="1240" y2="466" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="88" y="486" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">VoLTE/VoNR</text>
<text x="428" y="486" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">SIP（IMS）</text>
<text x="660" y="486" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">RTP over 蜂窝承载</text>
<text x="892" y="486" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">UE + IMS + EPC/5GC</text>
<text x="1124" y="486" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">语音成为网内 IP 业务</text>
<line x1="80" y1="500" x2="1240" y2="500" stroke="#e2e8f0" stroke-width="0.8"/>
<rect x="80" y="516" width="1160" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="96" y="546" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点（边界）</text>
<text x="96" y="570" font-size="10.2" fill="#334155" xml:space="preserve">· 变的只是两条腿跑在哪张网上：编号、鉴权、计费、互通这些“电信基因”没有消失。</text>
<text x="96" y="588" font-size="10.2" fill="#334155" xml:space="preserve">· 控制与承载分离（NGN）是分水岭：之前媒体跟着交换机走，之后媒体可以独立部署。</text>
<text x="36" y="644" font-size="12.3" fill="#64748b" xml:space="preserve">图源：ITU-T Q.76x（ISUP）、IETF RFC 3261、3GPP 23.228 的公开结构；课程材料《VoLTE 笔记》。</text>
</svg>
