<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1000" height="700" fill="#ffffff"/>
<line x1="36" y1="112" x2="964" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 03 · xDSL：在电话线上“挤”出宽带</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">xDSL 把 0–100 MHz 以上的铜线频谱切成很多窄子信道，用 DMT 按信噪比动态分配比特。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">越靠近用户（FTTC/FTTB），铜线越短，可用带宽越高；这是 G.fast 的前提。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">上行</text>
<line x1="120" y1="142" x2="150" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">下行</text>
<line x1="204" y1="142" x2="234" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="242" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">更高频段</text>
<line x1="310" y1="142" x2="340" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="348" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">边界</text>
<line x1="60" y1="250" x2="940" y2="250" stroke="#475569" stroke-width="1.6"/>
<line x1="60" y1="244" x2="60" y2="256" stroke="#475569" stroke-width="1.2"/>
<text x="60" y="274" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">0</text>
<line x1="220" y1="244" x2="220" y2="256" stroke="#475569" stroke-width="1.2"/>
<text x="220" y="274" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">138 kHz</text>
<line x1="420" y1="244" x2="420" y2="256" stroke="#475569" stroke-width="1.2"/>
<text x="420" y="274" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">1.1 MHz</text>
<line x1="600" y1="244" x2="600" y2="256" stroke="#475569" stroke-width="1.2"/>
<text x="600" y="274" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">17 MHz</text>
<line x1="780" y1="244" x2="780" y2="256" stroke="#475569" stroke-width="1.2"/>
<text x="780" y="274" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">30 MHz</text>
<line x1="920" y1="244" x2="920" y2="256" stroke="#475569" stroke-width="1.2"/>
<text x="920" y="274" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">106 MHz+</text>
<rect x="64" y="206" width="152" height="26" fill="#0f9d58" rx="3" stroke="#0f9d58" stroke-width="1"/>
<text x="140" y="224" font-size="9" fill="#ffffff" xml:space="preserve" font-weight="700" text-anchor="middle">ADSL 上行</text>
<rect x="220" y="206" width="196" height="26" fill="#4f46e5" rx="3" stroke="#4f46e5" stroke-width="1"/>
<text x="318" y="224" font-size="9" fill="#ffffff" xml:space="preserve" font-weight="700" text-anchor="middle">ADSL 下行</text>
<rect x="64" y="166" width="530" height="26" fill="#d97706" rx="3" stroke="#d97706" stroke-width="1"/>
<text x="329" y="184" font-size="9" fill="#ffffff" xml:space="preserve" font-weight="700" text-anchor="middle">VDSL2：上行 + 下行，最高 17/30 MHz（剖面可配）</text>
<rect x="64" y="126" width="856" height="26" fill="#0891b2" rx="3" stroke="#0891b2" stroke-width="1"/>
<text x="492" y="144" font-size="9" fill="#ffffff" xml:space="preserve" font-weight="700" text-anchor="middle">G.fast：最高 106/212 MHz，距离通常 &lt; 250 m</text>
<text x="60" y="300" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">DMT：把一条铜线切成很多窄子信道</text>
<text x="60" y="318" font-size="9.6" fill="#64748b" xml:space="preserve">每个子信道根据 SNR 决定装载几个比特；SNR 差的子信道少装或不装，这就是“比特加载”。</text>
<rect x="60" y="400" width="15" height="30" fill="#dc2626" rx="2" stroke="#dc2626" stroke-width="1"/>
