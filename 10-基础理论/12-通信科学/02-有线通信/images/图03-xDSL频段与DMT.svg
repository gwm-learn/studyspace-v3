<text x="60" y="450" font-size="9.2" fill="#64748b" xml:space="preserve">子信道编号 →（示意）</text>
<text x="60" y="470" font-size="9.6" fill="#334155" xml:space="preserve">高度 ≈ 该子信道可承载的比特数；凹陷处通常是窄带干扰或桥接抽头。</text>
<rect x="60" y="500" width="880" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="76" y="530" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图</text>
<text x="76" y="554" font-size="10.2" fill="#334155" xml:space="preserve">① 先看频率轴：ADSL/VDSL/G.fast 的频段逐代上移，但高频衰减更快，所以距离越来越短。</text>
<text x="76" y="572" font-size="10.2" fill="#334155" xml:space="preserve">② 再看 DMT 柱状图：不是每个子信道都一样快，系统按 SNR 动态分配比特。</text>
<text x="76" y="590" font-size="10.2" fill="#334155" xml:space="preserve">③ 铜线的敌人是“串扰”和“桥接抽头”，不是“线太长”这么简单。</text>
<text x="36" y="646" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="664" font-size="12.3" fill="#64748b" xml:space="preserve">说明：频段为量级示意，ADSL/VDSL2/G.fast 的具体剖面与速率以 ITU-T G.992/G.993/G.9701 为准。</text>
</svg>
