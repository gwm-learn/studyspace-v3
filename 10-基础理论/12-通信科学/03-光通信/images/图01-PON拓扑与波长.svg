<text x="578.5" y="398" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">所有 ONU，按 ONU-ID 过滤</text>
<rect x="36" y="410" width="620" height="32" fill="#ffffff"/>
<line x1="36" y1="410" x2="656" y2="410" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="430" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">上行</text>
<text x="268.5" y="430" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">1310 nm</text>
<text x="423.5" y="430" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">TDMA 突发</text>
<text x="578.5" y="430" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">OLT，按授权时隙接收</text>
<rect x="36" y="442" width="620" height="32" fill="#ffffff"/>
<line x1="36" y1="442" x2="656" y2="442" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="462" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">视频（可选）</text>
<text x="268.5" y="462" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">1550 nm</text>
<text x="423.5" y="462" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">叠加</text>
<text x="578.5" y="462" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">需要视频业务的 ONU</text>
<line x1="36" y1="474" x2="656" y2="474" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="700" y="330" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">PON 家族</text>
<rect x="700" y="348" width="320" height="30" fill="#f1f5f9" rx="6"/>
<text x="708" y="368" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="start">标准</text>
<text x="940" y="368" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">下行/上行</text>
