<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="740" viewBox="0 0 1140 740" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1140" height="740" fill="#ffffff"/>
<line x1="36" y1="112" x2="1104" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · PON：一根主干光纤，被分光器分给多户</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">PON 是点对多点：局端 OLT 一根光纤出去，经无源分光器分成多路到 ONU，中间不需要供电。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">下行是广播 TDM，所有 ONU 都能收到，靠 GEM Port/ONU-ID 过滤；上行是 TDMA，各 ONU 按授权时隙发送。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">下行 1490 nm</text>
<line x1="172.8" y1="142" x2="202.8" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="210.8" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">上行 1310 nm</text>
<line x1="309.6" y1="142" x2="339.6" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="347.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">无源分光</text>
<line x1="415.6" y1="142" x2="445.6" y2="142" stroke="#0891b2" stroke-width="3"/>
<text x="453.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">用户侧</text>
<rect x="36" y="200" width="170" height="86" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="36" y="200" width="4.5" height="86" fill="#4f46e5" rx="2"/>
<text x="49" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">OLT</text>
<text x="49" y="236" font-size="9.6" fill="#334155" xml:space="preserve">局端光线路终端</text>
<text x="49" y="251.4" font-size="9.6" fill="#334155" xml:space="preserve">PON 口/上行口</text>
<rect x="276" y="200" width="190" height="86" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
