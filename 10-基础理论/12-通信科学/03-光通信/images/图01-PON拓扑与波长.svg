<polygon points="270,243 261,238.5 261,247.5" fill="#4f46e5"/>
<text x="212" y="232" font-size="9" fill="#4f46e5" xml:space="preserve" font-weight="700">feeder</text>
<text x="476" y="262" font-size="9" fill="#d97706" xml:space="preserve" font-weight="700">splitter</text>
<text x="36" y="330" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">波长分配（GPON 为例）</text>
