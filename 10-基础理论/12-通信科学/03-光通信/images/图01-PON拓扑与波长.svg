<text x="708" y="488" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">EPON</text>
<text x="940" y="488" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">1G / 1G</text>
<rect x="700" y="498" width="320" height="30" fill="#ffffff"/>
<line x1="700" y1="498" x2="1020" y2="498" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="708" y="518" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">10G-EPON</text>
<text x="940" y="518" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">10G / 10G</text>
<line x1="700" y1="528" x2="1020" y2="528" stroke="#e2e8f0" stroke-width="0.8"/>
<rect x="36" y="540" width="980" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="570" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图</text>
<text x="52" y="594" font-size="10.2" fill="#334155" xml:space="preserve">① 先看拓扑：OLT 一根 feeder 光纤到分光器，分光器再分 drop 光纤到各 ONU，中间没有有源设备。</text>
<text x="52" y="612" font-size="10.2" fill="#334155" xml:space="preserve">② 再看波长：下行和上行用不同波长，所以同一根光纤可以同时双向传输（WDM）。</text>
<text x="52" y="630" font-size="10.2" fill="#334155" xml:space="preserve">③ 最后看复用：下行广播、上行突发，ONU 必须等 OLT 授权才能发，否则会撞车。</text>
<text x="36" y="686" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="704" font-size="12.3" fill="#64748b" xml:space="preserve">说明：速率为标称线路速率；分光比与波长以 ITU-T G.984/G.987/G.9807 及厂商实现为准。</text>
</svg>
