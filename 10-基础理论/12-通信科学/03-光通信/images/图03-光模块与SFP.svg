<text x="330" y="482" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">40G/100G</text>
<text x="526" y="482" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">短距多模/长距单模</text>
<text x="722" y="482" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">数据中心骨干</text>
<text x="918" y="482" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">MPO 极性</text>
