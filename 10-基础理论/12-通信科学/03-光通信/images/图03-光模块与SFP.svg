<text x="330" y="398" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">1G/2.5G</text>
<text x="526" y="398" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">数百 m–数十 km</text>
