<text x="918" y="398" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">速率与端口匹配</text>
<rect x="36" y="406" width="980" height="28" fill="#ffffff"/>
<line x1="36" y1="406" x2="1016" y2="406" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="426" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">SFP+</text>
<text x="330" y="426" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">10G</text>
<text x="526" y="426" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">300 m–40 km</text>
<text x="722" y="426" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">数据中心、园区</text>
<text x="918" y="426" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">DDM/兼容性</text>
<rect x="36" y="434" width="980" height="28" fill="#ffffff"/>
<line x1="36" y1="434" x2="1016" y2="434" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="454" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">SFP28</text>
<text x="330" y="454" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">25G</text>
<text x="526" y="454" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">100 m–10 km</text>
<text x="722" y="454" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">服务器/交换机</text>
<text x="918" y="454" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">散热与功耗</text>
