<text x="526" y="510" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">短距为主</text>
<text x="722" y="510" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">数据中心</text>
<text x="918" y="510" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">功耗/散热挑战</text>
<line x1="36" y1="518" x2="1016" y2="518" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="36" y="530" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">选型四问</text>
<rect x="36" y="548" width="980" height="128" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="578" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图</text>
<text x="52" y="602" font-size="10.2" fill="#334155" xml:space="preserve">① 速率对不对：1G 口插 10G 模块通常不协商，反之亦然。</text>
<text x="52" y="620" font-size="10.2" fill="#334155" xml:space="preserve">② 波长/光纤对不对：850 nm 多模、1310/1550 nm 单模，不能混用。</text>
<text x="52" y="638" font-size="10.2" fill="#334155" xml:space="preserve">③ 距离够不够：模块的 reach 是“典型最大距离”，还要扣连接器/熔接损耗。</text>
<text x="52" y="656" font-size="10.2" fill="#334155" xml:space="preserve">④ DDM 能不能读：收光/发光/温度/电压是现场排障的第一手数据。</text>
<text x="36" y="706" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="724" font-size="12.3" fill="#64748b" xml:space="preserve">说明：封装/速率/距离为常见组合，具体以 MSA（SFP/SFF/QSFP）与厂商规格书为准。</text>
</svg>
