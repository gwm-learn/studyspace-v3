<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 03 · 光模块：电信号 ↔ 光信号的双向翻译</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">光模块内部是“电接口 + 激光器/驱动器 + 光接口 + 接收探测/放大”的完整链路。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">选型看四件事：速率、波长、传输距离/光纤类型、DDM 与端口兼容。</text>
