<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · 上行 TDMA 与测距：让所有 ONU 的突发“排队进门”</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">不同 ONU 到 OLT 的距离不同，信号到达时间也不同；测距就是测 RTT，再给每个 ONU 一个均衡时延。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">上行时隙之间留保护间隔，防止近端 ONU 的突发压到远端 ONU 的时隙。</text>
