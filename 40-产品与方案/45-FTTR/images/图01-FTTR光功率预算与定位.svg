<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · FTTR 光功率预算与故障定位：从左到右逐段扣</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">预算是一条减法链：发端功率 → 主干损耗 → 分光器损耗 → 分支损耗 → 收端余量。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">定位按「主干—分支—从网关—终端」四段收敛，不要一上来换设备。</text>
