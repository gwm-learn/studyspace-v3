<text x="49" y="226" font-size="9.6" fill="#334155" xml:space="preserve">主/从网关 TX</text>
<line x1="206" y1="231" x2="226" y2="231" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="226,231 217,226.5 217,235.5" fill="#94a3b8"/>
<rect x="226" y="190" width="170" height="82" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="226" y="190" width="4.5" height="82" fill="#d97706" rx="2"/>
<text x="239" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">光纤损耗</text>
<text x="239" y="226" font-size="9.6" fill="#334155" xml:space="preserve">距离 × 衰减</text>
<line x1="396" y1="231" x2="416" y2="231" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="416,231 407,226.5 407,235.5" fill="#94a3b8"/>
