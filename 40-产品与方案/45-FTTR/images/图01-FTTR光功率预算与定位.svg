<text x="52" y="432.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">收端余量（高于灵敏度）</text>
<text x="550" y="432.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">判定</text>
<text x="620" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">故障定位四段</text>
