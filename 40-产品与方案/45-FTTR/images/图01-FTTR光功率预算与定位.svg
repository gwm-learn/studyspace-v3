<text x="550" y="216.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">起点</text>
<rect x="40" y="244" width="520" height="46" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.1"/>
<text x="52" y="270.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">主干光纤 + 活动连接器</text>
<text x="550" y="270.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">扣损耗</text>
<rect x="40" y="298" width="520" height="46" fill="#fff9ee" rx="6" stroke="#d97706" stroke-width="1.1"/>
<text x="52" y="324.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">分光器（1:N）</text>
