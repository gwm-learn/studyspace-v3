<text x="180" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">损耗项</text>
<line x1="237" y1="142" x2="267" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="275" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">收光判定</text>
<text x="36" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① 光功率预算</text>
<rect x="36" y="190" width="170" height="82" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
