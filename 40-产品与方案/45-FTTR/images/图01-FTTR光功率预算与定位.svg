<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="700" viewBox="0 0 1020 700" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1020" height="700" fill="#ffffff"/>
<line x1="36" y1="112" x2="984" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · FTTR 光功率预算与故障定位</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">收光 = 发光 − 光纤/分光/连接器损耗 − 余量，必须高于灵敏度。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：上半段算预算，下半段按“主干—分支—从网关—终端”四段定位。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">功率预算</text>
