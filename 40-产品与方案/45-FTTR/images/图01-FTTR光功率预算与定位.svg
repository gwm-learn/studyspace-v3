<text x="632" y="221.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">① 主干：查 OLT 口与总光功率</text>
<text x="990" y="221.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">先看</text>
<rect x="620" y="246" width="380" height="44" fill="#f8fafc" rx="6" stroke="#475569" stroke-width="1.1"/>
<text x="632" y="271.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">② 分支：查分光器端口</text>
<text x="990" y="271.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">再看</text>
<rect x="620" y="296" width="380" height="44" fill="#f8fafc" rx="6" stroke="#475569" stroke-width="1.1"/>
