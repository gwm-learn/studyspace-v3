<text x="632" y="371.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">④ 终端：查 Wi-Fi / 网线</text>
<text x="990" y="371.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">最后</text>
<rect x="40" y="478" width="1000" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="508" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="532" font-size="10.2" fill="#334155" xml:space="preserve">分光比、光纤长度、熔接点、连接器脏污都会吃余量；任何一项异常，最后都表现为「收光偏低」。</text>
<text x="56" y="550" font-size="10.2" fill="#334155" xml:space="preserve">先量收光再换设备：收光正常但注册失败，才轮到认证/版本问题。</text>
