<text x="52" y="704" font-size="10.2" fill="#334155" xml:space="preserve">① 接入模块是形态差异的核心：xDSL/PON/蜂窝的驱动和认证完全不同。</text>
<text x="52" y="722" font-size="10.2" fill="#334155" xml:space="preserve">② 管理通道走 WAN 还是独立 VLAN，决定了 ACS 能否稳定连上设备。</text>
<text x="52" y="740" font-size="10.2" fill="#334155" xml:space="preserve">③ 用户侧业务可能分 VLAN，不能默认所有 LAN 口都在同一个二层域。</text>
