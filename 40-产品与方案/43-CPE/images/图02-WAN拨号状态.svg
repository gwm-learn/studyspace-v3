<line x1="763.9" y1="340" x2="96.5" y2="340" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3 3"/>
<line x1="96.5" y1="340" x2="96.5" y2="294" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3 3"/>
<polygon points="96.5,294 92,303 101,303" fill="#dc2626"/>
<text x="430.2" y="356" font-size="9.4" fill="#dc2626" xml:space="preserve" font-weight="600" text-anchor="middle">掉线 / 认证失败 / 地址超时 → 重新拨号</text>
<rect x="60" y="400" width="900" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="76" y="430" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="76" y="454" font-size="10.2" fill="#334155" xml:space="preserve">认证失败通常停在「认证中」，不会往下走；地址超时停在「获取地址」。</text>
<text x="76" y="472" font-size="10.2" fill="#334155" xml:space="preserve">把失败阶段写进日志（或 TR-069 的参数），远程排障就不用猜。</text>
