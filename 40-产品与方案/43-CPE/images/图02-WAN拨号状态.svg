<text x="763.9" y="272" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">在线</text>
<text x="763.9" y="284" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">可转发</text>
<line x1="133" y1="272" x2="220" y2="272" stroke="#475569" stroke-width="1.6"/>
