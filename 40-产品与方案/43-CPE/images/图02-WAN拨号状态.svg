<rect x="220" y="250" width="70.16" height="44" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.2"/>
<text x="255.08" y="272" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">链路 up</text>
<text x="255.08" y="284" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">PPPoE 发现</text>
<rect x="400" y="250" width="73.6" height="44" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.2"/>
<text x="436.8" y="272" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">认证中</text>
<text x="436.8" y="284" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">PAP / CHAP</text>
