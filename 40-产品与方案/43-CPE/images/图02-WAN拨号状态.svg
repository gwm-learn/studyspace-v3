<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · WAN 拨号状态：失败停在哪一步，就从哪一步查</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">主链是 链路 → 认证 → 地址 → 在线；失败不掉到「未知」，而是停在对应阶段。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">重拨时从链路阶段重新开始，不是从失败那一步续上。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
