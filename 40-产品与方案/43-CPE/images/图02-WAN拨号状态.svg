<text x="345.08" y="265" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">LCP 完成</text>
<line x1="473.6" y1="272" x2="560" y2="272" stroke="#4f46e5" stroke-width="1.6"/>
<polygon points="560,272 551,267.5 551,276.5" fill="#4f46e5"/>
<text x="516.8" y="265" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">认证通过</text>
<line x1="638.76" y1="272" x2="740" y2="272" stroke="#0f9d58" stroke-width="1.6"/>
