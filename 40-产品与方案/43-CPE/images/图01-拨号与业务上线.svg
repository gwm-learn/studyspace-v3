<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="800" viewBox="0 0 1060 800" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1060" height="800" fill="#ffffff"/>
<line x1="36" y1="112" x2="1024" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · CPE 拨号与业务上线流程</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">链路 → 认证 → 地址 → 路由/NAT → 业务；失败时按阶段向上排查。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：每一步都有明确的失败现象，先定位阶段，再看具体配置。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">正常路径</text>
<line x1="142" y1="142" x2="172" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="180" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">关键动作</text>
<rect x="36" y="200" width="180" height="82" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="36" y="200" width="4.5" height="82" fill="#4f46e5" rx="2"/>
