<text x="52" y="714" font-size="10.2" fill="#334155" xml:space="preserve">① 标准路径优先：TR-181 用 Device.*，TR-098 用 InternetGatewayDevice.*。</text>
<text x="52" y="732" font-size="10.2" fill="#334155" xml:space="preserve">② 私有参数只做标准模型覆盖不到的补充，换 ACS 时要能降级。</text>
<text x="52" y="750" font-size="10.2" fill="#334155" xml:space="preserve">③ 参数是只读还是可写由模型定义，写只读参数会返回故障码。</text>
