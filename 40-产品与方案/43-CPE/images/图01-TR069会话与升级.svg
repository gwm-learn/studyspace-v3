<svg xmlns="http://www.w3.org/2000/svg" width="880" height="740" viewBox="0 0 880 740" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="880" height="740" fill="#ffffff"/>
<line x1="36" y1="112" x2="844" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · TR-069 会话与升级流程</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">CPE 主动 Inform 建立会话，ACS 在同一会话里连续下发 RPC；升级后由 BOOT 事件确认。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：先看会话主线，再看升级支线；两者的失败处理都在 CPE 侧。</text>
