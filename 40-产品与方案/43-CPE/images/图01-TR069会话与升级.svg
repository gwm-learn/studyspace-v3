<text x="52" y="570" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="52" y="594" font-size="10.2" fill="#334155" xml:space="preserve">① 所有会话由 CPE 发起；ACS 主动下发必须先做 Connection Request。</text>
<text x="52" y="612" font-size="10.2" fill="#334155" xml:space="preserve">② 升级失败要能回滚到旧分区，重启后由 BOOT 事件确认版本。</text>
<text x="52" y="630" font-size="10.2" fill="#334155" xml:space="preserve">③ 参数路径必须与 TR-098/TR-181 对齐，私有参数只做补充。</text>
