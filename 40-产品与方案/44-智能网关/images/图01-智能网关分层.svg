<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1100" height="620" fill="#ffffff"/>
<line x1="36" y1="112" x2="1064" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · 智能网关分层架构：底座、中间件、插件、云管</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">下面两层保证「能用」，上面两层决定「能做什么」；任一层故障都向上表现为业务不可用。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">中间件的价值是把南向设备抽象成统一模型，插件不必为每种协议写一遍。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#475569" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">平台</text>
<line x1="120" y1="142" x2="150" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">抽象</text>
<line x1="204" y1="142" x2="234" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="242" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">业务</text>
<line x1="288" y1="142" x2="318" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="326" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">运维</text>
<rect x="40" y="190" width="700" height="56" fill="#fff9ee" rx="6" stroke="#d97706" stroke-width="1.1"/>
<text x="52" y="221.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">云管 / OTA：远程下发、版本与观测</text>
<text x="730" y="221.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">运维面</text>
<rect x="40" y="256" width="700" height="56" fill="#f2fcf5" rx="6" stroke="#0f9d58" stroke-width="1.1"/>
<text x="52" y="287.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">插件 / 场景：业务逻辑与自动化</text>
<text x="730" y="287.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">业务</text>
<rect x="40" y="322" width="700" height="56" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.1"/>
<text x="52" y="353.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">中间件：设备模型、协议适配、消息总线</text>
<text x="730" y="353.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">统一抽象</text>
<rect x="40" y="388" width="700" height="56" fill="#f8fafc" rx="6" stroke="#475569" stroke-width="1.1"/>
<text x="52" y="419.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">系统底座：网络、存储、进程管理</text>
<text x="730" y="419.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">平台</text>
<rect x="780" y="190" width="280" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="796" y="220" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">分层排障</text>
<text x="796" y="244" font-size="10.2" fill="#334155" xml:space="preserve">业务不通先看底座（网络/进程）</text>
<text x="796" y="262" font-size="10.2" fill="#334155" xml:space="preserve">设备不可控看中间件（协议/模型）</text>
<text x="796" y="280" font-size="10.2" fill="#334155" xml:space="preserve">远程操作失败看云管（连接/权限）</text>
<rect x="40" y="450" width="1020" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="480" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="504" font-size="10.2" fill="#334155" xml:space="preserve">层次越靠下越稳定：底座很少变，插件和云管迭代快。</text>
<text x="56" y="522" font-size="10.2" fill="#334155" xml:space="preserve">跨层问题常见于「中间件模型对不上」——设备在线，但模型没有对应属性，业务就调不到。</text>
<text x="36" y="566" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py 生成</text>
<text x="36" y="584" font-size="12.3" fill="#64748b" xml:space="preserve">本篇：40-产品与方案/44-智能网关/00-智能网关架构.md</text>
</svg>
