<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">启动是按层来的：底座 → 中间件 → 云管 → 插件；前一层不就绪，后一层起不来。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">任一层失败进入「降级」而不是整机不可用——但业务范围会收窄。</text>
