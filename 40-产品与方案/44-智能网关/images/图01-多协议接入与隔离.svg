<rect x="410" y="470" width="4.5" height="110" fill="#0f9d58" rx="2"/>
<text x="423" y="489" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">主网络</text>
<text x="423" y="506" font-size="9.6" fill="#334155" xml:space="preserve">手机/PC/NAS</text>
<text x="423" y="521.4" font-size="9.6" fill="#334155" xml:space="preserve">本地管理</text>
<line x1="640" y1="525" x2="714" y2="525" stroke="#0f9d58" stroke-width="1.8"/>
<polygon points="714,525 705,520.5 705,529.5" fill="#0f9d58"/>
<rect x="714" y="470" width="210" height="110" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="714" y="470" width="4.5" height="110" fill="#0f9d58" rx="2"/>
<text x="727" y="489" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">云平台</text>
<text x="727" y="506" font-size="9.6" fill="#334155" xml:space="preserve">远程控制</text>
<text x="727" y="521.4" font-size="9.6" fill="#334155" xml:space="preserve">OTA/遥测</text>
<rect x="36" y="610" width="888" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="640" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="52" y="664" font-size="10.2" fill="#334155" xml:space="preserve">① 多协议不是目的：上层只消费统一设备模型，才能做跨协议场景。</text>
<text x="52" y="682" font-size="10.2" fill="#334155" xml:space="preserve">② IoT 与主网络必须隔离，跨网访问只开必要端口和发现协议。</text>
<text x="52" y="700" font-size="10.2" fill="#334155" xml:space="preserve">③ 2.4G 上 Wi-Fi/BLE/Zigbee/Thread 共存，天线和信道要一起设计。</text>
<text x="36" y="746" font-size="12.3" fill="#64748b" xml:space="preserve">图源：40-产品与方案/44-智能网关/02-智能家居与安全.md</text>
