<text x="49" y="236" font-size="9.6" fill="#334155" xml:space="preserve">Wi-Fi：摄像头/家电</text>
<text x="49" y="251.4" font-size="9.6" fill="#334155" xml:space="preserve">BLE：门锁/传感器</text>
