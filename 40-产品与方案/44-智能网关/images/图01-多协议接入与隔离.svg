<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · 多协议接入与网络隔离</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">南向把 Wi-Fi/BLE/Zigbee/Thread 抽象成统一设备模型；IoT 设备放在独立 VLAN，受控访问主网和云。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：先看左侧协议接入，再看中间的隔离边界，最后看右侧的去向。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#0891b2" stroke-width="3"/>
