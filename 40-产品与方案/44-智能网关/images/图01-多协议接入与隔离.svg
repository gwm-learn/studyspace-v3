<rect x="604" y="200" width="210" height="170" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="604" y="200" width="4.5" height="170" fill="#4f46e5" rx="2"/>
<text x="617" y="219" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">设备抽象</text>
