<text x="313" y="251.4" font-size="9.6" fill="#334155" xml:space="preserve">BLE 配网代理</text>
<text x="313" y="266.8" font-size="9.6" fill="#334155" xml:space="preserve">Zigbee 协调器</text>
<text x="313" y="282.2" font-size="9.6" fill="#334155" xml:space="preserve">Thread 边界路由器</text>
<text x="313" y="297.6" font-size="9.6" fill="#334155" xml:space="preserve">Matter 控制器/桥</text>
<line x1="530" y1="285" x2="604" y2="285" stroke="#94a3b8" stroke-width="1.8"/>
<polygon points="604,285 595,280.5 595,289.5" fill="#94a3b8"/>
