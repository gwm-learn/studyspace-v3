<text x="156" y="253" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">下发：安装 / 升级 / 配置</text>
<line x1="450" y1="298" x2="750" y2="298" stroke="#0f9d58" stroke-width="1.8"/>
<polygon points="750,298 741,293.5 741,302.5" fill="#0f9d58"/>
<text x="456" y="291" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">执行：装载 / 切换</text>
<line x1="750" y1="336" x2="450" y2="336" stroke="#0f9d58" stroke-width="1.8" stroke-dasharray="3 3"/>
<polygon points="450,336 459,340.5 459,331.5" fill="#0f9d58"/>
<text x="456" y="329" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">状态回报</text>
<line x1="450" y1="374" x2="150" y2="374" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="3 3"/>
<polygon points="150,374 159,378.5 159,369.5" fill="#4f46e5"/>
<text x="156" y="367" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">回执：结果 / 版本</text>
<line x1="150" y1="412" x2="450" y2="412" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="450,412 441,407.5 441,416.5" fill="#4f46e5"/>
<text x="156" y="405" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600">观测：心跳 / 指标</text>
<rect x="40" y="560" width="820" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="590" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="614" font-size="10.2" fill="#334155" xml:space="preserve">云管只管「下发」和「观测」，安装与卸载由网关运行时负责——所以云管显示成功，不代表插件真的在跑。</text>
<text x="56" y="632" font-size="10.2" fill="#334155" xml:space="preserve">升级要先校验再切换；失败必须能回滚，否则一次坏包就让设备失联。</text>
