<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · 插件生命周期与云管链路：谁管安装，谁管下发</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">左边是云管链路：云端下发指令，网关执行并回执；右侧是插件自身的生命周期。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">OTA 与应用升级共用「下载—校验—切换—回滚」骨架。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">云端</text>
<line x1="120" y1="142" x2="150" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">网关</text>
<line x1="204" y1="142" x2="234" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="242" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">插件</text>
<rect x="40" y="190" width="220" height="42" fill="#f1f5f9" rx="8" stroke="#d97706" stroke-width="1"/>
<text x="52" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">云管</text>
<rect x="340" y="190" width="220" height="42" fill="#f1f5f9" rx="8" stroke="#4f46e5" stroke-width="1"/>
<text x="352" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">网关</text>
<rect x="640" y="190" width="220" height="42" fill="#f1f5f9" rx="8" stroke="#0f9d58" stroke-width="1"/>
<text x="652" y="216" font-size="11.2" fill="#0f172a" xml:space="preserve" font-weight="700">插件</text>
<line x1="150" y1="232" x2="150" y2="430" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="450" y1="232" x2="450" y2="430" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
