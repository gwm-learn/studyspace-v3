<text x="52" y="594" font-size="10.2" fill="#334155" xml:space="preserve">① 插件必须有 CPU/内存/磁盘/重启次数上限，否则会拖垮底座。</text>
<text x="52" y="612" font-size="10.2" fill="#334155" xml:space="preserve">② 云管是最终一致：指令要有超时、重试和幂等，离线补发不能执行过期指令。</text>
<text x="52" y="630" font-size="10.2" fill="#334155" xml:space="preserve">③ OTA 必须签名校验 + 双分区 + 回滚，灰度发布优先于全量推送。</text>
