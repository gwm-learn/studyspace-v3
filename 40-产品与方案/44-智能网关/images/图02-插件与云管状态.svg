<text x="88.2" y="284" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">文件就位</text>
<rect x="220" y="250" width="56.4" height="44" fill="#f2fcf5" rx="6" stroke="#0f9d58" stroke-width="1.2"/>
<text x="248.2" y="272" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">运行中</text>
<text x="248.2" y="284" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">业务生效</text>
<rect x="390" y="250" width="56.4" height="44" fill="#f8fafc" rx="6" stroke="#475569" stroke-width="1.2"/>
<text x="418.2" y="272" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">已卸载</text>
<text x="418.2" y="284" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">资源释放</text>
<line x1="116.4" y1="272" x2="220" y2="272" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="220,272 211,267.5 211,276.5" fill="#4f46e5"/>
<text x="168.2" y="265" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">启动</text>
<line x1="276.4" y1="272" x2="390" y2="272" stroke="#475569" stroke-width="1.6"/>
<polygon points="390,272 381,267.5 381,276.5" fill="#475569"/>
<text x="333.2" y="265" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">卸载</text>
<rect x="300" y="360" width="89.08" height="44" fill="#fff5f5" rx="6" stroke="#dc2626" stroke-width="1.2"/>
<text x="344.54" y="382" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">崩溃</text>
<text x="344.54" y="394" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">进程退出 / 异常</text>
<rect x="520" y="360" width="89.08" height="44" fill="#fff9ee" rx="6" stroke="#d97706" stroke-width="1.2"/>
