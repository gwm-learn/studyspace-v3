<text x="564.54" y="394" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">退避 + 次数上限</text>
<rect x="740" y="360" width="90.8" height="44" fill="#fff5f5" rx="6" stroke="#dc2626" stroke-width="1.2"/>
<text x="785.4" y="382" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">禁用</text>
<text x="785.4" y="394" font-size="8.6" fill="#64748b" xml:space="preserve" text-anchor="middle">保留配置，等人工</text>
<line x1="248.2" y1="294" x2="340" y2="360" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3 3"/>
