<line x1="609.08" y1="382" x2="740" y2="382" stroke="#dc2626" stroke-width="1.6"/>
<polygon points="740,382 731,377.5 731,386.5" fill="#dc2626"/>
<text x="674.54" y="375" font-size="9.6" fill="#64748b" xml:space="preserve" font-weight="600" text-anchor="middle">超限</text>
<line x1="564.54" y1="360" x2="248.2" y2="294" stroke="#0f9d58" stroke-width="1.6" stroke-dasharray="3 3"/>
<polygon points="248.2,294 256.09,300.24 257.93,291.43" fill="#0f9d58"/>
<rect x="60" y="450" width="900" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="76" y="480" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="76" y="504" font-size="10.2" fill="#334155" xml:space="preserve">没有上限的重启会把设备拖死：限流 + 次数上限是保护机制，不是「不让你用」。</text>
<text x="76" y="522" font-size="10.2" fill="#334155" xml:space="preserve">禁用状态要能从云管看到，并给出原因，否则现场只能看到「插件不工作」。</text>
