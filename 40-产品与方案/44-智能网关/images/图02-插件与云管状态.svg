<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1000" height="620" fill="#ffffff"/>
<line x1="36" y1="112" x2="964" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · 插件状态：崩溃重启有上限，超限就禁用</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">安装 → 运行 → 卸载是正常链；崩溃走「重启 → 限流 → 禁用」的退避。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">禁用不是删除：配置与数据保留，等人工处理。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">正常</text>
