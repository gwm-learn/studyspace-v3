<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">退避</text>
<line x1="204" y1="142" x2="234" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="242" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">终止</text>
<rect x="60" y="250" width="56.4" height="44" fill="#f8fafc" rx="6" stroke="#475569" stroke-width="1.2"/>
