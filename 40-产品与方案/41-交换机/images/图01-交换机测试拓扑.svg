<text x="52" y="514" font-size="10.2" fill="#334155" xml:space="preserve">① 性能测试必须直连，中间加交换机/分光会引入额外丢包和时延。</text>
<text x="52" y="532" font-size="10.2" fill="#334155" xml:space="preserve">② 环网测试要能远程断开一条链路，记录业务中断时间。</text>
<text x="52" y="550" font-size="10.2" fill="#334155" xml:space="preserve">③ 管理口单独接管理 PC，避免管理流量和测试流量互相干扰。</text>
<text x="36" y="588" font-size="12.3" fill="#64748b" xml:space="preserve">图源：40-产品与方案/41-交换机/02-交换机测试与验收.md</text>
