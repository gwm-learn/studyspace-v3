<text x="56" y="464" font-size="10.2" fill="#334155" xml:space="preserve">SIP 注册失败先看账号/服务器可达；IGMP 加入失败先看组播 VLAN 与 OLT 的组播配置。</text>
<text x="56" y="482" font-size="10.2" fill="#334155" xml:space="preserve">两者都依赖上网通道，但「能上网」不等于 SIP/IGMP 通——它们各自还有一层业务配置。</text>
