<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">注册是 PON 物理层过程；OMCI 是注册成功后的业务配置过程，两者失败现象不同。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：先看上半段注册五步，再看下半段 OMCI 配置四步。</text>
