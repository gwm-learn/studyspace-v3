<text x="52" y="594" font-size="10.2" fill="#334155" xml:space="preserve">① 三条业务必须用 VLAN 隔离，不能都塞进一个 LAN。</text>
<text x="52" y="612" font-size="10.2" fill="#334155" xml:space="preserve">② IPTV 直播是组播，带宽按“同时观看频道数”算；点播才是单播。</text>
<text x="52" y="630" font-size="10.2" fill="#334155" xml:space="preserve">③ VoIP 要独立队列/优先级，否则下载会直接影响通话质量。</text>
