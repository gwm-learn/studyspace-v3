<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1080" height="600" fill="#ffffff"/>
<line x1="36" y1="112" x2="1044" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · WLAN 验收闭环：五个维度，逐项过关</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">覆盖、容量、漫游、认证、稳定性各自有判据，不能互相代替。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">任一项不达标回到规划/配置，复测通过才交付。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">验收项</text>
<line x1="131" y1="142" x2="161" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="169" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">整改</text>
<line x1="215" y1="142" x2="245" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="253" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">交付</text>
<rect x="40" y="190" width="420" height="44" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.1"/>
<text x="52" y="215.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">覆盖：目标区域 RSSI 达标</text>
<text x="450" y="215.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">必过</text>
<rect x="40" y="240" width="420" height="44" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.1"/>
<text x="52" y="265.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">容量：并发终端吞吐</text>
<text x="450" y="265.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">必过</text>
<rect x="40" y="290" width="420" height="44" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.1"/>
<text x="52" y="315.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">漫游：切换时延与丢包</text>
<text x="450" y="315.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">必过</text>
<rect x="40" y="340" width="420" height="44" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.1"/>
<text x="52" y="365.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">认证：802.1X / 访客流程</text>
<text x="450" y="365.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">必过</text>
<rect x="40" y="390" width="420" height="44" fill="#eef2ff" rx="6" stroke="#4f46e5" stroke-width="1.1"/>
<text x="52" y="415.6" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="600">稳定性：长稳 + 重连</text>
<text x="450" y="415.6" font-size="9.2" fill="#64748b" xml:space="preserve" text-anchor="end">必过</text>
<rect x="540" y="190" width="240" height="110" fill="#fff5f5" rx="8" stroke="#dc2626" stroke-width="1.1"/>
<rect x="540" y="190" width="4.5" height="110" fill="#dc2626" rx="2"/>
<text x="553" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">整改</text>
<text x="553" y="226" font-size="9.6" fill="#334155" xml:space="preserve">调布点 / 功率 / 信道</text>
<text x="553" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">改配置 / 换设备</text>
<rect x="540" y="330" width="240" height="110" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="540" y="330" width="4.5" height="110" fill="#0f9d58" rx="2"/>
<text x="553" y="349" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">复测 / 交付</text>
<text x="553" y="366" font-size="9.6" fill="#334155" xml:space="preserve">用例重跑</text>
<text x="553" y="381.4" font-size="9.6" fill="#334155" xml:space="preserve">通过后出报告</text>
<line x1="460" y1="300" x2="500" y2="300" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3 3"/>
<line x1="500" y1="300" x2="540" y2="245" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3 3"/>
<polygon points="540,245 531.07,249.63 538.35,254.93" fill="#dc2626"/>
<text x="470" y="330" font-size="9.4" fill="#dc2626" xml:space="preserve" font-weight="600">不达标</text>
<line x1="660" y1="300" x2="660" y2="330" stroke="#0f9d58" stroke-width="1.8"/>
<polygon points="660,330 664.5,321 655.5,321" fill="#0f9d58"/>
<rect x="40" y="460" width="1000" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="490" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="514" font-size="10.2" fill="#334155" xml:space="preserve">「覆盖好」不代表「能漫游」：RSSI 达标但切换慢，问题在 11k/v/r 与终端。</text>
<text x="56" y="532" font-size="10.2" fill="#334155" xml:space="preserve">验收报告要写清判据与样本（多少终端、什么业务、多长时长），否则无法复现。</text>
</svg>
