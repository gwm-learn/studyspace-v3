<text x="443" y="509" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">受控放行</text>
<text x="443" y="526" font-size="8.8" fill="#334155" xml:space="preserve">只放行互联网</text>
<text x="443" y="541.4" font-size="8.8" fill="#334155" xml:space="preserve">禁止访问内网</text>
<rect x="36" y="610" width="984" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="640" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="52" y="664" font-size="10.2" fill="#334155" xml:space="preserve">① 管理 VLAN 只承载 AP 管理/CAPWAP，业务 VLAN 承载终端流量，二者不要混。</text>
<text x="52" y="682" font-size="10.2" fill="#334155" xml:space="preserve">② 集中转发时业务流量绕到 AC；本地转发时 AC 只下发策略，数据从 AP 本地出。</text>
<text x="52" y="700" font-size="10.2" fill="#334155" xml:space="preserve">③ 访客/IoT 必须独立 VLAN，跨网访问只开必要端口。</text>
