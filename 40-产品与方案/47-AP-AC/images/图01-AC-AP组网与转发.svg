<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">AP 通过管理 VLAN 找到 AC；业务按 SSID 选择集中或本地转发；访客/IoT 走独立 VLAN。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：先看 AP 到 AC 的管理链，再看业务到网关的转发链。</text>
