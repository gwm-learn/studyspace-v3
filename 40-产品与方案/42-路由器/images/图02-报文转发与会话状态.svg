<text x="56" y="470" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">定时器与边界</text>
<text x="56" y="494" font-size="10.2" fill="#334155" xml:space="preserve">conntrack 表项从 NEW → ESTABLISHED → 超时删除；表满时新连接建不上，老连接照常。</text>
<text x="56" y="512" font-size="10.2" fill="#334155" xml:space="preserve">DNAT 只在 PREROUTING 对新连接首包生效；回程靠会话表还原，不再匹配规则。</text>
<text x="56" y="530" font-size="10.2" fill="#334155" xml:space="preserve">开启 flow offload 后，已建立的连接可能绕过 netfilter——排查「规则改了不生效」先看它。</text>
