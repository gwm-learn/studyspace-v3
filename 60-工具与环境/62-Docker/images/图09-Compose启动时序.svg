<rect x="40" y="444" width="1000" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="474" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="56" y="498" font-size="10.2" fill="#334155" xml:space="preserve">`docker compose ps` 的状态列是最快的分流器：Up (healthy) / Up (unhealthy) / Exit 1 对应三条不同路径。</text>
<text x="56" y="516" font-size="10.2" fill="#334155" xml:space="preserve">解析阶段的问题，用 `docker compose config` 就能暴露——它会打印插值、合并后的最终配置。</text>
<text x="36" y="566" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py 生成</text>
