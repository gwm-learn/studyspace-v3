<text x="313" y="226" font-size="9.6" fill="#334155" xml:space="preserve">build 或 image</text>
<text x="313" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">可多架构</text>
<rect x="560" y="190" width="220" height="84" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
