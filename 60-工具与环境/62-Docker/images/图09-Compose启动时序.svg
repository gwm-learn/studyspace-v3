<text x="832" y="352" font-size="9.4" fill="#334155" xml:space="preserve">主进程退出（看 logs）</text>
<text x="832" y="369" font-size="9.4" fill="#334155" xml:space="preserve">一直 unhealthy（看检查命令）</text>
<line x1="930" y1="274" x2="930" y2="306" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="3 3"/>
