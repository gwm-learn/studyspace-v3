<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 09 · Compose 启动时序与失败点</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">up 的四个阶段：解析配置 → 构建/拉取 → 创建资源 → 启动与等待健康。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">每个阶段有自己的失败模式；先看 ps 的状态列，再决定读哪种日志。</text>
