<text x="312" y="369" font-size="9.4" fill="#334155" xml:space="preserve">exec format / OOM</text>
<line x1="410" y1="274" x2="410" y2="306" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="3 3"/>
<polygon points="410,306 414.5,297 405.5,297" fill="#dc2626"/>
