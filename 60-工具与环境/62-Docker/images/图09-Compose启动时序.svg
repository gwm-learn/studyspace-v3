<text x="572" y="369" font-size="9.4" fill="#334155" xml:space="preserve">卷/网络名冲突</text>
<line x1="670" y1="274" x2="670" y2="306" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="3 3"/>
<polygon points="670,306 674.5,297 665.5,297" fill="#dc2626"/>
