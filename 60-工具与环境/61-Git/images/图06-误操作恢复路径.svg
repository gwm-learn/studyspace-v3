<svg xmlns="http://www.w3.org/2000/svg" width="880" height="680" viewBox="0 0 880 680" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="880" height="680" fill="#ffffff"/>
<line x1="36" y1="112" x2="844" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · 误操作恢复：先找 hash，再固定引用</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">reset --hard 只移动引用和覆盖工作区，不会立刻删除提交对象；reflog 记录了引用移动的历史。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：上半部分是提交链，中间是 reflog，下半部分是按目标 hash 恢复的两种做法。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">仍在分支上</text>
<line x1="153" y1="142" x2="183" y2="142" stroke="#94a3b8" stroke-width="3"/>
<text x="191" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">已不被分支引用</text>
<line x1="292" y1="142" x2="322" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="330" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">恢复入口</text>
<text x="36" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① 提交链：reset 之后 C3、C4 变成悬空提交</text>
<rect x="36" y="195" width="120" height="58" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="36" y="195" width="4.5" height="58" fill="#4f46e5" rx="2"/>
<text x="49" y="214" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">C1</text>
<rect x="190" y="195" width="120" height="58" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="190" y="195" width="4.5" height="58" fill="#4f46e5" rx="2"/>
<text x="203" y="214" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">C2</text>
<rect x="360" y="195" width="120" height="58" fill="#f8fafc" rx="8" stroke="#94a3b8" stroke-width="1.1"/>
<rect x="360" y="195" width="4.5" height="58" fill="#94a3b8" rx="2"/>
<text x="373" y="214" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">C3</text>
<rect x="530" y="195" width="120" height="58" fill="#f8fafc" rx="8" stroke="#94a3b8" stroke-width="1.1"/>
<rect x="530" y="195" width="4.5" height="58" fill="#94a3b8" rx="2"/>
<text x="543" y="214" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">C4</text>
<line x1="156" y1="224" x2="190" y2="224" stroke="#475569" stroke-width="2"/>
<polygon points="190,224 181,219.5 181,228.5" fill="#475569"/>
<line x1="310" y1="224" x2="360" y2="224" stroke="#475569" stroke-width="2"/>
<polygon points="360,224 351,219.5 351,228.5" fill="#475569"/>
<line x1="480" y1="224" x2="530" y2="224" stroke="#475569" stroke-width="2"/>
<polygon points="530,224 521,219.5 521,228.5" fill="#475569"/>
<line x1="250" y1="253" x2="250" y2="285" stroke="#d97706" stroke-width="2" stroke-dasharray="3 3"/>
<polygon points="250,285 254.5,276 245.5,276" fill="#d97706"/>
<text x="262" y="280" font-size="9.6" fill="#64748b" xml:space="preserve">main 现在指向 C2</text>
<text x="36" y="330" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② reflog：引用每次移动都留一条记录</text>
<rect x="36" y="345" width="760" height="30" fill="#f1f5f9" rx="6"/>
<text x="44" y="365" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="start">reflog 条目</text>
<text x="416" y="365" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">HEAD 位置</text>
<text x="669.33" y="365" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">说明</text>
<rect x="36" y="375" width="760" height="30" fill="#ffffff"/>
<line x1="36" y1="375" x2="796" y2="375" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="395" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">HEAD@{0}</text>
<text x="416" y="395" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">C2</text>
<text x="669.33" y="395" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">reset --hard C2（当前）</text>
<rect x="36" y="405" width="760" height="30" fill="#ffffff"/>
<line x1="36" y1="405" x2="796" y2="405" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="425" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">HEAD@{1}</text>
<text x="416" y="425" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">C4</text>
<text x="669.33" y="425" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">commit C4</text>
<rect x="36" y="435" width="760" height="30" fill="#ffffff"/>
<line x1="36" y1="435" x2="796" y2="435" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="455" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">HEAD@{2}</text>
<text x="416" y="455" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">C3</text>
<text x="669.33" y="455" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">commit C3</text>
<line x1="36" y1="465" x2="796" y2="465" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="36" y="500" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">③ 恢复：把悬空提交重新固定到引用上</text>
<rect x="36" y="515" width="180" height="82" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="36" y="515" width="4.5" height="82" fill="#d97706" rx="2"/>
<text x="49" y="534" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">git reflog</text>
<text x="49" y="551" font-size="8.8" fill="#334155" xml:space="preserve">找到目标 hash</text>
<text x="49" y="566.4" font-size="8.8" fill="#334155" xml:space="preserve">确认操作时间</text>
<line x1="216" y1="556" x2="226" y2="556" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="226,556 217,551.5 217,560.5" fill="#94a3b8"/>
<rect x="226" y="515" width="190" height="82" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="226" y="515" width="4.5" height="82" fill="#475569" rx="2"/>
<text x="239" y="534" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">选恢复方式</text>
<text x="239" y="551" font-size="8.8" fill="#334155" xml:space="preserve">要保留当前分支</text>
<text x="239" y="566.4" font-size="8.8" fill="#334155" xml:space="preserve">还是整体回到旧位置</text>
<line x1="416" y1="556" x2="426" y2="556" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="426,556 417,551.5 417,560.5" fill="#94a3b8"/>
<rect x="426" y="515" width="200" height="82" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="426" y="515" width="4.5" height="82" fill="#0f9d58" rx="2"/>
<text x="439" y="534" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">新建分支</text>
<text x="439" y="551" font-size="8.8" fill="#334155" xml:space="preserve">git branch rescue C4</text>
<text x="439" y="566.4" font-size="8.8" fill="#334155" xml:space="preserve">不影响当前工作</text>
<line x1="626" y1="556" x2="636" y2="556" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="636,556 627,551.5 627,560.5" fill="#94a3b8"/>
<rect x="636" y="515" width="200" height="82" fill="#fff5f5" rx="8" stroke="#dc2626" stroke-width="1.1"/>
<rect x="636" y="515" width="4.5" height="82" fill="#dc2626" rx="2"/>
<text x="649" y="534" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">或 reset</text>
<text x="649" y="551" font-size="8.8" fill="#334155" xml:space="preserve">git reset --hard C4</text>
<text x="649" y="566.4" font-size="8.8" fill="#334155" xml:space="preserve">丢弃 C2 之后的工作区</text>
<text x="36" y="626" font-size="12.3" fill="#64748b" xml:space="preserve">补充：git fsck --lost-found 可列出更早的悬空对象；对象被 gc 清理后无法恢复。</text>
<text x="36" y="644" font-size="12.3" fill="#64748b" xml:space="preserve">图源：本仓库生成脚本；reflog 默认保留时间见 00 篇的定时器表。</text>
</svg>
