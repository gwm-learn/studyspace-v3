<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="800" viewBox="0 0 1160 800" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1160" height="800" fill="#ffffff"/>
<line x1="36" y1="112" x2="1124" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · 快进与三方合并：先找共同祖先</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">merge 的结果取决于两条分支是否分叉：能快进就只移动指针，分叉了才生成合并提交。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：上方是快进，下方是三方合并；虚线框里的 B 是两条分支的共同祖先。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">主分支 main</text>
<line x1="164" y1="142" x2="194" y2="142" stroke="#0891b2" stroke-width="3"/>
<text x="202" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">特性分支 feature</text>
<line x1="322.8" y1="142" x2="352.8" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="360.8" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">合并提交</text>
<line x1="428.8" y1="142" x2="458.8" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="466.8" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">共同祖先</text>
<text x="36" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① 快进合并：main 是 feature 的祖先</text>
<text x="250" y="188" font-size="9.6" fill="#d97706" xml:space="preserve" font-weight="700" text-anchor="middle">main 原位置</text>
<text x="620" y="188" font-size="9.6" fill="#0891b2" xml:space="preserve" font-weight="700" text-anchor="middle">feature</text>
<rect x="36" y="195" width="120" height="58" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="36" y="195" width="4.5" height="58" fill="#4f46e5" rx="2"/>
<text x="49" y="214" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">A</text>
<rect x="190" y="195" width="120" height="58" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="190" y="195" width="4.5" height="58" fill="#d97706" rx="2"/>
<text x="203" y="214" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">B</text>
<rect x="400" y="195" width="120" height="58" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="400" y="195" width="4.5" height="58" fill="#0891b2" rx="2"/>
<text x="413" y="214" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">D</text>
<rect x="560" y="195" width="120" height="58" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="560" y="195" width="4.5" height="58" fill="#0891b2" rx="2"/>
<text x="573" y="214" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">E</text>
<line x1="156" y1="224" x2="190" y2="224" stroke="#475569" stroke-width="2"/>
<polygon points="190,224 181,219.5 181,228.5" fill="#475569"/>
<line x1="310" y1="224" x2="400" y2="224" stroke="#475569" stroke-width="2"/>
<polygon points="400,224 391,219.5 391,228.5" fill="#475569"/>
<line x1="520" y1="224" x2="560" y2="224" stroke="#475569" stroke-width="2"/>
<polygon points="560,224 551,219.5 551,228.5" fill="#475569"/>
<line x1="250" y1="253" x2="250" y2="285" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="3 3"/>
<polygon points="250,285 254.5,276 245.5,276" fill="#94a3b8"/>
<text x="262" y="278" font-size="9.6" fill="#64748b" xml:space="preserve">main 直接移到 E，不产生合并提交</text>
<text x="36" y="330" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② 三方合并：两条分支都有新提交</text>
<rect x="36" y="360" width="120" height="58" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="36" y="360" width="4.5" height="58" fill="#4f46e5" rx="2"/>
<text x="49" y="379" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">A</text>
<rect x="190" y="360" width="120" height="58" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="190" y="360" width="4.5" height="58" fill="#d97706" rx="2"/>
<text x="203" y="379" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">B</text>
<rect x="400" y="360" width="120" height="58" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="400" y="360" width="4.5" height="58" fill="#4f46e5" rx="2"/>
<text x="413" y="379" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">C</text>
<rect x="190" y="470" width="120" height="58" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="190" y="470" width="4.5" height="58" fill="#0891b2" rx="2"/>
<text x="203" y="489" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">D</text>
<rect x="400" y="470" width="120" height="58" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="400" y="470" width="4.5" height="58" fill="#0891b2" rx="2"/>
<text x="413" y="489" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">E</text>
<rect x="620" y="415" width="190" height="76" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="620" y="415" width="4.5" height="76" fill="#0f9d58" rx="2"/>
<text x="633" y="434" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">merge M</text>
<text x="633" y="451" font-size="9.6" fill="#334155" xml:space="preserve">parent：C 和 E</text>
<text x="633" y="466.4" font-size="9.6" fill="#334155" xml:space="preserve">结果 = base + ours + theirs</text>
<line x1="156" y1="389" x2="190" y2="389" stroke="#475569" stroke-width="2"/>
<polygon points="190,389 181,384.5 181,393.5" fill="#475569"/>
<line x1="310" y1="389" x2="400" y2="389" stroke="#475569" stroke-width="2"/>
<polygon points="400,389 391,384.5 391,393.5" fill="#475569"/>
<text x="347" y="381" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">main</text>
<line x1="250" y1="418" x2="250" y2="470" stroke="#475569" stroke-width="2"/>
<polygon points="250,470 254.5,461 245.5,461" fill="#475569"/>
<text x="262" y="440" font-size="10.2" fill="#64748b" xml:space="preserve" font-weight="600">feature</text>
<line x1="310" y1="499" x2="400" y2="499" stroke="#475569" stroke-width="2"/>
<polygon points="400,499 391,494.5 391,503.5" fill="#475569"/>
<line x1="520" y1="391" x2="620" y2="432" stroke="#475569" stroke-width="2"/>
<polygon points="620,432 613.38,424.42 609.97,432.75" fill="#475569"/>
<line x1="520" y1="501" x2="620" y2="474" stroke="#475569" stroke-width="2"/>
<polygon points="620,474 610.14,472 612.48,480.69" fill="#475569"/>
<rect x="36" y="605" width="1080" height="110" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="635" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图</text>
<text x="52" y="659" font-size="10.2" fill="#334155" xml:space="preserve">快进条件：当前分支的提交是对方分支的祖先，只需把 main 指针前移，历史保持线性。</text>
<text x="52" y="677" font-size="10.2" fill="#334155" xml:space="preserve">分叉后：Git 找共同祖先 B，做三方比较（base / ours / theirs），生成有两个 parent 的 merge 提交。</text>
<text x="52" y="695" font-size="10.2" fill="#334155" xml:space="preserve">冲突只发生在“同一文件的同一段被两边改过”时；其余文件自动合并。</text>
<text x="36" y="746" font-size="12.3" fill="#64748b" xml:space="preserve">命令：git switch main &amp;&amp; git merge feature；强制保留合并提交用 --no-ff。</text>
<text x="36" y="764" font-size="12.3" fill="#64748b" xml:space="preserve">图源：本仓库生成脚本；节点只是提交示意，不代表具体文件内容。</text>
</svg>
