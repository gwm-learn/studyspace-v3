<polygon points="960,345 951,340.5 951,349.5" fill="#d97706"/>
<text x="880" y="322" font-size="9.4" fill="#64748b" xml:space="preserve">topic（已移动）</text>
<rect x="80" y="408" width="1000" height="128" fill="#eef2ff" rx="10" stroke="#4f46e5" stroke-width="1"/>
<text x="96" y="438" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">参数怎么对上</text>
<text x="96" y="462" font-size="10.2" fill="#334155" xml:space="preserve">git rebase --onto main next topic  →  新家 = main，旧起点 = next，旧分支 = topic</text>
<text x="96" y="480" font-size="10.2" fill="#334155" xml:space="preserve">区间 = next..topic：包含 T1、T2，不含 next 自己；T1、T2 被复制成新对象，hash 全变。</text>
<text x="96" y="498" font-size="10.2" fill="#334155" xml:space="preserve">验证：git range-diff next..topic main..topic  对比重写前后哪些提交内容一致。</text>
<text x="96" y="516" font-size="10.2" fill="#334155" xml:space="preserve">右图省略了 next 行：N1、N2 仍挂在 B 后面，rebase 不影响它们，只有 topic 被移动。</text>
