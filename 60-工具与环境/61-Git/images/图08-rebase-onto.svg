<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 08 · rebase --onto 的三段区间</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">三个参数各管一段：upstream 是区间左端（不含），branch 是被移动的分支，onto 是新落点。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">命令从左到右读：新家 ← 旧起点 ← 旧分支。区间永远是「起点之后」。</text>
