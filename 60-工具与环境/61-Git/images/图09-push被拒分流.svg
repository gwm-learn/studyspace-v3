<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1100" height="620" fill="#ffffff"/>
<line x1="36" y1="112" x2="1064" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 09 · push 被拒的分流</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">先看报错里的关键词，再决定是「补历史」「换权限」还是「改推送方式」。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">右下角是唯一不该走的路：用 --force 绕过非快进。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">补历史</text>
<line x1="131" y1="142" x2="161" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="169" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">权限/策略</text>
<line x1="243.6" y1="142" x2="273.6" y2="142" stroke="#0891b2" stroke-width="3"/>
<text x="281.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">引用冲突</text>
<line x1="349.6" y1="142" x2="379.6" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="387.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">危险做法</text>
<rect x="430" y="186" width="240" height="60" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="430" y="186" width="4.5" height="60" fill="#475569" rx="2"/>
<text x="443" y="205" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">push 被拒</text>
<text x="443" y="222" font-size="9.6" fill="#334155" xml:space="preserve">读报错关键词</text>
<rect x="36" y="292" width="226" height="104" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="36" y="292" width="4.5" height="104" fill="#4f46e5" rx="2"/>
<text x="49" y="311" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">① 非快进</text>
<text x="49" y="328" font-size="9.6" fill="#334155" xml:space="preserve">non-fast-forward</text>
<text x="49" y="343.4" font-size="9.6" fill="#334155" xml:space="preserve">远程有你没有的提交</text>
<line x1="550" y1="246" x2="149" y2="292" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="149,292 158.45,295.44 157.43,286.5" fill="#4f46e5"/>
<text x="46" y="420" font-size="9.4" fill="#64748b" xml:space="preserve">→ fetch → merge/rebase → 再 push</text>
<rect x="300" y="292" width="226" height="104" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="300" y="292" width="4.5" height="104" fill="#d97706" rx="2"/>
<text x="313" y="311" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">② 权限 / 保护</text>
<text x="313" y="328" font-size="9.6" fill="#334155" xml:space="preserve">Permission denied / 403</text>
<text x="313" y="343.4" font-size="9.6" fill="#334155" xml:space="preserve">protected branch / pre-receive</text>
<line x1="550" y1="246" x2="413" y2="292" stroke="#d97706" stroke-width="1.8"/>
<polygon points="413,292 422.96,293.4 420.1,284.87" fill="#d97706"/>
<text x="310" y="420" font-size="9.4" fill="#64748b" xml:space="preserve">→ 走 PR；查 PAT/SSH key；按钩子规则改</text>
<rect x="564" y="292" width="226" height="104" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="564" y="292" width="4.5" height="104" fill="#0891b2" rx="2"/>
<text x="577" y="311" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">③ 引用冲突</text>
<text x="577" y="328" font-size="9.6" fill="#334155" xml:space="preserve">tag 已存在 / 分支同名</text>
<text x="577" y="343.4" font-size="9.6" fill="#334155" xml:space="preserve">shallow update not allowed</text>
<line x1="550" y1="246" x2="677" y2="292" stroke="#0891b2" stroke-width="1.8"/>
<polygon points="677,292 670.07,284.7 667.01,293.17" fill="#0891b2"/>
<text x="574" y="420" font-size="9.4" fill="#64748b" xml:space="preserve">→ 换名；或 fetch --unshallow</text>
<rect x="828" y="292" width="226" height="104" fill="#fff5f5" rx="8" stroke="#dc2626" stroke-width="1.1"/>
<rect x="828" y="292" width="4.5" height="104" fill="#dc2626" rx="2"/>
<text x="841" y="311" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">④ 用 --force 硬推</text>
<text x="841" y="328" font-size="9.6" fill="#334155" xml:space="preserve">绕过非快进检查</text>
<text x="841" y="343.4" font-size="9.6" fill="#334155" xml:space="preserve">别人的提交被抹掉</text>
<line x1="550" y1="246" x2="941" y2="292" stroke="#dc2626" stroke-width="1.8"/>
<polygon points="941,292 932.59,286.48 931.54,295.42" fill="#dc2626"/>
<text x="838" y="420" font-size="9.4" fill="#64748b" xml:space="preserve">→ 只在个人分支用 --force-with-lease</text>
<rect x="36" y="456" width="1018" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="52" y="486" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">一条判据</text>
<text x="52" y="510" font-size="10.2" fill="#334155" xml:space="preserve">报错里出现 non-fast-forward：这是「历史分叉」，不是权限问题，force 只会掩盖它。</text>
<text x="52" y="528" font-size="10.2" fill="#334155" xml:space="preserve">报错里出现 denied / 403 / protected：先验身份（ssh -T、PAT 是否过期），再看分支权限。</text>
<text x="36" y="566" font-size="12.3" fill="#64748b" xml:space="preserve">图源：.图表模板/svg-figure-template.py 生成</text>
