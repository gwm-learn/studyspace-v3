<polygon points="436,370 432.75,360.48 426.43,366.89" fill="#94a3b8"/>
<text x="36" y="420" font-size="9.8" fill="#334155" xml:space="preserve">目标比依赖旧 → 执行命令；-j 并行无依赖目标</text>
<text x="640" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② CMake：配置 → 生成 → 构建</text>
<rect x="640" y="190" width="170" height="80" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="640" y="190" width="4.5" height="80" fill="#d97706" rx="2"/>
<text x="653" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">configure</text>
<text x="653" y="226" font-size="9.6" fill="#334155" xml:space="preserve">读 CMakeLists.txt</text>
<text x="653" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">检测编译器/sysroot</text>
<line x1="810" y1="230" x2="828" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="828,230 819,225.5 819,234.5" fill="#94a3b8"/>
<rect x="828" y="190" width="170" height="80" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="828" y="190" width="4.5" height="80" fill="#d97706" rx="2"/>
<text x="841" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">generate</text>
<text x="841" y="226" font-size="9.6" fill="#334155" xml:space="preserve">输出 Makefile</text>
<text x="841" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">或 build.ninja</text>
<line x1="998" y1="230" x2="1016" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="1016,230 1007,225.5 1007,234.5" fill="#94a3b8"/>
<rect x="1016" y="190" width="170" height="80" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="1016" y="190" width="4.5" height="80" fill="#0f9d58" rx="2"/>
<text x="1029" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">build</text>
<text x="1029" y="226" font-size="9.6" fill="#334155" xml:space="preserve">make/ninja 执行</text>
<text x="1029" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">编译 + 链接</text>
<text x="640" y="300" font-size="10.2" fill="#334155" xml:space="preserve">target 属性通过 PUBLIC/PRIVATE/INTERFACE 传播</text>
<rect x="640" y="320" width="460" height="30" fill="#f1f5f9" rx="6"/>
<text x="648" y="340" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="start">可见性</text>
<text x="870" y="340" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">自己用</text>
<text x="1023.33" y="340" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">使用方继承</text>
<rect x="640" y="350" width="460" height="30" fill="#ffffff"/>
<line x1="640" y1="350" x2="1100" y2="350" stroke="#e2e8f0" stroke-width="0.8"/>
