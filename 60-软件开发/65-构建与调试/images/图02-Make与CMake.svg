<text x="870" y="370" font-size="10" fill="#0f9d58" xml:space="preserve" font-weight="700" text-anchor="middle">✓</text>
<text x="1023.33" y="370" font-size="10" fill="#dc2626" xml:space="preserve" font-weight="700" text-anchor="middle">✗</text>
<rect x="640" y="380" width="460" height="30" fill="#ffffff"/>
<line x1="640" y1="380" x2="1100" y2="380" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="648" y="400" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">PUBLIC</text>
<text x="870" y="400" font-size="10" fill="#0f9d58" xml:space="preserve" font-weight="700" text-anchor="middle">✓</text>
<text x="1023.33" y="400" font-size="10" fill="#0f9d58" xml:space="preserve" font-weight="700" text-anchor="middle">✓</text>
<rect x="640" y="410" width="460" height="30" fill="#ffffff"/>
<line x1="640" y1="410" x2="1100" y2="410" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="648" y="430" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">INTERFACE</text>
<text x="870" y="430" font-size="10" fill="#dc2626" xml:space="preserve" font-weight="700" text-anchor="middle">✗</text>
<text x="1023.33" y="430" font-size="10" fill="#0f9d58" xml:space="preserve" font-weight="700" text-anchor="middle">✓</text>
<line x1="640" y1="440" x2="1100" y2="440" stroke="#e2e8f0" stroke-width="0.8"/>
<rect x="36" y="450" width="480" height="110" fill="#fff5f5" rx="10" stroke="#dc2626" stroke-width="1"/>
<text x="52" y="480" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">边界</text>
<text x="52" y="504" font-size="10.2" fill="#334155" xml:space="preserve">・Make 必须显式声明头文件依赖（-MMD -MP）</text>
<text x="52" y="522" font-size="10.2" fill="#334155" xml:space="preserve">・CMake 改了 CMakeLists.txt 需要重新 configure</text>
<text x="52" y="540" font-size="10.2" fill="#334155" xml:space="preserve">・源码外构建：build/ 可整体删除</text>
<rect x="640" y="450" width="460" height="128" fill="#f2fcf5" rx="10" stroke="#0f9d58" stroke-width="1"/>
<text x="656" y="480" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">排查顺序</text>
<text x="656" y="504" font-size="10.2" fill="#334155" xml:space="preserve">① make -n 看将执行什么</text>
<text x="656" y="522" font-size="10.2" fill="#334155" xml:space="preserve">② -j1 复现并行问题</text>
<text x="656" y="540" font-size="10.2" fill="#334155" xml:space="preserve">③ 检查 .d 文件与时间戳</text>
<text x="656" y="558" font-size="10.2" fill="#334155" xml:space="preserve">④ 最后才删缓存/重新配置</text>
<text x="36" y="606" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="624" font-size="12.3" fill="#64748b" xml:space="preserve">示例为 C 工程；CMake 也支持 C++、汇编和多语言目标。</text>
</svg>
