<text x="453" y="226" font-size="8.8" fill="#334155" xml:space="preserve">源文件</text>
<rect x="440" y="270" width="130" height="50" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="440" y="270" width="4.5" height="50" fill="#475569" rx="2"/>
<text x="453" y="289" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">util.c</text>
<text x="453" y="306" font-size="8.8" fill="#334155" xml:space="preserve">源文件</text>
<rect x="440" y="350" width="130" height="50" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
