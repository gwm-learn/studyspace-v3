<line x1="370" y1="215" x2="436" y2="215" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="436,215 427,210.5 427,219.5" fill="#94a3b8"/>
<line x1="370" y1="295" x2="436" y2="295" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="436,295 427,290.5 427,299.5" fill="#94a3b8"/>
