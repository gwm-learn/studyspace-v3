<text x="49" y="226" font-size="8.8" fill="#334155" xml:space="preserve">可执行</text>
<rect x="240" y="190" width="130" height="50" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="240" y="190" width="4.5" height="50" fill="#4f46e5" rx="2"/>
<text x="253" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">main.o</text>
<text x="253" y="226" font-size="8.8" fill="#334155" xml:space="preserve">目标文件</text>
<rect x="240" y="270" width="130" height="50" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="240" y="270" width="4.5" height="50" fill="#4f46e5" rx="2"/>
<text x="253" y="289" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">util.o</text>
<text x="253" y="306" font-size="8.8" fill="#334155" xml:space="preserve">目标文件</text>
