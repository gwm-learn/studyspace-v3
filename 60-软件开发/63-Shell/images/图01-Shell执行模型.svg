<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1140" height="640" fill="#ffffff"/>
<line x1="36" y1="112" x2="1104" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · Shell 展开、重定向与子 shell 边界</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">一行命令先分词和展开，再重定向，最后 fork/exec；管道和 $() 在子 shell 中执行。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：上半部分是展开顺序，下半部分是进程边界；子 shell 的变量修改不会回传。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">当前 shell</text>
<line x1="159.6" y1="142" x2="189.6" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="197.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">子 shell</text>
<line x1="272.2" y1="142" x2="302.2" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="310.2" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">外部命令</text>
<text x="36" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① 一行命令的展开顺序</text>
<rect x="36" y="190" width="140" height="58" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="36" y="190" width="4.5" height="58" fill="#4f46e5" rx="2"/>
<text x="49" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">1. 读取</text>
<line x1="176" y1="219" x2="188" y2="219" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="188,219 179,214.5 179,223.5" fill="#94a3b8"/>
<rect x="188" y="190" width="140" height="58" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="188" y="190" width="4.5" height="58" fill="#4f46e5" rx="2"/>
<text x="201" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">2. 分词</text>
<line x1="328" y1="219" x2="340" y2="219" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="340,219 331,214.5 331,223.5" fill="#94a3b8"/>
<rect x="340" y="190" width="140" height="58" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="340" y="190" width="4.5" height="58" fill="#4f46e5" rx="2"/>
<text x="353" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">3. 大括号/波浪号</text>
<line x1="480" y1="219" x2="492" y2="219" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="492,219 483,214.5 483,223.5" fill="#94a3b8"/>
<rect x="492" y="190" width="140" height="58" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="492" y="190" width="4.5" height="58" fill="#4f46e5" rx="2"/>
<text x="505" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">4. 变量/命令/算术</text>
<line x1="632" y1="219" x2="644" y2="219" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="644,219 635,214.5 635,223.5" fill="#94a3b8"/>
<rect x="644" y="190" width="140" height="58" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="644" y="190" width="4.5" height="58" fill="#4f46e5" rx="2"/>
<text x="657" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">5. 再次分词/通配</text>
<line x1="784" y1="219" x2="796" y2="219" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="796,219 787,214.5 787,223.5" fill="#94a3b8"/>
<rect x="796" y="190" width="140" height="58" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="796" y="190" width="4.5" height="58" fill="#4f46e5" rx="2"/>
<text x="809" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">6. 重定向</text>
<line x1="936" y1="219" x2="948" y2="219" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="948,219 939,214.5 939,223.5" fill="#94a3b8"/>
<rect x="948" y="190" width="140" height="58" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="948" y="190" width="4.5" height="58" fill="#4f46e5" rx="2"/>
<text x="961" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">7. fork+exec</text>
<text x="36" y="300" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② 进程与子 shell 边界</text>
<rect x="36" y="314" width="210" height="90" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="36" y="314" width="4.5" height="90" fill="#4f46e5" rx="2"/>
<text x="49" y="333" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">父 shell</text>
<text x="49" y="350" font-size="9.6" fill="#334155" xml:space="preserve">变量表</text>
<text x="49" y="365.4" font-size="9.6" fill="#334155" xml:space="preserve">当前目录</text>
<text x="49" y="380.8" font-size="9.6" fill="#334155" xml:space="preserve">已打开 fd</text>
<rect x="300" y="314" width="210" height="90" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="300" y="314" width="4.5" height="90" fill="#d97706" rx="2"/>
<text x="313" y="333" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">管道子 shell</text>
<text x="313" y="350" font-size="9.6" fill="#334155" xml:space="preserve">cmd1 | cmd2</text>
<text x="313" y="365.4" font-size="9.6" fill="#334155" xml:space="preserve">变量修改不回传</text>
<text x="313" y="380.8" font-size="9.6" fill="#334155" xml:space="preserve">退出码取最后一个</text>
<rect x="564" y="314" width="210" height="90" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="564" y="314" width="4.5" height="90" fill="#d97706" rx="2"/>
<text x="577" y="333" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">命令替换 $(...)</text>
<text x="577" y="350" font-size="9.6" fill="#334155" xml:space="preserve">捕获 stdout</text>
<text x="577" y="365.4" font-size="9.6" fill="#334155" xml:space="preserve">去掉尾部换行</text>
<text x="577" y="380.8" font-size="9.6" fill="#334155" xml:space="preserve">同样在子 shell</text>
<rect x="828" y="314" width="210" height="90" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="828" y="314" width="4.5" height="90" fill="#0f9d58" rx="2"/>
<text x="841" y="333" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">外部命令</text>
<text x="841" y="350" font-size="9.6" fill="#334155" xml:space="preserve">fork + exec</text>
<text x="841" y="365.4" font-size="9.6" fill="#334155" xml:space="preserve">独立地址空间</text>
<text x="841" y="380.8" font-size="9.6" fill="#334155" xml:space="preserve">退出码写回 $?</text>
<line x1="246" y1="359" x2="296" y2="359" stroke="#94a3b8" stroke-width="1.8"/>
<polygon points="296,359 287,354.5 287,363.5" fill="#94a3b8"/>
<line x1="510" y1="359" x2="560" y2="359" stroke="#94a3b8" stroke-width="1.8"/>
<polygon points="560,359 551,354.5 551,363.5" fill="#94a3b8"/>
<line x1="774" y1="359" x2="820" y2="359" stroke="#94a3b8" stroke-width="1.8"/>
<polygon points="820,359 811,354.5 811,363.5" fill="#94a3b8"/>
<text x="36" y="450" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">③ 重定向顺序</text>
<text x="36" y="470" font-size="10.4" fill="#334155" xml:space="preserve" font-family="'DejaVu Sans Mono','Noto Sans Mono CJK SC',monospace">cmd &gt;f 2&gt;&amp;1     stdout → f，stderr 跟随 stdout → f（正确）</text>
<text x="36" y="492" font-size="10.4" fill="#334155" xml:space="preserve" font-family="'DejaVu Sans Mono','Noto Sans Mono CJK SC',monospace">cmd 2&gt;&amp;1 &gt;f     stderr → 终端，stdout → f（顺序不同）</text>
<rect x="600" y="440" width="440" height="110" fill="#fff5f5" rx="10" stroke="#dc2626" stroke-width="1"/>
<text x="616" y="470" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">边界</text>
<text x="616" y="494" font-size="10.2" fill="#334155" xml:space="preserve">・未加引号的变量会被分词和通配：rm $file 有风险</text>
<text x="616" y="512" font-size="10.2" fill="#334155" xml:space="preserve">・while 在管道里改的变量，循环外看不到</text>
<text x="616" y="530" font-size="10.2" fill="#334155" xml:space="preserve">・命令替换 $(...) 的结果会再次分词；cd 失败要立即退出</text>
<text x="36" y="586" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="604" font-size="12.3" fill="#64748b" xml:space="preserve">展开顺序按 POSIX/Bash 常见实现；不同 shell 的细节略有差异。</text>
</svg>
