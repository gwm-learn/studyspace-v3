<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="960" height="760" fill="#ffffff"/>
<line x1="36" y1="112" x2="924" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 01 · C 对象的内存布局：从 ELF 段到进程地址空间</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">编译期决定大小与对齐，加载期映射段，运行期在堆栈上分配对象。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：左边是文件里的段，右边是运行时的地址空间；箭头表示映射关系。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#475569" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">代码/只读</text>
<line x1="148.6" y1="142" x2="178.6" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="186.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">已初始化数据</text>
<line x1="276.6" y1="142" x2="306.6" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="314.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">未初始化数据</text>
<line x1="404.6" y1="142" x2="434.6" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="442.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">堆/栈</text>
<text x="36" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① ELF 文件中的段</text>
<rect x="36" y="190" width="200" height="58" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="36" y="190" width="4.5" height="58" fill="#475569" rx="2"/>
<text x="49" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">.text</text>
<text x="49" y="226" font-size="8.8" fill="#334155" xml:space="preserve">机器码、函数体</text>
<rect x="36" y="262" width="200" height="58" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="36" y="262" width="4.5" height="58" fill="#475569" rx="2"/>
<text x="49" y="281" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">.rodata</text>
<text x="49" y="298" font-size="8.8" fill="#334155" xml:space="preserve">字符串字面量、常量</text>
<rect x="36" y="334" width="200" height="58" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="36" y="334" width="4.5" height="58" fill="#0f9d58" rx="2"/>
<text x="49" y="353" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">.data</text>
<text x="49" y="370" font-size="8.8" fill="#334155" xml:space="preserve">已初始化全局/静态</text>
<rect x="36" y="406" width="200" height="58" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="36" y="406" width="4.5" height="58" fill="#4f46e5" rx="2"/>
<text x="49" y="425" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">.bss</text>
<text x="49" y="442" font-size="8.8" fill="#334155" xml:space="preserve">零初始化全局/静态</text>
<text x="300" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② 进程运行时地址空间（低地址在上）</text>
<rect x="300" y="190" width="230" height="56" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="300" y="190" width="4.5" height="56" fill="#475569" rx="2"/>
<text x="313" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">.text</text>
<text x="313" y="226" font-size="9.6" fill="#334155" xml:space="preserve">机器码</text>
<rect x="300" y="262" width="230" height="56" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="300" y="262" width="4.5" height="56" fill="#475569" rx="2"/>
<text x="313" y="281" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">.rodata</text>
<text x="313" y="298" font-size="9.6" fill="#334155" xml:space="preserve">只读数据</text>
<rect x="300" y="334" width="230" height="56" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="300" y="334" width="4.5" height="56" fill="#0f9d58" rx="2"/>
<text x="313" y="353" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">.data</text>
<text x="313" y="370" font-size="9.6" fill="#334155" xml:space="preserve">已初始化数据</text>
<rect x="300" y="406" width="230" height="56" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="300" y="406" width="4.5" height="56" fill="#4f46e5" rx="2"/>
<text x="313" y="425" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">.bss</text>
<text x="313" y="442" font-size="9.6" fill="#334155" xml:space="preserve">零初始化数据</text>
<rect x="300" y="486" width="230" height="56" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="300" y="486" width="4.5" height="56" fill="#d97706" rx="2"/>
<text x="313" y="505" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">堆 heap</text>
<text x="313" y="522" font-size="9.6" fill="#334155" xml:space="preserve">malloc/free，向高地址增长 ↓</text>
<rect x="300" y="558" width="230" height="56" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="300" y="558" width="4.5" height="56" fill="#475569" rx="2"/>
<text x="313" y="577" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">共享库 / mmap</text>
<text x="313" y="594" font-size="9.6" fill="#334155" xml:space="preserve">libc、文件映射</text>
<rect x="300" y="630" width="230" height="56" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="300" y="630" width="4.5" height="56" fill="#d97706" rx="2"/>
<text x="313" y="649" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">栈 stack</text>
<text x="313" y="666" font-size="9.6" fill="#334155" xml:space="preserve">局部变量/返回地址</text>
<line x1="236" y1="218" x2="296" y2="218" stroke="#94a3b8" stroke-width="1.4"/>
<polygon points="296,218 287,213.5 287,222.5" fill="#94a3b8"/>
<line x1="236" y1="290" x2="296" y2="290" stroke="#94a3b8" stroke-width="1.4"/>
<polygon points="296,290 287,285.5 287,294.5" fill="#94a3b8"/>
<line x1="236" y1="362" x2="296" y2="362" stroke="#94a3b8" stroke-width="1.4"/>
<polygon points="296,362 287,357.5 287,366.5" fill="#94a3b8"/>
<line x1="236" y1="434" x2="296" y2="434" stroke="#94a3b8" stroke-width="1.4"/>
<polygon points="296,434 287,429.5 287,438.5" fill="#94a3b8"/>
<rect x="590" y="190" width="330" height="128" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="606" y="220" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="606" y="244" font-size="10.2" fill="#334155" xml:space="preserve">① 段在文件里有大小，加载后映射为虚拟内存。</text>
<text x="606" y="262" font-size="10.2" fill="#334155" xml:space="preserve">② 栈和堆相向增长，中间留给共享库和 mmap。</text>
<text x="606" y="280" font-size="10.2" fill="#334155" xml:space="preserve">③ .bss 不占文件空间，但运行时占内存。</text>
<text x="606" y="298" font-size="10.2" fill="#334155" xml:space="preserve">④ 对象能否访问，取决于存储期而不是段名。</text>
<rect x="590" y="340" width="330" height="110" fill="#fff5f5" rx="10" stroke="#dc2626" stroke-width="1"/>
<text x="606" y="370" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">常见误判</text>
<text x="606" y="394" font-size="10.2" fill="#334155" xml:space="preserve">・sizeof(struct) 等于成员大小之和</text>
<text x="606" y="412" font-size="10.2" fill="#334155" xml:space="preserve">・free 后指针自动变 NULL</text>
<text x="606" y="430" font-size="10.2" fill="#334155" xml:space="preserve">・const 全局一定在 .rodata（可能被优化）</text>
<text x="36" y="706" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="724" font-size="12.3" fill="#64748b" xml:space="preserve">布局为示意，具体段的划分以目标平台 ELF/ABI 为准。</text>
</svg>
