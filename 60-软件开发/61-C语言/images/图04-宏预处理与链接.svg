<text x="52" y="480" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">链接期规则</text>
<text x="52" y="504" font-size="10.2" fill="#334155" xml:space="preserve">・声明可以重复，定义只能有一份</text>
<text x="52" y="522" font-size="10.2" fill="#334155" xml:space="preserve">・static 把符号限制在本翻译单元</text>
<text x="52" y="540" font-size="10.2" fill="#334155" xml:space="preserve">・库顺序：使用方在前，被使用方在后</text>
