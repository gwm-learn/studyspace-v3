<text x="584" y="522" font-size="10.2" fill="#334155" xml:space="preserve">② 用 -c 单独编译，区分编译/链接错</text>
<text x="584" y="540" font-size="10.2" fill="#334155" xml:space="preserve">③ 用 nm/readelf 看符号是否 U/T</text>
<text x="584" y="558" font-size="10.2" fill="#334155" xml:space="preserve">④ 最后检查库路径、版本和 ABI</text>
