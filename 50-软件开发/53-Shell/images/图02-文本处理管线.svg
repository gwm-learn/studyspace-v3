<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1080" height="660" fill="#ffffff"/>
<line x1="36" y1="112" x2="1044" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 02 · 文本处理管线：过滤、改写、结构化、动作</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">find 产出文件集合，grep 选行，sed 改写，awk 按字段统计，xargs 批量执行。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：从左到右看数据形态变化；NUL 分隔是文件名含空格/换行时的安全边界。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#475569" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">输入/输出</text>
<line x1="148.6" y1="142" x2="178.6" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="186.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">过滤/改写</text>
<line x1="261.2" y1="142" x2="291.2" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="299.2" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">结构化</text>
<line x1="356.2" y1="142" x2="386.2" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="394.2" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">批量动作</text>
<text x="36" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① 主管线</text>
<rect x="36" y="190" width="150" height="80" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="36" y="190" width="4.5" height="80" fill="#475569" rx="2"/>
<text x="49" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">find</text>
<text x="49" y="226" font-size="9.6" fill="#334155" xml:space="preserve">文件集合</text>
<text x="49" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">-type/-name</text>
<line x1="186" y1="230" x2="208" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="208,230 199,225.5 199,234.5" fill="#94a3b8"/>
<rect x="208" y="190" width="150" height="80" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="208" y="190" width="4.5" height="80" fill="#4f46e5" rx="2"/>
<text x="221" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">grep</text>
<text x="221" y="226" font-size="9.6" fill="#334155" xml:space="preserve">命中行</text>
<text x="221" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">-n/-v/-E</text>
<line x1="358" y1="230" x2="380" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="380,230 371,225.5 371,234.5" fill="#94a3b8"/>
<rect x="380" y="190" width="150" height="80" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="380" y="190" width="4.5" height="80" fill="#4f46e5" rx="2"/>
<text x="393" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">sed</text>
<text x="393" y="226" font-size="9.6" fill="#334155" xml:space="preserve">改写行</text>
<text x="393" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">s///，先干跑</text>
<line x1="530" y1="230" x2="552" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="552,230 543,225.5 543,234.5" fill="#94a3b8"/>
<rect x="552" y="190" width="150" height="80" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="552" y="190" width="4.5" height="80" fill="#0f9d58" rx="2"/>
<text x="565" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">awk</text>
<text x="565" y="226" font-size="9.6" fill="#334155" xml:space="preserve">字段/统计</text>
<text x="565" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">-F，数组</text>
<line x1="702" y1="230" x2="724" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="724,230 715,225.5 715,234.5" fill="#94a3b8"/>
<rect x="724" y="190" width="150" height="80" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="724" y="190" width="4.5" height="80" fill="#d97706" rx="2"/>
<text x="737" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">xargs</text>
<text x="737" y="226" font-size="9.6" fill="#334155" xml:space="preserve">批量命令</text>
<text x="737" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">-0/-P/-n</text>
<text x="36" y="300" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② 特殊文件名：NUL 分隔</text>
<text x="36" y="322" font-size="10.6" fill="#334155" xml:space="preserve" font-family="'DejaVu Sans Mono','Noto Sans Mono CJK SC',monospace">find . -type f -print0 | xargs -0 rm -f</text>
<text x="36" y="344" font-size="10.2" fill="#dc2626" xml:space="preserve">不要用：for f in $(find .)；空格、换行、引号都会拆错</text>
<text x="36" y="386" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">③ 工具分工</text>
<rect x="36" y="400" width="700" height="30" fill="#f1f5f9" rx="6"/>
<text x="44" y="420" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="start">工具</text>
<text x="298.5" y="420" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">处理单位</text>
<text x="473.5" y="420" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">强项</text>
<text x="648.5" y="420" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">边界</text>
<rect x="36" y="430" width="700" height="30" fill="#ffffff"/>
<line x1="36" y1="430" x2="736" y2="430" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="450" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">grep</text>
<text x="298.5" y="450" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">行</text>
<text x="473.5" y="450" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">按模式选行</text>
<text x="648.5" y="450" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">默认 BRE，需 -E</text>
<rect x="36" y="460" width="700" height="30" fill="#ffffff"/>
<line x1="36" y1="460" x2="736" y2="460" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="480" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">sed</text>
<text x="298.5" y="480" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">行</text>
<text x="473.5" y="480" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">替换/删除/插入</text>
<text x="648.5" y="480" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">-i 平台差异</text>
<rect x="36" y="490" width="700" height="30" fill="#ffffff"/>
<line x1="36" y1="490" x2="736" y2="490" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="510" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">awk</text>
<text x="298.5" y="510" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">记录/字段</text>
<text x="473.5" y="510" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">字段、数组、算术</text>
<text x="648.5" y="510" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">复杂结构不如 jq/xmllint</text>
<rect x="36" y="520" width="700" height="30" fill="#ffffff"/>
<line x1="36" y1="520" x2="736" y2="520" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="540" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">cut</text>
<text x="298.5" y="540" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">行</text>
<text x="473.5" y="540" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">按分隔符取列</text>
<text x="648.5" y="540" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">分隔符只能单字符</text>
<rect x="36" y="550" width="700" height="30" fill="#ffffff"/>
<line x1="36" y1="550" x2="736" y2="550" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="570" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">sort/uniq</text>
<text x="298.5" y="570" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">行</text>
<text x="473.5" y="570" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">排序去重</text>
<text x="648.5" y="570" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">uniq 只合并相邻重复</text>
<line x1="36" y1="580" x2="736" y2="580" stroke="#e2e8f0" stroke-width="0.8"/>
<rect x="780" y="300" width="260" height="128" fill="#fff5f5" rx="10" stroke="#dc2626" stroke-width="1"/>
<text x="796" y="330" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">边界</text>
<text x="796" y="354" font-size="10.2" fill="#334155" xml:space="preserve">・正则方言：BRE / ERE / PCRE</text>
<text x="796" y="372" font-size="10.2" fill="#334155" xml:space="preserve">・JSON/XML 不要用 sed 硬改</text>
<text x="796" y="390" font-size="10.2" fill="#334155" xml:space="preserve">・sed -i 先试运行并备份</text>
<text x="796" y="408" font-size="10.2" fill="#334155" xml:space="preserve">・xargs 注意命令注入与参数长度</text>
<text x="36" y="606" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="624" font-size="12.3" fill="#64748b" xml:space="preserve">参数行为以 GNU 工具为主；BSD/BusyBox 有差异。</text>
</svg>
