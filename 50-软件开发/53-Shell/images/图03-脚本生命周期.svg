<text x="869" y="226" font-size="9.6" fill="#334155" xml:space="preserve">0 或失败码</text>
<text x="36" y="310" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② 异常路径统一兜底</text>
<rect x="36" y="324" width="260" height="78" fill="#fff5f5" rx="8" stroke="#dc2626" stroke-width="1.1"/>
<rect x="36" y="324" width="4.5" height="78" fill="#dc2626" rx="2"/>
<text x="49" y="343" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">trap &#x27;cleanup&#x27; EXIT INT TERM</text>
<text x="49" y="360" font-size="9.6" fill="#334155" xml:space="preserve">保存 $? → 清理 → exit $rc</text>
<text x="49" y="375.4" font-size="9.6" fill="#334155" xml:space="preserve">kill -9 不会触发 trap</text>
<rect x="360" y="324" width="260" height="78" fill="#fff5f5" rx="8" stroke="#dc2626" stroke-width="1.1"/>
<rect x="360" y="324" width="4.5" height="78" fill="#dc2626" rx="2"/>
