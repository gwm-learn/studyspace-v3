<text x="856" y="512" font-size="10.2" fill="#334155" xml:space="preserve">删除先预览</text>
<text x="856" y="530" font-size="10.2" fill="#334155" xml:space="preserve">临时文件用 mktemp</text>
<text x="856" y="548" font-size="10.2" fill="#334155" xml:space="preserve">日志写 stderr</text>
<text x="856" y="566" font-size="10.2" fill="#334155" xml:space="preserve">重复执行要安全</text>
