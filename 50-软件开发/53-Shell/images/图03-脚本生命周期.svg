<text x="697" y="360" font-size="9.6" fill="#334155" xml:space="preserve">mktemp -d 目录</text>
<text x="697" y="375.4" font-size="9.6" fill="#334155" xml:space="preserve">flock 文件描述符</text>
<text x="697" y="390.8" font-size="9.6" fill="#334155" xml:space="preserve">后台子进程</text>
