<text x="511" y="474" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">幂等策略</text>
<text x="701" y="474" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">风险点</text>
