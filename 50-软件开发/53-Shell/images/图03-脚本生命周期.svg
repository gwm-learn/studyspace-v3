<text x="180" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">异常跳转</text>
<line x1="248" y1="142" x2="278" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="286" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">清理</text>
