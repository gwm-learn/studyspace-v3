<line x1="680" y1="229" x2="698" y2="229" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="698,229 689,224.5 689,233.5" fill="#94a3b8"/>
<rect x="698" y="190" width="140" height="78" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
