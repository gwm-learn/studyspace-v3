<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1100" height="660" fill="#ffffff"/>
<line x1="36" y1="112" x2="1064" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 03 · 自动化脚本生命周期与 trap 清理</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">正常路径和异常路径最终都走同一个 cleanup；锁和临时目录必须在 trap 中释放。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：实线是正常阶段，虚线是任意阶段的失败/信号跳转；退出码要原样保留。</text>
