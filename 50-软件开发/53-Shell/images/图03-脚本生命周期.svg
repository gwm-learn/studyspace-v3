<text x="511" y="564" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">临时文件 + mv</text>
<text x="701" y="564" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">半截文件、命名空间</text>
