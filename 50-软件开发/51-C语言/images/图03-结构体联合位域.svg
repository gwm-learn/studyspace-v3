<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1160" height="580" fill="#ffffff"/>
<line x1="36" y1="112" x2="1124" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 03 · 结构体填充、联合叠加与线格式</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">结构体按成员对齐补齐；联合所有成员共享起始地址；线格式必须逐字段编解码。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：先看每个字节属于谁，再看联合的几种视图，最后看写出去的字节流。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">成员</text>
<line x1="120" y1="142" x2="150" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="158" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">填充</text>
<line x1="204" y1="142" x2="234" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="242" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">联合成员</text>
<text x="36" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① struct { char a; int b; short c; } → 12 字节</text>
<rect x="36" y="196" width="50" height="44" fill="#eef2ff" rx="4" stroke="#4f46e5" stroke-width="1"/>
<text x="61" y="223" font-size="9" fill="#0f172a" xml:space="preserve" text-anchor="middle">a</text>
<text x="61" y="258" font-size="8.4" fill="#64748b" xml:space="preserve" text-anchor="middle">0</text>
<rect x="88" y="196" width="50" height="44" fill="#fff9ee" rx="4" stroke="#d97706" stroke-width="1"/>
<text x="113" y="223" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">pad</text>
<text x="113" y="258" font-size="8.4" fill="#64748b" xml:space="preserve" text-anchor="middle">1</text>
<rect x="140" y="196" width="50" height="44" fill="#fff9ee" rx="4" stroke="#d97706" stroke-width="1"/>
<text x="165" y="223" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">pad</text>
<text x="165" y="258" font-size="8.4" fill="#64748b" xml:space="preserve" text-anchor="middle">2</text>
<rect x="192" y="196" width="50" height="44" fill="#fff9ee" rx="4" stroke="#d97706" stroke-width="1"/>
<text x="217" y="223" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">pad</text>
<text x="217" y="258" font-size="8.4" fill="#64748b" xml:space="preserve" text-anchor="middle">3</text>
<rect x="244" y="196" width="50" height="44" fill="#eef2ff" rx="4" stroke="#4f46e5" stroke-width="1"/>
<text x="269" y="223" font-size="9" fill="#0f172a" xml:space="preserve" text-anchor="middle">b0</text>
<text x="269" y="258" font-size="8.4" fill="#64748b" xml:space="preserve" text-anchor="middle">4</text>
<rect x="296" y="196" width="50" height="44" fill="#eef2ff" rx="4" stroke="#4f46e5" stroke-width="1"/>
<text x="321" y="223" font-size="9" fill="#0f172a" xml:space="preserve" text-anchor="middle">b1</text>
<text x="321" y="258" font-size="8.4" fill="#64748b" xml:space="preserve" text-anchor="middle">5</text>
<rect x="348" y="196" width="50" height="44" fill="#eef2ff" rx="4" stroke="#4f46e5" stroke-width="1"/>
<text x="373" y="223" font-size="9" fill="#0f172a" xml:space="preserve" text-anchor="middle">b2</text>
<text x="373" y="258" font-size="8.4" fill="#64748b" xml:space="preserve" text-anchor="middle">6</text>
<rect x="400" y="196" width="50" height="44" fill="#eef2ff" rx="4" stroke="#4f46e5" stroke-width="1"/>
<text x="425" y="223" font-size="9" fill="#0f172a" xml:space="preserve" text-anchor="middle">b3</text>
<text x="425" y="258" font-size="8.4" fill="#64748b" xml:space="preserve" text-anchor="middle">7</text>
<rect x="452" y="196" width="50" height="44" fill="#eef2ff" rx="4" stroke="#4f46e5" stroke-width="1"/>
<text x="477" y="223" font-size="9" fill="#0f172a" xml:space="preserve" text-anchor="middle">c0</text>
<text x="477" y="258" font-size="8.4" fill="#64748b" xml:space="preserve" text-anchor="middle">8</text>
<rect x="504" y="196" width="50" height="44" fill="#eef2ff" rx="4" stroke="#4f46e5" stroke-width="1"/>
<text x="529" y="223" font-size="9" fill="#0f172a" xml:space="preserve" text-anchor="middle">c1</text>
<text x="529" y="258" font-size="8.4" fill="#64748b" xml:space="preserve" text-anchor="middle">9</text>
<rect x="556" y="196" width="50" height="44" fill="#fff9ee" rx="4" stroke="#d97706" stroke-width="1"/>
<text x="581" y="223" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">pad</text>
<text x="581" y="258" font-size="8.4" fill="#64748b" xml:space="preserve" text-anchor="middle">10</text>
<rect x="608" y="196" width="50" height="44" fill="#fff9ee" rx="4" stroke="#d97706" stroke-width="1"/>
<text x="633" y="223" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">pad</text>
<text x="633" y="258" font-size="8.4" fill="#64748b" xml:space="preserve" text-anchor="middle">11</text>
<text x="36" y="282" font-size="10.2" fill="#334155" xml:space="preserve">偏移 0：a；偏移 4：b（前补 3 字节）；偏移 8：c；总大小按最大对齐 4 补到 12</text>
<text x="36" y="320" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② union { uint32_t v; uint8_t b[4]; }</text>
<rect x="36" y="340" width="68" height="42" fill="#f2fcf5" rx="4" stroke="#0f9d58" stroke-width="1"/>
<text x="70" y="366" font-size="9.4" fill="#0f172a" xml:space="preserve" text-anchor="middle">b[0]</text>
<rect x="106" y="340" width="68" height="42" fill="#f2fcf5" rx="4" stroke="#0f9d58" stroke-width="1"/>
<text x="140" y="366" font-size="9.4" fill="#0f172a" xml:space="preserve" text-anchor="middle">b[1]</text>
<rect x="176" y="340" width="68" height="42" fill="#f2fcf5" rx="4" stroke="#0f9d58" stroke-width="1"/>
<text x="210" y="366" font-size="9.4" fill="#0f172a" xml:space="preserve" text-anchor="middle">b[2]</text>
<rect x="246" y="340" width="68" height="42" fill="#f2fcf5" rx="4" stroke="#0f9d58" stroke-width="1"/>
<text x="280" y="366" font-size="9.4" fill="#0f172a" xml:space="preserve" text-anchor="middle">b[3]</text>
<text x="320" y="366" font-size="10.2" fill="#334155" xml:space="preserve">四个成员从同一地址开始；写 v 后读 b[] 可观察字节序</text>
<text x="36" y="410" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">③ 内存结构体 → 线格式（逐字段、定宽、定字节序）</text>
<rect x="36" y="424" width="170" height="84" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="36" y="424" width="4.5" height="84" fill="#4f46e5" rx="2"/>
<text x="49" y="443" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">内存结构体</text>
<text x="49" y="460" font-size="9.6" fill="#334155" xml:space="preserve">可能有填充</text>
<text x="49" y="475.4" font-size="9.6" fill="#334155" xml:space="preserve">成员宽度不定</text>
<line x1="206" y1="466" x2="228" y2="466" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="228,466 219,461.5 219,470.5" fill="#94a3b8"/>
<rect x="228" y="424" width="180" height="84" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="228" y="424" width="4.5" height="84" fill="#d97706" rx="2"/>
<text x="241" y="443" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">逐字段编码</text>
<text x="241" y="460" font-size="9.6" fill="#334155" xml:space="preserve">uint16/32 + htonl</text>
<text x="241" y="475.4" font-size="9.6" fill="#334155" xml:space="preserve">显式长度</text>
<line x1="408" y1="466" x2="430" y2="466" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="430,466 421,461.5 421,470.5" fill="#94a3b8"/>
<rect x="430" y="424" width="160" height="84" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="430" y="424" width="4.5" height="84" fill="#0f9d58" rx="2"/>
<text x="443" y="443" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">字节流</text>
<text x="443" y="460" font-size="9.6" fill="#334155" xml:space="preserve">无填充</text>
<text x="443" y="475.4" font-size="9.6" fill="#334155" xml:space="preserve">端序确定</text>
<line x1="590" y1="466" x2="612" y2="466" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="612,466 603,461.5 603,470.5" fill="#94a3b8"/>
<rect x="612" y="424" width="170" height="84" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="612" y="424" width="4.5" height="84" fill="#475569" rx="2"/>
<text x="625" y="443" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">对端解码</text>
<text x="625" y="460" font-size="9.6" fill="#334155" xml:space="preserve">按同一约定</text>
<text x="625" y="475.4" font-size="9.6" fill="#334155" xml:space="preserve">校验长度/边界</text>
<rect x="880" y="190" width="230" height="128" fill="#fff5f5" rx="10" stroke="#dc2626" stroke-width="1"/>
<text x="896" y="220" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">边界</text>
<text x="896" y="244" font-size="10.2" fill="#334155" xml:space="preserve">・不要 memcmp 比较结构体</text>
<text x="896" y="262" font-size="10.2" fill="#334155" xml:space="preserve">・不要 memcpy 整个结构体上线</text>
<text x="896" y="280" font-size="10.2" fill="#334155" xml:space="preserve">・位域位序由实现决定</text>
<text x="896" y="298" font-size="10.2" fill="#334155" xml:space="preserve">・#pragma pack(1) 有对齐代价</text>
<text x="36" y="526" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="544" font-size="12.3" fill="#64748b" xml:space="preserve">布局为 LP64 常见结果；实际 sizeof/offsetof 以目标 ABI 为准。</text>
</svg>
