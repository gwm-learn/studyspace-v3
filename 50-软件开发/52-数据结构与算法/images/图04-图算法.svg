<text x="1085" y="226" font-size="9.6" fill="#334155" xml:space="preserve">加入集合</text>
<text x="1085" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">重复直到空</text>
<rect x="560" y="320" width="500" height="30" fill="#f1f5f9" rx="6"/>
<text x="568" y="340" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="start">算法</text>
<text x="810" y="340" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">适用</text>
<text x="976.67" y="340" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">复杂度</text>
<rect x="560" y="350" width="500" height="30" fill="#ffffff"/>
<line x1="560" y1="350" x2="1060" y2="350" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="568" y="370" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">BFS</text>
<text x="810" y="370" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">无权图单源</text>
<text x="976.67" y="370" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">O(V+E)</text>
<rect x="560" y="380" width="500" height="30" fill="#ffffff"/>
<line x1="560" y1="380" x2="1060" y2="380" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="568" y="400" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">Dijkstra</text>
<text x="810" y="400" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">非负权单源</text>
<text x="976.67" y="400" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">O(E log V)</text>
<rect x="560" y="410" width="500" height="30" fill="#ffffff"/>
<line x1="560" y1="410" x2="1060" y2="410" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="568" y="430" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">Bellman-Ford</text>
<text x="810" y="430" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">可含负权</text>
<text x="976.67" y="430" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">O(VE)</text>
<rect x="560" y="440" width="500" height="30" fill="#ffffff"/>
<line x1="560" y1="440" x2="1060" y2="440" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="568" y="460" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">Floyd</text>
<text x="810" y="460" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">任意两点</text>
<text x="976.67" y="460" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">O(V³)</text>
<line x1="560" y1="470" x2="1060" y2="470" stroke="#e2e8f0" stroke-width="0.8"/>
<rect x="560" y="500" width="500" height="92" fill="#fff5f5" rx="10" stroke="#dc2626" stroke-width="1"/>
<text x="576" y="530" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">边界</text>
<text x="576" y="554" font-size="10.2" fill="#334155" xml:space="preserve">・Dijkstra 不能处理负权边：负权会破坏“已确定顶点不会更短”的前提</text>
<text x="576" y="572" font-size="10.2" fill="#334155" xml:space="preserve">・Prim 适合稠密图，Kruskal 适合稀疏图；MST 不是两点最短路</text>
