<text x="797" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">选最小</text>
<text x="797" y="226" font-size="9.6" fill="#334155" xml:space="preserve">未确定集合</text>
<text x="797" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">取 dist 最小</text>
<line x1="914" y1="229" x2="928" y2="229" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="928,229 919,224.5 919,233.5" fill="#94a3b8"/>
<rect x="928" y="190" width="130" height="78" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
