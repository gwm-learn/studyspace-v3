<text x="370" y="375" font-size="9.6" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">D</text>
<text x="250" y="424" font-size="10" fill="#334155" xml:space="preserve">BFS：A → B → C → D（队列）</text>
<text x="250" y="444" font-size="10" fill="#334155" xml:space="preserve">DFS：A → B → D → C（栈/递归）</text>
<text x="560" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">③ Dijkstra：选最小 dist，松弛邻居</text>
