<text x="941" y="226" font-size="9.6" fill="#334155" xml:space="preserve">dist[v] &gt; d+w</text>
<text x="941" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">则更新</text>
<line x1="1058" y1="229" x2="1072" y2="229" stroke="#94a3b8" stroke-width="1.5"/>
