<rect x="640" y="190" width="4.5" height="78" fill="#4f46e5" rx="2"/>
<text x="653" y="209" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">初始化</text>
<text x="653" y="226" font-size="9.6" fill="#334155" xml:space="preserve">dist[s]=0</text>
<text x="653" y="241.4" font-size="9.6" fill="#334155" xml:space="preserve">其余 ∞</text>
