<text x="569" y="330" font-size="9.6" fill="#334155" xml:space="preserve">O(log n)</text>
<text x="569" y="345.4" font-size="9.6" fill="#334155" xml:space="preserve">支持有序遍历</text>
<rect x="816" y="294" width="220" height="76" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="816" y="294" width="4.5" height="76" fill="#d97706" rx="2"/>
<text x="829" y="313" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">堆 / 优先队列</text>
<text x="829" y="330" font-size="9.6" fill="#334155" xml:space="preserve">取极值 O(1)</text>
<text x="829" y="345.4" font-size="9.6" fill="#334155" xml:space="preserve">插入删除 O(log n)</text>
