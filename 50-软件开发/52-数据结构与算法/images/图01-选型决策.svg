<text x="336" y="594" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">大</text>
<text x="536" y="594" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">中</text>
<text x="736" y="594" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">Trie/基数树</text>
<text x="936" y="594" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">按前缀收敛</text>
<line x1="36" y1="604" x2="1036" y2="604" stroke="#e2e8f0" stroke-width="0.8"/>
<rect x="36" y="620" width="1000" height="92" fill="#f8fafc" rx="10" stroke="#475569" stroke-width="1"/>
<text x="52" y="650" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">回退原则</text>
<text x="52" y="674" font-size="10.2" fill="#334155" xml:space="preserve">规模很小（几十项）时，数组线性扫描往往比哈希/树更快：常数小、缓存友好、代码简单。</text>
<text x="52" y="692" font-size="10.2" fill="#334155" xml:space="preserve">实时路径优先固定容量 + 预分配；哈希表要控制负载因子，树要防退化，堆要防扩容抖动。</text>
<text x="36" y="746" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="764" font-size="12.3" fill="#64748b" xml:space="preserve">复杂度是渐近量级，实际性能需用真实数据基准测试。</text>
</svg>
