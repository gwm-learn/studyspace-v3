<text x="49" y="313" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">哈希表</text>
<text x="49" y="330" font-size="9.6" fill="#334155" xml:space="preserve">平均 O(1)</text>
<text x="49" y="345.4" font-size="9.6" fill="#334155" xml:space="preserve">最坏 O(n)，无范围查询</text>
<rect x="296" y="294" width="220" height="76" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="296" y="294" width="4.5" height="76" fill="#0f9d58" rx="2"/>
<text x="309" y="313" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">数组 / 动态数组</text>
<text x="309" y="330" font-size="9.6" fill="#334155" xml:space="preserve">随机访问 O(1)</text>
<text x="309" y="345.4" font-size="9.6" fill="#334155" xml:space="preserve">中间插入 O(n)</text>
<rect x="556" y="294" width="220" height="76" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="556" y="294" width="4.5" height="76" fill="#d97706" rx="2"/>
