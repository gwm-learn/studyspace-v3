<text x="536" y="564" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">低</text>
<text x="736" y="564" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">数组线性扫描</text>
<text x="936" y="564" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">常数小、实现简单</text>
<rect x="36" y="574" width="1000" height="30" fill="#ffffff"/>
<line x1="36" y1="574" x2="1036" y2="574" stroke="#e2e8f0" stroke-width="0.8"/>
