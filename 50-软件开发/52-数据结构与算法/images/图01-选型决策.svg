<text x="536" y="444" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">更新频率</text>
<text x="736" y="444" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">首选</text>
<text x="936" y="444" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">理由</text>
<rect x="36" y="454" width="1000" height="30" fill="#ffffff"/>
<line x1="36" y1="454" x2="1036" y2="454" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="474" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">固定上限收包队列</text>
<text x="336" y="474" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">中</text>
<text x="536" y="474" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">高</text>
<text x="736" y="474" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">环形缓冲</text>
<text x="936" y="474" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">无分配、可预测</text>
<rect x="36" y="484" width="1000" height="30" fill="#ffffff"/>
<line x1="36" y1="484" x2="1036" y2="484" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="504" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">按 ID 查会话</text>
<text x="336" y="504" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">大</text>
<text x="536" y="504" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">高</text>
<text x="736" y="504" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">哈希表</text>
<text x="936" y="504" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">平均 O(1)</text>
<rect x="36" y="514" width="1000" height="30" fill="#ffffff"/>
<line x1="36" y1="514" x2="1036" y2="514" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="44" y="534" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">最近超时任务</text>
<text x="336" y="534" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">大</text>
<text x="536" y="534" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">高</text>
<text x="736" y="534" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">最小堆</text>
