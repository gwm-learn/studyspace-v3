<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="620" viewBox="0 0 1140 620" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1140" height="620" fill="#ffffff"/>
<line x1="36" y1="112" x2="1104" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 03 · 二叉树遍历与堆的数组映射</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">同一棵树的四种遍历只是“访问根”的时机不同；堆用数组存完全二叉树，只维护父子偏序。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：先按编号看树的形状，再对照遍历序列，最后看堆的 sift-down 路径。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">根/分支</text>
<line x1="137.6" y1="142" x2="167.6" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="175.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">叶子</text>
<line x1="221.6" y1="142" x2="251.6" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="259.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">堆调整路径</text>
<text x="36" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① 二叉树（编号 A..G）</text>
<line x1="208" y1="218" x2="128" y2="270" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="208" y1="218" x2="288" y2="270" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="128" y1="288" x2="88" y2="340" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="128" y1="288" x2="168" y2="340" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="288" y1="288" x2="288" y2="340" stroke="#cbd5e1" stroke-width="1.4"/>
<rect x="190" y="200" width="36" height="36" fill="#eef2ff" rx="18" stroke="#4f46e5" stroke-width="1"/>
<text x="208" y="224" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">A</text>
<rect x="110" y="270" width="36" height="36" fill="#eef2ff" rx="18" stroke="#4f46e5" stroke-width="1"/>
<text x="128" y="294" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">B</text>
<rect x="270" y="270" width="36" height="36" fill="#eef2ff" rx="18" stroke="#4f46e5" stroke-width="1"/>
<text x="288" y="294" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">C</text>
<rect x="70" y="340" width="36" height="36" fill="#f2fcf5" rx="18" stroke="#0f9d58" stroke-width="1"/>
<text x="88" y="364" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">D</text>
<rect x="150" y="340" width="36" height="36" fill="#f2fcf5" rx="18" stroke="#0f9d58" stroke-width="1"/>
<text x="168" y="364" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">E</text>
<rect x="270" y="340" width="36" height="36" fill="#f2fcf5" rx="18" stroke="#0f9d58" stroke-width="1"/>
<text x="288" y="364" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">F</text>
<text x="36" y="404" font-size="10.2" fill="#334155" xml:space="preserve">前序 A B D E C F   中序 D B E A C F</text>
<text x="36" y="424" font-size="10.2" fill="#334155" xml:space="preserve">后序 D E B F C A   层序 A B C D E F</text>
<text x="560" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② 大顶堆：数组下标与 sift-down</text>
<rect x="560" y="200" width="70" height="46" fill="#fff9ee" rx="4" stroke="#d97706" stroke-width="1"/>
<text x="595" y="219" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">9</text>
<text x="595" y="236" font-size="8.4" fill="#64748b" xml:space="preserve" text-anchor="middle">i=0</text>
<rect x="632" y="200" width="70" height="46" fill="#fff9ee" rx="4" stroke="#d97706" stroke-width="1"/>
<text x="667" y="219" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">7</text>
<text x="667" y="236" font-size="8.4" fill="#64748b" xml:space="preserve" text-anchor="middle">i=1</text>
<rect x="704" y="200" width="70" height="46" fill="#fff9ee" rx="4" stroke="#d97706" stroke-width="1"/>
<text x="739" y="219" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">8</text>
<text x="739" y="236" font-size="8.4" fill="#64748b" xml:space="preserve" text-anchor="middle">i=2</text>
<rect x="776" y="200" width="70" height="46" fill="#fff9ee" rx="4" stroke="#d97706" stroke-width="1"/>
<text x="811" y="219" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">3</text>
<text x="811" y="236" font-size="8.4" fill="#64748b" xml:space="preserve" text-anchor="middle">i=3</text>
<rect x="848" y="200" width="70" height="46" fill="#fff9ee" rx="4" stroke="#d97706" stroke-width="1"/>
<text x="883" y="219" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">5</text>
<text x="883" y="236" font-size="8.4" fill="#64748b" xml:space="preserve" text-anchor="middle">i=4</text>
<rect x="920" y="200" width="70" height="46" fill="#fff9ee" rx="4" stroke="#d97706" stroke-width="1"/>
<text x="955" y="219" font-size="10.4" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="middle">6</text>
<text x="955" y="236" font-size="8.4" fill="#64748b" xml:space="preserve" text-anchor="middle">i=5</text>
<text x="560" y="270" font-size="10" fill="#334155" xml:space="preserve" font-family="'DejaVu Sans Mono','Noto Sans Mono CJK SC',monospace">parent=(i-1)/2  left=2i+1  right=2i+2</text>
<text x="560" y="292" font-size="10.2" fill="#334155" xml:space="preserve">父 ≥ 子；数组整体不一定有序</text>
<text x="560" y="330" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">③ 插入 10：末尾上浮</text>
<rect x="560" y="344" width="120" height="64" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="560" y="344" width="4.5" height="64" fill="#d97706" rx="2"/>
<text x="573" y="363" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">1</text>
<text x="573" y="380" font-size="8.8" fill="#334155" xml:space="preserve">末尾插入 10</text>
<line x1="680" y1="376" x2="698" y2="376" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="698,376 689,371.5 689,380.5" fill="#94a3b8"/>
<rect x="698" y="344" width="120" height="64" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="698" y="344" width="4.5" height="64" fill="#d97706" rx="2"/>
<text x="711" y="363" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">2</text>
<text x="711" y="380" font-size="8.8" fill="#334155" xml:space="preserve">与父 6 交换</text>
<line x1="818" y1="376" x2="836" y2="376" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="836,376 827,371.5 827,380.5" fill="#94a3b8"/>
<rect x="836" y="344" width="120" height="64" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="836" y="344" width="4.5" height="64" fill="#d97706" rx="2"/>
<text x="849" y="363" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">3</text>
<text x="849" y="380" font-size="8.8" fill="#334155" xml:space="preserve">与父 8 交换</text>
<line x1="956" y1="376" x2="974" y2="376" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="974,376 965,371.5 965,380.5" fill="#94a3b8"/>
<rect x="974" y="344" width="120" height="64" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="974" y="344" width="4.5" height="64" fill="#d97706" rx="2"/>
<text x="987" y="363" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">4</text>
<text x="987" y="380" font-size="8.8" fill="#334155" xml:space="preserve">与父 9 交换，停止</text>
<rect x="560" y="436" width="430" height="110" fill="#fff5f5" rx="10" stroke="#dc2626" stroke-width="1"/>
<text x="576" y="466" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">边界</text>
<text x="576" y="490" font-size="10.2" fill="#334155" xml:space="preserve">・取堆顶 O(1)，插入/删除 O(log n)，建堆 O(n)</text>
<text x="576" y="508" font-size="10.2" fill="#334155" xml:space="preserve">・堆只保证父子偏序，不能有序遍历</text>
<text x="576" y="526" font-size="10.2" fill="#334155" xml:space="preserve">・需要按 key 查找时用 BST/哈希，不要用堆</text>
<text x="36" y="566" font-size="12.3" fill="#64748b" xml:space="preserve">模板：.图表模板/svg-figure-template.py</text>
<text x="36" y="584" font-size="12.3" fill="#64748b" xml:space="preserve">树的形状与遍历序列对应；堆的数组下标从 0 开始。</text>
</svg>
