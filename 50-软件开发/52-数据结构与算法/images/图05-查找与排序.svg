<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1120" height="780" fill="#ffffff"/>
<line x1="36" y1="112" x2="1084" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">图 05 · 查找路径与排序选型</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">查找按“有无序、是否按 key”分流；排序先看规模、稳定性、内存和最坏情况。</text>
<text x="36" y="92" font-size="12.3" fill="#64748b" xml:space="preserve">读法：左侧是查找决策树，中间是二分区间收缩，右侧是排序算法对照表。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">有序/二分</text>
<line x1="148.6" y1="142" x2="178.6" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="186.6" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">哈希/树</text>
<line x1="250.2" y1="142" x2="280.2" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="288.2" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">排序</text>
<text x="36" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">① 查找决策</text>
<rect x="36" y="190" width="190" height="56" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="36" y="190" width="4.5" height="56" fill="#475569" rx="2"/>
<text x="49" y="209" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">数据无序？</text>
<text x="49" y="226" font-size="8.8" fill="#334155" xml:space="preserve">是 → 线性扫描 O(n)</text>
<rect x="36" y="264" width="190" height="56" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="36" y="264" width="4.5" height="56" fill="#4f46e5" rx="2"/>
<text x="49" y="283" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">有序 + 随机访问？</text>
<text x="49" y="300" font-size="8.8" fill="#334155" xml:space="preserve">是 → 二分 O(log n)</text>
<rect x="36" y="338" width="190" height="56" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="36" y="338" width="4.5" height="56" fill="#0f9d58" rx="2"/>
<text x="49" y="357" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="700">按 key 动态增删？</text>
<text x="49" y="374" font-size="8.8" fill="#334155" xml:space="preserve">哈希 O(1) / 树 O(log n)</text>
<line x1="131" y1="246" x2="131" y2="260" stroke="#94a3b8" stroke-width="1.4"/>
<polygon points="131,260 135.5,251 126.5,251" fill="#94a3b8"/>
<line x1="131" y1="320" x2="131" y2="334" stroke="#94a3b8" stroke-width="1.4"/>
<polygon points="131,334 135.5,325 126.5,325" fill="#94a3b8"/>
<text x="280" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">② 二分：区间每次减半</text>
<rect x="280" y="200" width="44" height="36" fill="#f8fafc" rx="3" stroke="#4f46e5" stroke-width="1"/>
<text x="302" y="224" font-size="9.4" fill="#0f172a" xml:space="preserve" text-anchor="middle">2</text>
<rect x="326" y="200" width="44" height="36" fill="#f8fafc" rx="3" stroke="#4f46e5" stroke-width="1"/>
<text x="348" y="224" font-size="9.4" fill="#0f172a" xml:space="preserve" text-anchor="middle">4</text>
<rect x="372" y="200" width="44" height="36" fill="#eef2ff" rx="3" stroke="#4f46e5" stroke-width="1"/>
<text x="394" y="224" font-size="9.4" fill="#0f172a" xml:space="preserve" text-anchor="middle">6</text>
<rect x="418" y="200" width="44" height="36" fill="#eef2ff" rx="3" stroke="#4f46e5" stroke-width="1"/>
<text x="440" y="224" font-size="9.4" fill="#0f172a" xml:space="preserve" text-anchor="middle">8</text>
<rect x="464" y="200" width="44" height="36" fill="#eef2ff" rx="3" stroke="#4f46e5" stroke-width="1"/>
<text x="486" y="224" font-size="9.4" fill="#0f172a" xml:space="preserve" text-anchor="middle">10</text>
<rect x="510" y="200" width="44" height="36" fill="#f8fafc" rx="3" stroke="#4f46e5" stroke-width="1"/>
<text x="532" y="224" font-size="9.4" fill="#0f172a" xml:space="preserve" text-anchor="middle">12</text>
<rect x="556" y="200" width="44" height="36" fill="#f8fafc" rx="3" stroke="#4f46e5" stroke-width="1"/>
<text x="578" y="224" font-size="9.4" fill="#0f172a" xml:space="preserve" text-anchor="middle">14</text>
<text x="280" y="258" font-size="9.8" fill="#334155" xml:space="preserve">lo=0, hi=6, mid=3 → 8 &lt; key，lo=mid+1</text>
<text x="280" y="278" font-size="9.8" fill="#334155" xml:space="preserve">mid = lo + (hi-lo)/2，避免 lo+hi 溢出</text>
<text x="560" y="176" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">③ 排序算法对照</text>
<rect x="560" y="190" width="520" height="30" fill="#f1f5f9" rx="6"/>
<text x="568" y="210" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="start">算法</text>
<text x="716" y="210" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">平均</text>
<text x="820" y="210" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">最坏</text>
<text x="924" y="210" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">稳定</text>
<text x="1028" y="210" font-size="10" fill="#64748b" xml:space="preserve" font-weight="700" text-anchor="middle">内存</text>
<rect x="560" y="220" width="520" height="30" fill="#ffffff"/>
<line x1="560" y1="220" x2="1080" y2="220" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="568" y="240" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">冒泡</text>
<text x="716" y="240" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">O(n²)</text>
<text x="820" y="240" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">O(n²)</text>
<text x="924" y="240" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">是</text>
<text x="1028" y="240" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">O(1)</text>
<rect x="560" y="250" width="520" height="30" fill="#ffffff"/>
<line x1="560" y1="250" x2="1080" y2="250" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="568" y="270" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">插入</text>
<text x="716" y="270" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">O(n²)</text>
<text x="820" y="270" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">O(n²)</text>
<text x="924" y="270" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">是</text>
<text x="1028" y="270" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">O(1)</text>
<rect x="560" y="280" width="520" height="30" fill="#ffffff"/>
<line x1="560" y1="280" x2="1080" y2="280" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="568" y="300" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">选择</text>
<text x="716" y="300" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">O(n²)</text>
<text x="820" y="300" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">O(n²)</text>
<text x="924" y="300" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">否</text>
<text x="1028" y="300" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">O(1)</text>
<rect x="560" y="310" width="520" height="30" fill="#ffffff"/>
<line x1="560" y1="310" x2="1080" y2="310" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="568" y="330" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">希尔</text>
<text x="716" y="330" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">≈O(n^1.3)</text>
<text x="820" y="330" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">O(n²)</text>
<text x="924" y="330" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">否</text>
<text x="1028" y="330" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">O(1)</text>
<rect x="560" y="340" width="520" height="30" fill="#ffffff"/>
<line x1="560" y1="340" x2="1080" y2="340" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="568" y="360" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">归并</text>
<text x="716" y="360" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">O(n log n)</text>
<text x="820" y="360" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">O(n log n)</text>
<text x="924" y="360" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">是</text>
<text x="1028" y="360" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">O(n)</text>
<rect x="560" y="370" width="520" height="30" fill="#ffffff"/>
<line x1="560" y1="370" x2="1080" y2="370" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="568" y="390" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">快速</text>
<text x="716" y="390" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">O(n log n)</text>
<text x="820" y="390" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">O(n²)</text>
<text x="924" y="390" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">否</text>
<text x="1028" y="390" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">O(log n)</text>
<rect x="560" y="400" width="520" height="30" fill="#ffffff"/>
<line x1="560" y1="400" x2="1080" y2="400" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="568" y="420" font-size="10" fill="#0f172a" xml:space="preserve" font-weight="700" text-anchor="start">堆</text>
<text x="716" y="420" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">O(n log n)</text>
<text x="820" y="420" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">O(n log n)</text>
<text x="924" y="420" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">否</text>
<text x="1028" y="420" font-size="10" fill="#334155" xml:space="preserve" text-anchor="middle">O(1)</text>
<line x1="560" y1="430" x2="1080" y2="430" stroke="#e2e8f0" stroke-width="0.8"/>
<text x="36" y="470" font-size="12" fill="#0f172a" xml:space="preserve" font-weight="700">④ 工程选择</text>
<rect x="36" y="484" width="170" height="72" fill="#f2fcf5" rx="8" stroke="#0f9d58" stroke-width="1.1"/>
<rect x="36" y="484" width="4.5" height="72" fill="#0f9d58" rx="2"/>
<text x="49" y="503" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">小规模/近乎有序</text>
<text x="49" y="520" font-size="9.6" fill="#334155" xml:space="preserve">插入排序</text>
<line x1="206" y1="520" x2="224" y2="520" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="224,520 215,515.5 215,524.5" fill="#94a3b8"/>
<rect x="224" y="484" width="190" height="72" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="224" y="484" width="4.5" height="72" fill="#d97706" rx="2"/>
<text x="237" y="503" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">通用内存排序</text>
<text x="237" y="520" font-size="9.6" fill="#334155" xml:space="preserve">快排 + 小区间插入</text>
<line x1="414" y1="520" x2="432" y2="520" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="432,520 423,515.5 423,524.5" fill="#94a3b8"/>
<rect x="432" y="484" width="160" height="72" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="432" y="484" width="4.5" height="72" fill="#4f46e5" rx="2"/>
<text x="445" y="503" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">要求稳定</text>
<text x="445" y="520" font-size="9.6" fill="#334155" xml:space="preserve">归并排序</text>
<line x1="592" y1="520" x2="610" y2="520" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="610,520 601,515.5 601,524.5" fill="#94a3b8"/>
<rect x="610" y="484" width="190" height="72" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="610" y="484" width="4.5" height="72" fill="#475569" rx="2"/>
<text x="623" y="503" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">最坏也要 O(n log n)</text>
<text x="623" y="520" font-size="9.6" fill="#334155" xml:space="preserve">堆排序</text>
<rect x="36" y="585" width="1040" height="110" fill="#fff5f5" rx="10" stroke="#dc2626" stroke-width="1"/>
<text x="52" y="615" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">读图要点</text>
<text x="52" y="639" font-size="10.2" fill="#334155" xml:space="preserve">・比较排序的下界是 O(n log n)，计数/基数排序用空间换时间</text>
<text x="52" y="657" font-size="10.2" fill="#334155" xml:space="preserve">・qsort 不保证稳定；需要稳定时自己实现归并或插入</text>
<text x="52" y="675" font-size="10.2" fill="#334155" xml:space="preserve">・哈希表不支持范围查询，需要有序时用 B+ 树/跳表</text>
