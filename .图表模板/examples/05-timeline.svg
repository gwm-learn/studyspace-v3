<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="960" height="480" fill="#ffffff"/>
<line x1="36" y1="112" x2="924" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">示例 05 · 时间线（timeline）</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">横轴是时间，菱形是节点；说明文字上下交错，避免挤在一行。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">规范版本</text>
<line x1="142" y1="142" x2="172" y2="142" stroke="#0f9d58" stroke-width="3"/>
<text x="180" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">能力增强</text>
<line x1="80" y1="250" x2="920" y2="250" stroke="#cbd5e1" stroke-width="1.8"/>
<polygon points="164,245 159,250 164,255 169,250" fill="#4f46e5"/>
<text x="164" y="232" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="600" text-anchor="middle">R1</text>
<text x="164" y="218" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">2018 · 基础组网</text>
<polygon points="332,245 327,250 332,255 337,250" fill="#0f9d58"/>
<text x="332" y="274" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="600" text-anchor="middle">R2</text>
<text x="332" y="288" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">2019 · 诊断/隔离</text>
<polygon points="500,245 495,250 500,255 505,250" fill="#4f46e5"/>
<text x="500" y="232" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="600" text-anchor="middle">R3</text>
<text x="500" y="218" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">2021 · 6 GHz</text>
<polygon points="668,245 663,250 668,255 673,250" fill="#0f9d58"/>
<text x="668" y="274" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="600" text-anchor="middle">R4</text>
<text x="668" y="288" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">2022 · 多介质</text>
<polygon points="836,245 831,250 836,255 841,250" fill="#4f46e5"/>
<text x="836" y="232" font-size="10.2" fill="#0f172a" xml:space="preserve" font-weight="600" text-anchor="middle">R5</text>
<text x="836" y="218" font-size="9" fill="#64748b" xml:space="preserve" text-anchor="middle">2024 · Wi-Fi 7</text>
<rect x="80" y="330" width="840" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="96" y="360" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">什么时候用</text>
<text x="96" y="384" font-size="10.2" fill="#334155" xml:space="preserve">有明确先后、且重点是「什么时候发生了什么」时用 timeline。</text>
<text x="96" y="402" font-size="10.2" fill="#334155" xml:space="preserve">要表达因果或分叉，用 graph；要表达步骤，用 flow_row。</text>
<text x="36" y="444" font-size="12.3" fill="#64748b" xml:space="preserve">示例：.图表模板/examples/05-timeline.svg</text>
</svg>
