<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',sans-serif">
<rect width="1080" height="600" fill="#ffffff"/>
<line x1="36" y1="112" x2="1044" y2="112" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="36" y="42" font-size="23" fill="#0f172a" xml:space="preserve" font-weight="700">示例 04 · 决策分流（decision）</text>
<text x="36" y="70" font-size="12.3" fill="#64748b" xml:space="preserve">一个根、N 个分支，每支给一句「动作」；分支数由内容决定。</text>
<line x1="36" y1="142" x2="66" y2="142" stroke="#4f46e5" stroke-width="3"/>
<text x="74" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">补历史</text>
<line x1="131" y1="142" x2="161" y2="142" stroke="#d97706" stroke-width="3"/>
<text x="169" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">权限</text>
<line x1="215" y1="142" x2="245" y2="142" stroke="#0891b2" stroke-width="3"/>
<text x="253" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">冲突</text>
<line x1="299" y1="142" x2="329" y2="142" stroke="#dc2626" stroke-width="3"/>
<text x="337" y="146" font-size="11" fill="#334155" xml:space="preserve" font-weight="600">危险</text>
<rect x="435" y="180" width="210" height="58" fill="#f8fafc" rx="8" stroke="#475569" stroke-width="1.1"/>
<rect x="435" y="180" width="4.5" height="58" fill="#475569" rx="2"/>
<text x="448" y="199" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">push 被拒</text>
<text x="448" y="216" font-size="9.6" fill="#334155" xml:space="preserve">先读报错关键词</text>
<rect x="40" y="290" width="236.5" height="72.8" fill="#eef2ff" rx="8" stroke="#4f46e5" stroke-width="1.1"/>
<rect x="40" y="290" width="4.5" height="72.8" fill="#4f46e5" rx="2"/>
<text x="53" y="309" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">① 非快进</text>
<text x="53" y="326" font-size="9.6" fill="#334155" xml:space="preserve">non-fast-forward</text>
<text x="53" y="341.4" font-size="9.6" fill="#334155" xml:space="preserve">远程有你没有的提交</text>
<line x1="477" y1="238" x2="158.25" y2="290" stroke="#4f46e5" stroke-width="1.8"/>
<polygon points="158.25,290 167.86,292.99 166.41,284.11" fill="#4f46e5"/>
<text x="50" y="382.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ fetch → merge/rebase → 再 push</text>
<rect x="294.5" y="290" width="236.5" height="72.8" fill="#fff9ee" rx="8" stroke="#d97706" stroke-width="1.1"/>
<rect x="294.5" y="290" width="4.5" height="72.8" fill="#d97706" rx="2"/>
<text x="307.5" y="309" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">② 权限</text>
<text x="307.5" y="326" font-size="9.6" fill="#334155" xml:space="preserve">403 / Permission denied</text>
<text x="307.5" y="341.4" font-size="9.6" fill="#334155" xml:space="preserve">protected branch</text>
<line x1="519" y1="238" x2="412.75" y2="290" stroke="#d97706" stroke-width="1.8"/>
<polygon points="412.75,290 422.81,290.09 418.86,282" fill="#d97706"/>
<text x="304.5" y="382.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 走 PR；查 PAT / SSH key</text>
<rect x="549" y="290" width="236.5" height="72.8" fill="#ecfeff" rx="8" stroke="#0891b2" stroke-width="1.1"/>
<rect x="549" y="290" width="4.5" height="72.8" fill="#0891b2" rx="2"/>
<text x="562" y="309" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">③ 引用冲突</text>
<text x="562" y="326" font-size="9.6" fill="#334155" xml:space="preserve">tag 已存在</text>
<text x="562" y="341.4" font-size="9.6" fill="#334155" xml:space="preserve">shallow update not allowed</text>
<line x1="561" y1="238" x2="667.25" y2="290" stroke="#0891b2" stroke-width="1.8"/>
<polygon points="667.25,290 661.14,282 657.19,290.09" fill="#0891b2"/>
<text x="559" y="382.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 换名，或 fetch --unshallow</text>
<rect x="803.5" y="290" width="236.5" height="72.8" fill="#fff5f5" rx="8" stroke="#dc2626" stroke-width="1.1"/>
<rect x="803.5" y="290" width="4.5" height="72.8" fill="#dc2626" rx="2"/>
<text x="816.5" y="309" font-size="11.8" fill="#0f172a" xml:space="preserve" font-weight="700">④ 硬推</text>
<text x="816.5" y="326" font-size="9.6" fill="#334155" xml:space="preserve">绕过非快进</text>
<text x="816.5" y="341.4" font-size="9.6" fill="#334155" xml:space="preserve">别人的提交被抹掉</text>
<line x1="603" y1="238" x2="921.75" y2="290" stroke="#dc2626" stroke-width="1.8"/>
<polygon points="921.75,290 913.59,284.11 912.14,292.99" fill="#dc2626"/>
<text x="813.5" y="382.8" font-size="9.4" fill="#64748b" xml:space="preserve">→ 只对个人分支用 --force-with-lease</text>
<rect x="40" y="440" width="1000" height="92" fill="#fff9ee" rx="10" stroke="#d97706" stroke-width="1"/>
<text x="56" y="470" font-size="10.6" fill="#0f172a" xml:space="preserve" font-weight="700">什么时候用</text>
<text x="56" y="494" font-size="10.2" fill="#334155" xml:space="preserve">知道「有几种可能」但需要按证据分流时用 decision。</text>
<text x="56" y="512" font-size="10.2" fill="#334155" xml:space="preserve">分支超过 5 个就说明该拆图，或改成矩阵。</text>
<text x="36" y="564" font-size="12.3" fill="#64748b" xml:space="preserve">示例：.图表模板/examples/04-decision.svg</text>
</svg>
